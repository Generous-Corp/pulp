<!doctype html>
<style>
  /* A flat, mid-grey page, far from the gradient's dark stop, so the colour
     under a translucent border says which end of the gradient Chrome placed
     there: the 0.8 stop (dark) or the transparent end (page grey). */
  body { margin: 0; background: #78828c; }
  #panel { position: relative; width: 400px; height: 180px; }
  .bar {
    position: absolute; left: 0; width: 400px; height: 44px;
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    background: linear-gradient(to bottom, rgba(10, 14, 20, .8), rgba(10, 14, 20, 0));
  }
  /* Initial values: background-origin padding-box, background-repeat repeat.
     The gradient tile is the 44px padding box and repeats into the 1px
     border strip, so the border row shows the tile's first (0.8) row. */
  #padding { top: 0; }
  /* The tile is the 45px border box: the border row shows the transparent
     end. Any renderer that sizes gradients to the border box already agrees
     here. */
  #border { top: 60px; background-origin: border-box; }
  /* The tile is the padding box and does not repeat, so the border strip
     carries no gradient at all: only the page under the white hairline. */
  #norepeat { top: 120px; background-repeat: no-repeat; }
</style>
<div id="panel">
  <div class="bar" id="padding"></div>
  <div class="bar" id="border"></div>
  <div class="bar" id="norepeat"></div>
</div>
