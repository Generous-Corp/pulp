<!doctype html><canvas id="surface" width="240" height="120"></canvas><script>
const c = document.querySelector('#surface').getContext('2d');
c.fillStyle = '#17324d'; c.fillRect(0, 0, 240, 120);
c.strokeStyle = '#f2c14e'; c.lineWidth = 4; c.beginPath(); c.moveTo(20, 90); c.lineTo(120, 20); c.arc(120, 60, 40, -Math.PI / 2, Math.PI / 2); c.stroke();
</script>
