<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#ffffff}
#panel{position:relative;width:320px;height:80px}
.text{position:absolute;font-family:"Helvetica Neue",sans-serif;font-size:15px;color:#101010;line-height:20px}
.smooth{-webkit-font-smoothing:antialiased}
.subpixel{-webkit-font-smoothing:subpixel-antialiased}
</style></head><body>
<div id="panel">
  <div class="text smooth" id="smooth" style="left:10px;top:10px">Antialiased</div>
  <div class="text" id="default" style="left:10px;top:40px">Default</div>
  <div class="text subpixel" id="subpixel" style="left:170px;top:40px">Subpixel</div>
</div>
</body></html>
