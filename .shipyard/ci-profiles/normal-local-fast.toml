# Pulp CI routing profile.
#
# PR: fast pull-request/default validation.
# Release: conservative release workflows.
# Coverage: coverage-producing workflows; local coverage must use clean
#     ephemeral VM labels, not warm bare-metal build pools.
# Scheduled: periodic main validation. GitHub-hosted Intel Linux/Windows remains
#     authoritative for x64 compatibility.
# issue_on_failure: scheduled jobs may create/update deduped issues. PR failures
#     should stay on the PR.
#
# This file mirrors the tartci `normal-local-fast` profile vocabulary so
# Shipyard/agents can explain or apply the same policy from the Pulp checkout.

name = "normal-local-fast"
description = "Fast PRs on local ARM64 VMs; nightly GitHub Intel validation."

[repo."Generous-Corp/pulp".pr.macos]
strategy = "ordered-fallback"
targets = ["macstudio.macos-arm64-vm", "m5.macos-arm64-vm", "github.macos-arm64"]
github_variable = "PULP_LOCAL_MACOS_RUNS_ON_JSON"
ephemeral_required = true

# Automatic pull-request Linux stays hosted. The protected local route exists
# (.github/workflows/pr-safe-linux.yml, fail-closed admission + 15-minute health
# lease + ubuntu-latest fallback) but no workflow calls it yet, and build.yml's
# inline automatic gate additionally requires the run's workflow_ref to be
# build.yml@refs/heads/main. Declaring macpro here before that is proven would
# describe a route no PR can take.
[repo."Generous-Corp/pulp".pr.linux]
strategy = "github-only"
targets = ["github.linux-x64"]

# Operator-dispatched Linux. Proven 2026-08-16: build.yml run 31931976717's
# `Linux (x64) [local]` leg was assigned to ephemeral runner
# pulp-auto-ephemeral-200 on the macpro Proxmox pool. Every consumer of this
# variable gates it on `github.event_name == 'workflow_dispatch'`
# (version-skill-check, vellum-freeze-check, examples-validation, and build.yml's
# EXPLICIT_LINUX_RUNNER_SELECTOR_JSON), so it cannot alter a required
# pull-request or merge-group check. Unsetting it restores ubuntu-latest.
[repo."Generous-Corp/pulp".dispatch.linux]
strategy = "ordered-fallback"
targets = ["macpro.linux-x64-vm", "github.linux-x64"]
github_variable = "PULP_LOCAL_LINUX_RUNS_ON_JSON"

# Merge-queue preamble on the fleet's disposable Linux lint VMs. Report-only:
# `shipyard runner local-linux-lease --context merge_group --lane preamble`
# reports whether the pool could take the preamble and raises an alarm when
# the selector is set while it cannot. No workflow reads
# PULP_LINT_LINUX_LEASE_UNTIL, because the preamble reads its selector directly
# in runs-on and an expression has no clock. Setting PULP_PREAMBLE_RUNS_ON_JSON
# is an operator flip, and it reaches the fleet for merge_group runs only.
[repo."Generous-Corp/pulp".merge_group.preamble]
strategy = "ordered-fallback"
targets = ["fleet.linux-arm64-lint-vm", "github.linux-x64"]
github_variable = "PULP_PREAMBLE_RUNS_ON_JSON"
health_lease_variable = "PULP_LINT_LINUX_LEASE_UNTIL"
health_lease_ttl_seconds = 300
health_lease_events = ["merge_group"]
health_lease_runner_name_prefix = "pulp-lint-ephemeral-"
health_lease_merge_queue_branch = "main"
# main-merge-queue ruleset 19431100: max_entries_to_build = 3 (2026-10-06).
health_lease_admission_burst = 3
health_lease_required_capability = "pulp-lint-linux-arm64"
health_lease_forbidden_capability = "pulp-pr-safe-lint-linux-arm64"

[repo."Generous-Corp/pulp".pr.windows]
strategy = "github-only"
targets = ["github.windows-x64-runtime"]

[repo."Generous-Corp/pulp".release.macos]
strategy = "ordered-fallback"
targets = ["macstudio.macos-arm64-release-vm", "github.macos-arm64"]
github_variable = "PULP_RELEASE_MACOS_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".coverage.macos]
strategy = "ordered-fallback"
targets = ["macstudio.macos-arm64-coverage-vm", "github.macos-arm64"]
github_variable = "PULP_COVERAGE_MACOS_RUNS_ON_JSON"
ephemeral_required = true

[repo."Generous-Corp/pulp".coverage.windows]
strategy = "github-only"
targets = ["github.windows-x64"]
github_variable = "PULP_COVERAGE_WINDOWS_RUNS_ON_JSON"

[repo."Generous-Corp/pulp".scheduled.nightly_intel]
enabled = true
branch = "main"
workflow = "cross-platform-check.yml"
targets = ["github.linux-x64", "github.windows-x64"]
issue_on_failure = true

[targets."macstudio.macos-arm64-vm"]
runs_on_json = ["self-hosted", "macOS", "ARM64", "pulp-build", "pulp-build-vm", "pulp-gate-fast"]
ephemeral = true

[targets."m5.macos-arm64-vm"]
runs_on_json = ["self-hosted", "macOS", "ARM64", "pulp-build", "pulp-build-vm", "pulp-gate-fast"]
ephemeral = true

[targets."macstudio.linux-arm64-vm"]
runs_on_json = ["self-hosted", "Linux", "ARM64", "pulp-build-linux"]

[targets."m5.linux-arm64-vm"]
runs_on_json = ["self-hosted", "Linux", "ARM64", "pulp-build-linux"]

# One disposable tart Linux VM per job (tartci providers/tart-linux), runner
# names pulp-lint-ephemeral-<host>-<pid>-<i>, repository scope, no host mounts.
[targets."fleet.linux-arm64-lint-vm"]
runs_on_json = ["self-hosted", "Linux", "ARM64", "pulp-lint-linux-arm64"]
ephemeral = true

[targets."macpro.linux-x64-vm"]
runs_on_json = ["self-hosted", "Linux", "X64", "pulp-build-linux-x64", "pulp-host-macpro"]

[targets."macstudio.windows-arm64-qemu"]
runs_on_json = ["self-hosted", "Windows", "ARM64", "pulp-build-windows"]
role = "windows-arm64-smoke"

[targets."macstudio.macos-arm64-release-vm"]
runs_on_json = ["self-hosted", "macOS", "ARM64", "pulp-build-vm-release"]

[targets."macstudio.macos-arm64-coverage-vm"]
runs_on_json = ["self-hosted", "macOS", "ARM64", "pulp-coverage-vm-macos"]
ephemeral = true

# Dedicated ephemeral sanitizer VM lane. Deliberately carries NEITHER
# `pulp-build` nor `pulp-build-vm`: sanitizers.yml resolves each sanitizer with
# deny-labels=pulp-build,pulp-build-vm so an advisory sanitizer can never land
# on the pool serving the required `macos` gate. The supervisor IS installed
# (on M1) but cannot currently serve this label, so an installed supervisor is
# not evidence the lane is usable — only a real dispatch and teardown proof on
# this exact label set is. The sanitizer variables stay hosted until then.
[targets."sanitizer.macos-arm64-vm"]
runs_on_json = ["self-hosted", "macOS", "ARM64", "pulp-sanitizer-vm-macos"]
ephemeral = true

# Native Intel macOS on the Mac mini. Advisory compatibility work only; the
# release darwin-x64 leg is cross-compiled on Apple Silicon and must not be
# pointed here.
[targets."macmini.macos-x64-native"]
runs_on_json = ["self-hosted", "macOS", "X64", "pulp-intel-native", "pulp-host-macmini"]

[targets."github.macos-x64-intel"]
runs_on_json = "macos-15-intel"

[targets."github.macos-arm64"]
runs_on_json = "macos-15"

[targets."github.linux-x64"]
runs_on_json = "ubuntu-latest"
authoritative_for = ["linux-x64"]

[targets."github.windows-x64"]
runs_on_json = "windows-latest"
authoritative_for = ["windows-x64"]

[targets."github.windows-x64-runtime"]
runs_on_json = "windows-2022"
authoritative_for = ["windows-x64"]
