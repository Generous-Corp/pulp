# Pulp pinned-toolchain golden layer — a CANDIDATE golden carrying the exact
# tools tools/toolchain/manifest.toml pins, installed at bake time so a job in
# it never fetches a tool mid-build. Bake on one host with:
#     tools/ci/tart-provision.sh manifest .shipyard/vm-image.mise.toml
# The bake writes a receipt (~/.cache/pulp-ci/golden-receipts/<vm>-mise.json)
# that the guest itself reports. Nothing routes jobs to it until a lane opts in.
#
# It derives from the runner golden (Xcode, Skia, runner agent already there)
# and adds only the pinned layer (tools/ci/mise-golden-layer.sh):
#   - the host's pinned mise binary, checked by sha256 on host and guest;
#   - `MISE_ENV=toolchain mise install --locked` from this checkout's committed
#     .mise.toml, .mise.toolchain.toml and mise.toolchain.lock;
#   - rustup set to never self-update, and the pinned Rust installed by name.
# The [mise] table below is generated by tools/toolchain/generate.py.
schema   = 1
name     = "pulp-build-runner-mise-candidate"
strategy = "bake"

base       = "pulp-build-runner:latest"
disk_gb    = 150
auto_login = true          # REQUIRED for WindowServer/Metal GPU tests

# BEGIN GENERATED PULP TOOLCHAIN (tools/toolchain/manifest.toml)
# source_sha256 = 3cbe8514fd7c32c4d2bb544618182804766356a96d57110f4df82d02cb16d4a6
[mise]
version = "2026.10.17"
path = "~/.local/opt/mise-2026.10.17/bin/mise"
sha256 = "284869e5b5f57211377f026309910bea91ef65b3a71b934295fa8bd712436dfc"
rust = "1.97.1"
rust_components = ["rustfmt", "clippy"]
rust_targets = ["x86_64-apple-darwin"]
# END GENERATED PULP TOOLCHAIN
