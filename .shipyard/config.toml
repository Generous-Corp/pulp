# Shipyard configuration for Pulp.
#
# This file declares Pulp's CI targets, validation pipeline, and merge
# requirements in a form that Shipyard understands. Per-machine secrets
# (SSH host details, runner credentials) live in .shipyard.local/
# (gitignored) — see .shipyard.local/config.toml.example for the
# template, and run `shipyard doctor` to verify everything is wired up.
#
# To use this config:
#   ./tools/install-shipyard.sh   # install pinned Shipyard binary
#   shipyard doctor               # verify reachability + config sanity
#   shipyard run                  # validate the current branch
#   shipyard ship                 # PR + validate + merge on green

[project]
name      = "pulp"
type      = "cmake"
# Shipyard governance profile. `solo` matches Pulp's single-maintainer
# branch-protection posture (0 required approvals, self-merge on green).
profile   = "solo"
# The platforms Pulp ships. Not the set Shipyard validates locally — see
# "Targets" below: `mac` is the only declared target, and Linux/Windows
# validate as advisory GitHub-hosted lanes.
platforms = ["macos", "linux", "windows"]

# Physical and planned machines that must remain visible even when no runner is
# registered. Shipyard matches these by label subset, so JIT/ephemeral runner
# names remain disposable. `active = false` records planned inventory without
# claiming capacity or raising an availability alert.
[runner.fleet.expected_host.macpro]
labels = ["self-hosted", "Linux", "X64", "pulp-host-macpro"]
min_online = 2

[runner.fleet.expected_host.macmini]
labels = ["self-hosted", "macOS", "X64", "pulp-intel-native", "pulp-host-macmini"]

[runner.fleet.expected_host.macbook_air]
active = false
labels = ["self-hosted", "Linux", "ARM64", "pulp-host-macbook-air"]

# The three Apple Silicon Macs serving the required `macos` gate (m3, m5, m1) are
# deliberately NOT declared here, and adding them would make the view less accurate,
# not more. Matching is by label subset and those hosts carry no host-identifying
# label: every gate runner on all three registers the same `pulp-build-vm` +
# `pulp-gate-fast` set, so a per-host entry matches the whole pool and reports all
# three online while only one is serving. Their per-host state comes from
# `fleet-status`'s `hosts[]` array instead, keyed by class and read over SSH.
# See docs/guides/local-ci.md, "Why the macOS gate hosts are not declared as
# expected hosts".

# ── Gate script paths (Shipyard v0.19.1+ path discovery) ───────────────────
# Pulp keeps the skill-sync, version-bump, and versioning-config files
# under tools/scripts/. Shipyard v0.19.1+ auto-discovers this layout, but
# we pin the paths explicitly here so any future Shipyard bump can't
# accidentally drop the discovery order and silently fall back to
# scripts/ (which Pulp doesn't use).
[validation]
skill_sync_script   = "tools/scripts/skill_sync_check.py"
version_bump_script = "tools/scripts/version_bump_check.py"
versioning_config   = "tools/scripts/versioning.json"

# ── Validation pipeline ────────────────────────────────────────────────────
# Each stage maps to a step in tools/validate-build.sh. Shipyard runs
# them in order; stage failure short-circuits the pipeline.
#
# Stage names are ["setup", "configure", "build", "test"] only —
# Shipyard v0.1.2's executors compose those four canonical stages
# when building remote commands. Custom stage names like "install" or
# "smoke" are silently dropped on the ssh-windows backend, so we
# fold those steps into the canonical four for now and revisit when
# Shipyard supports arbitrary stage lists end-to-end.
#
# Build parallelism must never be unbounded. A bare `--parallel` (no count)
# delegates to the generator's default, which for Unix Makefiles is `make -j`
# with NO limit — it fans out one compile per ready translation unit and can
# exhaust memory / oversubscribe cores on a shared machine.
#
# The POSIX backends (mac `local`, ssh-linux) run through
# `tools/ci/governed-build.sh`, which acquires a tartci host build-lease when
# one is available (so a validation build shares the host's core/memory budget
# with concurrent agent builds instead of racing them) and otherwise falls back
# to a bounded local `-j`. The ssh-windows overrides below use a fixed cap
# instead: they run under PowerShell (no `$(...)` or wrapper path assumptions)
# and unlimited MSBuild link parallelism triggers LNK1104 on ARM64.

# ── CMAKE_BUILD_TYPE=Debug IS DELIBERATE. DO NOT "FIX" IT. ───────────────────
#
# This contradicts CLAUDE.md ("Release is the default") and reads exactly like
# config drift, so a tidy-minded config audit will want to flip it to Release.
# Don't. This -O0 lane is the ONLY thing in CI that can see a whole class of
# undefined behaviour.
#
# 2026-07-12: it caught a real ODR violation (#6081). `snap_to_zero()` is an inline
# function template defined in a header, its body gated by a macro, and a test TU
# redefined that macro before including it. Two TUs then emitted the SAME mangled
# symbol with DIFFERENT bodies.
#
#   at -O3  each TU inlines its own copy, so each behaves per its own macro.
#           The A/B test appears to work. RELEASE IS GREEN. The bug is invisible
#           by construction — a Release-only lane cannot ever see it.
#   at -O0  nothing is inlined. Both TUs emit a weak symbol, the linker keeps ONE
#           arbitrarily, and both call it. DEBUG IS RED.
#
# The red test was the mild outcome: had the linker kept the other definition, the
# assertions would have PASSED while exercising a no-op — a null test asserting
# nothing, green forever.
#
# Debug is slower, and CLAUDE.md is right that it is the wrong default for most
# work. The answer is not "Debug everywhere" — it is "keep ONE -O0 lane, and
# calibrate perf gates for the build they actually run in." A perf gate that fails
# here is a MIS-CALIBRATED GATE, not a reason to flip the lane: see
# test/test_yoga_layout_bench.cpp, whose timing assertion was sized for -O3 and is
# now `#ifdef NDEBUG`-gated. Guarded by tools/scripts/test_odr_macro_gated_headers.py.
# ── Interrupted-build sentinel ───────────────────────────────────────────────
#
# The POSIX lanes below reuse a warm `build/`. A run killed mid-compile — which
# is how a timeout ends, with no trap or exit handler running — leaves partial
# object files that the next incremental build happily links against, producing
# heap corruption and SEGFAULTs in tests unrelated to the diff. Each timeout
# therefore seeded the next run's failure, and the loop sustained itself.
#
# `tools/ci/build-dir-sentinel.sh arm` recreates the dir when the previous run
# left its marker behind; `clear` removes the marker on a clean build. It is
# armed BEFORE configure so a run killed during configure is caught too.
#
# This is only safe because `[targets.mac] timeout_secs` is 14400. Arming a
# sentinel on a cap the build cannot finish under yields an infinite
# wipe → cold rebuild → timeout → wipe loop. Check that first if you change
# either number.
[validation.default]
stages = ["setup", "configure", "build", "test"]
setup     = "./setup.sh --ci --deps-only"
configure = "tools/ci/build-dir-sentinel.sh guard build 'ci_python=$(python3 tools/ci/find_python311.py) && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON -DPython3_EXECUTABLE=\"$ci_python\"'"
build     = "tools/ci/governed-build.sh cmake --build build && tools/ci/build-dir-sentinel.sh clear build"
# `--label-exclude "validation|slow"` mirrors build.yml's PR ctest and
# cross-platform-check.yml. Two label groups are skipped on the per-PR gate:
#   * `slow`       — e.g. `cmake-ios-auv3-configure` (~25-30 min iOS try-compile).
#   * `validation` — the example plugins' real-host format-validators
#     (`pluginval-*`, `auval-*`, `clap-dlopen-*`; all live under examples/ and
#     are the only users of this label). They are slow and flaky under load and
#     have no business gating unrelated core PRs. Runtime validation lives on
#     the path-filtered example-validation lane. Compilation deliberately stays
#     ON here until that stable context is promoted to a required check; only
#     then may a follow-up turn examples OFF in Shipyard. See
#     docs/guides/test-lanes.md.
# `--repeat until-pass:2` retries a failed test once before failing the leg, so a
# single timing-flake self-heals instead of reddening the required `macos` gate
# and wedging auto-merge (mirrors build.yml + sanitizers.yml; each attempt is
# still bounded by the test's own TIMEOUT).
# The governor exports CTEST_PARALLEL_LEVEL from the same leased host share used
# for builds. CTest remains responsible for RUN_SERIAL and RESOURCE_LOCK.
test      = "python3 tools/ci/build_dir_lock.py --build-dir build -- tools/ci/governed-build.sh ctest --test-dir build --output-on-failure --repeat until-pass:2 --exclude-regex AudioWorkgroup --label-exclude \"validation|slow|performance|bench|quality-lab\""

# Per-target overrides — ssh-windows needs `cmake --build` with the
# Visual Studio multi-config generator's --config flag. The base
# build line above is left platform-neutral; this section refines it
# for the Windows target only.
#
# Windows test exclusions (--exclude-regex):
#   AudioWorkgroup  — macOS-only API, no Windows implementation
#   Toolbar add items — SEGFAULT in headless Yoga layout (no parent
#                       context), tagged [!mayfail] but CTest still
#                       reports failure because the crash kills the
#                       executable before Catch2 processes the tag
#   EventLoop       — timing-sensitive dispatch tests that flake on
#                     the ARM64 Windows VM (50ms sleep not reliable
#                     under SSH + cross-compile emulation overhead)
[validation.default.overrides.windows]
configure = "cmake -S . -B build -G \"Visual Studio 17 2022\" -A x64 -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON"

# --parallel is capped at 4 to limit MSBuild parallelism. Unlimited
# parallelism causes LNK1104 (cannot open file) on ARM64 Windows because
# concurrent x64-emulated link steps create file contention that Windows'
# file locking can't handle gracefully.
build     = "cmake --build build --config Release --parallel 4"
# Only exclude tests with genuine platform incompatibility or
# undiagnosable crashes. Timing-sensitive tests (EventLoop,
# BufferingReader, VisualizationBridge) were fixed with proper
# wait_until patterns and longer timeouts — no longer excluded.
test      = "python3 tools/ci/build_dir_lock.py --build-dir build -- ctest --test-dir build -C Release --output-on-failure --exclude-regex \"AudioWorkgroup|Toolbar add items\" --label-exclude \"slow|validation\""

# The exact inventory is specific to the required macOS target. Optional Linux
# targets inherit the default recipe but register a different platform-gated
# CTest inventory, so they must not validate against the macOS cardinality.
[validation.default.overrides.macos]
configure = "tools/ci/build-dir-sentinel.sh guard build 'mkdir -p build/.cmake/api/v1/query && : > build/.cmake/api/v1/query/codemodel-v2 && ci_python=$(python3 tools/ci/find_python311.py) && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON -DPULP_CHANGED_SURFACE_INVENTORY_TARGET=ON -DPython3_EXECUTABLE=\"$ci_python\"'"

[validation.gates]
# Layer-3 authoritative gates — same scripts CI runs via
# .github/workflows/version-skill-check.yml. Named `gates` so you can
# run it standalone with `shipyard run --pipeline gates`. Shipyard's
# executors only support the canonical stage set, so all gate checks
# are chained into the `setup` step and exit non-zero on first failure.
#
# PULP_ENFORCE_PREPUSH=1 makes the pre-push hook upgrade warnings to
# errors; the Python scripts inspect the same env var for parity.
# See docs/guides/versioning.md for the full three-layer design.
stages = ["setup"]
setup = "PULP_ENFORCE_PREPUSH=1 python3 tools/scripts/skill_sync_check.py --base origin/main --mode=report && PULP_ENFORCE_PREPUSH=1 python3 tools/scripts/version_bump_check.py --base origin/main --mode=report && python3 tools/scripts/hotspot_size_guard.py --base origin/main --config tools/scripts/hotspot_size_guard.json --mode=report && python3 tools/scripts/build_parallelism_guard.py && python3 tools/import-validation/check-source-contracts.py --strict && python3 tools/import-validation/test_source_contracts.py"

[validation.parser]
# Path-scoped lane for runtime-import parser PRs (pulp #1916).
#
# Triggered when a diff only touches the parser-import scope defined in
# tools/scripts/validation_profile_select.py — the standalone
# import-design tool, the import-validation scripts, the pulp-import-ir
# package, parser fixtures, and the parser-specific test surface. Run
# it explicitly with `shipyard run --pipeline parser`; the selector
# script prints `parser` or `default` so wrappers can pick the matching
# lane without rolling their own classifier.
#
# Configure step disables PULP_BUILD_EXAMPLES, which keeps the plugin
# validator CTest entries (auval / pluginval / clap-validator,
# registered in examples/pulp-*/CMakeLists.txt) out of the test
# discovery list entirely — those failures motivated #1916 in the first
# place. The test step filters by the `parser-import` CTest label
# (test/CMakeLists.txt) so even if a non-example validator slips in,
# it stays out of the lane. `slow` is excluded for symmetry with
# [validation.default].
stages = ["setup", "configure", "build", "test"]
setup     = "./setup.sh --ci --deps-only"
configure = "tools/ci/build-dir-sentinel.sh guard build 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=OFF'"
build     = "tools/ci/governed-build.sh cmake --build build && tools/ci/build-dir-sentinel.sh clear build"
test      = "tools/ci/governed-build.sh ctest --test-dir build --output-on-failure --label-include parser-import --exclude-regex AudioWorkgroup --label-exclude slow"

[validation.parser.overrides.windows]
configure = "cmake -S . -B build -G \"Visual Studio 17 2022\" -A x64 -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=OFF"
build     = "cmake --build build --config Release --parallel 4"
test      = "ctest --test-dir build -C Release --output-on-failure --label-include parser-import --exclude-regex \"AudioWorkgroup|Toolbar add items\" --label-exclude slow"

[validation.smoke]
# Lighter validation for quick sanity checks. Builds without tests +
# GPU + examples; the smoke pipeline (SDK install + downstream
# scaffold build) is folded into the build stage so it works on
# every backend. When Shipyard supports custom stage names on the
# ssh-windows executor, we will split this back out into named
# stages for clearer per-stage failure messages.
stages = ["setup", "configure", "build"]
setup     = "./setup.sh --ci --deps-only"
configure = "tools/ci/build-dir-sentinel.sh guard build 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULP_BUILD_TESTS=OFF -DPULP_BUILD_EXAMPLES=OFF'"
build     = "tools/ci/governed-build.sh cmake --build build && tools/ci/build-dir-sentinel.sh clear build && cmake --install build --prefix install && cmake -S tools/validation/sdk-smoke -B smoke/build -DCMAKE_PREFIX_PATH=install && tools/ci/governed-build.sh cmake --build smoke/build"

[validation.smoke.overrides.windows]
configure = "cmake -S . -B build -G \"Visual Studio 17 2022\" -A x64 -DPULP_BUILD_TESTS=OFF -DPULP_BUILD_EXAMPLES=OFF"
# PowerShell uses ; as the statement separator, not && — note the
# different chaining. The semantics differ: PowerShell does NOT
# short-circuit on failure, so each step is wrapped in a guard.
build     = "cmake --build build --config Release --parallel 4; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cmake --install build --prefix install --config Release; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cmake -S tools/validation/sdk-smoke -B smoke/build -G \"Visual Studio 17 2022\" -A x64 -DCMAKE_PREFIX_PATH=install; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cmake --build smoke/build --config Release --parallel 4"

# ── Targets ────────────────────────────────────────────────────────────────
# One target is declared here: `mac`, the required gate. Linux and Windows
# validate as advisory GitHub-hosted lanes in .github/workflows/build.yml, so
# Shipyard does not need a target for them.
#
# The SSH `ubuntu` / `windows` targets are OPT-IN, per machine. They used to be
# declared here with `host` deferred to the gitignored .shipyard.local/config.toml
# — which no machine in the fleet actually has. Shipyard preflights every
# *declared* target, so on every box the result was:
#
#     Target 'ubuntu' (ssh) is unreachable.
#       Failure category: configuration
#       Last error: target has no host configured
#
# ...an exit-3 on every `shipyard run` / `shipyard pr`, worked around by passing
# `--skip-target ubuntu --skip-target windows` forever. Declaring a target we
# cannot reach makes the *default* path fail closed for a lane that is advisory
# anyway. So the targets move to where their hosts live.
#
# To re-enable a local SSH lane on one machine, copy the target block from
# .shipyard.local/config.toml.example into .shipyard.local/config.toml and fill
# in `host` + `repo_path`. That overlay can define a target outright, not merely
# supply its host — verified against Shipyard v0.70.0. Nothing else changes: the
# [validation.*.overrides.windows] recipes below stay version-controlled here and
# apply the moment the target exists.
#
# Note for anyone reaching for [profiles.*]: a profile's `targets` list does NOT
# gate preflight in Shipyard v0.70.0. Setting `profile = "local"` still probes
# every declared target. Profiles are the natural home for this and one day may
# be; until then, "declared" is the only thing that matters.

[targets.mac]
# 2026-05-20: Namespace macOS routing is disabled for cost control.
# Shipyard validates the mac target locally again; GitHub Actions routes
# the required macOS check through the self-hosted pulp-build runners.
backend  = "local"
platform = "macos-arm64"
workflow = "build"
validation_build_type = "debug"
# Phase 8 timeout bump (Dawn + Skia + mbedtls + cargo build); see
# git history for context.
#
# 2026-07-27: raised 3600 -> 7200. One hour no longer covers a clean local
# build on a loaded machine, and the failure mode is indistinguishable from a
# broken PR: the lane is killed mid-build and reports `Validation timed out`
# with no per-target diagnostics, so a perfectly good branch looks red.
# Measured on this Mac with four agent sessions active: a change touching
# core/view broadly ran 62 min and was killed at 98% with ZERO compile errors;
# another ran 113 min and died at 67%. A small change against a warm build dir
# finished in 41 min and passed — which is why this presents as flakiness
# rather than as a ceiling everyone hits.
#
# Queue wait is NOT charged against this budget (the clock starts when the lane
# starts), so 3600 was only ever bounding the build itself.
#
# 2026-08-20: raised 7200 -> 14400 after an exact-head, clean, governed Debug
# build with examples enabled was killed at 7337s while still making normal
# progress at 91%. The next complete neighboring lane took 9879s wall time and
# passed all 20,669 tests. Four hours restores hang-guard headroom without
# changing Debug coverage, examples, governed parallelism, or the test set.
timeout_secs = 14400

# ── Cloud dispatch (manual only) ───────────────────────────────────────────
# Namespace remains available only for explicit operator-dispatched cloud
# runs. It is not the default mac target and should not be used as
# automatic PR-validation failover while the repo variables are unset.

[targets.mac.changed_surface_selection]
schema_version = 3
# Exact current-main registration count. CTest permits duplicate display names,
# so this is deliberately not the unique-name count. The canonical multiset
# contract in changed-surface-inventory.json pins all 21,248 registrations.
# Test-topology changes force a full-suite decision. This remains shadow-only:
# [validation.default] is still the authoritative execution.
full_test_count = 21248
build_type = "debug"
build_flags = ["-DCMAKE_BUILD_TYPE=Debug", "-DPULP_BUILD_TESTS=ON", "-DPULP_BUILD_EXAMPLES=ON", "-DPULP_CHANGED_SURFACE_INVENTORY_TARGET=ON"]
baseline_tests = [
  "build-check",
  "decisions-contract-validate",
  "cmake-sdk-provenance-contract",
  "agent-hook-paths",
  "cli-help",
  "changed-surface-policy-selftest",
]
baseline_build_targets = ["pulp-test-build-check", "pulp-cli"]
baseline_only_paths = [
  "docs/guides/**",
  "docs/reference/**",
  "docs/examples/**",
  "docs/validation/**",
]
# Independent authorization for omitting the expensive iOS/AUv3 compile gate.
# Do not infer this from `families`: a bounded macOS test family may still feed
# a mobile build target. Each addition here requires its own mobile-impact
# review and focused classifier mutation proof.
ios_compile_skip_safe_paths = [
  "docs/guides/**",
  "docs/reference/**",
  "docs/examples/**",
  "docs/validation/**",
  "tools/cli/cmd_forge.cpp",
  "tools/cli/cmd_dsp.cpp",
  "test/test_child_process.cpp",
]

# Known global build, toolchain, ABI, security, provenance, packaging, and
# dependency surfaces are ineligible for bounded execution. Unknown paths also
# fall back to full in Shipyard.
full_required_paths = [
  "CMakeLists.txt",
  "**/CMakeLists.txt",
  "cmake/**",
  "tools/cmake/**",
  "tools/ci/**",
  ".github/**",
  ".agents/contract.toml",
  ".shipyard/**",
  "tools/shipyard.toml",
  "setup.sh",
  "setup.ps1",
  "core/**/include/**",
  "include/**",
  "inspect/include/**",
  "ship/**",
  "security/**",
  "apple/**",
  "tools/scripts/*release*",
  "tools/scripts/*checksum*",
  "tools/scripts/*sign*",
  "tools/scripts/*provenance*",
  "tools/rack/provenance_check.py",
  "tools/local-ci/provenance*.py",
  "tools/import-design/browser_capture/security*",
  "examples/web-demos/tools/local-http-security*",
  "packages/**/package.json",
  "packages/**/package-lock.json",
]
policy_paths = [
  ".shipyard/changed-surface-inventory.json",
  "tools/scripts/changed_surface_inventory.py",
  "tools/scripts/test_changed_surface_policy.py",
  ".agents/skills/ci/SKILL.md",
]
test_topology_paths = [
  "CMakeLists.txt",
  "**/CMakeLists.txt",
  "test/cmake/**",
  "tools/scripts/test_*.py",
]

# Start with one narrow command-projection family. Broader core mappings stay
# unknown and therefore select full until shadow evidence supports graduation.
[[targets.mac.changed_surface_selection.families]]
name = "forge-dsp-catalog-projection"
paths = ["tools/cli/cmd_forge.cpp", "tools/cli/cmd_dsp.cpp"]
tests = [
  "cli-forge-catalog-json",
  "cli-forge-catalog-check",
  "cli-forge-help",
  "cli-forge-help-flag",
  "cli-forge-unknown-subcommand",
  "cli-forge-catalog-write",
  "cli-dsp-capabilities-check",
  "cli-dsp-capabilities-json",
  "cli-dsp-capabilities-write",
  "cli-dsp-help",
  "cli-dsp-help-flag",
  "cli-dsp-unknown-subcommand",
]
build_targets = ["pulp-cli", "pulp-test-forge-catalog-index"]
supported_build_types = ["debug", "release"]
risk_class = "medium"
extended_tests = [
  "Forge catalog index covers every catalog header",
  "Forge catalog index comparison detects add and remove drift",
]

[[targets.mac.changed_surface_selection.families]]
name = "child-process-test-source-only"
paths = ["test/test_child_process.cpp"]
tests = [
  "exec captures stdout",
  "exec captures non-zero exit code",
  "exec respects timeout",
  "line callback fires per line",
  "line callback exceptions cancel the child during wait",
  "line callback failure preserves the other output stream during cancellation",
  "line callback exceptions cancel a child during input-channel setup",
  "cancel terminates process",
  "process_id is available and stable after wait",
  "find_on_path finds known binary",
  "find_on_path returns nullopt for missing binary",
  "exec with a binary that does not exist reports failure",
  "exec captures empty-stdout cleanly",
  "find_on_path returns nullopt for nonexistent",
  "run with empty command fails gracefully",
  "stderr is captured separately",
  "wait and read before start return default results",
  "disabled stream capture discards stdout stderr and callbacks",
  "read_available_output drains stdout while process is running",
  "read_available_output is empty when stdout capture is disabled",
  "run honors working directory",
  "output capture respects max byte limits",
  "zero max output bytes drains without capturing lines",
  "stderr line callback fires independently",
  "line callback buffers partial stdout without trailing newline",
  "line callback buffers partial stderr without trailing newline",
  "move assignment transfers a running child process",
  "move constructor transfers a running child process",
  "wait is idempotent after process completion",
  "start after observed completion waits previous child without cancellation state",
  "cancel after natural exit reports completed process result",
  "process reuse clears timeout state from prior run",
  "process reuse clears cancellation state from prior run",
  "start cancels a running child before launching replacement",
  "failed restart after completion does not retain stale child state",
  "argv arguments preserve empty strings spaces and punctuation",
  "line callback emits empty lines and preserves order",
  "line callback joins a line split across drain passes",
  "line callback honors output cap before later complete lines",
  "read_available_output drains stdout without losing stderr result",
  "timeout preserves output emitted before termination",
  "wait preserves output after is_running observes fast exit",
  "ChildProcess destructor cancels a still-running POSIX child",
  "ChildProcess move construction transfers a running POSIX child",
  "ChildProcess move assignment transfers a running POSIX child",
  "cancel escalates when a POSIX child ignores SIGTERM",
  "timeout escalates when a POSIX child ignores SIGTERM",
  "starting a POSIX replacement cancels a still-running child",
  "starting a POSIX replacement drains a previously observed exit",
  "POSIX wait consumes cached fast-exit status after polling",
]
build_targets = ["pulp-test-child-process"]
supported_build_types = ["debug", "release"]
risk_class = "low"

[[targets.mac.changed_surface_selection.families]]
name = "forge-rack-generator"
paths = [
  "tools/rack/generate.py",
  "tools/rack/test_generate_safety.py",
  ".agents/skills/forge-modular/SKILL.md",
]
tests = [
  "rack-generator-safety",
  "rack-generator-endings",
]
build_targets = ["pulp-cli"]
supported_build_types = ["debug", "release"]
risk_class = "medium"
extended_tests = [
  "rack-generation-eligibility",
  "rack-inert-input-cause",
]

# The repository may describe a bounded POSIX test-stage adapter, but it cannot
# activate it. Shipyard reads the independent machine-global
# changed_surface_execution.mode switch, which defaults to off. The initial
# controlled canary uses shadow_compare so this selected run is measured while
# the ordinary full CTest corpus remains the merge-authoritative result.
[targets.mac.changed_surface_selection.execution]
mode = "authoritative"
stage = "build_and_test"
command = "python3 tools/scripts/run_changed_surface_tests.py --selection-receipt-b64 {selection_receipt_b64} --selection-receipt-sha256 {selection_receipt_digest} --build-dir build --target mac"

[cloud]
provider   = "namespace"
workflow   = "build"
repository = "Generous-Corp/pulp"

# ── Merge gating ───────────────────────────────────────────────────────────
# Shipyard's can_merge() requires evidence (passing validation) for
# every required platform on the exact merge-candidate SHA before
# `shipyard ship` will merge. This is stricter than local_ci.py's
# job.passed check, which only required the most recent run to pass.

[merge]
require_platforms = ["macos", "linux", "windows"]

# PAUSED 2026-09-07. Set back to true once Shipyard's handoff validator is
# fixed; this is a one-line revert and nothing else here changes.
#
# What this normally does: on protected main, make PR creation and durable
# steward ownership one operation. Shipyard reads this policy from origin/main
# rather than the PR branch, writes an exact-head server receipt, revalidates
# the open PR/head, and only then attaches shipyard:managed. The submitting
# agent may exit as soon as `shipyard pr` has completed this handoff.
#
# WHY IT IS PAUSED. Since 2026-08-31 the handoff rejects every agent-run
# `shipyard pr` against this repo, AFTER the branch is pushed, with
# "--workstream-id must be a canonical GEN-style handle". Two independent
# guards combine to make that unavoidable here:
#
#   1. Shipyard synthesizes the fallback id as `{repo}#{pr}` preserving case,
#      then its escape hatch requires the slug to be ALREADY LOWERCASE. This
#      repo is `Generous-Corp/pulp`, so the hatch is false by construction.
#   2. Even with a lowercase slug, the hatch is refused when an agent route is
#      detected, and CLAUDE_CODE_SESSION_ID / CODEX_THREAD_ID are set in every
#      agent shell.
#
# Deterministic, not flaky. Observed cost: a pushed branch with an unowned PR
# that had to be adopted by hand with `shipyard ship --pr <n>`.
#
# COST OF THE PAUSE, stated plainly: new PRs here are not steward-managed.
# `runner steward` classifies them Unmanaged and attaches shipyard:unmanaged,
# so it will not queue, re-run, cancel or recovery-signal them. That is the
# pre-2026-08-14 landing path: `shipyard ship` still validates and merges on
# its own, and nothing in ship/queue/watch depends on the managed label. The
# recovery worker goes idle rather than broken, since it requires that label.
#
# An explicit `shipyard pr --workstream-id GEN-N` still opts in, so agent
# guidance must not pass one while this is paused or the fleet splits into
# managed and unmanaged PRs.
[merge_steward]
auto_handoff = false

# ── Governance (required-check contract) ───────────────────────────────────
# The GitHub checks that must be green before `main` accepts a merge. This
# mirrors the LIVE branch-protection ruleset, NOT the full ship platform set:
# only the macOS build+test leg and the version/skill-sync gate are blocking.
# Linux and Windows validate as advisory GitHub-hosted lanes (see [project]
# platforms) and deliberately do NOT gate merge — making them blocking would
# crater throughput without adding signal. Keep this list aligned with
# .github/rulesets/main-protection.json.
[governance]
required_status_checks = ["macos", "Enforce version & skill sync"]

# Per-branch protection knobs. `require_strict_status = true` means a PR must
# be up to date with `main` (re-validated on the exact merge-candidate SHA)
# before it can merge — matching the ruleset's
# strict_required_status_checks_policy.
[branch_protection."main"]
require_strict_status = true

# ── Ship defaults ──────────────────────────────────────────────────────────

[ship]
base_branch = "main"

# ── Changelog & post-tag sync (issue #53, shipyard v0.9.0) ────────────────
# Shipyard owns CHANGELOG.md regeneration after tag pushes. The GitHub Release
# body is composed separately in release-cli.yml from Pulp highlights plus
# GitHub's generated release notes.

[release.changelog]
enabled    = true
repo_url   = "https://github.com/Generous-Corp/pulp"
path       = "CHANGELOG.md"
tag_filter = "v*"
product    = "Pulp"
skip_commit_patterns = [
  "^chore: bump .*version",
  "^chore\\(release\\): ",
  "^bump .*to v?\\d+\\.\\d+\\.\\d+$",
]
# Preserve pulp's pre-migration HTML header verbatim so the byte-identity
# validation gate passes. Shipyard v0.11.0+ accepts a full comment block
# here; pre-0.11 hardcoded shipyard's own docs-path reference, which
# would have forced a header-text change during the migration.
header_comment = """<!-- This file is auto-regenerated after every SDK tag by Shipyard's
     `shipyard changelog regenerate` post-tag hook. Edits are picked up on the
     next regen as long as they land in the right release's bullet block. See
     docs/guides/versioning.md § Release pipeline for the full end-to-end flow. -->"""

[release.post_tag_hook]
enabled  = true
command  = "shipyard changelog regenerate"
# `main` carries the `main-merge-queue` ruleset with `bypass_actors = []` and
# `current_user_can_bypass = never`, so a direct push is refused — bot pushes
# included. Left on the default, this hook would publish the tag and binaries
# fine and then fail the changelog sync, retry `max_push_attempts` times, and
# leave a red run plus a silently stale CHANGELOG. `pr` opens a pull request
# instead, so the changelog lands THROUGH the queue like every other change.
# Requires Shipyard >= v0.78.0 (see tools/shipyard.toml): an older binary does
# not know this key, ignores it, and silently reverts to the direct push.
push_mode = "pr"
watch    = ["CHANGELOG.md"]
trailers = [
  'Version-Bump: sdk=skip reason="docs-only automated regeneration"',
  'Skill-Update: skip skill=ci reason="no workflow shape change"',
  'Release: skip reason="bot commit; prevent recursive auto-release"',
]
only_for_tag_pattern = "v*"
max_push_attempts    = 5
ssh_signing_setup_script = "tools/scripts/configure_release_bot_ssh_signing.sh"

[release.post_tag_hook.bot_identity]
name  = "pulp-release-bot"
email = "25807+danielraffel@users.noreply.github.com"
