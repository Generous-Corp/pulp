# END GENERATED changed-surface script families

# The repository may describe a bounded POSIX test-stage adapter, but it cannot
# activate it. Shipyard reads the independent machine-global
# changed_surface_execution.mode switch, which defaults to off. The initial
# controlled canary uses shadow_compare so this selected run is measured while
# the ordinary full CTest corpus remains the merge-authoritative result.
[targets.mac.changed_surface_selection.execution]
mode = "authoritative"
stage = "build_and_test"
command = "python3 tools/scripts/run_changed_surface_tests.py --selection-receipt-b64 {selection_receipt_b64} --selection-receipt-sha256 {selection_receipt_digest} --build-dir build --target mac"

[cloud]
provider   = "namespace"
workflow   = "build"
repository = "Generous-Corp/pulp"

# ── Merge gating ───────────────────────────────────────────────────────────
# Shipyard's can_merge() requires evidence (passing validation) for
# every required platform on the exact merge-candidate SHA before
# `shipyard ship` will merge. This is stricter than local_ci.py's
# job.passed check, which only required the most recent run to pass.

[merge]
require_platforms = ["macos", "linux", "windows"]
refresh_branch = "only-if-conflicting"

# Off, and there is no steward to hand off to. `auto_handoff = true` makes
# `shipyard pr` write an exact-head `shipyard/steward-handoff` receipt and the
# `shipyard:managed` label for a repository-wide steward workflow to act on.
# Pulp removed that workflow and its recovery worker: they never ran on a
# schedule, and PRs land through the native merge queue (arm auto-merge with
# mergeMethod MERGE). Turning this on would write receipts nobody reads. Do not
# pass `shipyard pr --workstream-id` either: it opts a single PR into the same
# unread handoff.
[merge_steward]
auto_handoff = false

# ── Batch attribution (queue-arm-guard escape) ─────────────────────────────
# `queue-arm-guard` refuses a same-head re-enqueue after a `failed_checks`
# ejection, and `branch-refresh-guard` refuses the `update-branch` that would
# otherwise dodge it. Both are right: re-queueing a head that broke a batch
# ejects its innocent batch-mates again, and a refresh buys nothing while
# cancelling and restarting a 40-minute required gate.
#
# Together they trap a pull request ejected by a defect that was never its own.
# This declaration is the way out: the guard runs this command as
#   <command> --repo <owner/name> --pr <n> --run-id <ejecting run>
# from the repository root, and allows the re-enqueue only when it exits 0 and
# prints a JSON object whose `implicates_head` is exactly false alongside a
# verdict that positively names why.
#
# It must be an argv list. A shell string would make this file a
# shell-injection surface for a command Shipyard runs on an operator's machine,
# and Shipyard rejects one by design.
[queue.attribution]
command = ["python3", "tools/scripts/queue_batch_attribute.py", "--certify"]

# One same-head re-enqueue after an ENVIRONMENT ejection. When the attributor
# above does not certify, Shipyard allows exactly one retry of the unchanged
# head if every failing required check on the ejecting merge-group commit
# failed a step whose output (not its echoed script) printed a network
# signature near its first ##[error]: the pip relay 403, pinned-Chrome
# `curl: (56)`, cargo DNS, upload ECONNRESET. A second ejection of the same
# head is refused. See docs/guides/local-ci.md ("One same-head retry after a
# network ejection").
[queue.environment_requeue]
enabled = true

# ── Governance (required-check contract) ───────────────────────────────────
# The GitHub checks that must be green before `main` accepts a merge. This
# mirrors the LIVE branch-protection ruleset, NOT the full ship platform set:
# the macOS build+test leg, the version/skill-sync gate, the WebCLAP
# build-and-prove job, the two Vellum freeze gates and `drift-fast` are
# blocking. Linux and Windows validate as advisory GitHub-hosted lanes (see [project]
# platforms) and deliberately do NOT gate merge — making them blocking would
# crater throughput without adding signal. `drift-fast` is the exception to
# "hosted lanes are advisory": it configures without building and runs only
# tree-reading drift checks, so it reports in minutes and cannot be starved by
# the shared Macs.
#
# This is the FULL contract, all six contexts: `shipyard governance apply`
# pushes exactly this list to branch protection, so a partial list would drop
# required checks. It must equal the contexts in
# .github/rulesets/main-protection.json; `base-poison-detector-selftest`
# (tools/ci/test_base_poison_detector.py) fails when the two disagree.
#
# Readers that judge only some of these must narrow it themselves rather than
# have it narrowed here. tools/ci/base_poison_detector.py judges main's tip
# from the build.yml merge_group run, so only the job names build.yml produces
# (`macos`) select anything there; tools/scripts/landing_watchdog.py reads
# commit statuses as well as check runs, because `Vellum trusted freeze` reaches
# a pull request's head as a status.
[governance]
required_status_checks = [
    "macos",
    "Enforce version & skill sync",
    "Build + prove + (owner-gated) deploy",
    "Vellum freeze",
    "Vellum trusted freeze",
    "drift-fast",
]

# Every workflow that PRODUCES a required status context, so Shipyard's
# landability preflight can answer "will this gate be requested, and can it be
# scheduled" for all six rather than for one.
#
# Branch protection on `main` requires six contexts. Reading only `build.yml`
# — the previous default — left four of them `no_producer`: not checked, and
# reported as a warning that reads identically to a clean result. The list is
# the map from context to file:
#
#   macos                                  build.yml
#   Enforce version & skill sync           version-skill-check.yml
#   Build + prove + (owner-gated) deploy   wclap-cloudflare.yml
#   Vellum freeze                          vellum-freeze-check.yml
#   Vellum trusted freeze                  vellum-trusted-gate.yml
#   drift-fast                             drift-fast.yml
#
# None of the six is path-filtered under `pull_request`
# (`wclap-cloudflare.yml`'s `paths:` sits under `push`, deliberately: a
# path-filtered REQUIRED check stays Pending forever and blocks the PR), so all
# six fire on every pull request to `main`. `shipyard landability` re-derives
# that on each run rather than trusting this comment.
[landability]
workflows = [
    ".github/workflows/build.yml",
    ".github/workflows/version-skill-check.yml",
    ".github/workflows/wclap-cloudflare.yml",
    ".github/workflows/vellum-freeze-check.yml",
    ".github/workflows/vellum-trusted-gate.yml",
    ".github/workflows/drift-fast.yml",
]

# Per-branch protection knobs. `require_strict_status = true` means a PR must
# be up to date with `main` (re-validated on the exact merge-candidate SHA)
# before it can merge — matching the ruleset's
# strict_required_status_checks_policy.
[branch_protection."main"]
require_strict_status = true

# ── Ship defaults ──────────────────────────────────────────────────────────

[ship]
base_branch = "main"

# ── Changelog & post-tag sync (issue #53, shipyard v0.9.0) ────────────────
# Shipyard owns CHANGELOG.md regeneration after tag pushes. The GitHub Release
# body is composed separately in release-cli.yml from Pulp highlights plus
# GitHub's generated release notes.

[release.changelog]
enabled    = true
repo_url   = "https://github.com/Generous-Corp/pulp"
path       = "CHANGELOG.md"
tag_filter = "v*"
product    = "Pulp"
skip_commit_patterns = [
  "^chore: bump .*version",
  "^chore\\(release\\): ",
  "^bump .*to v?\\d+\\.\\d+\\.\\d+$",
]
# The generated file's leading comment. Shipyard v0.11.0+ accepts a full
# comment block here.
header_comment = """<!-- This file is regenerated by `shipyard changelog regenerate` in every
     version-bump commit, so a release appears here with the bump after it.
     Edits are picked up on the next regen as long as they land in the right
     release's bullet block. See docs/guides/versioning.md § Release pipeline
     for the full end-to-end flow. -->"""

[metrics.gate_cost]
# Defaults for `shipyard metrics gate-cost`, so the gate-cost proxy (gate runs
# and gate-minutes per merged PR, batch fullness, receipt reuse) is the same
# number whoever runs it: `shipyard metrics gate-cost --since 7d` from a Pulp
# checkout. `macos` in build.yml is the required gate the merge queue waits on.
repo        = "Generous-Corp/pulp"
workflow    = "build.yml"
gate_job    = "macos"
base_branch = "main"

[pr.body]
# Closes every PR body `shipyard pr` composes, so agents stop editing the
# attribution line in by hand after the PR opens.
attribution = "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
