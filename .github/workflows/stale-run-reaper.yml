name: Stale run reaper

# Scheduled janitor that cancels stuck GitHub Actions runs.
#
# Motivating incident: GitHub Actions has no automatic cleanup of stuck
# workflow runs, and Pulp's CI queue clogged badly because of two
# distinct failure modes:
#
#   - Hung runs: Coverage runs sat `in_progress` for 2-7 hours when a
#     healthy Coverage run takes ~1h. A hung job squats on a runner
#     slot until GitHub's 6h default job timeout finally reaps it.
#   - Orphaned queued runs: runs sat `queued` for 5+ days, waiting on a
#     runner label or branch that no longer exists. A queued job that
#     never starts never hits any timeout — it waits effectively
#     forever.
#
# Both modes occupy the limited macOS-runner concurrency slots, and
# everything behind them stalls. Nothing else in the repo detects or
# cancels them. This workflow does.
#
# Logic (tools/scripts/stale_run_reaper.py, tested by test_stale_run_reaper.py):
#   - Pages through `actions/runs?status=in_progress` and `?status=queued`.
#   - `in_progress` runs are aged from `run_started_at` (execution
#     start), NOT `created_at`. `created_at` also counts queue time, so
#     a run that queued for hours then started recently would look
#     "hung" and be wrongly cancelled. `queued` runs never started, so
#     `created_at` IS their age.
#   - `in_progress` runs older than IN_PROGRESS_MAX_MINUTES and
#     `queued` runs older than QUEUED_MAX_MINUTES are cancelled via the
#     runs/<id>/cancel API. A 409 refusal escalates to runs/<id>/force-cancel
#     unless the run's head is still the head of an open pull request.
#   - A run refusing BOTH with "has not been queued yet" is a GitHub-side
#     phantom (zero jobs; delete is refused too). It is listed separately and
#     never counted as cancelled -- the old shell loop logged those as
#     "likely already completed" every 30 minutes for weeks.
#   - Thresholds are conservative: the slowest legit run (the cold
#     nightly full build) executes ~2h, so the 4h in_progress cutoff
#     is a 2x margin — nothing healthy is reaped.
#   - Never cancels its own run (skips `${{ github.run_id }}`).
#   - A failed cancel on one run never aborts the rest of the sweep.
#   - Writes a step summary: runs scanned plus a table of every run
#     cancelled. If the reaper keeps reaping the same workflow, that
#     workflow has a hang bug worth investigating — the summary history
#     makes that visible.

on:
  schedule:
    # Every 30 minutes — a stuck run should not squat a slot for long.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      in_progress_max_minutes:
        description: 'Cancel in_progress runs whose execution has run longer than this many minutes'
        required: false
        default: '240'
      queued_max_minutes:
        description: 'Cancel queued runs older than this many minutes'
        required: false
        default: '480'

permissions:
  actions: write   # required to cancel workflow runs
  contents: read

concurrency:
  group: stale-run-reaper
  cancel-in-progress: false

jobs:
  reap:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    name: Cancel stuck workflow runs

    env:
      # Defaults, overridable by workflow_dispatch inputs. in_progress
      # runs that have been EXECUTING (run_started_at) longer than 4h
      # are hung; queued runs older than 8h are orphaned. The slowest
      # legit run — the cold nightly full build — executes ~2h, so 4h
      # is a safe 2x margin.
      IN_PROGRESS_MAX_MINUTES: ${{ github.event.inputs.in_progress_max_minutes || '240' }}
      QUEUED_MAX_MINUTES: ${{ github.event.inputs.queued_max_minutes || '480' }}
      REPO: ${{ github.repository }}
      SELF_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools/scripts

      - name: Reap stale runs
        shell: bash
        # Cancel first; on a refused cancel escalate to force-cancel unless the
        # run's head is a live PR head; report GitHub-side phantoms (cancel and
        # force-cancel both refused) separately instead of as cancelled.
        run: |
          set -euo pipefail
          python3 tools/scripts/stale_run_reaper.py --summary "$GITHUB_STEP_SUMMARY"
