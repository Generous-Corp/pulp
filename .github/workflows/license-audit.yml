name: License Audit

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: license-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit dependency and boundaries

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The renderer pin transition check merge-bases HEAD against
          # origin/<base>, which a shallow checkout does not have.
          fetch-depth: 0

      - name: Verify dependency inventory
        run: python3 tools/deps/audit.py --strict

      - name: Verify and vendor boundaries
        run: python3 tools/audit.py --
