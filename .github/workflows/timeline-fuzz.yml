name: Timeline and control protocol fuzzing

# Fuzzing over the untrusted Timeline document parsers, the bounded local
# capability-control protocol decoder, and the other parsers that read bytes a
# host, a downloaded pack or a dropped file hands the SDK: the host-facing
# plugin state blob, a scripted UI document (ui.js) in a QuickJS realm, SVG
# ingest, Standard MIDI File import, audio container headers, and the
# content-pack, sample-bank and plugin capability manifests.
#
# Two lanes share each parser's oracle implementation
# (`timeline_document_oracle.*` and `control_protocol_fuzz_oracle.hpp`), because
# duplicated properties would drift into disagreeing about what a finding is:
#
#   deterministic  Replays a seeded mutation corpus. Runs on every PR that
#                  touches the parse surface, reproduces any case from its
#                  (seed, index) pair, and needs no special toolchain.
#   libfuzzer      Coverage-guided exploration under ASan. Scheduled and
#                  on-demand only, and Linux-only: `-fsanitize=fuzzer` needs a
#                  compiler runtime Apple's clang does not ship, so a macOS leg
#                  would need a Homebrew LLVM and would buy nothing the
#                  deterministic lane does not already cover. The parser
#                  targets that have no deterministic twin live only here, so
#                  this job is their one lane: each also carries a bounded
#                  ctest smoke (`-L libfuzzer`) that proves the binary links,
#                  loads its seeds and survives a short mutation pass before
#                  the long budget starts.
#
# Runner routing: GitHub-hosted throughout. Per the repository's runner-priority
# contract the self-hosted Macs carry the required `macos` gate, and a
# high-throughput fuzz loop is exactly the kind of long-running job that must
# not compete with it.
#
# Cost, measured on an arm64 Release build: the replay runs ~37k cases per
# second, so the PR budget of 20k cases is ~0.5s and the nightly 2M is ~53s.
# The lane's wall clock is therefore its build, not its fuzzing, which is why
# the nightly budget is large: raising it is nearly free, and a lane that costs
# minutes per run is a lane that gets muted. The libFuzzer job is bounded by
# -max_total_time instead, since coverage-guided exploration has no natural end.
# Both jobs carry a timeout-minutes ceiling.

on:
  pull_request:
    paths:
      - 'core/timeline/**'
      - 'inspect/include/pulp/inspect/control_protocol.hpp'
      - 'inspect/src/control_protocol*.cpp'
      - 'inspect/src/control_json_*.cpp'
      - 'test/fuzz/**'
      - 'test/fixtures/fuzz/**'
      - 'test/test_control_protocol_fuzz.cpp'
      - 'test/test_timeline_document_fuzz.cpp'
      - 'test/fixtures/timeline/**'
      - 'test/cmake/timeline_tests.cmake'
      - '.github/workflows/timeline-fuzz.yml'
  schedule:
    # Nightly, off the PR path so a long exploration budget costs no review time.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: 'Deterministic replay cases'
        required: false
        default: '2000000'
      libfuzzer_seconds:
        description: 'libFuzzer wall-clock budget per target, in seconds'
        required: false
        default: '900'

concurrency:
  group: timeline-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic corpus replay
    if: github.event_name != 'schedule' || github.repository == 'Generous-Corp/pulp'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # The oracle parses documents, but the target is built out of a whole-repo
      # configure, and core/audio's `find_package(ALSA REQUIRED)` makes the
      # native Linux headers a hard prerequisite of that configure — not of the
      # fuzzing. setup.sh checks for the same headers and exits non-zero without
      # them, so this step has to come first.
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-build-deps

      - name: Bootstrap repository dependencies
        run: ./setup.sh --ci --deps-only

      - name: Configure
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=Release \
            -DPULP_BUILD_TESTS=ON \
            -DPULP_BUILD_EXAMPLES=OFF \
            -DPULP_ENABLE_GPU=OFF

      - name: Build
        run: |
          tools/ci/governed-build.sh cmake --build build-fuzz \
            --target pulp-test-timeline-document-fuzz pulp-test-control-protocol-fuzz \

      - name: Replay
        env:
          # A schedule run rotates the seed so successive nights explore
          # different inputs; a PR run pins it so a failure a reviewer sees is
          # the same failure they can reproduce locally.
          PULP_TIMELINE_FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || 1 }}
          PULP_TIMELINE_FUZZ_CASES: ${{ inputs.cases || (github.event_name == 'pull_request' && '20000' || '2000000') }}
          PULP_CONTROL_PROTOCOL_FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || 1 }}
          PULP_CONTROL_PROTOCOL_FUZZ_CASES: ${{ inputs.cases || (github.event_name == 'pull_request' && '20000' || '2000000') }}
        run: |
          ctest --test-dir build-fuzz --output-on-failure -L fuzz

  libfuzzer:
    name: Coverage-guided (libFuzzer + ASan)
    # Skipped on pull_request: the deterministic lane already runs every oracle
    # on the PR path, and a coverage-guided run whose budget is short enough for
    # a PR explores too little to justify the build.
    if: >-
      (github.event_name != 'schedule' || github.repository == 'Generous-Corp/pulp')
      && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Eight targets at the default 900 s budget each is two hours of fuzzing
    # on top of the build; the ceiling leaves room for the build and the
    # smoke without masking a wedged target.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-build-deps

      - name: Bootstrap repository dependencies
        run: ./setup.sh --ci --deps-only

      - name: Configure with libFuzzer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-libfuzzer \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPULP_BUILD_TESTS=ON \
            -DPULP_BUILD_EXAMPLES=OFF \
            -DPULP_ENABLE_GPU=OFF \
            -DPULP_ENABLE_FUZZING=ON

      - name: Build
        run: |
          tools/ci/governed-build.sh cmake --build build-libfuzzer \
            --target pulp-fuzz-timeline-document pulp-fuzz-control-protocol \
              pulp-generate-control-protocol-fuzz-corpus \
              pulp-fuzz-plugin-state pulp-generate-plugin-state-fuzz-corpus \
              pulp-fuzz-ui-script pulp-fuzz-svg pulp-fuzz-smf \
              pulp-fuzz-content-manifest pulp-fuzz-format-registry

      # Bounded pass over every registered target and its seed corpus. A
      # target that fails to load its seeds or crashes within a few thousand
      # iterations fails here, named, instead of inside a fifteen-minute run.
      - name: Smoke every libFuzzer target
        run: |
          ctest --test-dir build-libfuzzer --output-on-failure -L libfuzzer

      - name: Seed the corpus
        run: |
          mkdir -p fuzz-corpus/timeline fuzz-corpus/control-protocol
          # Only the entries corpus.index declares as timeline JSON. Feeding it
          # the payload blobs and foreign-format inputs it deliberately excludes
          # would seed the engine with documents whose rejection means nothing.
          awk '$1 == "document" || $1 == "fragment" { print $2 }' \
            test/fixtures/timeline/corpus.index \
            | while read -r entry; do
                cp "test/fixtures/timeline/$entry" \
                   "fuzz-corpus/timeline/$(echo "$entry" | tr '/' '_')"
              done
          ./build-libfuzzer/test/pulp-generate-control-protocol-fuzz-corpus \
            fuzz-corpus/control-protocol
          ./build-libfuzzer/test/pulp-generate-plugin-state-fuzz-corpus \
            fuzz-corpus/plugin-state
          # The checked-in seeds are read in place; libFuzzer writes every new
          # input into the first directory it is given, so each target gets a
          # scratch directory first and never grows the fixture tree.
          mkdir -p fuzz-corpus/ui-script fuzz-corpus/svg fuzz-corpus/smf \
            fuzz-corpus/content-manifest fuzz-corpus/format-registry
          find fuzz-corpus -type f -print | sort

      - name: Fuzz
        env:
          ASAN_OPTIONS: 'detect_leaks=0:halt_on_error=1'
        run: |
          ./build-libfuzzer/test/pulp-fuzz-timeline-document \
            fuzz-corpus/timeline \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=1048576 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          ./build-libfuzzer/test/pulp-fuzz-control-protocol \
            fuzz-corpus/control-protocol \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=1048576 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          ./build-libfuzzer/test/pulp-fuzz-plugin-state \
            fuzz-corpus/plugin-state \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=1048576 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          # Each ui.js input builds a fresh realm, so the input ceiling is
          # small and the per-input watchdog (500 ms) sits well under the
          # libFuzzer timeout.
          ./build-libfuzzer/test/pulp-fuzz-ui-script \
            fuzz-corpus/ui-script test/fixtures/fuzz/ui-script \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=16384 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          ./build-libfuzzer/test/pulp-fuzz-svg \
            fuzz-corpus/svg test/fixtures/fuzz/svg \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=262144 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          ./build-libfuzzer/test/pulp-fuzz-smf \
            fuzz-corpus/smf test/fixtures/fuzz/smf \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=1048576 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          ./build-libfuzzer/test/pulp-fuzz-content-manifest \
            fuzz-corpus/content-manifest test/fixtures/fuzz/content-manifest \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=262144 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1
          ./build-libfuzzer/test/pulp-fuzz-format-registry \
            fuzz-corpus/format-registry \
            -max_total_time=${{ inputs.libfuzzer_seconds || 900 }} \
            -max_len=1048576 \
            -rss_limit_mb=2048 \
            -timeout=25 \
            -print_final_stats=1

      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-fuzz-reproducers
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          # Deliberately the long retention, not an oversight: these upload only
          # on failure and hold the crash/timeout/OOM input that reproduces the
          # bug. A reproducer that expires before anyone downloads it is a lost
          # bug, and the volume is negligible because green runs upload nothing.
          retention-days: 90
