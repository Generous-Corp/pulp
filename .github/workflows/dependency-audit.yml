name: Dependency Audit

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'

jobs:
  audit:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    name: Audit dependency pins and notices

    steps:
      - uses: actions/checkout@v5

      - name: Run dependency audit
        run: |
          python3 tools/deps/audit.py --strict --check-upstream --format markdown > dependency-audit.md

      - name: Publish summary
        run: cat dependency-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit
          path: dependency-audit.md
          # The same report is written to the run's step summary, which persists
          # with the run, so the artifact is a convenience download.
          retention-days: 14
