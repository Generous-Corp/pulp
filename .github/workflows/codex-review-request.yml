name: Codex review request

# Codex's automatic code review fires on PR open only for PRs whose author is a
# GitHub *User*. A PR opened by an App — every PR `shipyard pr` creates, which is
# the mandated path for agents — is skipped, so it merges unreviewed unless
# somebody asks. Codex reports the distinction itself: the "Review trigger" cell
# in its summary comment reads `PR opened` on User-authored PRs and
# `Manual request` on the App-authored ones that were reviewed at all.
#
# The skip is Codex-side behavior and is not configurable from this repository.
# This workflow is the in-repo mitigation: it issues the same `@codex review` a
# human would, then PROVES a review completed for this PR's head commit. It
# fails loudly when none did, because a review-coverage mitigation that can
# no-op in silence reproduces the gap it exists to close.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    # Matched by login, not by `user.type == 'Bot'`. That type also covers
    # Dependabot, whose `pull_request` runs get no secrets and a read-only
    # token, so this job would reach `gh pr comment` and fail — an unrelated
    # red check on a PR it was never meant to touch. Fork PRs are excluded
    # too: they carry a User author, so Codex already reviews them.
    if: >-
      github.event.pull_request.user.login == 'shipyard-local[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Request Codex review on an App-authored PR
    timeout-minutes: 20

    env:
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # A real user PAT is preferred so the request carries the same identity as
      # the manual `@codex review` comments a human would send. GITHUB_TOKEN is
      # a workable fallback — a request from an App identity does produce a
      # review — but it is second choice, and the verification below is what
      # actually decides whether either worked.
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      CODEX_LOGIN: chatgpt-codex-connector[bot]

    steps:
      # Deliberately the BASE commit, never the PR's. This job runs with a
      # privileged PAT in the environment, and the PR under review is authored
      # by an automated process: checking out the PR would let a change to
      # `codex_review_signal.sh` execute with that PAT in reach. The base copy
      # is the reviewed one, and a PR that edits the checker is still checked by
      # the version already on the branch it targets.
      - name: Checkout the base commit (never the PR under review)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Request a review if one has not already completed
        id: request
        shell: bash
        run: |
          set -euo pipefail

          # Exit 2 means the checker could not see, which is not the same as
          # "no review" and must not be treated as one.
          set +e
          bash tools/scripts/codex_review_signal.sh "$REPO" "$PR" "$HEAD_SHA"
          signal=$?
          set -e
          if [ "$signal" -eq 2 ]; then
              echo "::error::Cannot read review state for #$PR, so whether it has been" \
                   "reviewed is unknown. Not requesting; re-run once GitHub is reachable."
              exit 1
          fi
          if [ "$signal" -eq 0 ]; then
              echo "A review has already completed for this head — not requesting again."
              echo "already=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "already=false" >> "$GITHUB_OUTPUT"

          gh pr comment "$PR" --repo "$REPO" --body '@codex review'
          echo "Requested a Codex review on #$PR."

      - name: Verify a review completed for this head
        if: steps.request.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Observed reviews reach **Completed** in four to five minutes, so the
          # budget is ten: long enough not to fail one that is simply still
          # thinking, short enough to report while the PR is open. Four spaced
          # checks, never a poll loop — a tight loop over the GitHub API trips
          # its secondary rate limit for the whole machine.
          for wait in 120 150 180 240; do
              sleep "$wait"
              set +e
              bash tools/scripts/codex_review_signal.sh "$REPO" "$PR" "$HEAD_SHA"
              signal=$?
              set -e
              [ "$signal" -eq 0 ] && exit 0
              if [ "$signal" -eq 2 ]; then
                  echo "::error::Lost visibility of review state for #$PR; whether it" \
                       "was reviewed is unknown rather than known-bad."
                  exit 1
              fi
          done

          echo "::error::Requested a Codex review on #$PR but none completed for" \
               "$HEAD_SHA within ten minutes, so this PR is unreviewed. The last line" \
               "above distinguishes a request that stalled from one never taken."
          exit 1
