name: Format validator baseline diff

# Runs the format validator baseline diff whenever a PR touches the
# format adapters or plugin slots. Catches silent format/protocol
# regressions that compile clean but break real-DAW compatibility.
#
# The gate compares the current validator output (auval / pluginval /
# clap-validator) against the committed fixtures in
# test/fixtures/format-baseline/. A diff blocks the PR; intentional
# changes require regenerating the baseline in the same PR via
# tools/scripts/format_baseline_capture.sh.

on:
  pull_request:
    paths:
      - 'core/format/**'
      - 'core/host/src/plugin_slot_*'
      - 'core/host/include/pulp/host/plugin_slot.hpp'
      - 'test/fixtures/format-baseline/**'
      - 'tools/scripts/format_baseline_*'
      - '.github/workflows/format-baseline-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same PR. This
# job runs on the self-hosted macOS runner and installs plugin bundles
# into the runner's ~/Library/Audio/Plug-Ins; cancelling a stale run
# frees that runner sooner. The "Clean up installed plugin bundles"
# step below (if: always()) removes any bundles a cancelled run left
# behind on the next run.
concurrency:
  group: format-baseline-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-advisory-macos:
    name: Resolve isolated advisory macOS runner
    runs-on: ubuntu-latest
    outputs:
      selector_json: ${{ steps.resolve.outputs.selector_json }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        shell: bash
        env:
          CONFIGURED_JSON: ${{ vars.PULP_ADVISORY_MACOS_RUNS_ON_JSON }}
        run: |
          python3 tools/scripts/resolve_advisory_macos_runner.py \
            --configured-json "$CONFIGURED_JSON" \
            --fallback-json '"macos-15"' \
            --event-name "${{ github.event_name }}"

  baseline-diff:
    # macOS is required because auval is platform-specific. Pull requests stay
    # hosted; an isolated private advisory selector is dispatch-only until an
    # organization runner group enforces trusted-workflow access.
    needs: resolve-advisory-macos
    # The resolver rejects the required pulp-build* and pulp-preamble* pools.
    runs-on: ${{ fromJSON(needs.resolve-advisory-macos.outputs.selector_json) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned pluginval
        run: |
          set -euo pipefail
          PLUGINVAL_VERSION="1.0.4"
          PLUGINVAL_SHA256="3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f"
          PLUGINVAL_URL="https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          curl -fsSL "$PLUGINVAL_URL" -o "$RUNNER_TEMP/pluginval.zip"
          echo "$PLUGINVAL_SHA256  $RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval-dist"
          PLUGINVAL_BIN="$RUNNER_TEMP/pluginval-dist/pluginval.app/Contents/MacOS/pluginval"
          if [ ! -x "$PLUGINVAL_BIN" ]; then
            echo "::error::Pinned pluginval archive did not contain the expected binary"
            find "$RUNNER_TEMP/pluginval-dist" -type f | head -20
            exit 1
          fi
          # Keep the executable inside its signed .app bundle. Copying it out
          # breaks the bundle context and macOS amfid may kill it with exit 137.
          echo "$(dirname "$PLUGINVAL_BIN")" >> "$GITHUB_PATH"

      - name: Install pinned clap-validator
        run: |
          set -euo pipefail
          CV_VERSION="0.3.2"
          CV_SHA256="3750f3729adfd8489f2b29019f7f2ed65ba71bf9d5049735f6a2ca0fccb18ffd"
          CV_ARCHIVE="$RUNNER_TEMP/clap-validator.tar.gz"
          CV_URL="https://github.com/free-audio/clap-validator/releases/download/${CV_VERSION}/clap-validator-${CV_VERSION}-macos-universal.tar.gz"
          curl -fsSL "$CV_URL" -o "$CV_ARCHIVE"
          echo "$CV_SHA256  $CV_ARCHIVE" | shasum -a 256 -c -
          tar -xzf "$CV_ARCHIVE" -C "$RUNNER_TEMP" --strip-components=1
          mkdir -p "$RUNNER_TEMP/pulp-bin"
          mv "$RUNNER_TEMP/clap-validator" "$RUNNER_TEMP/pulp-bin/clap-validator"
          chmod +x "$RUNNER_TEMP/pulp-bin/clap-validator"
          echo "$RUNNER_TEMP/pulp-bin" >> "$GITHUB_PATH"

      - name: Check validator availability
        id: validators
        run: |
          have_auval=0
          have_pluginval=0
          have_clap_validator=0
          if command -v auval >/dev/null 2>&1; then have_auval=1; fi
          if command -v pluginval >/dev/null 2>&1; then have_pluginval=1; fi
          if command -v clap-validator >/dev/null 2>&1; then have_clap_validator=1; fi
          {
            echo "auval=$have_auval"
            echo "pluginval=$have_pluginval"
            echo "clap_validator=$have_clap_validator"
          } >> "$GITHUB_OUTPUT"
          echo "Validator availability: auval=$have_auval pluginval=$have_pluginval clap-validator=$have_clap_validator"
          if [ "$have_pluginval" -ne 1 ]; then
            echo "::error::pluginval is required for the blocking VST3 baseline"
            exit 1
          fi
          if [ "$have_clap_validator" -ne 1 ]; then
            echo "::error::clap-validator is required for the blocking CLAP baseline"
            exit 1
          fi

      - name: Fetch external SDKs required for AU / VST3
        # The AU and VST3 format targets are conditionally created
        # only when their respective external SDKs are present.
        # Without these, cmake configure prints "AudioUnitSDK not
        # found — AU v2 format disabled" and the _AU / _VST3 targets
        # don't exist, causing `make: *** No rule to make target` on
        # the build step. Both SDKs are MIT/Apache-2.0 and safe to
        # clone in CI per CLAUDE.md's "External SDKs" section.
        run: |
          if [ ! -d external/AudioUnitSDK ]; then
            git clone --depth 1 https://github.com/apple/AudioUnitSDK.git external/AudioUnitSDK
          fi
          if [ ! -d external/vst3sdk ]; then
            git clone --depth 1 --branch v3.8.0_build_66 \
              --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git \
              external/vst3sdk
          fi

      - name: Build representative plugin (PulpEffect — AU + VST3 + CLAP)
        # PulpDrums is CLAP-only; PulpEffect ships in all three formats
        # (FORMATS VST3 AU CLAP per examples/pulp-effect/CMakeLists.txt)
        # so the gate exercises every validator.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPULP_ENABLE_GPU=OFF
          # pulp_add_plugin() emits per-format targets:
          # PulpEffect_AU, PulpEffect_VST3, PulpEffect_CLAP. If a
          # target is missing because its SDK couldn't be fetched
          # (transient network failure), build the rest and let
          # format_baseline_diff.py skip the missing lane.
          # A configured self-hosted advisory lane still takes a governed share
          # (a tartci lease) instead of `-j$(sysctl -n hw.ncpu)` (every core).
          available=()
          for fmt in AU VST3 CLAP; do
            if tools/ci/governed-build.sh cmake --build build --target PulpEffect_$fmt 2>/dev/null; then
              available+=("PulpEffect_$fmt")
              echo "Built PulpEffect_$fmt"
            else
              echo "::warning::PulpEffect_$fmt target missing — that lane will skip"
            fi
          done
          if [ ${#available[@]} -eq 0 ]; then
            echo "::error::No PulpEffect format targets built"
            exit 1
          fi

      - name: Install plugin bundles to system folders + ad-hoc codesign
        # Plugin bundles are emitted under top-level format dirs per
        # tools/cmake/PulpUtils.cmake — LIBRARY_OUTPUT_DIRECTORY is
        # set to ${CMAKE_BINARY_DIR}/AU, /VST3, /CLAP for each format.
        #
        # Ad-hoc codesign each bundle so pluginval and auval can load
        # them without macOS Gatekeeper killing the process. The
        # `-` identity is an ad-hoc signature (no Developer ID needed);
        # `--force --deep` re-signs all embedded resources.
        run: |
          set -e
          mkdir -p ~/Library/Audio/Plug-Ins/Components \
                   ~/Library/Audio/Plug-Ins/VST3 \
                   ~/Library/Audio/Plug-Ins/CLAP
          if [ -d build/AU/PulpEffect.component ]; then
            codesign --force --deep --sign - build/AU/PulpEffect.component || true
            cp -R build/AU/PulpEffect.component ~/Library/Audio/Plug-Ins/Components/
          else
            echo "::warning::build/AU/PulpEffect.component missing — AU lane will skip"
          fi
          if [ -d build/VST3/PulpEffect.vst3 ]; then
            codesign --force --deep --sign - build/VST3/PulpEffect.vst3 || true
            cp -R build/VST3/PulpEffect.vst3 ~/Library/Audio/Plug-Ins/VST3/
          else
            echo "::warning::build/VST3/PulpEffect.vst3 missing — VST3 lane will skip"
          fi
          if [ -e build/CLAP/PulpEffect.clap ]; then
            cp -R build/CLAP/PulpEffect.clap ~/Library/Audio/Plug-Ins/CLAP/
          else
            echo "::warning::build/CLAP/PulpEffect.clap missing — CLAP lane will skip"
          fi

          # AudioComponentRegistrar caches AU metadata across jobs on the
          # self-hosted Studios. A freshly copied component can otherwise be
          # present on disk while auval still resolves the removed component
          # from the preceding job and fails with error -50. This is the same
          # refresh required by validate.yml, the DAW bench preflight, and
          # `pulp doctor --au-cache`.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5

      - name: Run baseline diff
        run: |
          python3 tools/scripts/format_baseline_diff.py --plugin PulpEffect \
            --diag-dir "$RUNNER_TEMP/baseline-diag"

      - name: Upload validator output
        # The validators' own output is the only thing that explains a failure
        # here, and it is written inside a temp dir the diff script deletes on
        # the way out. --diag-dir above copies it somewhere durable; this makes
        # it reachable from the run. `if: always()` because the run that most
        # needs its output uploaded is the one that failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-baseline-validator-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline-diag
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up installed plugin bundles
        # The "Install plugin bundles to system folders" step above copies
        # PulpEffect.{component,vst3,clap} into the self-hosted macOS
        # runner's ~/Library/Audio/Plug-Ins. Remove them so a stale bundle
        # from this run (or a run cancelled by the concurrency group before
        # this step) can't poison a later format-baseline-diff or any other
        # job that scans those folders. `if: always()` so the cleanup runs
        # even when the baseline diff fails.
        if: always()
        run: |
          rm -rf ~/Library/Audio/Plug-Ins/Components/PulpEffect.component \
                 ~/Library/Audio/Plug-Ins/VST3/PulpEffect.vst3 \
                 ~/Library/Audio/Plug-Ins/CLAP/PulpEffect.clap
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          echo "Removed PulpEffect plugin bundles from ~/Library/Audio/Plug-Ins/"
