name: CodeQL (advanced)

on:
  push:
    branches: [main]
  # A pull request that changes only Markdown, docs/ or the planning gitlink
  # has nothing for CodeQL to analyze, so it does not run; every other pull
  # request, every push to main and the weekly schedule still do. CodeQL is not
  # a required check, so skipping it never leaves a pull request on "Expected".
  # This list is classify_changes.DOCS_PATHS_IGNORE: test_classify_changes.py
  # proves every docs-only diff (impact_class) is skipped and no diff touching
  # a file outside it is.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "planning"
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# A new push to a PR retires the previous head's analysis: CodeQL is advisory
# and only the latest PR head's results matter. Main, schedule, and manual runs
# get a group per run so every main commit keeps its own analysis.
concurrency:
  group: codeql-advanced-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # C++ is scanned by the sharded `analyze-cpp` job below, not here: one
    # repository-wide extraction never finished (see that job).
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ${{ matrix.runner }}
    # Native autobuild can exceed 45 minutes on the hosted macOS/Linux images;
    # canceling before `analyze` produces a false-red required check.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: autobuild
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # C++ is analyzed in shards, nightly and on demand, not on every push.
  #
  # One buildless extraction of the whole repository (about 3,850 translation
  # units) never completed: 0 of 271 runs from 2026-11-11 to 2026-11-17. The
  # single extractor process grows about 0.5 GB a minute until the 16 GB runner
  # is out of memory and is shut down (or the 90-minute timeout hits), so the
  # cost is the size of one process, not the thread count. Each shard below
  # extracts a slice in 2 to 12 minutes. The slices come from bisecting that
  # failure; `rest` takes everything the named slices do not, so a new
  # directory is still scanned.
  #
  # Two translation units make the extractor spin with growing memory and no
  # end (more than 20 minutes alone, while the other 3,800 finish in minutes):
  # tools/audio/host-probe/au_effect_ab.cpp and
  # examples/pulp-delay/test_pulp_delay_ui.cpp. They are excluded until the
  # cause is found; both are exercised by the build and test gates.
  #
  # Not a per-push job: 20 shards a push on hosted runners would queue behind
  # the required Linux leg for no gain, since the scan is advisory.
  analyze-cpp:
    name: Analyze c-cpp (${{ matrix.shard }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == vars.PULP_PRIMARY_REPO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: core-view, paths: "core/view"}
          - {shard: core-audio-host-format, paths: "core/audio core/host core/format"}
          - {shard: core-timeline-canvas-platform, paths: "core/timeline core/canvas core/platform"}
          - {shard: core-rest, paths: "core", ignore: "core/view core/audio core/host core/format core/timeline core/canvas core/platform"}
          - {shard: tools-a, paths: "tools/appearance tools/audio tools/clap-worker tools/clap_param_probe.c tools/cli"}
          - {shard: tools-b, paths: "tools/cmake tools/design tools/design-ab tools/diagnostics tools/editor-open tools/gpu_roofline tools/import-design tools/lv2-ttlgen tools/mcp tools/midi-ports tools/packages tools/rack tools/scan-worker tools/screenshot tools/scripts tools/testing tools/timeline tools/validation tools/vst3_load_probe.c tools/wgsl"}
          - {shard: examples-a, paths: "examples", ignore: "examples/ink-signal-sampler examples/ink-signal-showcase examples/ios-auv3-chainer examples/ios-auv3-gpu-smoke examples/ios-auv3-jsc-threejs examples/ios-auv3-synth examples/midi-learn-demo examples/pulp-compressor examples/pulp-delay examples/pulp-effect examples/pulp-gain examples/pulp-multi-out examples/pulp-pluck examples/pulp-tone examples/pulp-transpose examples/rust-gain examples/sample-region-allpass examples/sdf-effects-demo examples/sdf-text-demo"}
          - {shard: examples-b, paths: "examples/ink-signal-sampler examples/ink-signal-showcase examples/ios-auv3-chainer examples/ios-auv3-gpu-smoke examples/ios-auv3-jsc-threejs examples/ios-auv3-synth examples/midi-learn-demo examples/pulp-compressor examples/pulp-delay examples/pulp-effect examples/pulp-gain examples/pulp-multi-out examples/pulp-pluck examples/pulp-tone examples/pulp-transpose examples/rust-gain examples/sample-region-allpass examples/sdf-effects-demo examples/sdf-text-demo"}
          - {shard: test-a-d, paths: "test/test_a*.cpp test/test_b*.cpp test/test_c*.cpp test/test_d*.cpp test/test_e*.cpp"}
          - {shard: test-f-l, paths: "test/test_f*.cpp test/test_g*.cpp test/test_h*.cpp test/test_i*.cpp test/test_j*.cpp test/test_k*.cpp test/test_l*.cpp"}
          - {shard: test-m-r, paths: "test/test_m*.cpp test/test_n*.cpp test/test_o*.cpp test/test_p*.cpp test/test_q*.cpp test/test_r*.cpp"}
          - {shard: test-s, paths: "test/test_s*.cpp"}
          - {shard: test-t-z, paths: "test/test_t*.cpp test/test_u*.cpp test/test_v*.cpp test/test_w*.cpp test/test_x*.cpp test/test_y*.cpp test/test_z*.cpp"}
          - {shard: test-rest, paths: "test", ignore: "test/test_a*.cpp test/test_b*.cpp test/test_c*.cpp test/test_d*.cpp test/test_e*.cpp test/test_f*.cpp test/test_g*.cpp test/test_h*.cpp test/test_i*.cpp test/test_j*.cpp test/test_k*.cpp test/test_l*.cpp test/test_m*.cpp test/test_n*.cpp test/test_o*.cpp test/test_p*.cpp test/test_q*.cpp test/test_r*.cpp test/test_s*.cpp test/test_t*.cpp test/test_u*.cpp test/test_v*.cpp test/test_w*.cpp test/test_x*.cpp test/test_y*.cpp test/test_z*.cpp"}
          - {shard: rest, paths: ".", ignore: "core tools examples test"}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select this shard
        env:
          SHARD_PATHS: ${{ matrix.paths }}
          SHARD_IGNORE: ${{ matrix.ignore }}
        run: |
          set -euo pipefail
          {
            echo "name: pulp-codeql-cpp-${{ matrix.shard }}"
            if [ "$SHARD_PATHS" != "." ]; then
              echo "paths:"
              for p in $SHARD_PATHS; do
                if [ -d "$p" ]; then echo "  - $p/**"; else echo "  - $p"; fi
              done
            fi
            echo "paths-ignore:"
            # What .github/codeql-config.yml ignores, plus the two translation
            # units named above.
            echo "  - test/fixtures/import-differential/holdout/**"
            echo "  - tools/audio/host-probe/au_effect_ab.cpp"
            echo "  - examples/pulp-delay/test_pulp_delay_ui.cpp"
            for p in $SHARD_IGNORE; do
              if [ -d "$p" ]; then echo "  - $p/**"; else echo "  - $p"; fi
            done
          } > .github/codeql-cpp-shard.yml
          cat .github/codeql-cpp-shard.yml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          config-file: ./.github/codeql-cpp-shard.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp/shard:${{ matrix.shard }}"
