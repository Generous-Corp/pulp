name: CodeQL (advanced)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

# A new push to a PR retires the previous head's analysis: CodeQL is advisory
# and only the latest PR head's results matter. Main, schedule, and manual runs
# get a group per run so every main commit keeps its own analysis.
concurrency:
  group: codeql-advanced-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # C++ CodeQL is retained for main, scheduled, and manual scans, but its
    # repository-wide buildless extraction routinely exceeds a PR job budget.
    # PR compilation/security coverage remains in the required native gates;
    # CodeQL is advisory and must not monopolize the PR fleet.
    if: github.event_name != 'schedule' || github.repository == 'danielraffel/pulp'
    runs-on: ${{ matrix.runner }}
    # Native autobuild can exceed 45 minutes on the hosted macOS/Linux images;
    # canceling before `analyze` produces a false-red required check.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: c-cpp
            # Buildless extraction keeps CodeQL from monopolizing a runner for
            # 90 minutes on this repository's full native graph. Compilation
            # coverage remains in the required GCC/macOS/Windows build gates.
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: autobuild
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: matrix.language != 'c-cpp' || github.event_name != 'pull_request'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: >-
          (matrix.build-mode == 'autobuild') &&
          (matrix.language != 'c-cpp' || github.event_name != 'pull_request')
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        if: matrix.language != 'c-cpp' || github.event_name != 'pull_request'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
