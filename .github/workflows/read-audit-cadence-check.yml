name: Read audit cadence check

# The read audit's Stage 0 exit counts clean nights on main, and only a run of
# read-audit-nightly.yml that completed in the night's 07:00-10:00Z window
# counts (normally the scheduled run; a same-sha dispatch that cancelled it
# counts in its place). GitHub fires the nightly's cron hours late and
# sometimes not at all; a night with no counted run is a gap and resets the
# streak. This check writes the per-night ledger (the counted run, every run
# not counted and why, the clean-night streak) to the run summary and an
# artifact, and opens a tracking issue naming any recent gap, so a late or
# dropped schedule is never hidden. The issue closes itself once the last
# seven nights have no gap; the ledger keeps every older one.
# Logic: tools/ci/read_audit_cadence.py.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: read-audit-cadence-check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    name: Check every night has a read audit run
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The first day of the Stage 0 streak.
      STREAK_START: '2026-10-03'
      TRACKING_TITLE: 'Read audit: a day passed with no run on main'
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/ci/read_audit_cadence.py
          sparse-checkout-cone-mode: false

      - name: Build the per-day ledger
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          # Unfiltered by branch: a branch-filtered read can return a stale
          # page. The ref is selected in the script.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/read-audit-nightly.yml/runs?per_page=100" > runs.json
          # Each counted run's own stage0 verdict, from its read-audit.json:
          # the conclusion alone could not tell findings from clean before the
          # nightly failed on findings. A run whose report is gone is judged
          # by its conclusion in the script.
          echo '{}' > verdicts.json
          python3 -c "
          import json, sys
          for r in json.load(open('runs.json'))['workflow_runs']:
              if r.get('head_branch') == 'main' and r.get('status') == 'completed' \
                      and r.get('conclusion') in ('success', 'failure') and r['created_at'] >= sys.argv[1]:
                  print(r['id'])
          " "$STREAK_START" > counted.txt
          while read -r run_id; do
            dir="verdict-${run_id}"
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name read-audit --dir "$dir" 2>/dev/null \
                && [ -f "$dir/read-audit.json" ]; then
              python3 -c "
          import json, sys
          v = json.load(open('verdicts.json'))
          v[sys.argv[1]] = (json.load(open(sys.argv[2])).get('stage0') or {}).get('verdict') or 'unknown'
          json.dump(v, open('verdicts.json', 'w'))
          " "$run_id" "$dir/read-audit.json"
            fi
          done < counted.txt
          python3 tools/ci/read_audit_cadence.py --runs runs.json --verdicts verdicts.json \
            --start "$STREAK_START" --out ledger.json --summary ledger.md
          cat ledger.md >> "$GITHUB_STEP_SUMMARY"
          missing=$(python3 -c "import json; print(','.join(json.load(open('ledger.json'))['missing_recent']))")
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"

      - name: Maintain tracking issue
        shell: bash
        env:
          MISSING: ${{ steps.ledger.outputs.missing }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          title="${TRACKING_TITLE}"
          existing_json=$(gh issue list --repo "$repo" --state all --search "in:title \"${title}\"" \
            --json number,title,state --jq "[.[] | select(.title == \"${title}\")] | first // {}")
          existing=$(echo "$existing_json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('number','') or '')")
          state=$(echo "$existing_json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('state','') or '')")
          if [ -z "$MISSING" ]; then
            if [ -n "$existing" ] && [ "$state" = "OPEN" ]; then
              gh issue comment "$existing" --repo "$repo" \
                --body "Sweep on $(date -u '+%Y-%m-%d %H:%M') UTC: no gap in the last 7 nights. Closing."
              gh issue close "$existing" --repo "$repo" --reason completed
            fi
            exit 0
          fi
          {
            echo "_Auto-generated by \`.github/workflows/read-audit-cadence-check.yml\`._"
            echo
            echo "No counted run of \`read-audit-nightly.yml\` on main for the night(s): **${MISSING}** (UTC, last 7 days)."
            echo "Only a run that completed in the night's 07:00-10:00Z window counts, so each such"
            echo "night is a gap and reset the Stage 0 streak. A dispatch outside the window does not"
            echo "fill a gap. Check why the scheduled run did not complete in the window."
            echo
            cat ledger.md
          } > body.md
          if [ -z "$existing" ]; then
            gh issue create --repo "$repo" --title "$title" --body-file body.md --label ci 2>&1 || \
              gh issue create --repo "$repo" --title "$title" --body-file body.md
          else
            gh issue edit "$existing" --repo "$repo" --body-file body.md
            gh issue reopen "$existing" --repo "$repo" 2>/dev/null || true
          fi

      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-audit-cadence
          path: |
            ledger.json
            ledger.md
            verdicts.json
          retention-days: 90
          if-no-files-found: ignore
