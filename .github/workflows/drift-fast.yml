name: Drift fast

# Required, hosted pre-check for the tree-reading drift tests that fail most
# merge groups on the required `macos` gate: census, script-inputs,
# tools-registry and lane-contract drift, and the wide-non-native replay. They
# read the checkout and the configured test graph, never a compiled binary, so
# a configure alone is enough to run them. On `macos` they run after a
# ~20-minute build; here they report in minutes on a hosted runner.
#
# The selection is data, not YAML: tools/ci/drift_fast.json names whole ctest
# labels plus individual registrations, and tools/ci/drift_fast.py resolves it
# against the configured tree. A listed test this configuration does not
# register (Apple-only registrations on this Linux configure) is printed as
# NOT CHECKED, and so is one that skips — the Linux configure's census profile
# is not recorded, so the census drift comparison itself skips here and still
# runs on `macos`.
#
# REQUIRED: `drift-fast` is a required status check on `main` (branch
# protection; mirrored in .github/rulesets/main-protection.json). A required
# check that never reports holds a pull request on "Expected" forever, so this
# workflow must report on every pull_request and merge_group it can see: no
# `paths:`/`paths-ignore:` filter on the trigger and no job-level `if:`.
# `tools/ci/drift_fast.py check` (drift-fast-selftest) enforces both. Step-level
# `if:` is fine; it skips a step, never the job. See docs/guides/local-ci.md.
#
# DOCS FAST PATH (pull requests only): the `scope` step classifies the pull
# request's diff with tools/scripts/classify_changes.py. For a docs-only diff
# whose readers all run from source (`tools/ci/drift_fast.py scope`,
# mode=source) the job skips the bootstrap and configure and runs only those
# tests; every other diff, and any doubt, takes the full lane exactly as
# before. A merge group always takes the full lane: a group lands every entry
# queued ahead of it, so its own entry's diff does not say what it lands (see
# tools/scripts/resolve_classify_base.py). The job reports either way.

on:
  pull_request:
    branches: [main, 'develop/**']
  merge_group:

# A new push supersedes the pull-request run. A merge group's ref is unique per
# group, so its runs never share a concurrency domain and none is cancelled.
concurrency:
  group: drift-fast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift-fast:
    name: drift-fast
    # Hosted by default. PULP_DRIFT_FAST_RUNS_ON_JSON can route this required
    # check elsewhere when GitHub cannot assign hosted runners; it is JSON and
    # parsed, because an unparsed array becomes one literal label that no
    # runner carries and the job queues forever. A self-hosted target must
    # also list this workflow in its runner group's selected workflows
    # (tools/ci/verify_linux_runner_group.py), or the job is never assigned.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PULP_DRIFT_FAST_RUNS_ON_JSON || '"ubuntu-latest"') }}
    # The job budget must exceed the cold bootstrap (up to 20 min), configure and
    # the checks; GitHub reports a job-timeout kill as "cancelled".
    timeout-minutes: 40
    env:
      PULP_BUILD_DIR: build-linux
      # The pull request's own change: the merge ref's first parent.
      IMPACT_BASE: HEAD^1
    steps:
      # pull_request checks out refs/pull/N/merge and merge_group checks out
      # the group's own commit: both are the tip combined with the head, which
      # is the tree the drift exists in. Depth 2 keeps HEAD^1 (the base) for
      # the diff-scoped script-inputs check.
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
          fetch-depth: 2

      # script-test-inputs-drift scopes its check to the diff against
      # origin/$GITHUB_BASE_REF on a pull request; pin that ref to the event's
      # base commit. A merge group scopes against HEAD^1 instead.
      - name: Fetch pull-request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+${BASE_SHA}:refs/remotes/origin/${BASE_REF}"

      # The historical GPU-probe acceptance check is selected by drift_fast.py
      # and walks commits outside the depth-2 event checkout. Reconnect the
      # bounded provenance history before configuring so a shallow hosted clone
      # cannot turn this required check into a deterministic red one.
      - name: Hydrate bounded GPU provenance commits
        shell: bash
        run: python3 tools/scripts/hydrate_gpu_provenance_commits.py

      # mode=source only for a docs-only pull request whose readers all run
      # from source; anything else, including the empty output of a merge
      # group (this step does not run there), is the full lane.
      - name: Scope
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/ci/drift_fast.py scope --base "$IMPACT_BASE"

      - name: Install Linux dependencies
        if: steps.scope.outputs.mode != 'source'
        uses: ./.github/actions/install-linux-build-deps

      # Restore only: main's Linux build leg publishes this cache, and this job
      # uses the same key and paths (the path list is part of the cache
      # version). setup.sh clones into the shared ~/.cache/pulp/fetchcontent-src
      # on Linux, so that directory must be restored or every run re-clones
      # three.js and the SDK submodules cold. It never saves.
      - name: Restore FetchContent sources
        if: steps.scope.outputs.mode != 'source'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/${{ env.PULP_BUILD_DIR }}/_deps
            ~/.cache/pulp/fetchcontent-src
          key: ${{ runner.os }}-linux-fetchcontent-${{ hashFiles('setup.sh') }}
          restore-keys: |
            ${{ runner.os }}-linux-fetchcontent-

      - name: Bootstrap repository dependencies
        if: steps.scope.outputs.mode != 'source'
        timeout-minutes: 20
        run: ./setup.sh --ci --deps-only

      # The gate's own configure (Release, examples off, GPU on), minus the
      # build. The GPU stays on so the registered test graph is the gate's.
      - name: Configure (no build)
        if: steps.scope.outputs.mode != 'source'
        run: |
          cmake -S . -B "$PULP_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DPULP_BUILD_EXAMPLES=OFF

      - name: Run drift checks
        if: steps.scope.outputs.mode != 'source'
        run: |
          python3 tools/ci/drift_fast.py run --build-dir "$PULP_BUILD_DIR"

      - name: Set up Python (docs fast path)
        if: steps.scope.outputs.mode == 'source'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # The full lane runs on the runner image's system Python; this pinned
      # interpreter needs PyYAML installed (tools-registry-check reads YAML).
      - name: Run docs-only drift checks from source
        if: steps.scope.outputs.mode == 'source'
        run: |
          tools/ci/net-retry.sh python3 -m pip install --quiet 'PyYAML==6.0.2'
          python3 tools/ci/drift_fast.py run-source --base "$IMPACT_BASE"

      # script-test-inputs --check writes the expected fragment of each drifted
      # entry to $RUNNER_TEMP/script-inputs-expected; a repair copies them into
      # test/ctest_script_inputs/ with no configure. Never blocks the check.
      - name: Upload expected script-inputs fragments
        if: failure() && steps.scope.outputs.mode != 'source'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: script-inputs-expected
          path: ${{ runner.temp }}/script-inputs-expected
          if-no-files-found: ignore
