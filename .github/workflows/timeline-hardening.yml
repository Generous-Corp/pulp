name: Timeline hardening

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'core/timebase/**'
      - 'core/timeline/**'
      - 'core/playback/**'
      - 'test/test_timeline_scale.cpp'
      - 'test/test_timeline_agent_view.cpp'
      - 'test/cmake/timeline_tests.cmake'
      - 'test/fixtures/timeline/**'
      - 'tools/scripts/timeline_fixture_coverage_check.py'
      - 'tools/scripts/test_timeline_fixture_coverage_check.py'
      - '.github/workflows/timeline-hardening.yml'
      - 'CMakeLists.txt'
      - 'tools/cmake/**'
  push:
    branches: [main]
    paths:
      - 'core/timebase/**'
      - 'core/timeline/**'
      - 'core/playback/**'
      - 'test/test_timeline_scale.cpp'
      - 'test/test_timeline_agent_view.cpp'
      - 'test/cmake/timeline_tests.cmake'
      - 'test/fixtures/timeline/**'
      - 'tools/scripts/timeline_fixture_coverage_check.py'
      - 'tools/scripts/test_timeline_fixture_coverage_check.py'
      - '.github/workflows/timeline-hardening.yml'
      - 'CMakeLists.txt'
      - 'tools/cmake/**'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 3'

permissions:
  contents: read

concurrency:
  group: timeline-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale-and-compile-latency:
    if: github.event_name != 'schedule' || github.repository == 'Generous-Corp/pulp'
    name: Timeline scale and compile latency
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install build dependencies
        uses: ./.github/actions/install-linux-build-deps
        with:
          extra-packages: ninja-build

      - name: Bootstrap dependencies
        run: ./setup.sh --ci --deps-only

      - name: Configure focused benchmark build
        run: |
          cmake -S . -B build-timeline-hardening -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPULP_BUILD_TESTS=ON \
            -DPULP_BUILD_EXAMPLES=OFF \
            -DPULP_ENABLE_GPU=OFF \
            -DPULP_BENCHMARK=ON

      - name: Build timeline scale gates
        run: |
          cmake --build build-timeline-hardening \
            --target pulp-test-timeline-scale pulp-test-timeline-agent-view \
            -j 2

      - name: Enforce scale, replay, and paging budgets
        env:
          # Milliseconds; these advisory-lane ceilings are reviewed like code.
          PULP_PERF_STRICT: '1'
          PULP_TIMELINE_LOAD_BUDGET_MS: '2000'
          PULP_TIMELINE_COLD_COMPILE_BUDGET_MS: '2000'
          PULP_TIMELINE_EDIT_BATCH_BUDGET_MS: '1000'
          PULP_TIMELINE_EDIT_MAX_BUDGET_MS: '30'
          PULP_TIMELINE_NOTE_COMPILE_BUDGET_MS: '20000'
          PULP_TIMELINE_AUTOMATION_COMPILE_BUDGET_MS: '20000'
          PULP_TIMELINE_N_WRITER_BUDGET_MS: '5000'
          PULP_TIMELINE_DEEP_UNDO_BUDGET_MS: '5000'
          PULP_TIMELINE_JOURNAL_REPLAY_BUDGET_MS: '3000'
          PULP_TIMELINE_AGENT_VIEW_OUTLINE_BUDGET_MS: '3000'
          PULP_TIMELINE_AGENT_VIEW_PAGING_BUDGET_MS: '8000'
        run: |
          build-timeline-hardening/test/pulp-test-timeline-scale \
            --rng-seed 1
          build-timeline-hardening/test/pulp-test-timeline-agent-view \
            --rng-seed 1

  fixture-coverage:
    if: github.event_name != 'schedule' || github.repository == 'Generous-Corp/pulp'
    name: Schema fixture coverage
    # Advisory lane on GitHub-hosted ubuntu: no build, a seconds-long script
    # over committed artifacts, so local capacity is never the constraint.
    # See docs/guides/local-ci.md for lane routing and fallback behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Enforce schema fixture coverage
        run: python3 tools/scripts/timeline_fixture_coverage_check.py

      - name: Prove the coverage gate can go red
        run: python3 tools/scripts/test_timeline_fixture_coverage_check.py
