# Example-plugin format validation — the path-filtered advisory lane.
#
# The example plugins' real-host format-validators (`pluginval-*`, `auval-*`,
# `clap-dlopen-*`, all tagged `LABELS "validation"`) are excluded from the
# per-PR required `macos` gate (see .shipyard/config.toml + docs/guides/
# test-lanes.md): they are slow and flaky under load and must not gate unrelated
# core PRs. They still need PR-time signal when an example itself changes, not
# only the informational nightly. This lane compiles the examples on Linux and
# runs the macOS validators only on PRs that touch `examples/**`, the
# state/format headers or core CMake source lists they consume, or shared
# build/dependency infrastructure.
# It remains advisory pending promotion below.
#
# Required-safe shape: the workflow ALWAYS runs (no top-level `paths:` filter),
# a cheap `changes` job decides whether examples were touched, and a final
# `gate` job always reports a stable `example-validation` status. That way this
# can be made a required branch-protection context without the
# "Expected — waiting for status" dead-lock GitHub imposes on a required check
# that a `paths:` filter skipped. It stays OUT of required_status_checks until a
# real-runner run proves green (see docs/guides/test-lanes.md).
name: Example validation

on:
  pull_request:
  # Deliberately NOT run on `merge_group` — see header-self-contained.yml for the
  # full rationale. Neither `Validate examples (macOS)` nor `example-validation`
  # is a required context, and the macOS leg claimed a self-hosted runner on
  # every queue entry, starving the required `macos` gate.
  workflow_dispatch:

concurrency:
  group: example-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect example changes
    # Advisory bookkeeping must never wait behind the required macOS gate.
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Apply the policy already accepted on the base branch so a classifier
      # change takes effect after it lands. This is rollout consistency, not a
      # security boundary: pull_request workflow YAML remains PR-controlled.
      - name: Check out base-pinned example-path policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .base-ci-control
          sparse-checkout: tools/scripts/example_validation_paths.py
          sparse-checkout-cone-mode: false
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            # merge_group / workflow_dispatch: no PR base — run to be safe.
            echo "examples=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Trigger on examples/**, shared build/dependency infrastructure, and
          # the core headers the examples
          # brace-initialize (ParamInfo/ParamRange in core/state, the
          # descriptor/bus/context structs in core/format). A field REORDER in
          # one of those headers breaks every example's designated initializer
          # without touching examples/** — GCC then fails the release build while
          # a core-only PR sailed through. Watch the include dirs so that class
          # of change compiles the examples here, at PR time.
          changed_paths="$(git diff --name-only "$base"...HEAD)"
          classifier=".base-ci-control/tools/scripts/example_validation_paths.py"
          if [ ! -f "$classifier" ]; then
            # Bootstrap the commit that first introduces (or later renames)
            # the classifier. Missing base policy means use the proposed copy
            # and run conservatively, never fail every PR at lookup time.
            classifier="tools/scripts/example_validation_paths.py"
          fi
          set +e
          printf '%s\n' "$changed_paths" \
            | python3 "$classifier"
          classifier_status=$?
          set -e
          if [ "$classifier_status" -eq 0 ]; then
            echo "examples=true" >> "$GITHUB_OUTPUT"
            echo "example source, watched core headers, or shared build/dependency infrastructure changed — will run example validation."
          elif [ "$classifier_status" -eq 10 ]; then
            echo "examples=false" >> "$GITHUB_OUTPUT"
            echo "no example-affecting source or build/dependency change — skipping example validation."
          else
            echo "example path classifier failed with status $classifier_status" >&2
            exit "$classifier_status"
          fi

  resolve-advisory-macos:
    name: Resolve isolated advisory macOS runner
    runs-on: ubuntu-latest
    outputs:
      selector_json: ${{ steps.resolve.outputs.selector_json }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        shell: bash
        env:
          CONFIGURED_JSON: ${{ vars.PULP_ADVISORY_MACOS_RUNS_ON_JSON }}
        run: |
          python3 tools/scripts/resolve_advisory_macos_runner.py \
            --configured-json "$CONFIGURED_JSON" \
            --fallback-json '"macos-15"' \
            --event-name "${{ github.event_name }}"

  validate:
    name: Validate examples (macOS)
    needs: [changes, resolve-advisory-macos]
    if: needs.changes.outputs.examples == 'true'
    # The resolver rejects pulp-build* and pulp-preamble* labels. A dedicated
    # advisory selector may use the fleet only when it cannot steal a required
    # merge-gate runner; otherwise this uses GitHub-hosted macOS.
    runs-on: ${{ fromJSON(needs.resolve-advisory-macos.outputs.selector_json) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Skia (darwin-arm64)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/fetch_skia_for_release.py darwin-arm64
      - name: Deps
        shell: bash
        run: ./setup.sh --ci --deps-only
      - name: Configure (examples ON)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON
      - name: Build
        shell: bash
        run: tools/ci/governed-build.sh cmake --build build
      - name: Run example validators (ctest -L validation)
        shell: bash
        run: |
          set -euo pipefail
          # Only the `validation`-labeled example format-validators. --repeat
          # until-pass:2 lets a single timing-flake self-heal; each attempt is
          # bounded by the test's own TIMEOUT. A real validation regression is
          # reported on the PR that introduced it.
          # --no-tests=ignore: a runner without pluginval/auval registers no
          # `validation` tests (some are find_program-conditional), and bare
          # `ctest -L` exits 8 on "no tests" — that must not FALSE-FAIL an
          # example PR. Hosted PR runs exercise auval and built-in CLAP dlopen
          # checks; pluginval/clap-validator coverage requires an
          # operator-dispatched isolated advisory image that installs them.
          # AudioComponentRegistrar is a single per-user cache. Running several
          # auval tests in parallel makes each test kill the registrar while its
          # neighbors are scanning freshly copied components; a clean Tart guest
          # then reports every component as missing. Keep non-AU validators
          # parallel, but serialize the registrar-dependent AU checks.
          ctest --test-dir build --output-on-failure --repeat until-pass:2 \
            --no-tests=ignore -L validation -E '^auval-' -j4
          ctest --test-dir build --output-on-failure --repeat until-pass:2 \
            --no-tests=ignore -L validation -R '^auval-' -j1
      - name: Surface ctest failures
        if: failure()
        shell: bash
        run: |
          tdir="build/Testing/Temporary"
          { [ -f "$tdir/LastTestsFailed.log" ] && { echo "=== failed example validators ==="; cat "$tdir/LastTestsFailed.log"; }; } || \
            echo "_no ctest result log — failed before ctest (configure/build)_"

  build-linux:
    name: Build examples (Linux x64)
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    # This workflow is not admitted by either protected Mac Pro runner group.
    # Keep PR and operator-dispatched example builds hosted until they have a
    # dedicated workflow-scoped group and selector; the merge-group selector
    # must never create an unroutable job here.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        uses: ./.github/actions/install-linux-build-deps
      - name: Fetch Skia (linux-x64)
        shell: bash
        run: python3 tools/scripts/fetch_skia_for_release.py linux-x64
      - name: Bootstrap repository dependencies
        shell: bash
        run: ./setup.sh --ci --deps-only
      - name: Configure (examples ON)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DPULP_BUILD_TESTS=ON -DPULP_BUILD_EXAMPLES=ON
      - name: Build all examples
        shell: bash
        run: tools/ci/governed-build.sh cmake --build build --config Release --target pulp-examples-all
      - name: Ccache stats
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

  gate:
    name: example-validation
    needs: [changes, validate, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report validation outcome
        shell: bash
        run: |
          set -euo pipefail
          changes_result="${{ needs.changes.result }}"
          changed="${{ needs.changes.outputs.examples }}"
          macos_result="${{ needs.validate.result }}"
          linux_result="${{ needs.build-linux.result }}"
          if [ "$changes_result" != "success" ]; then
            echo "Example change detection did not pass (result=$changes_result). FAIL."
            exit 1
          fi
          if [ "$changed" != "true" ]; then
            echo "No example-affecting source or build/dependency changes — example validation not required. PASS."
            exit 0
          fi
          if [ "$macos_result" = "success" ] && [ "$linux_result" = "success" ]; then
            echo "Linux example build and macOS validators passed. PASS."
            exit 0
          fi
          echo "Example validation did not pass (macos=$macos_result, linux=$linux_result). FAIL."
          exit 1
