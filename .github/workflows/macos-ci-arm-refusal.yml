name: macOS CI arm refusal

# With PULP_MACOS_PR_GATING on, a pull request is armed only after its head's
# `macos` check is a completed full-lane success (see "macOS on a pull request
# waits for approval" in docs/guides/local-ci.md). A contract-lane green
# satisfies the required check without a build, so an arm made before that
# (arm-on-open, or while the full lane is still running) would let native
# auto-merge enqueue the head on the wrong green. This refuses such an arm the
# moment it is made: when auto-merge is enabled, it reads the head's latest
# `macos` check run from this repository's own Actions workflows whose run is
# for a head in this repository, and leaves the arm alone only on a completed
# success with an explicit `full`, `fast` (full lane) or `not-required`
# (skip-safe) tier. Otherwise (absent, still running, failed, `deferred`, or no
# such tier) it disables auto-merge and says what it found on the pull
# request. It checks the macos run only; approval is the arm side's.
#
# The contract lane's last step (build.yml) and macos-ci-deferred-disarm.yml
# stay behind this as later layers. pull_request_target runs this definition
# from protected main and checks out nothing, so no pull request code runs with
# the write token. With the variable unset nothing here runs.

on:
  pull_request_target:
    branches: [main, 'develop/**']
    types: [auto_merge_enabled]

permissions:
  actions: read
  checks: read
  pull-requests: write

concurrency:
  group: macos-ci-arm-refusal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse an arm without a full-lane macos success
    if: vars.PULP_MACOS_PR_GATING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge unless the head's macos is a full-lane success
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fails closed: every read that fails, and every check run it cannot
          # place, becomes a refusal. The only check run passed over is one
          # proven to be for a head in another repository; it never falls back
          # to an older run on uncertainty. So no errexit: a failed read must
          # still reach the disable below.
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          runs_prefix="$GITHUB_SERVER_URL/$repo/actions/runs/"
          reason=""
          check_run=""
          # Judge the head that would merge: the pull request's current head,
          # read live, not the event's, which a push may already have replaced.
          # A push also disarms through macos-ci-label-reset.yml; judging the
          # live head keeps an arm on a stale event from being read against the
          # wrong commit.
          # shellcheck disable=SC2016  # $owner, $name and $number are GraphQL variables
          if ! HEAD_SHA=$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { headRefOid } } }' \
              -f owner="${repo%%/*}" -f name="${repo#*/}" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.headRefOid // ""') \
              || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            HEAD_SHA="$EVENT_HEAD_SHA"
            reason="could not verify its macos check: the pull request's current head could not be read"
          elif [ "$HEAD_SHA" != "$EVENT_HEAD_SHA" ]; then
            echo "#$PR_NUMBER moved from $EVENT_HEAD_SHA to $HEAD_SHA since it was armed; judging the current head"
          fi
          # GitHub Actions' `macos` check runs on that head, newest first. Every
          # page is read and the result sorted here, so a head with more than
          # one page of check runs is judged on all of them.
          if [ -n "$reason" ]; then
            :
          elif ! candidates=$(set -o pipefail
              gh api --paginate "repos/$repo/commits/$HEAD_SHA/check-runs?check_name=macos&filter=latest&per_page=100" \
                --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.id) \(.status) \(.conclusion) \(.details_url)"' \
                | sort -k1,1nr); then
            reason="could not verify its macos check: the head's check runs could not be read"
          else
            while read -r candidate status_ conclusion_ url; do
              [ -n "${candidate:-}" ] || continue
              if [[ "$url" != "$runs_prefix"* ]]; then
                reason="could not verify its macos check: check run $candidate is not from this repository's workflows ($url)"
                break
              fi
              run_id="${url#"$runs_prefix"}"
              run_id="${run_id%%/*}"
              if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
                reason="could not verify its macos check: check run $candidate has no readable workflow run id"
                break
              fi
              if ! head_repo=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.head_repository.full_name // ""') \
                  || [ -z "$head_repo" ]; then
                reason="could not verify its macos check: workflow run $run_id could not be read"
                break
              fi
              if [ "$head_repo" != "$repo" ]; then
                echo "passing over macos check run $candidate: its run $run_id is for a head in $head_repo"
                continue
              fi
              check_run="$candidate"
              status="$status_"
              conclusion="$conclusion_"
              break
            done <<< "$candidates"
          fi
          if [ -z "$reason" ]; then
            if [ -z "$check_run" ]; then
              reason="no macos check has run on it yet"
            elif [ "$status" != completed ]; then
              reason="its macos check is still $status"
            elif [ "$conclusion" != success ]; then
              reason="its macos check concluded $conclusion"
            elif ! tiers=$(gh api --paginate "repos/$repo/check-runs/$check_run/annotations?per_page=100" \
                --jq '.[] | select(.title == "shipyard-test-tier") | .message'); then
              reason="could not verify its macos check: the annotations of check run $check_run could not be read"
            # Only an explicit tier passes: `full` (the full suite, as a
            # dispatch runs it), `fast` (the full lane on a pull request) or
            # `not-required` (skip-safe). `deferred`, a missing tier or any
            # other is refused.
            elif [[ "$tiers" == *'"tier":"deferred"'* ]]; then
              reason="its macos check is the contract lane (tier deferred), which builds nothing"
            elif [[ "$tiers" != *'"tier":"full"'* && "$tiers" != *'"tier":"fast"'* \
                && "$tiers" != *'"tier":"not-required"'* ]]; then
              reason="its macos check carries no full, full-lane or skip-safe tier"
            fi
          fi
          if [ -z "$reason" ]; then
            echo "#$PR_NUMBER armed at $HEAD_SHA on a completed full-lane macos success (check run $check_run); leaving it"
            exit 0
          fi
          # shellcheck disable=SC2016  # $id is a GraphQL variable
          if ! gh api graphql \
              -f query='mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }' \
              -f id="$PR_NODE_ID" >/dev/null; then
            echo "::error title=auto-merge not disabled::#$PR_NUMBER at $HEAD_SHA should be disarmed ($reason) but the mutation failed; disable auto-merge by hand"
            exit 1
          fi
          echo "disabled auto-merge on #$PR_NUMBER at $HEAD_SHA: $reason"
          if [[ "$reason" == "could not verify"* ]]; then
            summary="Auto-merge disabled: $reason, so this head is not known to have a completed full macOS run."
          else
            summary="Auto-merge disabled: this head has no completed full macOS run yet ($reason)."
          fi
          if ! gh api --method POST "repos/$repo/issues/$PR_NUMBER/comments" -f body="$summary

          Arm it again once this head's \`macos\` check is a completed full-lane success (docs/guides/local-ci.md, \"macOS on a pull request waits for approval\")." >/dev/null; then
            echo "::warning title=refusal comment not posted::auto-merge on #$PR_NUMBER was disabled ($reason), but the comment saying why failed"
            exit 1
          fi
