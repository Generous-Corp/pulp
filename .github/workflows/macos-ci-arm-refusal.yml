name: macOS CI arm refusal

# With PULP_MACOS_PR_GATING on, a pull request is armed only after its head's
# `macos` check is a completed full-lane success (see "macOS on a pull request
# waits for approval" in docs/guides/local-ci.md). A contract-lane green
# satisfies the required check without a build, so an arm made before that
# (arm-on-open, or while the full lane is still running) would let native
# auto-merge enqueue the head on the wrong green. This refuses such an arm the
# moment it is made: when auto-merge is enabled, it reads the head's latest
# `macos` check run from this repository's own Actions workflows whose run is
# for a head in this repository, and leaves the arm alone only on a completed
# success with an explicit `full`, `fast` (full lane) or `not-required`
# (skip-safe) tier. Otherwise (absent, still running, failed, `deferred`, or no
# such tier) it disables auto-merge and says what it found on the pull
# request. It checks the macos run only; approval is the arm side's.
#
# The contract lane's last step (build.yml) and macos-ci-deferred-disarm.yml
# stay behind this as later layers. pull_request_target runs this definition
# from protected main and checks out nothing, so no pull request code runs with
# the write token. With the variable unset nothing here runs.

on:
  pull_request_target:
    branches: [main, 'develop/**']
    types: [auto_merge_enabled]

permissions:
  actions: read
  checks: read
  pull-requests: write

concurrency:
  group: macos-ci-arm-refusal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse an arm without a full-lane macos success
    if: vars.PULP_MACOS_PR_GATING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge unless the head's macos is a full-lane success
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # This repository's GitHub Actions `macos` check runs on this head,
          # newest first, each with the workflow run it belongs to.
          candidates=$(gh api "repos/$repo/commits/$HEAD_SHA/check-runs?check_name=macos&filter=latest&per_page=100" \
            --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and (.details_url | startswith(\"$GITHUB_SERVER_URL/$repo/actions/runs/\")))] | sort_by(.id) | reverse | .[] | \"\\(.id) \\(.status) \\(.conclusion) \\(.details_url | split(\"/actions/runs/\")[1] | split(\"/\")[0])\"")
          # The newest one whose workflow run's head is in this repository. A
          # run for a head in another repository is ignored, never trusted.
          latest=""
          while read -r candidate_check candidate_status candidate_conclusion run_id; do
            [ -n "${candidate_check:-}" ] || continue
            head_repo=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.head_repository.full_name')
            if [ "$head_repo" = "$repo" ]; then
              latest="$candidate_check $candidate_status $candidate_conclusion"
              break
            fi
            echo "ignoring macos check run $candidate_check: its run $run_id is for a head in $head_repo"
          done <<< "$candidates"
          reason=""
          if [ -z "$latest" ]; then
            reason="no macos check has run on it yet"
          else
            read -r check_run status conclusion <<< "$latest"
            if [ "$status" != completed ]; then
              reason="its macos check is still $status"
            elif [ "$conclusion" != success ]; then
              reason="its macos check concluded $conclusion"
            else
              tiers=$(gh api --paginate "repos/$repo/check-runs/$check_run/annotations?per_page=100" \
                --jq '.[] | select(.title == "shipyard-test-tier") | .message')
              # Only an explicit tier passes: `full` (the full suite, as a
              # dispatch runs it), `fast` (the full lane on a pull request) or
              # `not-required` (skip-safe). `deferred`, a missing tier or any
              # other is refused.
              if [[ "$tiers" == *'"tier":"deferred"'* ]]; then
                reason="its macos check is the contract lane (tier deferred), which builds nothing"
              elif [[ "$tiers" != *'"tier":"full"'* && "$tiers" != *'"tier":"fast"'* \
                  && "$tiers" != *'"tier":"not-required"'* ]]; then
                reason="its macos check carries no full, full-lane or skip-safe tier"
              fi
            fi
          fi
          if [ -z "$reason" ]; then
            echo "#$PR_NUMBER armed at $HEAD_SHA on a completed full-lane macos success (check run $check_run); leaving it"
            exit 0
          fi
          # shellcheck disable=SC2016  # $id is a GraphQL variable
          gh api graphql \
            -f query='mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }' \
            -f id="$PR_NODE_ID" >/dev/null
          echo "disabled auto-merge on #$PR_NUMBER at $HEAD_SHA: $reason"
          gh api --method POST "repos/$repo/issues/$PR_NUMBER/comments" -f body="Auto-merge disabled: this head has no completed full macOS run yet ($reason).

          Arm it again once this head's \`macos\` check is a completed full-lane success (docs/guides/local-ci.md, \"macOS on a pull request waits for approval\")." >/dev/null
