name: Optional RmlUi bridge

on:
  pull_request:
    paths:
      - ".github/workflows/rmlui.yml"
      - "CMakeLists.txt"
      - "core/view/**"
      - "tools/cmake/PulpConfig.cmake.in"
      - "tools/cmake/PulpDependencies.cmake"
      - "tools/cmake/PulpInstallRules.cmake"
      - "tools/deps/manifest.json"
      - "tools/ci/dependency_pin_map.json"
      - "test/cmake/rmlui_*.cmake"
      - "test/test_rmlui_*.cpp"
      - "DEPENDENCIES.md"
      - "NOTICE.md"
      - "docs/reference/licensing.md"
      - "docs/migrations/unreleased/rmlui-editor-bridge.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rmlui:
    name: RmlUi opt-in configure/build/test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        uses: ./.github/actions/install-linux-build-deps
        with:
          extra-packages: libfreetype6-dev

      - name: Configure RmlUi opt-in build
        run: |
          # The current signal-graph test registration requires the inspector
          # runtime even when the RmlUi bridge itself is the only feature under
          # test. Keep this enabled until that unrelated baseline registration
          # gap is fixed.
          # GitHub's Ubuntu runner is intentionally headless. SDL otherwise
          # fails configure when neither X11 nor Wayland development headers
          # are installed, even though these tests never create a window.
          cmake -S . -B build-rmlui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPULP_ENABLE_RMLUI=ON \
            -DPULP_ENABLE_RMLUI_FONTS=ON \
            -DPULP_ENABLE_GPU=OFF \
            -DPULP_BUILD_EXAMPLES=OFF \
            -DPULP_ENABLE_INSPECTOR=ON \
            -DPULP_ENABLE_AUDIO_PROBES=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON

      - name: Build RmlUi backend and SDK consumer
        run: |
          # Keep this opt-in lane focused.  Building the default graph here
          # pulls in thousands of unrelated targets and can exhaust the job
          # timeout before the RmlUi contract is exercised.
          tools/ci/governed-build.sh cmake --build build-rmlui \
            --target pulp-test-rmlui-backend pulp-rmlui-sdk-closure

      - name: Run RmlUi backend and installed SDK consumer tests
        run: |
          ctest --test-dir build-rmlui -C Release --output-on-failure \
            -R '^(RmlUi backend|RmlUi core|RmlUi font|headless RmlUi|rooted RmlUi|cmake-rmlui-sdk-consumer)'
