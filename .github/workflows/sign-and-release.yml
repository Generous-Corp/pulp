name: Sign and Release

permissions:
  contents: read

# End-to-end release pipeline documented in
# docs/guides/release-pipeline.md — keep that doc in sync when you change
# this workflow.

on:
  push:
    tags: ['v*']

# Never cancel in-flight signing/notarization. Partial notarization
# artifacts are hard to recover; serialize instead.
concurrency:
  group: sign-and-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release

jobs:
  # Resolve the macOS runner using the same release-specific priority as
  # release-cli.yml where signing is safe: dedicated isolated release override,
  # optional Namespace, then GitHub-hosted macos-15. The shared local PR pool is
  # deliberately excluded because this job imports a Developer ID private key.
  # Keeping the two tag-triggered legs on release-specific capacity
  # prevents a release whose CLI assets finish while signing waits indefinitely
  # in a saturated hosted queue.
  # Background: 2026-05-18 SDK starvation — GitHub-hosted macos-14 queue
  # backed up for hours and blocked v0.111..v0.134 from publishing
  # (compound with the supersede bug fixed in pulp #2238 and the Skia
  # gate fix in pulp #2281).
  resolve-macos-runner:
    # Tag-push-only trusted control-plane work may use the MacPro Linux/X64
    # pool. Unset both variables to fall back to GitHub-hosted Ubuntu.
    runs-on: ${{ fromJSON(vars.PULP_RELEASE_CONTROL_LINUX_RUNS_ON_JSON || vars.PULP_LOCAL_LINUX_RUNS_ON_JSON || '"ubuntu-latest"') }}
    outputs:
      runs_on_json: ${{ steps.resolve.outputs.runs_on_json }}
    steps:
      # Only the resolver is needed; it owns the opt-in class-label rewrite so
      # the three release workflows share one tested implementation.
      - uses: actions/checkout@v5
        with:
          # Resolver policy comes from the default branch, like release-cli.yml.
          ref: ${{ github.event.repository.default_branch }}
          lfs: false
          sparse-checkout: tools/scripts/resolve_release_runners.py
          sparse-checkout-cone-mode: false
      - id: resolve
        env:
          RELEASE_JSON: ${{ vars.PULP_RELEASE_MACOS_RUNS_ON_JSON }}
          NAMESPACE_JSON: ${{ vars.PULP_NAMESPACE_BUILD_MACOS_RUNS_ON_JSON }}
          # Opt-in (exactly `1`/`true`): append `pulp-release-tagged` to a
          # self-hosted selector. Unset = the selector below, verbatim.
          PULP_RELEASE_CLASS_TOKENS: ${{ vars.PULP_RELEASE_CLASS_TOKENS }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_JSON:-}" ]; then
            selector="${RELEASE_JSON}"
            echo "Routing macOS sign-and-release via PULP_RELEASE_MACOS_RUNS_ON_JSON: ${RELEASE_JSON}"
          elif [ -n "${NAMESPACE_JSON:-}" ]; then
            selector="${NAMESPACE_JSON}"
            echo "Routing macOS sign-and-release through Namespace: ${NAMESPACE_JSON}"
          else
            selector='["macos-15"]'
            echo "Routing macOS sign-and-release through GitHub-hosted macos-15"
          fi
          selector="$(python3 tools/scripts/resolve_release_runners.py \
            --apply-class-label pulp-release-tagged --selector "$selector")"
          echo "runs_on_json=${selector}" >> "$GITHUB_OUTPUT"

  build-and-sign-macos:
    needs: resolve-macos-runner
    runs-on: ${{ fromJSON(needs.resolve-macos-runner.outputs.runs_on_json) }}
    name: Build, Sign, Notarize (macOS)
    # READ-ONLY on contents, deliberately. This workflow no longer writes to the
    # GitHub Release — release-cli.yml's `release` job is the sole writer. Taking
    # away the write scope is what makes that a structural guarantee rather than
    # a convention: a future edit cannot reintroduce a second release writer here
    # without also, visibly, re-granting `contents: write`.
    #
    # (It formerly held `contents: write` — pulp #724 — solely to upload
    # appcast.xml onto release-cli's draft. That upload, and the 50-minute poll
    # that waited for the draft to appear, are gone.)
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # CI COVERAGE-GAP FIX: this release job once ran on macos-14, whose default
      # Xcode 15.4 Apple clang lacked C++20 P0960 (parenthesized aggregate init).
      # The self-hosted PR `macos` lane used a newer clang, so a CLI/import TU
      # (tools/import-design/import_detect.cpp) compiled on every PR but failed
      # here, silently breaking every GitHub Release from ~v0.371 to v0.391. The
      # job now falls back to macos-15, and still selects the newest installed
      # Xcode 16.x so the release build stays at C++20 parity with the PR lane.
      - name: Select modern Xcode (C++20 parity with the PR lane)
        if: runner.os == 'macOS'
        run: |
          # Pick the newest installed Xcode >= 16 on the selected macOS runner.
          # Shell-based on purpose: no third-party action dependency, and it
          # can't be blocked by an actions allowlist — the release must not be
          # held hostage to that. Falls back to the default Xcode only if none
          # is found (then the build fails loudly, which is the right signal).
          newest="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest/Contents/Developer"
          else
            echo "::warning::No Xcode 16.x found; using default $(xcode-select -p)"
          fi
          echo "Using: $(xcode-select -p)"
          c++ --version | head -1

      - name: Clone VST3 SDK
        run: |
          git clone --depth 1 --branch v3.8.0_build_66 \
            https://github.com/steinbergmedia/vst3sdk.git \
            external/vst3sdk
          cd external/vst3sdk && git submodule update --init --recursive --depth 1

      - name: Clone AudioUnitSDK
        run: |
          # Pinned to 1.3.0 — 1.4.0 introduced <expected> (C++23) in its
          # headers, and AppleClang/libc++ on GitHub-hosted macOS runners
          # doesn't yet expose std::expected even at -std=c++23. See #155.
          git clone --depth 1 --branch AudioUnitSDK-1.3.0 \
            https://github.com/apple/AudioUnitSDK.git \
            external/AudioUnitSDK

      - name: Configure
        # -DPULP_BUILD_EXAMPLES=OFF: the pulp-design-tool example hard-fails
        # configure when PULP_HAS_SKIA is FALSE (this runner has no Skia), so
        # building examples here aborts the whole sign-and-release run and no
        # GitHub Release is published. Skip examples to match build.yml's
        # release legs. Tests are also disabled: this job packages artifacts
        # and must not run Catch test discovery for GPU/display binaries on
        # GitHub-hosted macOS release runners. Audio probes are development
        # inspection surfaces and are not part of release artifacts.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DPULP_BUILD_EXAMPLES=OFF
          -DPULP_BUILD_TESTS=OFF
          -DPULP_ENABLE_AUDIO_PROBES=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)

      # NOTE: the release build does NOT re-run the unit-test suite. A release-
      # artifact build is not a test gate — by the time a commit is tagged it has
      # already passed the FULL suite on the PR/merge gate (self-hosted lane with
      # real GPU/display/iOS-SDK). Re-running ctest here on a HEADLESS GitHub-
      # hosted runner is redundant AND produces false failures from environment-
      # only tests (Skia-raster screenshot -> empty pixels, cmake-require-gpu ->
      # timeout, cmake-ios-hostapp-links) that pass on real hardware — which
      # silently blocked GitHub Releases v0.372-v0.391. (The same logic already
      # excluded the `validation`/auval suite here for the same hosted-runner
      # reason — see #720; this completes it.) The Build step above is the
      # release-config compile smoke; format validators are gated by validate.yml
      # on PR. The artifact smoke below is the headless-safe replacement gate.

      - name: Smoke built plugins (headless-safe — format entry point exported)
        # If this release configuration produces CLAP artifacts, confirm each
        # built plugin exports its format C-ABI entry. Static symbol read (`nm`)
        # only: no GPU/display/audio needed on the headless runner. Zero
        # block-risk: FAILS only on a built .clap whose Mach-O lacks
        # `clap_entry`; if no artifact is found it WARNS and passes, so the
        # examples-off release configuration can still publish appcast metadata.
        run: |
          set -uo pipefail
          shopt -s nullglob
          built=0
          for clap in build/CLAP/*.clap; do
            name="$(basename "$clap" .clap)"
            bin="$clap/Contents/MacOS/$name"
            [ -f "$bin" ] || bin="$clap"               # tolerate a flat .clap
            if [ ! -f "$bin" ]; then
              echo "::warning::no Mach-O found for $clap — skipping"
              continue
            fi
            built=$((built + 1))
            if nm -gU "$bin" 2>/dev/null | grep -q "_clap_entry"; then
              echo "ok: $name exports clap_entry"
            else
              echo "::error::$bin built but does NOT export clap_entry (linkage regression)"
              exit 1
            fi
          done
          if [ "$built" -eq 0 ]; then
            echo "::warning::no .clap plugins built — nothing to smoke (not a failure)"
          fi

      # Decide, once, whether this run signs and notarizes. Secrets cannot be
      # read in a step `if:`, and a step-level `env:` is not visible to that
      # step's own `if:` either, so a guard like `if: env.MACOS_CERTIFICATE != ''`
      # is never true and silently skips signing. Compute the decision here from
      # the secrets' presence and gate every signing step on these outputs.
      #
      # When no signing inputs are configured the run is marked UNSIGNED loudly
      # (warning annotation, job summary, a SIGNING-STATUS.txt inside the
      # artifact, and an `-UNSIGNED` artifact-name suffix) and continues.
      # `vars.PULP_RELEASE_UNSIGNED_POLICY=fail` turns an unsigned run into a
      # failure instead; the default is `mark`. A PARTIAL signing configuration
      # always fails: it is an attempt to sign that cannot succeed.
      - name: Detect signing inputs
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          UNSIGNED_POLICY: ${{ vars.PULP_RELEASE_UNSIGNED_POLICY || 'mark' }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          missing() {
            local out=""
            for name in "$@"; do
              [ -n "${!name:-}" ] || out="$out $name"
            done
            echo "${out# }"
          }
          sign_vars="MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD KEYCHAIN_PASSWORD SIGNING_IDENTITY"
          notary_vars="APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD"
          sign_missing="$(missing $sign_vars)"
          notary_missing="$(missing $notary_vars)"
          count() { set -- $1; echo $#; }
          n_sign_missing=$(count "$sign_missing")
          n_notary_missing=$(count "$notary_missing")

          case "$UNSIGNED_POLICY" in
            mark|fail) ;;
            *)
              echo "::error::PULP_RELEASE_UNSIGNED_POLICY='$UNSIGNED_POLICY' is not a policy. Set it to 'mark' (default: publish marked UNSIGNED) or 'fail'."
              exit 1
              ;;
          esac

          if [ "$n_sign_missing" -ne 0 ] && [ "$n_sign_missing" -ne 4 ]; then
            echo "::error::Signing is partially configured: missing secret(s): $sign_missing. Add them, or remove every signing secret to publish explicitly UNSIGNED."
            exit 1
          fi
          if [ "$n_notary_missing" -ne 0 ] && [ "$n_notary_missing" -ne 3 ]; then
            echo "::error::Notarization is partially configured: missing secret(s): $notary_missing. Add them, or remove every notarization secret."
            exit 1
          fi
          if [ "$n_sign_missing" -eq 4 ] && [ "$n_notary_missing" -eq 0 ]; then
            echo "::error::Notarization secrets are set but signing secrets are not ($sign_vars). Apple notarizes only signed code; add the signing secrets."
            exit 1
          fi

          mkdir -p artifacts
          if [ "$n_sign_missing" -eq 0 ] && [ "$n_notary_missing" -eq 0 ]; then
            status="signed-notarized"; sign=true; notarize=true; suffix=""
            line="Signed with Developer ID and notarized."
          elif [ "$n_sign_missing" -eq 0 ]; then
            status="signed-not-notarized"; sign=true; notarize=false; suffix="-NOT-NOTARIZED"
            line="NOT NOTARIZED — codesigned, but no notarization secrets ($notary_vars) are configured."
          else
            status="unsigned"; sign=false; notarize=false; suffix="-UNSIGNED"
            line="UNSIGNED — not codesigned or notarized (no signing secrets configured: $sign_vars)."
          fi

          {
            echo "status=$status"
            echo "sign=$sign"
            echo "notarize=$notarize"
            echo "artifact_suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "$line" > artifacts/SIGNING-STATUS.txt
          {
            echo "### macOS signing: \`$status\`"
            echo
            echo "$line"
          } >> "$summary"
          echo "Signing status: $status"

          if [ "$status" != "signed-notarized" ]; then
            echo "::warning title=Release ${GITHUB_REF_NAME:-} is $status::$line"
            if [ "$UNSIGNED_POLICY" = "fail" ]; then
              echo "::error::PULP_RELEASE_UNSIGNED_POLICY=fail and this release is $status."
              exit 1
            fi
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pulp-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          certificate="$RUNNER_TEMP/pulp-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.p12"
          previous_default=$(
            security default-keychain -d user \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"//' -e 's/"$//'
          )
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "PREVIOUS_DEFAULT_KEYCHAIN=$previous_default" >> "$GITHUB_ENV"
          trap 'rm -f "$certificate"' EXIT
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Sign plugins
        if: steps.signing.outputs.sign == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for plugin in build/VST3/*.vst3 build/CLAP/*.clap build/AU/*.component; do
            [ -e "$plugin" ] || continue
            echo "Signing $(basename $plugin)..."
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
              --entitlements ship/templates/entitlements.plist "$plugin"
          done

      - name: Create installer package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p artifacts
          # Package each format
          for plugin in build/VST3/*.vst3; do
            [ -e "$plugin" ] || continue
            NAME=$(basename "$plugin" .vst3)
            pkgbuild --component "$plugin" \
              --identifier "com.pulp.${NAME}.vst3" \
              --version "$VERSION" \
              --install-location "/Library/Audio/Plug-Ins/VST3/" \
              "artifacts/${NAME}-VST3-${VERSION}.pkg" || true
          done
          for plugin in build/CLAP/*.clap; do
            [ -e "$plugin" ] || continue
            NAME=$(basename "$plugin" .clap)
            pkgbuild --component "$plugin" \
              --identifier "com.pulp.${NAME}.clap" \
              --version "$VERSION" \
              --install-location "/Library/Audio/Plug-Ins/CLAP/" \
              "artifacts/${NAME}-CLAP-${VERSION}.pkg" || true
          done
          for plugin in build/AU/*.component; do
            [ -e "$plugin" ] || continue
            NAME=$(basename "$plugin" .component)
            pkgbuild --component "$plugin" \
              --identifier "com.pulp.${NAME}.au" \
              --version "$VERSION" \
              --install-location "$HOME/Library/Audio/Plug-Ins/Components/" \
              "artifacts/${NAME}-AU-${VERSION}.pkg" || true
          done

      # A notarization or staple failure fails the job. `notarytool submit
      # --wait` exits 0 even when Apple returns `Invalid`, so the status line
      # is checked too; a package that was not accepted is never stapled.
      - name: Notarize packages
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          for pkg in artifacts/*.pkg; do
            [ -e "$pkg" ] || continue
            echo "Notarizing $(basename "$pkg")..."
            out="$(xcrun notarytool submit "$pkg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_PASSWORD" \
              --wait)"
            echo "$out"
            if ! printf '%s\n' "$out" | grep -Eq '^[[:space:]]*status: Accepted[[:space:]]*$'; then
              echo "::error::Notarization of $(basename "$pkg") was not Accepted."
              exit 1
            fi
            xcrun stapler staple "$pkg"
          done

      # appcast.xml is NOT generated here any more, and this workflow no longer
      # touches the GitHub Release at all. release-cli.yml's `release` job owns
      # the release end to end and writes the Sparkle feed itself.
      #
      # What used to be here: generate appcast.xml, then poll for release-cli's
      # draft 150 times at 20s intervals (50 minutes) and upload the feed onto it.
      # That poll was a time bomb. Its own comment claimed 50 minutes "covers
      # release-cli's worst case", but release-cli's real worst case is 165+
      # minutes (its macOS legs queue for hours on the hosted pool). So on every
      # slow release this workflow failed by timeout — and because the publish
      # coordinator only published once BOTH legs succeeded, that timeout silently
      # held back an otherwise complete release. Releases whose binaries had all
      # built green never shipped.
      #
      # This workflow is now exactly what its name says and nothing more: it
      # signs and notarizes the example-plugin packages and keeps them as
      # workflow artifacts. It cannot delay, block, or break a release.
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pulp-macos-${{ github.ref_name }}${{ steps.signing.outputs.artifact_suffix }}
          path: artifacts/
          retention-days: 30


      - name: Clean up signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: |
          if [ -n "${PREVIOUS_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$PREVIOUS_DEFAULT_KEYCHAIN" || true
          fi
          security delete-keychain "$SIGNING_KEYCHAIN" || true
