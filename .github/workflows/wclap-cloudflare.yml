# WebCLAP → Cloudflare Pages deploy.
#
# Builds the WebCLAP PulpGain module (wasi-sdk, pinned), assembles a
# self-contained deploy dir (examples/web-demos/wclap-build/cloudflare/public),
# PROVES it in headless Chrome (crossOriginIsolated + audio + every subresource
# 200 under the real _headers), and — only once the owner has connected a
# Cloudflare account (secrets present) — deploys it to Cloudflare Pages.
#
# Cloudflare is WebCLAP's canonical host because it can send the COOP/COEP
# headers that cross-origin isolation (threads + SharedArrayBuffer) requires;
# GitHub Pages cannot. Until the two secrets below exist the deploy step is
# skipped and this workflow is a build+proof gate only.
name: WebCLAP Cloudflare

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
    paths:
      - "core/format/src/wasm/wclap-*.mjs"
      - "examples/web-demos/wclap-build/**"
      - "examples/pulp-gain/**"
      - "tools/cmake/PulpWclap.cmake"
      - "tools/cmake/wasi-toolchain.cmake"
      - ".github/workflows/wclap-cloudflare.yml"
  # No event-level paths filter on pull_request: this lane is a REQUIRED status check,
  # and a required check that is path-filtered leaves unrelated PRs stuck forever on
  # "Expected — Waiting for status". The job therefore always reports, but its first
  # step classifies the PR diff and skips the expensive proof for unrelated changes.
  # Relevant core/web changes still catch the real silent-breakage risk this lane exists for:
  # the wasm UI build hand-lists its sources (PulpWebUi.cmake), so a CORE refactor
  # (core/view/**, core/canvas/**) that splits a TU breaks the link with nothing under
  # examples/web-demos/** touched — invisible to a path-filtered lane. Deploy stays
  # owner-gated + main-only, so a PR run builds + proves and never deploys.
  pull_request:
  # Run this required check on queued merge groups so a merge queue on `main` can
  # land PRs. `merge_group` does not honour a paths filter (like the pull_request
  # lane above, on purpose), so the job always reports. Its trusted base-to-group
  # diff classifier skips the expensive proof for unrelated groups while relevant
  # changes still build + prove. Deploy stays owner-gated + main-only.
  merge_group:
  # Weekly drift check — a broken build is a red run, not a dead site.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: wclap-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-prove-deploy:
    name: Build + prove + (owner-gated) deploy
    # Scheduled-workflow fork guard: forks should not burn a weekly cron.
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    # Hosted by default. PULP_WCLAP_RUNS_ON_JSON can route this required job
    # elsewhere when GitHub cannot assign hosted runners; it is JSON and
    # parsed (an unparsed array becomes one literal label and the job queues
    # forever). This workflow carries the Cloudflare deploy secret, so the
    # trusted Linux runner group refuses it by policy
    # (tools/ci/verify_linux_runner_group.py): a target has to be a pool that
    # may hold that secret.
    runs-on: ${{ fromJSON(vars.PULP_WCLAP_RUNS_ON_JSON || '"ubuntu-latest"') }}
    env:
      # Owner-gated deploy switch (a step `if:` cannot read `secrets` directly).
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # A published site never reads a cache an untrusted run can write. When
      # PULP_WCLAP_RUNS_ON_JSON routes this job to a self-hosted pool, that
      # host's ccache is shared with PR jobs, so every object is compiled here.
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v7

      # The FetchContent seed and the configure-check cache are shared with PR
      # jobs on a self-hosted pool, so CMake fetches every dependency at its
      # pin into a fresh job-local root and include()s no cached
      # configure-check file. Toolchains, choc and the Skia slice below also
      # land under RUNNER_TEMP, never a $HOME directory an earlier job could
      # have left behind. tools/scripts/test_release_cache_isolation.py holds
      # every signing or publishing job to this step and to CCACHE_DISABLE.
      - name: Isolate the build from shared caches
        shell: bash
        run: |
          set -euo pipefail
          # A per-dependency source override would bypass the fresh root.
          if overrides="$(env | grep '^PULP_FETCHCONTENT_SOURCE_DIR_' | cut -d= -f1)"; then
            echo "::error::runner environment overrides dependency sources: ${overrides//$'\n'/ }"
            exit 1
          fi
          root="${RUNNER_TEMP:?}/pulp-isolated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if command -v cygpath >/dev/null 2>&1; then root="$(cygpath -m "$root")"; fi
          rm -rf "$root"
          mkdir -p "$root/src" "$root/fc" "$root/cc"
          echo "PULP_SHARED_FETCHCONTENT_SOURCE_DIR=$root/src" >> "$GITHUB_ENV"
          echo "PULP_FETCHCONTENT_BASE_DIR=$root/fc" >> "$GITHUB_ENV"
          # PulpConfigureCheckCache.cmake include()s the files it finds here,
          # so a shared directory would run CMake an earlier job wrote.
          echo "PULP_CONFIGURE_CHECK_CACHE_DIR=$root/cc" >> "$GITHUB_ENV"

      - name: Resolve WebCLAP relevance
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          trusted_classifier="$(mktemp)"
          trusted_bump_check="$(mktemp)"
          trap 'rm -f "$changed_files" "$trusted_classifier" "$trusted_bump_check"' EXIT

          # A version-only generated bump changes top-level CMake metadata, so
          # the ordinary path classifier correctly considers it WebCLAP-
          # relevant. First ask the PROTECTED BASE's shared verifier whether
          # this is the release bot's exact signed/reproducible transaction.
          # Any lookup, topology, provenance, or regeneration ambiguity falls
          # through to the existing full relevance decision.
          trusted_verifier_base="${BASE_SHA:-}"
          if [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BASE_SHA" \
              || true
          fi
          if [ "${{ github.event_name }}" = merge_group ]; then
            # A cumulative base is speculative, so never execute its verifier.
            # Resolve only the exact #7771 topology to the candidate's original
            # protected-main parent; every other shape keeps the full proof.
            trusted_verifier_base=
            group_parents=()
            group_parent_count=0
            while IFS= read -r parent; do
              group_parents+=("$parent")
              group_parent_count=$((group_parent_count + 1))
            done < <(
              git cat-file -p "$GITHUB_SHA" 2>/dev/null \
                | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
            )
            if [ "$group_parent_count" -eq 2 ] \
                && [ "${group_parents[0]}" = "${BASE_SHA:-}" ]; then
              candidate="${group_parents[1]}"
              git cat-file -e "$candidate^{commit}" 2>/dev/null \
                || git fetch --no-tags --depth=1 origin "$candidate" \
                || true
              candidate_parents=()
              candidate_parent_count=0
              while IFS= read -r parent; do
                candidate_parents+=("$parent")
                candidate_parent_count=$((candidate_parent_count + 1))
              done < <(
                git cat-file -p "$candidate" 2>/dev/null \
                  | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
              )
              if [ "$candidate_parent_count" -eq 1 ]; then
                candidate_base="${candidate_parents[0]}"
                git cat-file -e "$candidate_base^{commit}" 2>/dev/null \
                  || git fetch --no-tags --depth=1 origin "$candidate_base" \
                  || true
                if [ "$candidate_base" = "${BASE_SHA:-}" ]; then
                  trusted_verifier_base="$candidate_base"
                else
                  cumulative_parents=()
                  cumulative_parent_count=0
                  while IFS= read -r parent; do
                    cumulative_parents+=("$parent")
                    cumulative_parent_count=$((cumulative_parent_count + 1))
                  done < <(
                    git cat-file -p "$BASE_SHA" 2>/dev/null \
                      | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p'
                  )
                  if [ "$cumulative_parent_count" -eq 2 ] \
                      && [ "${cumulative_parents[0]}" = "$candidate_base" ]; then
                    trusted_verifier_base="$candidate_base"
                  fi
                fi
              fi
            fi
          fi
          if [[ "$trusted_verifier_base" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              && git show "$trusted_verifier_base:tools/scripts/generated_version_bump_check.py" \
                >"$trusted_bump_check" 2>/dev/null \
              && GH_TOKEN="${{ github.token }}" python3 "$trusted_bump_check" \
                --repo . \
                --event-name "${{ github.event_name }}" \
                --event-path "${{ github.event_path }}" \
                --base "$BASE_SHA" \
                --head "${{ github.sha }}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "WebCLAP proof skipped: exact generated version-bump transaction."
            exit 0
          fi

          case "${{ github.event_name }}" in
            pull_request)
              # GitHub caps the pull files API at 3,000 entries. At the boundary
              # the response may be truncated, so fail closed and run the proof.
              if [ "${CHANGED_FILE_COUNT:-0}" -ge 3000 ]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              GH_TOKEN="${{ github.token }}" gh api --paginate \
                "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
                --jq '.[] | .filename, (.previous_filename // empty)' > "$changed_files"
              ;;
            merge_group)
              # The queue head may contain more than one PR. Diff the complete
              # speculative group against GitHub's trusted base SHA so relevance
              # covers the union. --no-renames emits both sides of a rename.
              if [ -z "${BASE_SHA:-}" ] \
                  || ! git fetch --no-tags --depth=1 origin "$BASE_SHA" \
                  || ! git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # A PR must never use its own classifier to decide whether that
          # classifier or this workflow receives the full proof. This also
          # bootstraps the first landing, before the base branch has the script.
          if grep -Fxq '.github/workflows/wclap-cloudflare.yml' "$changed_files" \
              || grep -Fxq 'tools/scripts/webclap_relevance.py' "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Execute the classifier from the trusted base SHA, not the PR
          # checkout. Scope the token to gh only; PR-controlled Python never
          # inherits a repository credential.
          GH_TOKEN="${{ github.token }}" gh api \
            "repos/${{ github.repository }}/contents/tools/scripts/webclap_relevance.py?ref=${BASE_SHA}" \
            --jq '.content' | base64 --decode > "$trusted_classifier"
          set +e
          python3 "$trusted_classifier" < "$changed_files"
          relevance_status=$?
          set -e
          case "$relevance_status" in
            0) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "WebCLAP proof skipped: the PR does not touch a WebCLAP build surface."
              ;;
            *) exit "$relevance_status" ;;
          esac

      - name: Test WebCLAP relevance policy
        if: steps.relevance.outputs.run == 'true'
        run: python3 tools/scripts/test_webclap_relevance.py

      # The gallery's 23 plugins do NOT live in pulp — they live in two separate
      # public repos (the examples-out-of-core split), and wclap-build/CMakeLists.txt
      # declares each gallery target ONLY IF its plugin header is present. A job that
      # checks out pulp alone therefore builds exactly PulpGain, skips all 23 SILENTLY
      # (by design, so the in-repo build stays green without them) — and then dies in
      # assemble-gallery.mjs with "missing wasm for example-plugins/mono-synth". The
      # skip is quiet; the assemble is not. Without these two checkouts this workflow
      # cannot deploy the gallery at all, which is exactly how it broke.
      - uses: actions/checkout@v7
        if: steps.relevance.outputs.run == 'true'
        with:
          repository: danielraffel/pulp-example-plugins
          path: _ext/pulp-example-plugins
      - uses: actions/checkout@v7
        if: steps.relevance.outputs.run == 'true'
        with:
          repository: danielraffel/pulp-classic-effects
          path: _ext/pulp-classic-effects

      - uses: actions/setup-node@v7
        if: steps.relevance.outputs.run == 'true'
        with:
          node-version: "22"
          # setup-node v5+ restores an npm cache by itself when a package.json
          # names a packageManager; this job deploys, so it never restores one.
          package-manager-cache: false

      - name: Set up wasi-sdk (pinned)
        if: steps.relevance.outputs.run == 'true'
        run: |
          set -euo pipefail
          ver=25
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${ver}/wasi-sdk-${ver}.0-x86_64-linux.tar.gz"
          dest="${RUNNER_TEMP:?}/wasi-sdk"
          rm -rf "$dest" "${RUNNER_TEMP}/wasi-sdk.tar.gz"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/wasi-sdk.tar.gz"
          mkdir -p "$dest"
          tar -xzf "${RUNNER_TEMP}/wasi-sdk.tar.gz" -C "$dest" --strip-components=1
          echo "WASI_SDK_PREFIX=$dest" >> "$GITHUB_ENV"

      - name: Set up Chrome
        if: steps.relevance.outputs.run == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Install playwright-core
        if: steps.relevance.outputs.run == 'true'
        run: npm install --no-save playwright-core

      - name: Build WebCLAP module
        if: steps.relevance.outputs.run == 'true'
        working-directory: examples/web-demos/wclap-build
        run: |
          set -euo pipefail
          # The two plugin roots default to SIBLINGS of the pulp checkout, which is not
          # where actions/checkout can put them (a `path:` cannot escape the workspace),
          # so point the cache vars at the _ext checkouts above.
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/cmake/wasi-toolchain.cmake" \
            -DPULP_EXAMPLE_PLUGINS_DIR="$GITHUB_WORKSPACE/_ext/pulp-example-plugins" \
            -DPULP_CLASSIC_EFFECTS_DIR="$GITHUB_WORKSPACE/_ext/pulp-classic-effects" \
            -DCMAKE_BUILD_TYPE=Release
          bash "$GITHUB_WORKSPACE/tools/ci/governed-build.sh" cmake --build build

          # A gallery target that got skipped builds NOTHING and says nothing, and the
          # failure then surfaces hundreds of lines later as a missing wasm in the
          # assembler. Fail here instead, where the cause is legible.
          missing=""
          for p in MonoSynth Chorus; do
            [ -f "build/$p.wasm" ] || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::gallery plugin wasm not built:$missing — the external plugin" \
                 "checkouts are missing or PULP_EXAMPLE_PLUGINS_DIR/PULP_CLASSIC_EFFECTS_DIR" \
                 "point somewhere wrong, so wclap-build/CMakeLists.txt skipped the targets."
            exit 1
          fi

      # ── The three Emscripten trees the SuperConvolver pages are built from ──────
      #
      # Without these the assembler SKIPS /super-convolver/{wam,wclap}/ and
      # /super-convolver-gpu/ — quietly, with a one-line note — and the deploy then
      # publishes a site with those pages MISSING. Since the deploy replaces the whole
      # site, "skipped" means DELETED from the live URL, not "left as it was". That is a
      # far worse failure than the loud one it replaced, so they are built here.
      - name: Set up Emscripten
        if: steps.relevance.outputs.run == 'true'
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.2

      # choc at an exact commit (the pulp-webview-dnd-poc1 tag), cloned fresh.
      - name: Vendor choc for the WAM build
        if: steps.relevance.outputs.run == 'true'
        env:
          CHOC_COMMIT: df148a41a6bc9cbd67727532c4d5c9d8aa6d5d60
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP:?}/choc-src"
          rm -rf "$dest"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 https://github.com/danielraffel/choc.git "$CHOC_COMMIT"
          git -C "$dest" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$CHOC_COMMIT"
          echo "PULP_WAM_CHOC_INCLUDE=$dest" >> "$GITHUB_ENV"

      # The slice is kept as its release archive, named by the pinned sha256
      # from tools/deps/manifest.json, and checked against that digest on every
      # run, whether it was downloaded now or left on the host. It unpacks into
      # this job's temp dir, so a host that keeps $HOME between jobs never
      # builds against an older pin. This job deploys, so it restores no
      # actions/cache; it only saves one (test_release_cache_isolation.py).
      - name: Resolve the Skia wasm slice pin
        if: steps.relevance.outputs.run == 'true'
        id: skia-pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          dep = next(d for d in json.load(open("tools/deps/manifest.json"))["dependencies"]
                     if d["name"] == "Skia")
          # Key matches the release asset's platform segment
          # (skia-build-<platform>-gpu-release.zip), the convention every other
          # slice follows and the one check_manifest_mirrors.py enforces against
          # external/skia-build/VERSION.md.
          a = dep["determinism"]["release_assets"]["wasm-wasm32"]
          print(f"url={a['url']}")
          print(f"sha256={a['sha256']}")
          PY

      - name: Fetch and verify the Skia wasm slice
        if: steps.relevance.outputs.run == 'true'
        env:
          SKIA_WASM_URL: ${{ steps.skia-pin.outputs.url }}
          SKIA_WASM_SHA256: ${{ steps.skia-pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          archive="$HOME/.cache/pulp/skia-wasm/$SKIA_WASM_SHA256.zip"
          mkdir -p "$(dirname "$archive")"
          trap 'rm -f "$archive.$$"' EXIT
          verify() { echo "$SKIA_WASM_SHA256  $1" | shasum -a 256 -c -; }
          if [ ! -f "$archive" ] || ! verify "$archive"; then
            curl -fsSL "$SKIA_WASM_URL" -o "$archive.$$"
            verify "$archive.$$"
            mv -f "$archive.$$" "$archive"
          fi
          root="$RUNNER_TEMP/skia-wasm"
          rm -rf "$root"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          echo "SKIA_WASM_ROOT=$root" >> "$GITHUB_ENV"

      # Write-only: publishes the verified archive from main for web-plugins.yml's
      # PR runs to restore (and re-verify). This job never restores it.
      - name: Save the Skia wasm archive (main push, GitHub-hosted)
        if: steps.relevance.outputs.run == 'true' && runner.environment == 'github-hosted' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pulp/skia-wasm/${{ steps.skia-pin.outputs.sha256 }}.zip
          key: skia-wasm-archive-${{ steps.skia-pin.outputs.sha256 }}

      - name: Build the WAM, Pulp-UI and WebGPU-DSP modules
        if: steps.relevance.outputs.run == 'true'
        run: |
          set -euo pipefail

          # WAM: the /super-convolver/wam/ page is the same plugin through the other web
          # ABI, and the assembler emits the pair or neither.
          emcmake cmake -S examples/web-demos/wasm-build -B examples/web-demos/wasm-build/build \
            -DCMAKE_BUILD_TYPE=Release -DPULP_WAM_CHOC_INCLUDE="$PULP_WAM_CHOC_INCLUDE"
          bash "$GITHUB_WORKSPACE/tools/ci/governed-build.sh" cmake --build examples/web-demos/wasm-build/build

          # Pulp's own GPU UI, compiled to wasm. Both SuperConvolver pages mount it.
          emcmake cmake -S examples/web-demos/super-convolver-ui -B build-webui \
            -DCMAKE_BUILD_TYPE=Release -DSKIA_DIR="$SKIA_WASM_ROOT"
          bash "$GITHUB_WORKSPACE/tools/ci/governed-build.sh" cmake --build build-webui

          # The Skia-free WebGPU DSP module the GPU page's worker instantiates. Guarded:
          # the GPU-audio lane does not exist on every branch this workflow runs from, and
          # the assembler already omits /super-convolver-gpu/ when its tree is absent. A
          # bare `cmake -S` on a missing dir is a hard error, which would take the whole
          # deploy down for a page that is legitimately not there.
          if [ -d examples/web-demos/gpu-audio ]; then
            emcmake cmake -S examples/web-demos/gpu-audio -B build-gpu-dsp \
              -DCMAKE_BUILD_TYPE=Release
            bash "$GITHUB_WORKSPACE/tools/ci/governed-build.sh" cmake --build build-gpu-dsp
          else
            echo "note: examples/web-demos/gpu-audio is not in this tree — /super-convolver-gpu/ will not be emitted."
          fi

      - name: Assemble self-contained deploy dir
        if: steps.relevance.outputs.run == 'true'
        working-directory: examples/web-demos/wclap-build/cloudflare
        run: |
          set -euo pipefail
          node assemble.mjs                 # single-plugin isolation proof (/)
          node assemble-player.mjs          # shared-player WebCLAP demo (/player/)
          gpu_args=""
          [ -d "$GITHUB_WORKSPACE/build-gpu-dsp" ] && gpu_args="--gpu-build $GITHUB_WORKSPACE/build-gpu-dsp"
          # shellcheck disable=SC2086
          node assemble-gallery.mjs \
            --wam-build "$GITHUB_WORKSPACE/examples/web-demos/wasm-build/build" \
            --ui-build  "$GITHUB_WORKSPACE/build-webui" \
            $gpu_args

          # A page the assembler SKIPPED is a page this deploy DELETES from the live site
          # — the deploy replaces the whole thing, so "not emitted" and "removed" are the
          # same event, and the assembler only says so in a one-line note nobody reads.
          # Fail loudly instead. If one of these is genuinely being retired, remove it from
          # this list in the same change.
          #
          # /super-convolver-gpu/ is deliberately NOT listed: it is emitted conditionally
          # (GPU_IR_HANDOFF_WIRED), so requiring it here would hard-fail every deploy made
          # while that page is legitimately withheld. Add it to this list in the same
          # change that makes it unconditional.
          for p in super-convolver/wam super-convolver/wclap; do
            [ -f "public/$p/index.html" ] || {
              echo "::error::$p was NOT assembled — deploying now would delete it from the" \
                   "live site. Its build tree (--wam-build / --ui-build / --gpu-build) is" \
                   "missing or empty; see the assembler's skip note above for which."
              exit 1
            }
          done

      # OG previews are rendered from the ASSEMBLED pages, on every deploy, so a
      # change to a plugin's UI cannot leave a stale unfurl image behind: the
      # screenshot is always taken from the page being shipped. Each plugin page
      # is shot STARTED, so the image is the plugin actually running. The second
      # assemble-gallery pass is required — it bakes the og:image/twitter tags in
      # only for pages whose og.png now exists.
      - name: Render OG preview images (per page, from the started plugin)
        if: steps.relevance.outputs.run == 'true'
        working-directory: examples/web-demos/wclap-build/cloudflare
        run: |
          set -euo pipefail
          node gen-og-images.mjs
          # The second pass MUST get the same build trees as the first. Run bare, it cannot
          # find them, SKIPS every page that needs one — /super-convolver-gpu/ among them —
          # and therefore never rewrites that page's HTML, which is the only thing this pass
          # exists to do. The og.png was shot correctly and then never referenced: the page
          # shipped with no og:image at all and unfurled bare.
          gpu_args=""
          [ -d "$GITHUB_WORKSPACE/build-gpu-dsp" ] && gpu_args="--gpu-build $GITHUB_WORKSPACE/build-gpu-dsp"
          # shellcheck disable=SC2086
          node assemble-gallery.mjs \
            --wam-build "$GITHUB_WORKSPACE/examples/web-demos/wasm-build/build" \
            --ui-build  "$GITHUB_WORKSPACE/build-webui" \
            $gpu_args

      - name: Guard — every demo page has a fresh OG image
        if: steps.relevance.outputs.run == 'true'
        working-directory: examples/web-demos/wclap-build/cloudflare
        run: node check-og-images.mjs

      - name: Prove @danielraffel/web-player adapter unit tests
        if: steps.relevance.outputs.run == 'true'
        working-directory: packages/pulp-web-player
        run: npm test

      - name: "Prove locally (single-plugin: crossOriginIsolated + WebCLAP audio + subresources)"
        if: steps.relevance.outputs.run == 'true'
        working-directory: examples/web-demos/wclap-build/cloudflare
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          node validate-deploy.mjs --screenshot /tmp/wclap-cloudflare.png

      - name: "Prove locally (shared player: real-time WebCLAP + param + clap.state, same UI as WAM)"
        if: steps.relevance.outputs.run == 'true'
        working-directory: examples/web-demos/wclap-build/cloudflare
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node validate-player.mjs --screenshot /tmp/wclap-shared-player.png

      - name: Upload proof screenshots
        if: always() && steps.relevance.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wclap-cloudflare-proof
          path: |
            /tmp/wclap-cloudflare.png
            /tmp/wclap-shared-player.png
          if-no-files-found: ignore
          retention-days: 14

      # ── Owner-gated deploy ─────────────────────────────────────────────────
      # Runs only after the owner adds CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
      # repo secrets (see cloudflare/README.md). Until then this step is skipped.
      # (`secrets` is not a valid context in a step `if:` — actionlint — so the
      # presence check is hoisted into the job-level HAS_CF_TOKEN env var.)
      - name: Deploy to Cloudflare Pages
        # ALLOWLIST, not a denylist. This previously read
        # `github.event_name != 'pull_request'`, which silently became TRUE the
        # day the `merge_group:` trigger was added — so every merge group
        # published production from a synthetic gh-readonly-queue commit that had
        # NOT merged and could still be evicted. The file's own comments claimed
        # group runs "never deploy"; the condition disagreed. It only stayed
        # invisible because merge-group runs were starving before reaching this
        # step. Naming the events that MAY deploy fails closed when the next
        # trigger is added.
        if: ${{ steps.relevance.outputs.run == 'true' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && env.HAS_CF_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # wrangler-action v4 installs the latest wrangler when this is unset,
          # which would fetch an unpinned tool mid-deploy. Exact version, bumped
          # deliberately. This is a soaked release, not `latest`: 4.149.0 was
          # published 2026-10-08, a week before it was pinned, so a regression
          # in a fresh wrangler cannot reach the production deploy first.
          wranglerVersion: "4.149.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: examples/web-demos/wclap-build/cloudflare
          # --branch main is REQUIRED, not cosmetic. Without it wrangler picks up the
          # current git branch and publishes a PREVIEW alias, while og:image is an
          # absolute production URL — so the card points at a host that has no images
          # and every shared link unfurls blank. Cloudflare serves a missing asset as
          # its 404 page with a 200 status, so a status-code check does not catch it.
          command: pages deploy public --project-name pulp-wclap-demos --branch main

      # The local guard checks the files on disk; only this checks the HOST. Fetch each
      # page as a crawler does, follow its og:image, and assert the bytes are a PNG.
      - name: Guard — the live site actually unfurls
        # ALLOWLIST, not a denylist. This previously read
        # `github.event_name != 'pull_request'`, which silently became TRUE the
        # day the `merge_group:` trigger was added — so every merge group
        # published production from a synthetic gh-readonly-queue commit that had
        # NOT merged and could still be evicted. The file's own comments claimed
        # group runs "never deploy"; the condition disagreed. It only stayed
        # invisible because merge-group runs were starving before reaching this
        # step. Naming the events that MAY deploy fails closed when the next
        # trigger is added.
        if: ${{ steps.relevance.outputs.run == 'true' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && env.HAS_CF_TOKEN == 'true' }}
        working-directory: examples/web-demos/wclap-build/cloudflare
        run: node check-unfurl.mjs --base https://pulp-wclap-demos.pages.dev
