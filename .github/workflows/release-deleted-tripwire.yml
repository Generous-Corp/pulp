name: Release-deletion tripwire

# Fires the moment ANY GitHub release in this repo is deleted, and makes the
# consequence loud while the actor is still at the keyboard.
#
# Why this exists: deleting a release is close to irreversible in two ways
# that are not obvious from the confirmation prompt —
#
#   1. Deleting a release that was ever PUBLISHED permanently burns its tag
#      name. GitHub reserves an immutable release's tag_name forever, so every
#      future publish attempt for that tag fails with HTTP 422 "tag_name was
#      used by an immutable release". The only recovery is a NEW patch tag.
#      (This burned v0.807.0 and v0.808.0 on 2026-08-16.)
#   2. Deleting a draft destroys its attached assets. The built binaries still
#      survive as the building run's workflow artifacts (~90 days), but the
#      release-attached copies are gone.
#
# No Pulp automation deletes releases — release-reconcile.yml is re-dispatch
# only and its NeverDestructive test asserts there is no delete path. So every
# deletion this catches was a human or an agent-driven `gh` call, exactly the
# audience a same-minute tracking issue can still reach. (A deletion performed
# with GITHUB_TOKEN would not trigger this workflow; that is fine, because no
# workflow in this repo deletes releases.)
#
# It only reports. It never recreates, retags, or otherwise touches release
# state — recovery decisions stay with a human, per release-watchdog.md.

on:
  release:
    types: [deleted]

permissions:
  issues: write

jobs:
  report:
    name: Report deleted release
    if: github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-24.04
    steps:
      - name: File or update the deletion tracker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          WAS_DRAFT: ${{ github.event.release.draft }}
          ACTOR: ${{ github.event.sender.login }}
        shell: bash
        run: |
          set -euo pipefail

          title="release deleted: ${TAG} — check for a burned tag name"
          echo "::warning::Release ${TAG} (draft=${WAS_DRAFT}) was deleted by ${ACTOR}."

          # Deliberately UNLABELLED. The retired release-health watchdog filed
          # with a label that did not exist in the repo; the labelled create
          # failed, a fallback fired unlabelled, and its label-filtered dedupe
          # could never find its own issues again — 69 duplicates. Dedupe here
          # is by exact title, state:all, so a re-deletion of the same tag
          # updates the existing tracker instead of minting a sibling.
          existing=$(
              gh issue list --repo "$REPO" --state all \
                  --search "in:title \"${TAG}\"" \
                  --json number,title \
                  --jq "[.[] | select(.title == \"${title}\")] | first | .number // empty" \
                  2>/dev/null || true
          )

          body_file=$(mktemp)
          {
              echo "_Auto-generated by \`.github/workflows/release-deleted-tripwire.yml\` on $(date -u '+%Y-%m-%d %H:%M UTC')._"
              echo
              echo "**Release \`${TAG}\` was deleted** (was draft: \`${WAS_DRAFT}\`) by \`${ACTOR}\`."
              echo
              if [ "${WAS_DRAFT}" = "false" ]; then
                  echo "This release had been **published**, so GitHub has now permanently"
                  echo "reserved the tag name \`${TAG}\`. Every future publish attempt for"
                  echo "this tag will fail with \`HTTP 422: tag_name was used by an"
                  echo "immutable release\`. **This version number is burned.**"
                  echo
                  echo "**Recovery:** ship a NEW patch tag. Do not re-dispatch"
                  echo "\`release-cli.yml\` for \`${TAG}\` — it can never succeed."
              else
                  echo "This was a **draft**. Its attached assets are gone, but if it was"
                  echo "ever published before, its tag name is permanently burned (future"
                  echo "publishes 422). The built binaries survive as workflow artifacts"
                  echo "on the \`release-cli.yml\` run that built them (~90-day retention):"
                  echo "recover with \`gh run download <run-id>\`."
              fi
              echo
              echo "**Standing rule:** never delete a release or draft — deletion is what"
              echo "burns tag names and destroys attached assets. If a publish fails, the"
              echo "recovery is a new patch tag, never a deletion."
              echo "See \`docs/guides/release-watchdog.md\`."
          } > "$body_file"

          if [ -n "${existing:-}" ]; then
              gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
              gh issue reopen "$existing" --repo "$REPO" 2>/dev/null || true
              echo "Updated existing tracker #${existing}."
          else
              gh issue create --repo "$REPO" --title "$title" --body-file "$body_file"
          fi
