name: Vellum freeze

on:
  pull_request:
  merge_group:
  # Manual recovery. This check is REQUIRED, and without a dispatch trigger the
  # only way to recover a cancelled run is to push a commit purely to fire
  # `synchronize` — which rewrites the very history under review. The dispatch
  # job never checks out or executes PR code: it re-runs an existing exact-head
  # pull_request-context run, preserving that event's restricted trust scope.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  rerun-pr-context:
    name: Re-run exact PR context
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-run the exact restricted PR run
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$DISPATCH_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$DISPATCH_PR")"
          state="$(printf '%s' "$pr_json" | jq -r .state)"
          base_repo="$(printf '%s' "$pr_json" | jq -r .base.repo.full_name)"
          base_ref="$(printf '%s' "$pr_json" | jq -r .base.ref)"
          base_head="$(printf '%s' "$pr_json" | jq -r .base.sha)"
          source_head="$(printf '%s' "$pr_json" | jq -r .head.sha)"
          if [ "$state" != "open" ]; then
            echo "PR #$DISPATCH_PR is $state; only an open PR can be recovered" >&2
            exit 1
          fi
          if [ "$base_repo" != "$GITHUB_REPOSITORY" ] || [ "$base_ref" != "main" ]; then
            echo "only $GITHUB_REPOSITORY:main is trusted for manual recovery" >&2
            exit 1
          fi

          runs_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/vellum-freeze-check.yml/runs?event=pull_request&head_sha=$source_head&per_page=100")"
          candidate="$(printf '%s' "$runs_json" | jq -c \
            --arg sha "$source_head" --arg base "$base_head" --argjson pr "$DISPATCH_PR" '
              [.workflow_runs[]
               | select(.event == "pull_request" and .head_sha == $sha)
               | select(any(.pull_requests[]?;
                   .number == $pr and .head.sha == $sha and .base.sha == $base))]
              | sort_by(.created_at)
              | last // empty')"
          if [ -z "$candidate" ]; then
            echo "no exact-head pull_request-context Vellum freeze run exists for PR #$DISPATCH_PR at $source_head" >&2
            exit 1
          fi

          run_id="$(printf '%s' "$candidate" | jq -r .id)"
          run_status="$(printf '%s' "$candidate" | jq -r .status)"
          conclusion="$(printf '%s' "$candidate" | jq -r .conclusion)"
          if [ "$run_status" != "completed" ] || [ "$conclusion" = "success" ]; then
            echo "run $run_id is status=$run_status conclusion=$conclusion; refusing a redundant or competing re-run" >&2
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun"
          echo "re-run requested for exact PR head $source_head via pull_request run $run_id"

  freeze-check:
    name: Vellum freeze
    if: github.event_name != 'workflow_dispatch'
    # Automatic same-repository and merge-group validation uses the restricted
    # organization pool. Fork PRs and an unset selector fall back to hosted
    # Linux. Manual recovery is isolated in rerun-pr-context above.
    # See version-skill-check.yml: these are *_RUNS_ON_JSON variables, so every
    # branch must stay JSON and be parsed. An unparsed array becomes one literal
    # label no runner carries, and GitHub queues that job forever rather than
    # failing it.
    runs-on: >-
      ${{ fromJSON(
        github.workflow_ref == format('{0}/.github/workflows/vellum-freeze-check.yml@refs/heads/main', github.repository) &&
        (github.event_name == 'merge_group' ||
         (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)) &&
        (vars.PULP_AUTO_LINUX_RUNS_ON_JSON || '"ubuntu-latest"') ||
        '"ubuntu-latest"'
      ) }}
    steps:
      - name: Check out the proposed merge tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # On pull_request/merge_group the default checkout already IS the
          # proposed merge tree. Manual recovery re-runs that restricted event
          # context and never checks PR code out in the dispatch job.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact comparison
        id: comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            {
              echo "base=$PR_BASE"
              echo "head=$GITHUB_SHA"
              echo "source_head=$PR_SOURCE_HEAD"
            } >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin "$PR_BASE"
          else
            {
              echo "base=$MERGE_BASE"
              echo "head=$MERGE_HEAD"
              echo "source_head=$MERGE_HEAD"
            } >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin "$MERGE_BASE" "$MERGE_HEAD"
          fi

      - name: Validate durable source-authority events
        run: |
          python3 tools/scripts/vellum_freeze_check.py \
            --base '${{ steps.comparison.outputs.base }}' \
            --head '${{ steps.comparison.outputs.head }}' \
            --source-head '${{ steps.comparison.outputs.source_head }}' \
            --output "$RUNNER_TEMP/vellum-outbox.json"
          python3 tools/scripts/vellum_expansion_watch_check.py \
            --base '${{ steps.comparison.outputs.base }}' \
            --head '${{ steps.comparison.outputs.head }}' \
            --output "$RUNNER_TEMP/vellum-expansion-watch.json"

      - name: Install inventory parser dependency
        run: python3 -m pip install --quiet 'pyyaml==6.0.2'

      - name: Run freeze-check negative controls
        run: |
          python3 tools/scripts/test_vellum_freeze_check.py
          python3 tools/scripts/test_vellum_expansion_watch_check.py
          python3 tools/scripts/test_github_app_jwt.py
          python3 tools/scripts/test_vellum_authority_workflows.py

      - name: Verify extraction and tooling inventories
        run: |
          python3 tools/scripts/generate_vellum_cut_manifest.py --verify
          python3 tools/scripts/test_generate_vellum_cut_manifest.py
          python3 tools/scripts/generate_vellum_ownership_projection.py --verify
          python3 tools/scripts/test_generate_vellum_ownership_projection.py
          python3 tools/scripts/pulp_tooling_disposition.py
          python3 tools/scripts/test_pulp_tooling_disposition.py
