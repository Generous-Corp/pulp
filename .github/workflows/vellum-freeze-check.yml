name: Vellum freeze

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  freeze-check:
    name: Vellum freeze
    # Automatic same-repository and merge-group validation uses the restricted
    # organization pool. Fork PRs and an unset selector fall back to hosted
    # Linux. Manual recovery is isolated in vellum-freeze-recovery.yml so this
    # workflow never mixes a privileged event with an untrusted checkout.
    # See version-skill-check.yml: these are *_RUNS_ON_JSON variables, so every
    # branch must stay JSON and be parsed. An unparsed array becomes one literal
    # label no runner carries, and GitHub queues that job forever rather than
    # failing it.
    runs-on: >-
      ${{ fromJSON(
        github.workflow_ref == format('{0}/.github/workflows/vellum-freeze-check.yml@refs/heads/main', github.repository) &&
        (github.event_name == 'merge_group' ||
         (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)) &&
        (vars.PULP_AUTO_LINUX_RUNS_ON_JSON || '"ubuntu-latest"') ||
        '"ubuntu-latest"'
      ) }}
    steps:
      - name: Check out the proposed merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # merge_group: the default checkout IS the exact queued candidate.
          # pull_request: the default checkout is GitHub's merge ref, which
          # may already be behind main; the next step replaces it with a merge
          # against live protected main. Manual recovery re-runs this
          # restricted event context from a separate checkout-free workflow.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact comparison
        id: comparison
        env:
          PR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Validate the PR as it would merge into protected main NOW, the
            # same construction the trusted gate and manual recovery use.
            #
            # GitHub builds refs/pull/N/merge once per push, and main moves
            # many times a day, so its first parent is routinely an older main.
            # Requiring the two to be equal failed every PR that main outran,
            # and a rerun reused the same merge ref, so the only repair was a
            # hand merge of main. Rebuilding the candidate here from live main
            # plus the exact PR head removes that race without trusting a
            # stale snapshot: a violation that only exists against current
            # main (a slice frozen after the merge ref was built) is still
            # evaluated, and merge_group re-checks the exact queued base.
            #
            # The comparison base is the candidate's FIRST parent, never the
            # event payload's PR base. Diffing from the PR's fork point would
            # replay every watch event main gained after the branch forked and
            # report another PR's family claim as this PR's duplicate. With
            # live main as both the base and the first parent, those events
            # sit on both sides of the diff and cancel, so only this PR's own
            # change is measured.
            tools/ci/net-retry.sh git fetch --no-tags origin \
              '+refs/heads/main:refs/vellum/live-main'
            live_base="$(git rev-parse --verify 'refs/vellum/live-main^{commit}')"
            if ! git cat-file -e "$PR_SOURCE_HEAD^{commit}" 2>/dev/null; then
              tools/ci/net-retry.sh git fetch --no-tags origin "$PR_SOURCE_HEAD"
            fi
            source_head="$(git rev-parse --verify "$PR_SOURCE_HEAD^{commit}")"
            if [[ "$source_head" != "$PR_SOURCE_HEAD" ]]; then
              echo "vellum-freeze: PR head $PR_SOURCE_HEAD resolved to $source_head" >&2
              exit 1
            fi
            candidate_file="$RUNNER_TEMP/vellum-freeze-candidate"
            if ! python3 tools/scripts/vellum_trusted_merge.py \
              --repo . \
              --base "$live_base" \
              --head "$source_head" \
              --output "$candidate_file"
            then
              echo "vellum-freeze: PR head $source_head does not merge cleanly with current protected main $live_base; merge main into the branch" >&2
              exit 1
            fi
            candidate="$(cat "$candidate_file")"
            parents="$(git rev-list --parents -n 1 "$candidate")"
            if [[ "$parents" != "$candidate $live_base $source_head" ]]; then
              echo "vellum-freeze: candidate parents are not current protected main plus the exact PR head" >&2
              exit 1
            fi
            # Later steps read the working tree (inventory verification), so
            # they must see the same candidate the validators diff.
            git checkout --quiet --detach "$candidate"
            echo "validating PR head $source_head merged into current protected main $live_base as $candidate" >&2
            {
              echo "base=$live_base"
              echo "head=$candidate"
              echo "source_head=$source_head"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "base=$MERGE_BASE"
              echo "head=$MERGE_HEAD"
              echo "source_head=$MERGE_HEAD"
            } >> "$GITHUB_OUTPUT"
            tools/ci/net-retry.sh git fetch --no-tags origin "$MERGE_BASE" "$MERGE_HEAD"
          fi

      - name: Validate durable source-authority events
        run: |
          python3 tools/scripts/vellum_freeze_check.py \
            --base '${{ steps.comparison.outputs.base }}' \
            --head '${{ steps.comparison.outputs.head }}' \
            --source-head '${{ steps.comparison.outputs.source_head }}' \
            --output "$RUNNER_TEMP/vellum-outbox.json"
          python3 tools/scripts/vellum_expansion_watch_check.py \
            --base '${{ steps.comparison.outputs.base }}' \
            --head '${{ steps.comparison.outputs.head }}' \
            --output "$RUNNER_TEMP/vellum-expansion-watch.json"

      - name: Install inventory parser dependency
        run: tools/ci/net-retry.sh python3 -m pip install --quiet 'pyyaml==6.0.2'

      - name: Run freeze-check negative controls
        run: |
          python3 tools/scripts/test_vellum_freeze_check.py
          python3 tools/scripts/test_vellum_expansion_watch_check.py
          python3 tools/scripts/test_github_app_jwt.py
          python3 tools/scripts/test_vellum_authority_workflows.py
          python3 tools/scripts/test_vellum_trusted_merge.py

      - name: Verify extraction and tooling inventories
        run: |
          python3 tools/scripts/generate_vellum_cut_manifest.py --verify
          python3 tools/scripts/test_generate_vellum_cut_manifest.py
          python3 tools/scripts/generate_vellum_ownership_projection.py --verify
          python3 tools/scripts/test_generate_vellum_ownership_projection.py
          python3 tools/scripts/pulp_tooling_disposition.py
          python3 tools/scripts/test_pulp_tooling_disposition.py
