name: Post-tag docs sync

# Installed by `shipyard release-bot hook install`. Shipyard-owned file:
# re-running the install command overwrites this file in place.

# Tag trigger withdrawn: the job's `pulp-queue-authority-studio` runner is no
# longer registered, so every tag queued a run that sat for ~5.5 hours and was
# cancelled without doing anything. Dispatch it against a tag ref
# (`--ref vX.Y.Z`) once a runner serves that label again, and restore the
# `push: tags` trigger then. Re-running `shipyard release-bot hook install`
# rewrites this file and brings the trigger back.
on:
  workflow_dispatch:

concurrency:
  group: shipyard-post-tag-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  SHIPYARD_VERSION: "0.143.0"

jobs:
  sync:
    name: Regenerate docs for ${{ github.ref_name }}
    runs-on: [self-hosted, pulp-queue-authority-studio]
    steps:
      - name: Checkout release tag with full history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install shipyard (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://generouscorp.com/Shipyard/install.sh" | SHIPYARD_VERSION="$SHIPYARD_VERSION" bash
          shipyard --version

      - name: Configure release bot SSH signing
        shell: bash
        env:
          RELEASE_BOT_SSH_SIGNING_KEY: ${{ secrets.RELEASE_BOT_SSH_SIGNING_KEY }}
        run: bash -- tools/scripts/configure_release_bot_ssh_signing.sh


      - name: Run post-tag docs sync
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          shipyard release-bot hook run --tag "$tag"
