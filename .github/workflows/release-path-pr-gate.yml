name: Release-path PR gate

# PR-time pre-tag check that runs the actual release-cli.yml build
# steps for the platforms most likely to surface
# Skia/dependency/link-order regressions. Catches the class of breakage
# that would otherwise only fire post-tag (when the ship has sailed).
#
# Motivated by pulp #1962 (2026-05-12..2026-05-14): Skia chrome/m144
# fontconfig + SkUnicode-split breakage sailed through every PR's CI
# because PR `build.yml` builds from source via FetchContent and never
# touches `fetch_skia_for_release.py` or the prebuilt-Skia link path.
# Five tags drafted then rotted as drafts because release-cli.yml was
# the only thing that exercised the prebuilt path, and it only runs
# post-tag.
#
# Scope: only triggers on PRs touching files that can affect the
# release path. Most PRs (view / canvas / docs / examples) skip this
# gate entirely. Linux-x64 is the canonical leg — it's where:
#   - GNU ld surfaces archive-link-order bugs first (fontconfig, skunicode)
#   - the "no PULP_REQUIRE_GPU_FOR_SDK" gate trips silently on bad pins
#   - the WebView=OFF split path runs (issue #720)
#
# darwin-arm64 is included as a cross-platform sanity check so we
# don't ship a Linux-only release-path gate that misses macOS-only
# regressions (e.g. metal framework drift).

on:
  pull_request:
    paths:
      - 'tools/scripts/fetch_skia_for_release.py'
      - 'tools/scripts/fetch_v8_for_release.py'
      - 'tools/scripts/verify_skia_m153_capabilities.py'
      - 'tools/scripts/test_verify_skia_m153_capabilities.py'
      - 'tools/deps/validate_render_update.py'
      - 'tools/deps/test_validate_render_update.py'
      - 'tools/deps/manifest.json'
      - 'tools/cmake/Find*.cmake'
      - 'tools/cmake/Pulp*.cmake'
      - 'tools/cli/CMakeLists.txt'
      - 'tools/scripts/package_cli.py'
      - 'core/canvas/CMakeLists.txt'
      - 'core/render/CMakeLists.txt'
      - 'core/view/CMakeLists.txt'
      - 'examples/threejs-native-demo/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release-cli.yml'
      - '.github/workflows/release-dry-run.yml'
      - '.github/workflows/release-path-pr-gate.yml'
      - 'tools/ci/release_package_cli.sh'
      - 'tools/ci/release_path_changed.py'
  # A queue batch runs the gate only when it touches the paths above;
  # merge_group takes no `paths:` filter, so the classify job decides.
  merge_group:
  workflow_dispatch:

# Multiple PRs touching the same release-path files can stack up;
# cancel older in-flight runs of THIS workflow when a new commit
# lands. Does not cancel release-cli.yml itself (different concurrency
# group), only this PR-time gate.
concurrency:
  group: release-path-pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide whether this run builds. A pull request already passed the `paths:`
  # filter and a manual dispatch is deliberate; a queue batch is checked
  # against the same list (tools/ci/release_path_changed.py reads it from
  # this file).
  classify:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'merge_group'
        with:
          lfs: false
          sparse-checkout: |
            .github/workflows/release-path-pr-gate.yml
            tools/ci/release_path_changed.py
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/compare/${BASE}...${HEAD}" \
            --jq '.files[].filename' > "$RUNNER_TEMP/changed.txt"
          run="$(python3 tools/ci/release_path_changed.py \
            --workflow .github/workflows/release-path-pr-gate.yml \
            --files "$RUNNER_TEMP/changed.txt")"
          echo "Queue batch touches the release path: ${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  # Keep the PR-time release-path darwin leg on the same macOS runner policy as
  # release-cli.yml. The gate exercises the same release build path, so routing
  # it through raw GitHub-hosted macos-15 recreates the same hosted-queue
  # starvation this workflow is meant to catch before tags.
  resolve-macos-runner:
    needs: classify
    if: needs.classify.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      runs_on_json: ${{ steps.resolve.outputs.runs_on_json }}
    steps:
      # Only the resolver is needed; it owns the opt-in class-label rewrite so
      # the three release workflows share one tested implementation.
      - uses: actions/checkout@v7
        with:
          lfs: false
          sparse-checkout: tools/scripts/resolve_release_runners.py
          sparse-checkout-cone-mode: false
      - id: resolve
        env:
          PR_GATE_JSON: ${{ vars.PULP_RELEASE_PR_GATE_MACOS_RUNS_ON_JSON }}
          RELEASE_JSON: ${{ vars.PULP_RELEASE_MACOS_RUNS_ON_JSON }}
          LOCAL_JSON: ${{ vars.PULP_LOCAL_MACOS_RUNS_ON_JSON }}
          NAMESPACE_JSON: ${{ vars.PULP_NAMESPACE_BUILD_MACOS_RUNS_ON_JSON }}
          # Opt-in (exactly `1`/`true`): append `pulp-release-pr-gate` to a
          # self-hosted selector. Unset = the selector below, verbatim.
          PULP_RELEASE_CLASS_TOKENS: ${{ vars.PULP_RELEASE_CLASS_TOKENS }}
        run: |
          set -euo pipefail
          if [ -n "${PR_GATE_JSON:-}" ]; then
            selector="${PR_GATE_JSON}"
            echo "Routing macOS release-path PR gate via PULP_RELEASE_PR_GATE_MACOS_RUNS_ON_JSON: ${PR_GATE_JSON}"
          elif [ -n "${RELEASE_JSON:-}" ]; then
            selector="${RELEASE_JSON}"
            echo "Routing macOS release-path PR gate via legacy PULP_RELEASE_MACOS_RUNS_ON_JSON fallback: ${RELEASE_JSON}"
          elif [ -n "${LOCAL_JSON:-}" ]; then
            selector="${LOCAL_JSON}"
            echo "Routing macOS release-path PR gate via self-hosted PULP_LOCAL_MACOS_RUNS_ON_JSON: ${LOCAL_JSON}"
          elif [ -n "${NAMESPACE_JSON:-}" ]; then
            selector="${NAMESPACE_JSON}"
            echo "Routing macOS release-path PR gate through Namespace: ${NAMESPACE_JSON}"
          else
            selector='["macos-15"]'
            echo "Routing macOS release-path PR gate through GitHub-hosted macos-15"
          fi
          selector="$(python3 tools/scripts/resolve_release_runners.py \
            --apply-class-label pulp-release-pr-gate --selector "$selector")"
          echo "runs_on_json=${selector}" >> "$GITHUB_OUTPUT"

  release-build:
    needs: [classify, resolve-macos-runner]
    if: needs.classify.outputs.run == 'true'
    name: Release-path build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: darwin-arm64

    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.resolve-macos-runner.outputs.runs_on_json) || matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Release-path Skia artifacts are fetched explicitly below. Keep LFS
          # off to match release-cli.yml and avoid requiring git-lfs on the
          # persistent Studio release runners.
          lfs: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-build-deps
        with:
          profile: native-webview

      # The FetchContent seed and the configure-check cache on a self-hosted
      # host can be written by earlier jobs, PR gate jobs included, so this job
      # points setup.sh and CMake at a fresh job-local root: every dependency
      # is re-fetched at its pin, and no cached configure-check file is
      # include()d. The Windows subbuild base moves with it. tools/scripts/test_release_cache_isolation.py holds every
      # signing or publishing job to this step and to CCACHE_DISABLE.
      - name: Isolate the build from shared caches
        shell: bash
        run: |
          set -euo pipefail
          # A per-dependency source override would bypass the fresh root.
          if overrides="$(env | grep '^PULP_FETCHCONTENT_SOURCE_DIR_' | cut -d= -f1)"; then
            echo "::error::runner environment overrides dependency sources: ${overrides//$'\n'/ }"
            exit 1
          fi
          root="${RUNNER_TEMP:?}/pulp-isolated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if command -v cygpath >/dev/null 2>&1; then root="$(cygpath -m "$root")"; fi
          rm -rf "$root"
          mkdir -p "$root/src" "$root/fc" "$root/cc"
          echo "PULP_SHARED_FETCHCONTENT_SOURCE_DIR=$root/src" >> "$GITHUB_ENV"
          echo "PULP_FETCHCONTENT_BASE_DIR=$root/fc" >> "$GITHUB_ENV"
          # PulpConfigureCheckCache.cmake include()s the files it finds here,
          # so a shared directory would run CMake an earlier job wrote.
          echo "PULP_CONFIGURE_CHECK_CACHE_DIR=$root/cc" >> "$GITHUB_ENV"


      - name: Bootstrap dependencies
        run: ./setup.sh --ci --deps-only
        shell: bash

      # A self-hosted runner can leave external/skia-build as a symlink into a
      # warm shared cache. Unpacking into that can collide: a dangling/partial
      # tree makes mkdir see the build dir as both missing (for a child) and
      # present (for itself). Remove the entry — the symlink itself, never the
      # cache target — so the fetch below starts from a clean real directory.
      - name: Ensure a clean Skia dir (release path)
        run: rm -rf external/skia-build
        shell: bash

      # The whole point — exercise the prebuilt-Skia path that
      # release-cli.yml uses. PR build.yml does NOT do this, which is
      # exactly why fontconfig + skunicode breakage went undetected
      # at PR time (#1962).
      - name: Fetch Skia binaries (release path)
        run: env -u PULP_USE_BAKED_SKIA -u SKIA_DIR python3 tools/scripts/fetch_skia_for_release.py ${{ matrix.platform }}
        shell: bash

      - name: Verify m153+ provider capabilities and extracted receipt
        if: matrix.platform == 'darwin-arm64' || matrix.platform == 'linux-x64'
        run: |
          python3 tools/scripts/verify_skia_m153_capabilities.py \
            --platform "${{ matrix.platform }}" \
            --skia-dir external/skia-build
        shell: bash

      # Mirror release-cli.yml's CLI configure exactly so this gate
      # surfaces the same flag combinations that get exercised at
      # release time (PULP_REQUIRE_GPU_FOR_SDK=ON, WebView=OFF on
      # Linux to keep the CLI portable).
      # Packaging needs the Rust build/pulp CLI; same step as release-cli.yml.
      - name: Ensure a working Rust toolchain on PATH
        if: runner.os != 'Windows'
        run: |
          runs() { "$1/cargo" --version >/dev/null 2>&1; }
          use() { echo "$1" >> "$GITHUB_PATH"; echo "rust: using cargo at $1 ($("$1/cargo" --version))"; }
          if command -v cargo >/dev/null 2>&1 && cargo --version >/dev/null 2>&1; then
            echo "rust: cargo already works on PATH ($(cargo --version))"; exit 0
          fi
          if runs "$HOME/.cargo/bin"; then use "$HOME/.cargo/bin"; exit 0; fi
          # Broken rustup proxy / dangling shim — fall back to a toolchain's
          # direct bin (a real cargo binary, no proxy needed).
          for tc in "$HOME"/.rustup/toolchains/*/bin; do
            if runs "$tc"; then use "$tc"; exit 0; fi
          done
          # Last resort: no usable toolchain on this runner. This is the normal
          # state of a fresh Tart VM golden provisioned only for the C++
          # Build-and-Test lane (cmake/ninja, no cargo) — release-cli is the
          # first VM workload that builds the Rust build/pulp CLI. Bootstrap
          # rustup so the release lane is self-sufficient on ANY runner (VM or
          # bare-metal) instead of depending on operator-baked Rust. The
          # toolchain is pinned (experimental/pulp-rs/rust-toolchain.toml =
          # stable), so this resolves the same compiler the bare-metal runners
          # already use — no reproducibility drift from installing it here.
          echo "rust: no usable cargo on this runner — bootstrapping rustup (pinned stable)"
          # --no-modify-path: never touch the runner's shell profiles (this
          # fallback can fire on a persistent home, not just a disposable VM).
          if curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
               | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path >/dev/null 2>&1; then
            # rust-toolchain.toml also declares rustfmt+clippy; front-load them
            # here (best-effort) so any component fetch happens in this step
            # instead of stalling the CMake-driven cargo build later.
            "$HOME/.cargo/bin/rustup" component add rustfmt clippy >/dev/null 2>&1 || true
            if runs "$HOME/.cargo/bin"; then use "$HOME/.cargo/bin"; exit 0; fi
          fi
          echo "::error::No working cargo and the rustup bootstrap failed. release-cli needs Rust to build the user-facing build/pulp CLI — refusing to ship a CLI-less tarball." >&2
          exit 1
        shell: bash

      - name: Prepare pinned Node runtime for design import
        shell: bash
        run: |
          node_path="$RUNNER_TEMP/pulp-node-runtime/node"
          python3 tools/scripts/prepare_node_runtime.py \
            --platform "${{ matrix.platform }}" --output "$node_path"
          echo "PULP_NODE_RUNTIME_EXECUTABLE=$node_path" >> "$GITHUB_ENV"

      - name: Configure (CLI, no WebView on Linux, GPU required)
        run: |
          REQUIRE_GPU="-DPULP_REQUIRE_GPU_FOR_SDK=OFF"
          SCENE3D="-DPULP_ENABLE_SCENE3D=OFF"
          case "${{ matrix.platform }}" in
            darwin-arm64|linux-x64)
              REQUIRE_GPU="-DPULP_REQUIRE_GPU_FOR_SDK=ON"
              SCENE3D="-DPULP_ENABLE_SCENE3D=ON"
              ;;
          esac
          # Examples OFF to match release-cli.yml, whose build and package
          # steps this gate reproduces.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPULP_NODE_RUNTIME_EXECUTABLE="${PULP_NODE_RUNTIME_EXECUTABLE:-}" \
            -DSKIA_DIR="$PWD/external/skia-build" \
            -DPULP_BUILD_TESTS=OFF \
            -DPULP_BUILD_EXAMPLES=OFF \
            -DPULP_ENABLE_AUDIO_PROBES=OFF \
            -DPULP_ENABLE_INSPECTOR=ON \
            $REQUIRE_GPU \
            $SCENE3D \
            ${{ runner.os == 'Linux' && '-DPULP_BUILD_WEBVIEW=OFF' || '-DPULP_BUILD_WEBVIEW=ON' }}
        shell: bash

      # Build everything release-cli.yml builds: packaging needs pulp,
      # pulp-cpp, pulp-mcp, import-design and the inspector binaries. The
      # link step is where the SkUnicode core/icu order bug surfaces (and
      # where the fontconfig undefineds surfaced in the previous Skia bump).
      - name: Build (release path)
        run: tools/ci/governed-build.sh cmake --build build --config Release
        shell: bash

      # Package with the script release-cli.yml packages with, against the
      # isolated dependency root above. A change to how a release finds its
      # runtime libraries fails here, at PR time, not after the tag.
      - name: Package CLI (release path)
        run: bash tools/ci/release_package_cli.sh "${{ matrix.platform }}"
        shell: bash

      # Sanity: the binary actually runs. release-cli.yml has a
      # smoke-cli matrix that does this on a separate clean runner —
      # we do a lightweight `--version` here to catch the dynamic
      # loader failures that linker bugs hide (e.g. missing rpath /
      # missing dependency symbol resolution).
      - name: Smoke pulp-cpp --version
        run: |
          ./build/tools/cli/pulp-cpp --version || ./build/tools/cli/pulp-cpp version
        shell: bash

      # The render milestone may advance independently of V8. On macOS, prove
      # the exact pinned providers still coexist in one real Metal process and
      # render a headless Three.js frame before accepting a release-path change.
      - name: Fetch sealed V8 provider (mixed-provider gate)
        if: matrix.platform == 'darwin-arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/fetch_v8_for_release.py darwin-arm64
        shell: bash

      - name: Build mixed Skia/Dawn/V8 provider probe
        if: matrix.platform == 'darwin-arm64'
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DSKIA_DIR="$PWD/external/skia-build" \
            -DPULP_BUILD_TESTS=OFF \
            -DPULP_BUILD_EXAMPLES=ON \
            -DPULP_ENABLE_DESIGN_IMPORT=OFF \
            -DPULP_BUILD_RUST_CLI=OFF \
            -DPULP_JS_ENGINE=v8 \
            -DPULP_VALIDATE_V8_PROVIDER_STRICT=ON
          tools/ci/governed-build.sh cmake --build build --config Release \
            --target pulp-threejs-native-demo
        shell: bash

      - name: Verify mixed provider identity and headless cube
        if: matrix.platform == 'darwin-arm64'
        run: |
          set -euo pipefail
          expected_version="$(python3 -c 'import json; d=json.load(open("tools/deps/manifest.json")); print(next(x for x in d["dependencies"] if x["name"] == "V8")["version"].split("-", 3)[2])')"
          cmake \
            -DDEMO_BIN="$PWD/build/examples/threejs-native-demo/pulp-threejs-native-demo" \
            -DCAPTURE_PATH="$PWD/build/pulp-threejs-provider-identity.png" \
            -DEXPECTED_KIND=v8builder \
            -DEXPECTED_VERSION="$expected_version" \
            -P examples/threejs-native-demo/provider_identity_test.cmake
        shell: bash
