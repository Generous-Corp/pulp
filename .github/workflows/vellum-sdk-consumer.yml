# Vellum SDK consumer: build Pulp's editor-host slice against Vellum main.
#
# Pulp's editor-host slice (test/editor_host_slice/) compiles against an
# installed Vellum SDK. A Vellum change can break it without anything in Pulp
# changing, so this lane takes the SDK archive from Vellum main's newest green
# "Locked macOS GPU proof" run, verifies it against the artifact's SHA256SUMS,
# builds the slice and runs the acceptance runner
# (tools/scripts/editor_host_acceptance.py) against it. The same SDK also
# builds integrations/pulp-vellum (the ParamPort / VisualPort bridge to
# Vellum's ParamModel / ValueFeed) and runs its tests; the resolver refuses a
# run that does not contain the Vellum commit that introduced the ParamModel
# surface the bridge needs.
#
# Every full run also proves the lane can see a break: a negative control
# recompiles one Vellum-side translation unit against a copy of the SDK's
# mirror headers with vellum/canvas/canvas.hpp renamed, and requires that
# compile to fail on that missing header (tools/ci/vellum_sdk_consumer.py).
#
# Advisory: not a required check. The nightly run is the one that catches a
# Vellum change, because Vellum commits fire no Pulp events; it stops after
# the resolve step when Vellum main's head equals the head the last green run
# checked. Pull requests that touch the slice or this lane run it in full.
name: Vellum SDK consumer

on:
  schedule:
    - cron: '41 4 * * *'
  pull_request:
    paths:
      - 'test/editor_host_slice/**'
      - 'integrations/pulp-vellum/**'
      - 'integrations/pulp-vellum-audio/**'
      - 'integrations/pulp-vellum-scene/**'
      - 'test/fixtures/scene3d/DracoTriangle/**'
      - 'integrations/pulp-vellum-components/**'
      - 'integrations/pulp-vellum-renderer3d/**'
      - 'integrations/pulp-vellum-graph/**'
      - 'integrations/pulp-vellum/cmake/PulpVellumEditorPackage.cmake'
      - 'test/test_pulp_vellum_editor.cpp'
      - 'test/test_pulp_vellum_audio.cpp'
      - 'test/cmake/test_pulp_vellum_editor_package.cmake'
      # The bridge's PULP_ENABLE_PULP_VELLUM option and test-directory
      # registration live in these two files, not under the package.
      - 'integrations/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'test/test_pulp_vellum_param_bridge.cpp'
      # The view-free DAW reload shell that pulp-test-vellum-reload-shell drives
      # under the Vellum scripted editor.
      - 'core/format/include/pulp/format/reload/reloadable_shell_core.hpp'
      - 'test/cmake/editor_host_slice_tests.cmake'
      - 'tools/scripts/editor_host_acceptance.py'
      - 'tools/ci/vellum_sdk_consumer.py'
      # Yoga layout fixtures run on Vellum's layout through the SDK's app host.
      - 'tools/harness/visual/vellum_layout.py'
      - 'tools/harness/visual/runner.py'
      - 'tools/harness/visual/fixtures/yoga/**'
      - 'tools/harness/visual/goldens/yoga/**'
      - 'tools/harness/visual/tests/test_vellum_layout.py'
      # The GPU adapter probe built by the bridge configure.
      - 'tools/cli/gpu_probe/src/adapter_probe.cpp'
      - 'tools/cli/gpu_probe/include/pulp_tooling/gpu_probe/adapter_probe.hpp'
      # The MCP UI tools that run bundles on the SDK's vellum-app-host.
      - 'tools/mcp/mcp_ui_tools.cpp'
      - 'test/test_mcp_ui_tools.cpp'
      # The Vellum-backed UI target names: the package config that defines
      # them, their scenario driver and the installed consumer it builds. The
      # `real` and `wrong-version` scenarios carry the pulp-vellum label.
      - 'tools/cmake/PulpConfig.cmake.in'
      - 'test/cmake/test_vellum_ui_compat_package.cmake'
      - 'tools/validation/sdk-smoke/vellum-ui-compat/**'
      # The installed-SDK smoke: the install rules that ship the Vellum
      # packages, its driver and its consumer.
      - 'tools/cmake/PulpInstallRules.cmake'
      - 'test/cmake/test_vellum_installed_sdk_smoke.cmake'
      - 'tools/validation/sdk-smoke/vellum-installed/**'
      # PULP_UI_FROM_VELLUM_IN_TREE: its module, its scenario driver, and the
      # CMake files whose consumers the `real` scenario pins, so a change that
      # ports or adds a consumer runs the test that judges it.
      - 'integrations/pulp-vellum/cmake/PulpVellumUiInTree.cmake'
      - 'test/cmake/test_vellum_ui_in_tree.cmake'
      - 'core/**/CMakeLists.txt'
      - 'inspect/CMakeLists.txt'
      - 'tools/cli/cmake/PulpCliForceLoad.cmake'
      - '.github/workflows/vellum-sdk-consumer.yml'
  workflow_dispatch:
    inputs:
      vellum_run_id:
        description: 'A specific Vellum Locked macOS GPU proof run id; empty means the newest green run on main'
        required: false
        type: string

concurrency:
  group: vellum-sdk-consumer-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  resolve-advisory-macos:
    name: Resolve isolated advisory macOS runner
    if: github.head_ref != 'release/version-bump' && (github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO)
    runs-on: ubuntu-latest
    outputs:
      selector_json: ${{ steps.resolve.outputs.selector_json }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: resolve
        shell: bash
        env:
          CONFIGURED_JSON: ${{ vars.PULP_ADVISORY_MACOS_RUNS_ON_JSON }}
        run: |
          python3 tools/scripts/resolve_advisory_macos_runner.py \
            --configured-json "$CONFIGURED_JSON" \
            --fallback-json '"macos-15"' \
            --event-name "${{ github.event_name }}"

  consumer:
    name: Editor-host slice against Vellum main (macOS)
    needs: resolve-advisory-macos
    # The resolver rejects pulp-build* and pulp-preamble* labels, so this
    # advisory lane never takes a runner the required macos gate needs.
    runs-on: ${{ fromJSON(needs.resolve-advisory-macos.outputs.selector_json) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      # Vellum is public; its artifacts still need an authenticated token, and
      # github.token is enough. A failed lookup or digest fails this step.
      - name: Resolve Vellum main's SDK archive
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.vellum_run_id }}
        run: |
          set -euo pipefail
          # 6f76e3e6ea45 is the first Vellum main commit with ParamModel's
          # info/plain/parse/modulation surface.
          args=(resolve --out-dir "$RUNNER_TEMP/vellum-sdk" --min-vellum-sha 6f76e3e6ea453554df40b0844bc94f524337487f)
          if [ -n "${RUN_ID:-}" ]; then
            args+=(--run-id "$RUN_ID")
          elif [ "${{ github.event_name }}" = schedule ]; then
            args+=(--skip-if-unchanged "${{ github.repository }}:vellum-sdk-consumer.yml")
          fi
          python3 -I tools/ci/vellum_sdk_consumer.py "${args[@]}"

      - name: Report an unchanged Vellum head
        if: steps.sdk.outputs.unchanged == 'true'
        shell: bash
        run: |
          echo "Vellum main ${{ steps.sdk.outputs.vellum_head_sha }} was already checked by the last green run; nothing to do." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch Skia (darwin-arm64)
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/fetch_skia_for_release.py darwin-arm64 \
            --cache-root "${PULP_SKIA_CACHE_ROOT:-$HOME/.cache/pulp/skia}" \
            --cache-lock-timeout "${PULP_SKIA_CACHE_LOCK_TIMEOUT_SECS:-300}"

      - name: Deps
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: ./setup.sh --ci --deps-only

      # The runner configures build-acceptance, builds only the slice target
      # through tools/ci/governed-build.sh, and runs the slice's ctest label,
      # the direction check, the 6a census and the 3g mutation.
      - name: Editor-host acceptance against Vellum main
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/editor_host_acceptance.py \
            --vellum-prefix "${{ steps.sdk.outputs.prefix }}" \
            --json "$RUNNER_TEMP/vellum-sdk/acceptance.json" 2>&1 | tee "$RUNNER_TEMP/vellum-sdk/acceptance.log"

      # A separate configure: the bridge package is off in every other build,
      # so it is built only here, from the SDK this run resolved. The
      # pulp-vellum label also runs the Vellum-backed UI target scenarios
      # against that SDK; registered with its Vellum_DIR they fail rather
      # than skip.
      - name: Build and test the Pulp-Vellum parameter bridge
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tools/ci/vellum_sdk_consumer.py labelled-targets \
            --build-dir build-vellum-bridge --prepare
          cmake -S . -B build-vellum-bridge -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPULP_BUILD_EXAMPLES=OFF -DPULP_BUILD_TESTS=ON \
            -DPULP_ENABLE_PULP_VELLUM=ON \
            -DPULP_ENABLE_SCENE3D=ON \
            -DPULP_ENABLE_PULP_VELLUM_SCENE=ON \
            -DPULP_ENABLE_PULP_VELLUM_AUDIO=ON \
            -DPULP_ENABLE_PULP_VELLUM_COMPONENTS=ON \
            -DPULP_ENABLE_SCENE3D=ON \
            -DPULP_ENABLE_PULP_VELLUM_RENDERER3D=ON \
            -DPULP_ENABLE_PULP_VELLUM_GRAPH=ON \
            -DCMAKE_PREFIX_PATH="${{ steps.sdk.outputs.prefix }}"
          # Every executable under integrations/pulp-vellum*/ and every program
          # a pulp-vellum* ctest entry runs, from the CMake target graph, so a
          # new test target needs no edit here.
          target_list=$(python3 -I tools/ci/vellum_sdk_consumer.py labelled-targets \
            --build-dir build-vellum-bridge | tr '\n' ' ')
          read -r -a targets <<< "$target_list"
          echo "Building ${#targets[@]} Vellum test targets: ${targets[*]}"
          tools/ci/governed-build.sh cmake --build build-vellum-bridge --target "${targets[@]}"
          # Fails when a selected target or a labelled test's program is absent.
          python3 -I tools/ci/vellum_sdk_consumer.py labelled-targets \
            --build-dir build-vellum-bridge --verify
          ctest --test-dir build-vellum-bridge -L pulp-vellum --no-tests=error --output-on-failure \
            | tee "$RUNNER_TEMP/vellum-sdk/bridge.log"

      # Installs a release-profile SDK to an empty prefix and configures a
      # consumer of the two Vellum integration packages from scratch against
      # it. `cmake --install` needs every target built, which the labelled
      # build above does not do, so this is its own configure and build.
      - name: Installed SDK smoke (empty prefix, fresh consumer)
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-vellum-install -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPULP_PROFILE=release \
            -DPULP_ENABLE_PULP_VELLUM=ON \
            -DPULP_ENABLE_PULP_VELLUM_AUDIO=ON \
            -DCMAKE_PREFIX_PATH="${{ steps.sdk.outputs.prefix }}"
          tools/ci/governed-build.sh cmake --build build-vellum-install
          cmake -DPULP_SOURCE_DIR="$PWD" \
            -DBUILD_DIR="$PWD/build-vellum-install" \
            -DFIXTURE_DIR="$RUNNER_TEMP/vellum-installed-sdk" \
            -DVELLUM_PREFIX="${{ steps.sdk.outputs.prefix }}" \
            -P test/cmake/test_vellum_installed_sdk_smoke.cmake \
            | tee "$RUNNER_TEMP/vellum-sdk/installed-sdk.log"
          grep -q "vellum-installed-sdk-smoke: ok" "$RUNNER_TEMP/vellum-sdk/installed-sdk.log"

      # The MCP UI tools resolve vellum-app-host from the SDK this run
      # resolved. The live case must run, so a skip fails the step.
      - name: MCP UI tools against the SDK's app host
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools/ci/governed-build.sh cmake --build build-vellum-bridge --target pulp-test-mcp-server
          host="${{ steps.sdk.outputs.prefix }}/bin/vellum-app-host"
          test -x "$host"
          PULP_TEST_VELLUM_APP_HOST="$host" MTL_DEBUG_LAYER=0 \
            build-vellum-bridge/test/pulp-test-mcp-server "[ui]" | tee "$RUNNER_TEMP/vellum-sdk/mcp-ui.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/vellum-sdk/mcp-ui.log"; then
            echo "the live MCP UI case skipped" >&2
            exit 1
          fi

      # Layout fixtures on Vellum's layout, through the SDK's vellum-app-host.
      # The runner exits 3 when nothing was measured, so a run that skipped
      # every fixture fails here instead of passing.
      - name: Yoga layout fixtures on Vellum's layout
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          host="${{ steps.sdk.outputs.prefix }}/bin/vellum-app-host"
          test -x "$host"
          export VELLUM_APP_HOST="$host" MTL_DEBUG_LAYER=0
          python3 -m tools.harness.visual.runner --verify --engine vellum
          python3 -m unittest tools.harness.visual.tests.test_vellum_layout -v

      - name: Negative control (a renamed SDK header must fail the build)
        if: steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tools/ci/vellum_sdk_consumer.py negative-control \
            --build-dir build-acceptance --prefix "${{ steps.sdk.outputs.prefix }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: always() && steps.sdk.outputs.unchanged != 'true'
        shell: bash
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/vellum-sdk"
          {
            echo '### Vellum SDK consumer'
            [ -f "$dir/receipt.json" ] && { echo '```json'; cat "$dir/receipt.json"; echo '```'; }
            [ -f "$dir/acceptance.log" ] && { echo '```'; sed -n '/^Item  *Verdict/,$p' "$dir/acceptance.log"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

      # The receipt is what the next nightly run compares against, so it is
      # uploaded only when the whole run is green.
      - name: Upload receipt
        if: success() && steps.sdk.outputs.unchanged != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vellum-sdk-consumer-receipt
          path: |
            ${{ runner.temp }}/vellum-sdk/receipt.json
            ${{ runner.temp }}/vellum-sdk/acceptance.json
          retention-days: 30
