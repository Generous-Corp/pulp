name: PR-safe Linux

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      runner_selector_json:
        required: true
        type: string

permissions:
  contents: read

jobs:
  admission:
    name: Validate PR-safe Linux admission
    runs-on: ubuntu-latest
    outputs:
      admitted: ${{ steps.validate.outputs.admitted }}
    steps:
      - id: validate
        name: Validate protected route state
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY: Generous-Corp/pulp
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          SELECTOR_JSON: ${{ inputs.runner_selector_json }}
          CONFIGURED_SELECTOR_JSON: ${{ vars.PULP_PR_SAFE_LINUX_RUNS_ON_JSON || '' }}
          LEASE_UNTIL: ${{ vars.PULP_PR_SAFE_LINUX_LEASE_UNTIL || '' }}
          ROUTE_ENABLED: ${{ vars.PULP_PR_SAFE_LINUX_REUSABLE_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          expected_selector = [
              "self-hosted", "Linux", "X64", "pulp-build-linux-x64",
              "pulp-host-macpro", "pulp-pr-safe-linux-x64",
          ]

          def selector(name):
              try:
                  value = json.loads(os.environ.get(name, ""))
              except json.JSONDecodeError:
                  return None
              return value if value == expected_selector else None

          def lease_is_live():
              try:
                  expiry = datetime.fromisoformat(
                      os.environ.get("LEASE_UNTIL", "").replace("Z", "+00:00")
                  )
              except ValueError:
                  return False
              if expiry.tzinfo is None:
                  return False
              remaining = expiry.astimezone(timezone.utc) - datetime.now(timezone.utc)
              return 0 < remaining.total_seconds() <= 15 * 60

          checks = {
              "event": os.environ.get("EVENT_NAME") == "pull_request",
              "repository": os.environ.get("REPOSITORY") == os.environ.get("EXPECTED_REPOSITORY"),
              "same repository": os.environ.get("PR_HEAD_REPOSITORY") == os.environ.get("EXPECTED_REPOSITORY"),
              "head SHA": os.environ.get("SOURCE_SHA") == os.environ.get("PR_HEAD_SHA"),
              "base SHA": os.environ.get("BASE_SHA") == os.environ.get("PR_BASE_SHA"),
              "enabled": os.environ.get("ROUTE_ENABLED", "").strip().lower() == "true",
              "caller selector": selector("SELECTOR_JSON") is not None,
              "configured selector": selector("CONFIGURED_SELECTOR_JSON") is not None,
              "lease": lease_is_live(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"admitted={'false' if failed else 'true'}\n")
          if failed:
              print("PR-safe admission denied; using hosted Linux: " + ", ".join(failed))
          PY

  linux:
    name: Linux (x64) [pr-safe-with-hosted-fallback]
    needs: admission
    runs-on: >-
      ${{ fromJSON(
        needs.admission.outputs.admitted == 'true' &&
        inputs.runner_selector_json || '"ubuntu-latest"'
      ) }}
    timeout-minutes: 60
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_NODEPEND: "true"
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Validate same-repository PR assignment
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTOR_JSON: ${{ inputs.runner_selector_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          expected = [
              "self-hosted", "Linux", "X64", "pulp-build-linux-x64",
              "pulp-host-macpro", "pulp-pr-safe-linux-x64",
          ]
          checks = {
              "event": os.environ["EVENT_NAME"] == "pull_request",
              "same repository": os.environ["PR_HEAD_REPOSITORY"] == os.environ["EXPECTED_REPOSITORY"],
              "head SHA": os.environ["SOURCE_SHA"] == os.environ["PR_HEAD_SHA"],
              "base SHA": os.environ["BASE_SHA"] == os.environ["PR_BASE_SHA"],
              "selector": json.loads(os.environ["SELECTOR_JSON"]) == expected,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("PR-safe assignment rejected: " + ", ".join(failed))
          PY

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          lfs: false
          clean: true

      - name: Install Linux build dependencies
        uses: ./.github/actions/install-linux-build-deps
        with:
          extra-packages: ccache

      - name: Bootstrap repository dependencies
        run: ./setup.sh --ci --deps-only
        shell: bash

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-linux-pr-safe \
            -DCMAKE_BUILD_TYPE=Release \
            -DPULP_BUILD_EXAMPLES=OFF

      - name: Build
        shell: bash
        run: cmake --build build-linux-pr-safe --config Release --parallel 4

      - name: Test
        shell: bash
        run: |
          exclude='STFT|VisualizationBridge|Clipboard|Toolbar add items'
          exclude="${exclude}|AudioInspectorPanel renders a non-empty headless snapshot"
          exclude="${exclude}|font v2 Slice 3\\.4"
          exclude="${exclude}|baked native materializer makes a faithful_svg tab_group an interactive overlay"
          exclude="${exclude}|ImageView value-driven silhouette fill scales with value"
          exclude="${exclude}|DesignFrameView renders"
          exclude="${exclude}|DesignTabGroup renders"
          exclude="${exclude}|DesignStepper renders"
          exclude="${exclude}|DesignStepper with a single option paints nothing"
          exclude="${exclude}|DesignFrameView paints"
          exclude="${exclude}|DesignFrameView tints"
          exclude="${exclude}|DesignFrameView xy_pad puck renders"
          exclude="${exclude}|DesignFrameView slides"
          exclude="${exclude}|DesignFrameView rotates"
          exclude="${exclude}|Subtree cache composites a GPU image on the replay frame"
          ctest --test-dir build-linux-pr-safe --output-on-failure \
            --repeat until-pass:2 -C Release \
            -LE 'validation|slow|performance|bench|quality-lab' \
            -j4 --timeout 120 --exclude-regex "$exclude"
