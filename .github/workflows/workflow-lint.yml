name: Workflow lint

# Layer 1 of the release-watchdog triad (docs/guides/release-watchdog.md):
# catch bad `.github/workflows/*.yml` before merge. Uses agent-agnostic
# tooling (yamllint, actionlint, `python3 -c yaml.safe_load`) so any
# contributor or agent can run the same checks locally.
#
# Motivating incident: an auto-release workflow shipped with Python code at
# column 1 nested inside a YAML `run: |` block whose indent indicator was 10
# spaces. YAML terminated the block scalar at the first less-indented line,
# producing a workflow file GitHub refused to execute. Auto-release runs then
# failed silently with "workflow file issue" and 0 jobs; this lint workflow
# prevents the recurrence class.
#
# Scope: the suites run only when a change touches workflows/actions or one of
# the CI-policy surfaces listed in tools/ci/workflow_lint_paths.txt, which keeps
# the check under a minute on the PRs that don't touch CI. The decision is made
# per event by the `scope` job, for pull requests, merge-queue batches and
# pushes to main alike.

on:
  # No `paths:` filter on any trigger: `workflow-lint` is meant to be a required
  # check, and a required check that never reports holds a pull request on
  # "Expected" forever. merge_group takes no `paths:` filter at all, and the
  # queue batch is the only run that sees two pull requests' workflow changes
  # together: each can pass alone while their combined tree fails. The `scope`
  # job reads tools/ci/workflow_lint_paths.txt instead and the suites run only
  # when the change touches one of those paths; the `workflow-lint` job
  # reports on every run either way.
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this change can affect a workflow-lint suite. A pull
  # request, a queue batch and a push to main are judged by one list
  # (tools/ci/workflow_lint_paths.txt); an unreadable diff runs every suite.
  scope:
    name: workflow-lint scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            tools/ci/workflow_lint_scope.py
            tools/ci/workflow_lint_paths.txt
            tools/ci/release_path_changed.py
          sparse-checkout-cone-mode: false
      - name: Decide whether this change touches a workflow-lint path
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          run="$(python3 tools/ci/workflow_lint_scope.py scope --from-event --repo "$GITHUB_REPOSITORY")"
          echo "Change touches a workflow-lint path: ${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  lint:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: yamllint + actionlint + structural parse
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: yamllint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet yamllint==1.35.1
          # Pulp style: default "relaxed" profile except line-length,
          # which we suppress since GH Actions YAML runs long frequently.
          yamllint --no-warnings -d 'relaxed' .github/workflows/

      - name: Structural YAML parse
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml>=6'
          # Dumb-but-decisive: every workflow file must round-trip
          # through `yaml.safe_load` without raising. Catches block scalars
          # terminated by less-indented content even if yamllint's rules don't
          # flag them.
          python3 - <<'PY'
          import sys, pathlib, yaml
          failures = []
          for wf in sorted(pathlib.Path('.github/workflows').rglob('*.yml')):
              try:
                  yaml.safe_load(wf.read_text())
              except yaml.YAMLError as e:
                  failures.append(f"{wf}: {e}")
          for wf in sorted(pathlib.Path('.github/workflows').rglob('*.yaml')):
              try:
                  yaml.safe_load(wf.read_text())
              except yaml.YAMLError as e:
                  failures.append(f"{wf}: {e}")
          if failures:
              print("\n\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print(f"structural parse OK across {sum(1 for _ in pathlib.Path('.github/workflows').rglob('*.y*ml'))} files")
          PY

      - name: Scheduled-workflow fork guard
        # Every `on: schedule` workflow's entry jobs must carry the fork guard
        # (`github.event_name != 'schedule' || github.repository == '<repo>'`) so
        # a fork's copy doesn't cron-run our monitors and email the fork owner on
        # every failure. The schedule-backstop check keeps the manifest of
        # externally dispatched safety nets consistent with their crons. Both
        # checks also run in gates.sh and the pre-push hook.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml>=6'
          python3 tools/scripts/test_scheduled_workflow_fork_guard_check.py
          python3 tools/scripts/scheduled_workflow_fork_guard_check.py
          # A fork pull request, deleted or not, never gets a variable-selected runner.
          python3 tools/scripts/test_fork_runner_guard_check.py
          python3 tools/scripts/fork_runner_guard_check.py
          python3 tools/scripts/test_resolve_runs_on_fork.py
          python3 tools/scripts/test_schedule_backstop_check.py
          python3 tools/scripts/schedule_backstop_check.py

      - name: Shipyard installer token wiring
        # Every step that runs tools/install-shipyard.sh must pass GITHUB_TOKEN
        # (or SHIPYARD_GITHUB_TOKEN): the upstream installer's release lookup is
        # anonymous otherwise, and shared runner IPs hit the API rate limit.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml>=6'
          python3 tools/scripts/test_install_shipyard_token_check.py
          python3 tools/scripts/install_shipyard_token_check.py

      - name: Linux dependency and Codecov upload contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_install_linux_build_deps.py
          python3 tools/scripts/test_example_validation_paths.py
          python3 tools/scripts/test_ci_throughput_workflows.py
          python3 tools/scripts/test_dispatch_advisory_lanes.py
          python3 tools/scripts/test_verify_control_shipping_native_evidence.py
          python3 tools/scripts/test_control_shipping_native_workflow.py
          python3 tools/scripts/test_codecov_upload_contract.py
          python3 tools/scripts/test_coverage_surface_contract.py

      - name: View-audio archive producer contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml>=6'
          python3 tools/scripts/test_view_audio_archive_manifest.py

      - name: Android pre-merge probe contract
        # `android-build` is push/schedule only, so `android-run-fixtures` is
        # the only Android job a PR runs. Keep its API-floor compile probe and
        # the dependency closure that reaches it from silently going away.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml>=6'
          python3 tools/scripts/test_android_premerge_probe.py

      - name: Workflow lint regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/test_workflow_lint.py
          # workflow-lint reports on every event, merge groups included, and
          # runs its suites only in scope.
          python3 tools/ci/test_workflow_lint_scope.py
          python3 tools/scripts/test_action_pin_lint.py
          python3 tools/scripts/action_pin_lint.py
          python3 tools/scripts/test_shell_portability_check.py
          python3 tools/scripts/shell_portability_check.py tools/ci scripts tools/scripts
          python3 tools/scripts/test_ios_gate_skip_contract.py
          python3 tools/scripts/test_api_contracts_workflow.py
          python3 tools/scripts/test_queue_age_watchdog.py
          python3 tools/scripts/test_unserved_job_check.py
          python3 tools/scripts/test_merge_stall_watchdog.py
          python3 tools/scripts/test_stale_run_reaper.py
          python3 tools/scripts/test_gpu_provenance_ci_wiring.py

      - name: Release-pipeline regression tests (#720, #1962, #2467)
        # Regression coverage for silent CI-pipeline failures:
        #
        #   #720  — assert that release-side ctest invocations keep
        #           skipping the `validation` label so auval failures on
        #           hosted GitHub macOS runners cannot silently break
        #           the sign / notarize / publish pipeline.
        #
        #   #1962 — assert that fetch_skia_for_release.py copes with
        #           both flat AND arch-subdir skia-builder zip layouts.
        #           The chrome/m144 series moved libs under an arch
        #           subdir (e.g. lib/Release/arm64/libskia.a) which the
        #           original script couldn't see — every release after
        #           v0.94.0 silently failed at the Skia fetch step and
        #           no GitHub Release was published.
        #
        #   #2467 — assert build.yml's resolve-provider macOS busy probe
        #           counts only macOS legs actually in_progress on a
        #           local M1. The earlier cut over-counted not-yet-
        #           registered queued runs as local-busy, routed every
        #           macOS leg to github-hosted overflow during deep
        #           queues, and left the local M1s 100% idle.
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/test_release_workflow_test_step.py
          # release-cli, the dry-run and the release-path PR gate package
          # through one script and isolate with one step body.
          python3 tools/scripts/test_release_package_step.py
          # The release-configure gate replays release-cli.yml's
          # build-cli steps by name; a renamed or unclassified step fails here.
          python3 tools/ci/test_release_configure_matrix.py
          # Signing/publishing jobs compile with ccache disabled and re-fetch
          # every dependency into a fresh job root, never a shared host cache.
          python3 tools/scripts/test_release_cache_isolation.py
          # MSVC CLI compile lane: its change scope, the pre-tag check that
          # reads it, and its configure parity with release-cli.yml's
          # Windows legs. The reconciler's circuit/drought rules ride along.
          python3 tools/scripts/test_windows_cli_compile_scope.py
          python3 tools/scripts/test_windows_cli_release_precheck.py
          python3 tools/scripts/test_windows_cli_compile_workflow.py
          python3 tools/scripts/test_release_reconcile.py
          # The incident's root-cause diagnosis, replayed over the recorded
          # v0.955.1 pinned-asset digest-mismatch outage (v0.951.0 negative).
          python3 tools/scripts/test_release_failure_diagnosis.py
          # auto-release.yml's bypass-trailer guard, run as the step body
          # extracted from the workflow: a quoted trailer must not
          # withhold a release tag, a declared one must.
          python3 tools/scripts/test_release_trailer_guard.py
          python3 tools/scripts/test_release_checksum_manifest.py
          python3 tools/scripts/test_release_artifact_contents.py
          # The release packager, including where it looks for the wgpu-native
          # runtime when the job's dependencies live in an isolated root.
          python3 tools/scripts/test_package_cli.py
          # The active_platforms shipping knob: matrix-leg derivation and the
          # subset-staleness allowance that keeps a platform pause temporary.
          python3 tools/scripts/test_release_build_matrix.py
          # Release runner routing: the build map and the smoke map.
          python3 tools/scripts/test_resolve_release_runners.py
          python3 tools/scripts/test_release_platform_subset_check.py
          python3 tools/scripts/test_sdk_provenance.py
          python3 tools/scripts/test_required_gate_liveness.py
          python3 tools/scripts/test_build_workflow.py
          # No build.yml job reachable on push may route to a self-hosted
          # runner. Runs here because the ctest copy skips without PyYAML.
          python3 tools/scripts/test_fork_pr_runner_routing.py
          # Protected-validation receipts: evidence-backed issue and verify.
          python3 tools/scripts/test_protected_merge_receipt.py
          # Advisory report naming files that decide required checks.
          python3 tools/scripts/test_required_check_machinery.py
          python3 tools/scripts/test_visual_python_deps_step.py
          python3 tools/scripts/test_node_build_deps_step.py
          python3 tools/scripts/test_build_fetch_resilience.py
          python3 tools/scripts/test_build_macos_workflow_dispatch.py
          python3 tools/scripts/test_release_breakage_watchdog_wiring.py
          python3 tools/scripts/test_resign_macos_release_tree.py
          python3 tools/scripts/test_workflow_build_dirs.py
          python3 tools/scripts/test_ctest_nonruns.py
          # The interrupted-build sentinel and its Shipyard wiring. `arm`
          # and `clear` are a matched pair split across two stages; a lane
          # that arms without clearing wipes its build dir every run.
          python3 tools/scripts/test_build_dir_sentinel.py
          # Preflight that names configure blockers (stale/overridden Skia
          # cache, uninitialised planning submodule) before cmake reports
          # them late and by symptom.
          python3 tools/scripts/test_checkout_preflight.py
          python3 tools/scripts/test_fetch_skia_for_release.py
          python3 tools/scripts/test_fetch_skia_for_release_extra.py
          python3 tools/scripts/test_download_retry.py
          python3 tools/scripts/test_verify_skia_m153_capabilities.py
          python3 tools/scripts/test_build_skia_source_pin.py
          python3 tools/deps/test_validate_render_update.py
          python3 tools/deps/test_validate_hosts.py
          python3 tools/scripts/test_setup_shared_skia.py
          python3 tools/scripts/test_skia_cross_process_cache.py
          python3 tools/ci/test_pulp_worktree_cache_env.py
          python3 tools/ci/test_pulp_worktree_gc.py
          python3 tools/ci/test_cache_routing_contract.py
          python3 tools/scripts/test_resolve_provider_busy_probe.py
          python3 tools/scripts/test_required_macos_alias.py
          python3 tools/scripts/test_preamble_python_stable_cwd.py
          python3 tools/scripts/test_advisory_macos_runner_policy.py
          python3 tools/scripts/test_resolve_linux_route.py
          # Which macOS lane a pull request takes, and who may approve it.
          python3 tools/ci/test_macos_pr_lane.py
          # A clean merge of main into a full-lane-green head takes the contract lane.
          python3 tools/ci/test_clean_merge_lane.py
          # The macos tier record Shipyard's arm guard reads, decided from job steps.
          python3 tools/ci/test_macos_tier_record.py
          # A pr_number dispatch tests the merge ref and routes Linux like a PR run.
          python3 tools/ci/test_build_pr_dispatch.py
          # A runs-on that interpolates a *_RUNS_ON_JSON variable without
          # fromJSON yields one label no runner carries, so GitHub queues
          # the job forever instead of failing it. Substring guards could
          # not see the two-variable shape these selectors actually use;
          # this one matches parentheses per variable.
          python3 tools/scripts/test_workflow_runner_selector_audit.py
          # Keep the authoritative Windows runtime suite pinned independently
          # from moving latest-toolchain release/coverage/nightly lanes.
          python3 tools/scripts/test_windows_runner_policy.py
          # A new PR push retires the superseded CodeQL analysis; main never cancels.
          python3 tools/scripts/test_codeql_workflow_concurrency.py
          # Proof-branch dispatches run per ref; only main touches the
          # cross-platform tracking issues.
          python3 tools/scripts/test_cross_platform_check_concurrency.py
          # A dispatch-routed Windows job never lands on a macOS or Linux pool.
          python3 tools/scripts/test_windows_runner_selector.py
          # Windows x64 jobs default to the self-hosted lane; hosted is opt-in.
          python3 tools/scripts/test_windows_x64_routing.py
          # Pulp #47 — guard the linux-arm64 Skia manifest entry against
          # silent regressions (parallel to the linux-x64 / mac-arm64
          # entries enforced by tests/test_skia_determinism.py).
          python3 tools/scripts/test_skia_linux_arm64_asset.py
          # chrome/m151 backstop — every release-cli platform marked
          # PULP_REQUIRE_GPU_FOR_SDK=ON must have a Skia release asset in
          # the manifest, or the release leg FATALs and stays a draft.
          python3 tools/scripts/test_release_cli_gpu_asset_coverage.py
          # Tooling-consumed pin mirrors must match the manifest:
          # external/skia-build/VERSION.md's digest table is a fetch
          # cache-skip oracle and DEPENDENCIES.md's versions are the
          # license inventory of record (both Skia and V8).
          python3 tools/scripts/test_check_manifest_mirrors.py
          python3 tools/scripts/check_manifest_mirrors.py

      - name: actionlint
        # Disable shellcheck + pyflakes — the Pulp repo has accumulated
        # ~30 pre-existing shellcheck findings across auto-release.yml,
        # release-cli.yml, android.yml, freshness-check.yml, etc. that
        # pre-date this watchdog and aren't in scope here. Core actionlint
        # still catches YAML block-scalar issues, bad
        # `uses:` refs, missing required keys, and deprecated action
        # versions — which are the failure modes Layer 1 exists to catch.
        # Re-enable shellcheck after those existing findings are retired.
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          matcher: true
          shellcheck: false
          pyflakes: false
          flags: ''

  # The version-bump fast-path suite builds dozens of fixture clones and takes
  # 6-8 minutes on a hosted runner (every other contract here finishes in
  # about two minutes combined). Run on its own clock so it can neither starve
  # the lint job's 10-minute budget nor be cancelled by it.
  generated-version-bump-contract:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: generated version-bump fast-path contract
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Generated version-bump fast-path contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pyyaml>=6'
          python3 tools/scripts/test_generated_version_bump_check.py

  # The check to require. It runs on every event under `if: always()` and
  # passes only when the scope job succeeded and, in scope, every suite job
  # did; out of scope, the skipped suites pass. Its name is the status context.
  workflow-lint:
    name: workflow-lint
    needs: [scope, lint, generated-version-bump-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            tools/ci/workflow_lint_scope.py
            tools/ci/release_path_changed.py
          sparse-checkout-cone-mode: false
      - name: Every in-scope workflow-lint suite passed
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          LINT_RESULT: ${{ needs.lint.result }}
          VERSION_BUMP_RESULT: ${{ needs.generated-version-bump-contract.result }}
        run: |
          set -euo pipefail
          python3 tools/ci/workflow_lint_scope.py verdict --scope-result "$SCOPE_RESULT" --run "$RUN" \
            --job "lint=$LINT_RESULT" --job "generated-version-bump-contract=$VERSION_BUMP_RESULT"
