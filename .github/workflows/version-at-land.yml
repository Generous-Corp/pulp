name: Version-at-Land (single-writer, push)

# RETIRED: see the `on:` block. The header below describes the route it ran.

# Single-writer version assignment on main (T1.1 — see
# planning/2026-07-07-parallel-merge-land-coordination.md and
# docs/guides/version-at-land-cutover.md).
#
# LIVE (--push). On every push to main, drain the range since the last
# `Version-Bump-Applied` marker, assign each declared surface its next version
# from main's CURRENT value, commit `chore: bump versions` with a
# `Version-Bump-Applied:` marker (SSH-signed by the release bot), and push
# --ff-only with retry. That bump commit triggers auto-release.yml exactly as a
# hand-bump did before, so tagging + release are unchanged downstream.
#
# The concurrency group serialises runs (cancel-in-progress: false). Per Codex
# review a GitHub concurrency group is a serialiser, not a durable FIFO — so
# apply_and_push STILL recomputes from fresh origin/main and pushes --ff-only +
# retry (a loser re-syncs past the winner's marker and no-ops). Proven in
# tools/scripts/test_version_at_land.py (concurrency + idempotency).

on:
  # RETIRED (2026-10-24): release-please's standing release PRs assign versions
  # now (release-please.yml, docs/guides/versioning.md § Release PR). Every
  # automatic trigger is removed so this workflow opens no bump PR; the job and
  # its concurrency logic stay intact for rollback. Do not dispatch it while
  # release-please is live: both would assign the same versions.
  #
  # Rollback (docs/guides/version-at-land-cutover.md § Rollback): set
  # PULP_RELEASE_PLEASE=off, then restore the triggers below and this file's
  # entry in .github/schedule-backstop.json.
  #
  #   push: { branches: [main] }        # no paths: filter, see git history
  #   schedule: [{ cron: '*/15 * * * *' }]
  #   pull_request: { types: [dequeued] }
  #   workflow_run:
  #     workflows: [Build and Test, Drift fast, Vellum freeze,
  #                 Vellum trusted gate, Versioning & Skill-Sync,
  #                 WebCLAP Cloudflare]
  #     types: [completed]
  #     branches: [release/version-bump]
  workflow_dispatch: {}

concurrency:
  # DIRECT route (default): event-scoped so a scheduled drain is never
  # superseded by pushes (and vice versa). Concurrent push+schedule drains are
  # safe there: apply_and_push is --ff-only + Version-Bump-Applied-marker
  # idempotent + recompute-per-retry, so a loser re-syncs past the winner's
  # marker and no-ops (test_version_at_land.py concurrency proof). No double-bump.
  #
  # PR route (PULP_BUMP_ROUTE=pr): a SINGLE constant group so ALL bumper runs
  # SERIALIZE. The PR-route lands via a shared `release/version-bump` branch +
  # bump PR, and PR-existence vs branch-SHA cannot be read atomically — two
  # concurrent drains have an irreducible race (a PR appearing on an unchanged
  # ref between the no-PR check and a reclaim). Serialization removes the
  # competitor entirely, so that race cannot occur. The direct path's group is
  # left exactly as before, so this changes nothing until the toggle is flipped.
  #
  # Only events whose job actually runs join the serial group. A group holds a
  # single pending run, and a new arrival cancels it, so a `pull_request:
  # dequeued` for any other PR, or a green bump-branch `workflow_run`, used to
  # cancel a pending push drain and then skip its own job. Those events get a
  # per-run group instead, so they never contend. The serial-group condition
  # mirrors the job `if` below; test_version_at_land.py evaluates both against
  # every event shape and fails if they diverge.
  group: >-
    ${{ vars.PULP_BUMP_ROUTE == 'pr'
        && (github.event_name == 'push'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'schedule'
            && github.repository == vars.PULP_PRIMARY_REPO)
          || (github.event_name == 'pull_request'
            && github.event.pull_request.head.ref == 'release/version-bump'
            && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'workflow_run'
            && github.event.workflow_run.head_repository.full_name == github.repository
            && github.event.workflow_run.conclusion != 'success'
            && github.event.workflow_run.conclusion != 'skipped'
            && github.event.workflow_run.conclusion != 'neutral'))
        && 'version-at-land-serial'
        || ((github.event_name == 'pull_request'
            || github.event_name == 'workflow_run'
            || (github.event_name == 'schedule'
              && github.repository != vars.PULP_PRIMARY_REPO))
          && format('version-at-land-idle-{0}', github.run_id)
          || format('version-at-land-{0}', github.event_name)) }}
  cancel-in-progress: false

permissions:
  contents: write  # the single-writer bot pushes the `chore: bump versions` commit
  pull-requests: write  # the PR-route (PULP_BUMP_ROUTE=pr) opens + auto-merges a bump PR

jobs:
  drain-dry-run:
    if: >-
      (github.event_name != 'schedule'
        || github.repository == vars.PULP_PRIMARY_REPO)
      && (github.event_name != 'pull_request'
        || (vars.PULP_BUMP_ROUTE == 'pr'
          && github.event.pull_request.head.ref == 'release/version-bump'
          && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name != 'workflow_run'
        || (vars.PULP_BUMP_ROUTE == 'pr'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.conclusion != 'success'
          && github.event.workflow_run.conclusion != 'skipped'
          && github.event.workflow_run.conclusion != 'neutral'))
    runs-on: ubuntu-latest
    # The release secrets live in the release-bot environment (deployments
    # from main only).
    environment: release-bot
    steps:
      - name: Require the release-bot environment's secrets
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_BOT_SSH_SIGNING_KEY: ${{ secrets.RELEASE_BOT_SSH_SIGNING_KEY }}
        run: |
          missing=""
          for name in RELEASE_BOT_TOKEN RELEASE_BOT_SSH_SIGNING_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::release-bot environment secrets missing:$missing. Create the" \
                 "release-bot environment (deployment branches: main only) and add the" \
                 "release secrets to it before removing the repository-level copies."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0  # need history to find the last applied marker
          persist-credentials: true
          # RELEASE_BOT_TOKEN if present so the pushed commit re-triggers CI
          # checks gated to non-GITHUB_TOKEN pushes; GITHUB_TOKEN for bootstrap.
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure release bot SSH signing
        shell: bash
        env:
          RELEASE_BOT_SSH_SIGNING_KEY: ${{ secrets.RELEASE_BOT_SSH_SIGNING_KEY }}
        run: bash tools/scripts/configure_release_bot_ssh_signing.sh

      - name: Install pinned Shipyard
        # The bump renders CHANGELOG.md with `shipyard changelog regenerate`
        # (a derived regenerator in version_at_land.py). Without the binary the
        # regenerator logs that it could not run and CHANGELOG.md falls behind.
        shell: bash
        env:
          # Authenticates the installer's release lookup; anonymous calls from
          # shared runner IPs hit the 60/hour API limit (HTTP 403).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/install-shipyard.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assign versions (single-writer push)
        # GH_TOKEN authenticates the `gh` CLI the PR-route uses to open + arm the
        # bump PR. RELEASE_BOT_TOKEN (a real user PAT) so the PR + its checks are
        # not GITHUB_TOKEN-suppressed; GITHUB_TOKEN as the direct-route fallback.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
          BUMP_ROUTE: ${{ vars.PULP_BUMP_ROUTE || 'direct' }}
          # Opt-in (default off): replace a stale bump PR that is a dead end
          # (ejected from the merge queue, not armed, or a required check
          # failed). A stale bump PR still able to land is waited for either
          # way, and that wait exits 0.
          HEAL_STALE_PR: ${{ vars.PULP_BUMP_HEAL_STALE_PR || 'false' }}
        run: |
          # The PR-route MUST use a real PAT: a PR opened by GITHUB_TOKEN does
          # not trigger workflows (GitHub's loop-prevention), so its required
          # checks never run and auto-merge stalls forever. Fail loudly rather
          # than open a bump PR that can never merge.
          if [ "$BUMP_ROUTE" = "pr" ] && [ "$HAS_RELEASE_PAT" != "true" ]; then
            echo "::error::PULP_BUMP_ROUTE=pr requires the RELEASE_BOT_TOKEN PAT" \
                 "(GITHUB_TOKEN-created PRs do not trigger checks). Aborting."
            exit 1
          fi
          # --push recomputes from a fresh origin/main, prefers the
          # `Version-Bump-Applied` marker, and lands `chore: bump versions`.
          # --route selects HOW it lands (repo variable PULP_BUMP_ROUTE; unset ⇒
          # direct ⇒ today's --ff-only push, no behavior change):
          #   direct — push --ff-only straight to main (incompatible with a
          #            "Require merge queue" rule).
          #   pr     — open a bump PR + auto-merge (--merge) it (routes through
          #            the merge queue when enabled; a normal auto-merge PR when
          #            not).
          # --base is only the first-run FALLBACK before any marker exists;
          # `github.event.before` bounds it to this push.
          heal=()
          if [ "$BUMP_ROUTE" = "pr" ] && [ "$HEAL_STALE_PR" = "true" ]; then
            heal=(--heal-stale-pr)
          fi
          python3 tools/scripts/version_at_land.py --push \
              --route "$BUMP_ROUTE" "${heal[@]}" \
              --base "${{ github.event.before }}"
