name: Weekly ejected-but-not-selected report

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:
    inputs:
      selection_file:
        description: Optional JSON PR-head selector receipt; scheduled runs compute one
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Compute or validate selector receipt
        env:
          PULP_GH_CLI: gh
          GH_TOKEN: ${{ github.token }}
          INPUT_SELECTION_FILE: ${{ inputs.selection_file }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == schedule ]]; then
            python3 tools/scripts/weekly_pr_head_selection.py \
              --repo "${{ github.repository }}" --output "$RUNNER_TEMP/selection.json"
          else
            test -n "$INPUT_SELECTION_FILE" || {
              echo 'workflow_dispatch requires selection_file' >&2
              exit 2
            }
            cp "$INPUT_SELECTION_FILE" "$RUNNER_TEMP/selection.json"
          fi
      - name: Download merge-group history and render report
        env:
          PULP_GH_CLI: gh
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/scripts/queue_batch_attribute.py \
            --history --since 7d --format json \
            --ejected-not-selected --selection-file "$RUNNER_TEMP/selection.json" \
            > "$RUNNER_TEMP/ejected-not-selected.json"
          cat "$RUNNER_TEMP/ejected-not-selected.json" >> "$GITHUB_STEP_SUMMARY"
