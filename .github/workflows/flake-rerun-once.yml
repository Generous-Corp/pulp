name: Flake rerun once

on:
  workflow_run:
    workflows: ["Sanitizer Tests"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  decide:
    # workflow_run runs this file from the default branch. The additional
    # guards keep the observer read-only for non-failing or non-PR runs.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Decide and optionally request one failed-job rerun
        env:
          PULP_GH_CLI: gh
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --run-id "${{ github.event.workflow_run.id }}")
          if [ "${{ vars.PULP_FLAKE_RERUN_ONCE }}" = "1" ]; then
            args+=(--enabled)
          fi
          python3 tools/ci/flake_rerun_once.py "${args[@]}"
