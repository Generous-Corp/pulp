name: Release platform subset check

# Companion to release_product_matrix.json's `active_platforms` knob: a
# release may temporarily ship a subset of the platform inventory (e.g.
# darwin-arm64 only), but the standing decision is that the subset must not
# outlive a week. The documented failure mode of every temporary CI change is
# that nobody flips it back — so the reminder is enforced here, not
# remembered. Daily sweep: while `active_platforms` is a strict subset of
# `platforms`, tools/scripts/release_platform_subset_check.py dates the
# current subset streak from git history; once it exceeds the allowance the
# sweep opens (or updates) a tracking issue naming the paused platforms.
# Restoring the full set closes the tracker automatically on the next sweep.
#
# Extra weight while darwin-x64 is paused: docs/guides/intel-support.md
# records Intel as a required release platform after a real
# missed-artifact incident, so an Intel regression can land unnoticed for
# exactly as long as this subset stands. That tradeoff is deliberate and
# time-boxed — this workflow is the box.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Days a platform subset may stand before the sweep flags it'
        required: false
        default: '7'
      dry_run:
        description: 'Log findings but do not touch the tracking issue'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

concurrency:
  group: release-platform-subset-check
  cancel-in-progress: false

env:
  TRACKING_TITLE: 'Release platforms paused past their allowance (active_platforms subset)'

jobs:
  check:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    name: Check platform-subset allowance

    env:
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The streak is dated from the matrix file's git history.
          fetch-depth: 0

      - name: Evaluate subset age
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 tools/scripts/release_platform_subset_check.py \
            --max-age-days "${MAX_AGE_DAYS}" \
            --github-output | tee scan.out || rc=$?
          grep -E '^(overdue|missing|since|age_days)=' scan.out >> "$GITHUB_OUTPUT" || true
          # Exit 2 = cannot evaluate — that is this workflow's own failure,
          # not a finding.
          if [ "$rc" -eq 2 ]; then exit 2; fi

      - name: Maintain tracking issue
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OVERDUE: ${{ steps.scan.outputs.overdue }}
          MISSING: ${{ steps.scan.outputs.missing }}
          SINCE: ${{ steps.scan.outputs.since }}
          AGE_DAYS: ${{ steps.scan.outputs.age_days }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          title="${TRACKING_TITLE}"

          existing_json=$(
              gh issue list \
                  --repo "$repo" \
                  --state all \
                  --search "in:title \"${title}\"" \
                  --json number,title,state \
                  --jq "[.[] | select(.title == \"${title}\")] | first // {}"
          )
          existing=$(echo "$existing_json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('number','') or '')")
          existing_state=$(echo "$existing_json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state','') or '')")

          if [ "${OVERDUE:-false}" != "true" ]; then
              if [ -n "${existing:-}" ] && [ "$existing_state" = "OPEN" ]; then
                  echo "Subset within allowance (or full set restored) — closing #${existing}."
                  gh issue comment "$existing" --repo "$repo" \
                      --body "Sweep on $(date -u +%Y-%m-%d\ %H:%M) found active_platforms back within its allowance. Closing."
                  gh issue close "$existing" --repo "$repo" --reason completed
              else
                  echo "Nothing overdue and no open tracker — nothing to do."
              fi
              exit 0
          fi

          {
            echo "_Auto-generated by \`.github/workflows/release-platform-subset-check.yml\` on $(date -u '+%Y-%m-%d %H:%M UTC')._"
            echo
            echo "**Allowance exceeded:** \`release_product_matrix.json\`'s \`active_platforms\`"
            echo "has been a strict subset of the platform inventory since ${SINCE}"
            echo "(${AGE_DAYS} days; allowance ${MAX_AGE_DAYS} days)."
            echo
            echo "**Platforms not shipping:** ${MISSING}"
            echo
            echo "Every release in this window published without those platforms' binaries,"
            echo "and their release-cli legs did not compile — a regression there lands"
            echo "unnoticed (darwin-x64 in particular is documented as required by"
            echo "docs/guides/intel-support.md)."
            echo
            echo "**Resolution:** restore platforms in tools/scripts/release_product_matrix.json —"
            echo "delete \`active_platforms\` to ship everything, or add platforms back"
            echo "piecemeal. If the pause is being deliberately renewed, say so here and"
            echo "keep the issue open as the standing record. This tracker closes"
            echo "automatically once the sweep finds the subset resolved."
          } > body.md

          if [ -z "${existing:-}" ]; then
              echo "Creating tracking issue."
              gh issue create --repo "$repo" --title "$title" --body-file body.md --label ci 2>&1 || \
                  gh issue create --repo "$repo" --title "$title" --body-file body.md
          else
              echo "Updating tracking issue #${existing}."
              gh issue edit "$existing" --repo "$repo" --body-file body.md
              if [ "$existing_state" != "OPEN" ]; then
                  gh issue reopen "$existing" --repo "$repo"
              fi
          fi
