name: Shipyard merge steward

# Single logical, model-free PR-landing controller. This proof stage remains
# workflow_dispatch-only and dry-run by default. Every exception is mirrored
# into one durable GitHub issue before a failing tick exits.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply exact-head queue/recovery mutations'
        required: true
        default: false
        type: boolean
      dispatch_recovery:
        description: 'Dispatch at most one fenced recovery triage assignment'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: shipyard-merge-steward-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == vars.PULP_PRIMARY_REPO && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEWARD_LEDGER: ${{ github.workspace }}/.shipyard-steward/ledger.json

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Mint repository-scoped Shipyard App token
        id: shipyard-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-actions: write
          # Queue enrollment requires repository write access in addition to
          # the dedicated merge-queue permission.
          permission-contents: write
          permission-issues: write
          permission-merge-queues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Install pinned Shipyard
        id: install
        run: |
          ./tools/install-shipyard.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Actions caches are recoverable evidence, not a durable transactional
      # store. Keep this first pilot to exact-head queue enrollment and bounded
      # cleanup of workflow runs whose heads are provably no longer current.
      # Those GitHub mutations are revalidated, externally observable, and
      # idempotent. Durable remote ledger storage is required before enabling
      # reruns or capacity preemption.
      - name: Restore steward evidence ledger
        uses: actions/cache/restore@v4
        with:
          path: .shipyard-steward/ledger.json
          key: shipyard-merge-steward-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shipyard-merge-steward-v1-

      - name: Configure ephemeral controller authority
        id: configure
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/shipyard" "$(dirname "$STEWARD_LEDGER")"
          printf '%s\n' '[merge_queue]' 'mutation_machine = "github-actions"' \
            > "$HOME/.config/shipyard/config.toml"
          shipyard runner tag --set github-actions
          shipyard merge-queue status --json | tee authority.json
          python3 - <<'PY'
          import json
          status = json.load(open("authority.json", encoding="utf-8"))
          assert status["authority_configured"] is True
          assert status["authority_matches"] is True
          assert status["machine"] == "github-actions"
          assert status["mutation_machine"] == "github-actions"
          PY

      - name: Collect current merge queue and workflow runs
        id: merge_group_cleanup_census
        if: always() && steps.configure.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY#*/}
          # GraphQL variables are literal in the single-quoted query.
          # shellcheck disable=SC2016
          gh api graphql \
            -F owner="$owner" \
            -F name="$name" \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){mergeQueue(branch:"main"){entries(first:100){nodes{headCommit{oid}}}}}}' \
            > merge-queue.json
          {
            for status in in_progress pending queued requested waiting; do
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs?event=merge_group&status=${status}&per_page=100" \
                --jq '.workflow_runs[]'
            done
          } | jq -s 'unique_by(.id)' > merge-group-runs.json

      - name: Plan bounded stale merge-group cleanup
        id: merge_group_cleanup_plan
        if: always() && steps.merge_group_cleanup_census.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/shipyard_merge_queue_run_cleanup.py \
            --queue merge-queue.json \
            --runs merge-group-runs.json \
            --limit 20 \
            --output merge-group-cleanup-plan.json
          jq . merge-group-cleanup-plan.json

      - name: Cancel bounded stale merge-group runs
        id: merge_group_cleanup_apply
        if: inputs.apply && steps.merge_group_cleanup_plan.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY#*/}
          jq -c '.candidates[]' merge-group-cleanup-plan.json |
          while IFS= read -r candidate; do
            run_id=$(jq -r '.run_id' <<<"$candidate")
            head=$(jq -r '.head_sha' <<<"$candidate")

            # Revalidate the complete current queue immediately before each
            # cancellation. A rebuilt head that is current again is preserved.
            # GraphQL variables are literal in the single-quoted query.
            # shellcheck disable=SC2016
            gh api graphql \
              -F owner="$owner" \
              -F name="$name" \
              -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){mergeQueue(branch:"main"){entries(first:100){nodes{headCommit{oid}}}}}}' \
              > "$RUNNER_TEMP/live-merge-queue.json"
            if jq -e --arg head "$head" \
              '[.data.repository.mergeQueue.entries.nodes[].headCommit.oid // empty] | index($head) != null' \
              "$RUNNER_TEMP/live-merge-queue.json" >/dev/null; then
              echo "preserving run ${run_id}: head ${head} is current again"
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "$RUNNER_TEMP/merge-group-run.json"
            jq -e \
              --argjson run_id "$run_id" \
              --arg head "$head" \
              '.id == $run_id and .event == "merge_group" and .head_sha == $head' \
              "$RUNNER_TEMP/merge-group-run.json" >/dev/null
            status=$(jq -r '.status' "$RUNNER_TEMP/merge-group-run.json")
            if [ "$status" = completed ]; then
              echo "preserving run ${run_id}: already completed"
              continue
            fi
            case "$status" in
              in_progress|pending|queued|requested|waiting) ;;
              *) echo "refusing unexpected run status: $status" >&2; exit 1 ;;
            esac
            if ! gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"; then
              status=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '.status')
              [ "$status" = completed ] || exit 1
            fi
          done

      - name: Collect open PR heads and pull-request workflow runs
        id: pull_request_cleanup_census
        if: always() && steps.configure.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            | jq '[.[][]]' \
            > pull-request-open-heads.json
          {
            for status in in_progress pending queued requested waiting; do
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&status=${status}&per_page=100" \
                --jq '.workflow_runs[]'
            done
          } | jq -s 'unique_by(.id)' > pull-request-runs.json

      - name: Plan bounded superseded pull-request cleanup
        id: pull_request_cleanup_plan
        if: always() && steps.pull_request_cleanup_census.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/shipyard_pull_request_run_cleanup.py \
            --pulls pull-request-open-heads.json \
            --runs pull-request-runs.json \
            --limit 20 \
            --output pull-request-cleanup-plan.json
          jq . pull-request-cleanup-plan.json

      - name: Plan truthful provenance sentinel labels
        id: provenance_label_plan
        if: always() && steps.pull_request_cleanup_census.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/shipyard_provenance_label_plan.py \
            --pulls pull-request-open-heads.json \
            --output provenance-label-plan.json
          jq . provenance-label-plan.json

      - name: Converge truthful provenance sentinel labels
        id: provenance_label_apply
        if: inputs.apply && steps.provenance_label_plan.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          label='shipyard:provenance-missing'
          if jq -e 'any(.candidates[]; .mutation == "add")' \
            provenance-label-plan.json >/dev/null; then
            gh label create "$label" \
              --repo "$GITHUB_REPOSITORY" \
              --color D93F0B \
              --description 'Open PR has no agent, machine, route, or ownership provenance yet' \
              --force
          fi
          jq -c '.candidates[]' provenance-label-plan.json |
          while IFS= read -r candidate; do
            pr=$(jq -r '.number' <<<"$candidate")
            head=$(jq -r '.expected_head' <<<"$candidate")
            mutation=$(jq -r '.mutation' <<<"$candidate")
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
              > "$RUNNER_TEMP/provenance-pull-${pr}.json"
            jq -e --arg head "$head" \
              '.state == "open" and .head.sha == $head' \
              "$RUNNER_TEMP/provenance-pull-${pr}.json" >/dev/null
            mapfile -t labels < <(jq -r '.labels[].name' \
              "$RUNNER_TEMP/provenance-pull-${pr}.json")
            if [ "$mutation" = add ]; then
              # A concurrently added real label wins; never overwrite it.
              [ "${#labels[@]}" -eq 0 ] || continue
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" \
                --input - <<<"$(jq -n --arg label "$label" '{labels:[$label]}')"
            elif [ "$mutation" = remove ]; then
              printf '%s\n' "${labels[@]}" | grep -Fx "$label" >/dev/null || continue
              [ "${#labels[@]}" -gt 1 ] || continue
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels/shipyard%3Aprovenance-missing"
            else
              echo "refusing unexpected provenance mutation: $mutation" >&2
              exit 1
            fi
          done

      - name: Cancel bounded superseded pull-request runs
        id: pull_request_cleanup_apply
        if: inputs.apply && steps.pull_request_cleanup_plan.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -c '.candidates[]' pull-request-cleanup-plan.json |
          while IFS= read -r candidate; do
            run_id=$(jq -r '.run_id' <<<"$candidate")
            head=$(jq -r '.head_sha' <<<"$candidate")

            # Re-read every open PR immediately before cancellation. A head
            # that became current again, including on a different PR, wins.
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              > "$RUNNER_TEMP/live-open-pr-pages.json"
            if jq -e --arg head "$head" \
              '[.[][] | .head.sha] | index($head) != null' \
              "$RUNNER_TEMP/live-open-pr-pages.json" >/dev/null; then
              echo "preserving run ${run_id}: PR head ${head} is current again"
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "$RUNNER_TEMP/pull-request-run.json"
            jq -e \
              --argjson run_id "$run_id" \
              --arg head "$head" \
              '.id == $run_id and .event == "pull_request" and .head_sha == $head' \
              "$RUNNER_TEMP/pull-request-run.json" >/dev/null
            status=$(jq -r '.status' "$RUNNER_TEMP/pull-request-run.json")
            if [ "$status" = completed ]; then
              echo "preserving run ${run_id}: already completed"
              continue
            fi
            case "$status" in
              in_progress|pending|queued|requested|waiting) ;;
              *) echo "refusing unexpected run status: $status" >&2; exit 1 ;;
            esac
            if ! gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"; then
              status=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '.status')
              [ "$status" = completed ] || exit 1
            fi
          done

      - name: Reconcile managed PRs
        id: reconcile
        if: always() && steps.install.outcome == 'success' && steps.configure.outcome == 'success'
        shell: bash
        env:
          APPLY: ${{ inputs.apply }}
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          args=(
            runner steward
            --repo "${GITHUB_REPOSITORY}"
            --base main
            --ledger "$STEWARD_LEDGER"
            --max-transient-reruns 0
            --no-coalesce
            --no-preempt-capacity
            --json
          )
          if [ "$APPLY" = true ]; then
            args+=(--apply)
          fi
          set +e
          shipyard "${args[@]}" | tee steward-report.json
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Collect open PR facts
        id: pull_facts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > open-prs.json; then
            printf '%s\n' '[]' > open-prs.json
            exit 1
          fi

      - name: Render durable PR exception outbox
        id: outbox
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s steward-report.json ]; then
            python3 - <<'PY'
          import json, os
          payload = {
              "repos": [{
                  "repo": os.environ["GITHUB_REPOSITORY"],
                  "prs": [],
                  "errors": ["steward produced no structured report"],
              }]
          }
          with open("steward-report.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          fi
          [ -s open-prs.json ] || printf '%s\n' '[]' > open-prs.json
          python3 tools/scripts/shipyard_steward_outbox.py \
            --report steward-report.json \
            --pulls open-prs.json \
            --body steward-outbox.md \
            --state steward-outbox.json

      - name: Collect exact-head recovery status facts
        id: recovery_statuses
        if: always() && steps.pull_facts.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          pages = json.load(open("open-prs.json", encoding="utf-8"))
          pulls = [pull for page in pages for pull in (page if isinstance(page, list) else [page])]
          rows = []
          for pull in pulls:
              head = str((pull.get("head") or {}).get("sha") or "").lower()
              if len(head) != 40:
                  continue
              result = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{head}/statuses?per_page=100"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              pages = json.loads(result.stdout)
              rows.append({"head_sha": head, "statuses": [status for page in pages for status in page]})
          with open("recovery-statuses.json", "w", encoding="utf-8") as handle:
              json.dump(rows, handle)
          PY

      - name: Plan deduplicated recovery assignments
        id: recovery_plan
        if: always() && steps.recovery_statuses.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/shipyard_recovery_dispatch.py \
            --report steward-report.json \
            --statuses recovery-statuses.json \
            --epoch "$GITHUB_RUN_ID" \
            --output recovery-plan.json

      - name: Dispatch one fenced recovery assignment
        id: recovery_dispatch
        if: inputs.apply && inputs.dispatch_recovery && steps.recovery_plan.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          candidate=$(jq -c '.candidates[0] // empty' recovery-plan.json)
          [ -n "$candidate" ] || exit 0
          pr=$(jq -r '.pr_number' <<<"$candidate")
          head=$(jq -r '.expected_head' <<<"$candidate")
          epoch=$(jq -r '.assignment_epoch' <<<"$candidate")
          attempt=$(jq -r '.dispatch_attempt' <<<"$candidate")
          fingerprint=$(jq -r '.fingerprint' <<<"$candidate")
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if recovery_url=$(gh workflow run shipyard-recovery-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$pr" \
            -f expected_head="$head" \
            -f assignment_epoch="$epoch" \
            -f dispatch_attempt="$attempt" \
            -f blocker_fingerprint="$fingerprint" \
            -f publish_status=true \
            -f attempt_repair=true); then
            if [[ "$recovery_url" =~ ^https://github.com/${GITHUB_REPOSITORY}/actions/runs/[1-9][0-9]*$ ]]; then
              run_id=${recovery_url##*/}
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" \
                -f state=pending \
                -f context='shipyard/recovery-dispatch' \
                -f description="queued attempt=${attempt} epoch=${epoch} worker=pool fingerprint=${fingerprint}" \
                -f target_url="$recovery_url"; then
                exit 0
              fi
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              echo "cancelled untracked recovery run ${run_id}" >&2
            fi
            echo "workflow dispatch returned no exact run URL" >&2
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" \
            -f state=error \
            -f context='shipyard/recovery-dispatch' \
            -f description="dispatch_failed attempt=${attempt} epoch=${epoch} worker=pool fingerprint=${fingerprint}" \
            -f target_url="$target_url"
          exit 1

      - name: Preserve outbox renderer failure
        if: always() && steps.outbox.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > steward-outbox.md <<EOF
          <!-- shipyard-steward-outbox:v1 -->
          # [Shipyard steward] Pulp PR exception outbox

          The model-free controller could not render its structured exception census.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Exact controller revision: ${GITHUB_SHA}
          - Next action: repair the controller before trusting PR landing automation.
          EOF
          printf '%s\n' \
            '{"schema_version":1,"issue_title":"[Shipyard steward] Pulp PR exception outbox","exception_count":1,"pr_exception_count":0,"control_plane_error_count":1}' \
            > steward-outbox.json

      - name: Sync durable GitHub exception issue
        id: sync_outbox
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          label='shipyard:steward-outbox'
          gh label create "$label" \
            --repo "$GITHUB_REPOSITORY" \
            --color 5319E7 \
            --description 'Model-free Shipyard PR exception census' \
            --force
          issue=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --label "$label" \
            --limit 100 \
            --json number,state,title \
            --jq 'map(select(.title == "[Shipyard steward] Pulp PR exception outbox")) | sort_by(.number) | .[0].number // empty')
          count=$(jq -r '.exception_count' steward-outbox.json)
          title=$(jq -r '.issue_title' steward-outbox.json)
          if [ -z "$issue" ] && [ "$count" -gt 0 ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "$label" \
              --body-file steward-outbox.md
          elif [ -n "$issue" ]; then
            gh issue edit "$issue" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file steward-outbox.md
            state=$(gh issue view "$issue" \
              --repo "$GITHUB_REPOSITORY" \
              --json state \
              --jq '.state')
            if [ "$count" -gt 0 ] && [ "$state" = CLOSED ]; then
              gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY"
            elif [ "$count" -eq 0 ] && [ "$state" = OPEN ]; then
              gh issue close "$issue" \
                --repo "$GITHUB_REPOSITORY" \
                --comment 'Shipyard reconciled the exception count to zero.'
            fi
          fi

      - name: Save steward evidence ledger
        if: always() && hashFiles('.shipyard-steward/ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .shipyard-steward/ledger.json
          key: shipyard-merge-steward-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-merge-steward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            authority.json
            steward-report.json
            steward-outbox.md
            steward-outbox.json
            open-prs.json
            recovery-statuses.json
            recovery-plan.json
            merge-queue.json
            merge-group-runs.json
            merge-group-cleanup-plan.json
            pull-request-open-heads.json
            pull-request-runs.json
            pull-request-cleanup-plan.json
            provenance-label-plan.json
            .shipyard-steward/ledger.json
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve unhealthy controller result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.install.outcome }}" = success ]
          [ "${{ steps.configure.outcome }}" = success ]
          [ "${{ steps.merge_group_cleanup_census.outcome }}" = success ]
          [ "${{ steps.merge_group_cleanup_plan.outcome }}" = success ]
          [ "${{ steps.pull_request_cleanup_census.outcome }}" = success ]
          [ "${{ steps.pull_request_cleanup_plan.outcome }}" = success ]
          [ "${{ steps.provenance_label_plan.outcome }}" = success ]
          if [ "${{ inputs.apply }}" = true ]; then
            [ "${{ steps.merge_group_cleanup_apply.outcome }}" = success ]
            [ "${{ steps.pull_request_cleanup_apply.outcome }}" = success ]
            [ "${{ steps.provenance_label_apply.outcome }}" = success ]
          fi
          [ "${{ steps.pull_facts.outcome }}" = success ]
          [ "${{ steps.outbox.outcome }}" = success ]
          [ "${{ steps.sync_outbox.outcome }}" = success ]
          [ "${{ steps.recovery_statuses.outcome }}" = success ]
          [ "${{ steps.recovery_plan.outcome }}" = success ]
          if [ "${{ inputs.apply }}" = true ] && [ "${{ inputs.dispatch_recovery }}" = true ]; then
            [ "${{ steps.recovery_dispatch.outcome }}" = success ]
          fi
          [ "${{ steps.reconcile.outputs.exit_code }}" = 0 ]
