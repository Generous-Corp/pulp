name: Shipyard merge steward

# Keep the native merge queue supplied by the existing exact-head steward.
# Scheduled runs apply only the governed steward path; manual dispatch remains
# dry-run by default. Review dispatch, repair, rebase, and direct merge remain
# outside this feeder.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply exact-head steward mutations'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: shipyard-merge-steward-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == vars.PULP_PRIMARY_REPO && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Mint repository-scoped Shipyard App token
        id: shipyard-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SHIPYARD_APP_ID }}
          private-key: ${{ secrets.SHIPYARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-merge-queues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Install pinned Shipyard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./tools/install-shipyard.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure queue mutation authority
        id: configure
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/shipyard" "$RUNNER_TEMP/steward"
          printf '%s\n' '[merge_queue]' 'mutation_machine = "github-actions"' \
            > "$HOME/.config/shipyard/config.toml"
          shipyard runner tag --set github-actions
          shipyard merge-queue status --json | tee "$RUNNER_TEMP/steward/authority.json"
          python3 - "$RUNNER_TEMP/steward/authority.json" <<'PY'
          import json
          import sys
          status = json.load(open(sys.argv[1], encoding="utf-8"))
          assert status["authority_configured"] is True
          assert status["authority_matches"] is True
          assert status["machine"] == "github-actions"
          assert status["mutation_machine"] == "github-actions"
          PY

      - name: Audit exact-head review gates before mutation
        id: review_gate
        if: steps.configure.outcome == 'success' && (github.event_name == 'schedule' || inputs.apply)
        env:
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The steward remains the sole mutation planner. This read-only pass
          # independently proves every planned arm candidate is allowed at its
          # current head before the apply pass can mutate GitHub state.
          shipyard runner steward --repo "$GITHUB_REPOSITORY" --base main --arm-unqueued --json \
            > "$RUNNER_TEMP/steward/audit.json"
          jq -c '.repos[].prs[] | select(.mutation != null) | {number,head_sha}' \
            "$RUNNER_TEMP/steward/audit.json" > "$RUNNER_TEMP/steward/review-candidates.jsonl"
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            pr=$(jq -r '.number' <<<"$candidate")
            head=$(jq -r '.head_sha' <<<"$candidate")
            verdict=$(shipyard review-verdict --repo "$GITHUB_REPOSITORY" --pr "$pr" --head "$head" --json)
            jq -e '.verdict.verdict == "allowed"' <<<"$verdict" >/dev/null || {
              echo "refusing mutation: PR $pr head $head lacks an allowed exact-head review" >&2
              exit 1
            }
          done < "$RUNNER_TEMP/steward/review-candidates.jsonl"

      - name: Reconcile and feed the native queue
        id: reconcile
        if: steps.configure.outcome == 'success'
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          GH_TOKEN: ${{ steps.shipyard-app-token.outputs.token }}
        run: |
          set -euo pipefail
          args=(runner steward --repo "$GITHUB_REPOSITORY" --base main --arm-unqueued --json)
          if [ "$APPLY" = true ]; then
            args+=(--apply)
          fi
          shipyard "${args[@]}" | tee "$RUNNER_TEMP/steward/report.json"

      - name: Publish feeder evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shipyard-merge-steward-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steward
          retention-days: 14
          if-no-files-found: warn
