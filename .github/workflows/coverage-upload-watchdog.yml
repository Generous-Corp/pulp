name: Coverage upload watchdog
# Processed-receipt invariant: "main should have a completed Coverage workflow
# with exact current-attempt receipts for every reliable producer that
# Codecov processed for the same SHA within the last N hours." Codecov's dashboard silently degrades when
# fresh complete uploads stop arriving — and there was no alarm for it (the
# release pipeline has cadence/stuck/cli watchdogs; coverage had none). This
# fires on the *symptom* (no recent coverage that actually uploaded), regardless
# of cause:
#   - coverage runs cancelled before upload (stale-run-reaper under a CI
#     throttle — the 2026-06-28 incident: 8 consecutive main coverage runs
#     cancelled, Codecov surface shrank, nothing screamed),
#   - the instrumented suite hitting coverage.yml's internal time budget on a
#     real OS leg, which now drops its report and skips upload NON-FATALLY (so
#     the run concludes `success` with no C++ upload). A conclusion==success
#     proxy alone would be blinded by this, so this watchdog requires the
#     required producer receipt artifacts emitted only after the shared Codecov
#     action completes successfully. The check uses the actions API and needs
#     no Codecov token.
#   - Codecov `after_n_builds` waiting forever on a missing per-OS leg.
#
# This watchdog proves receipt transport, exact-SHA Codecov processing, and the
# distance from current main to that processed coverage watermark. It does not
# interpret the resulting coverage percentage. It complements verify_cobertura_xml.py (per-leg,
# lines-valid>0, pre-upload)
# and test_codecov_components.py / test_codecov_config.py (config mapping,
# PR-gate). Together they form the same layered shape as the release watchdogs
# (docs/guides/release-watchdog.md).
#
# Auto-closes when a fresh exact receipt set lands on main.

on:
  schedule:
    - cron: '17 * * * *'  # hourly; a healthy Coverage run takes ~1h
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Hours since the last complete exact-attempt Codecov receipt set before flagging'
        required: false
        default: '14'
      dry_run:
        description: 'Log findings but do not touch the tracking issue'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: coverage-upload-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          lfs: false
      - name: Scan main for a recent successful Coverage run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Coverage refreshes every 8h and can run for several hours. Keep the
          # alarm beyond one healthy cadence while still paging within a day.
          MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '14' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MARKER: '<!-- coverage-upload-watchdog -->'
          TITLE: 'Coverage uploads stalled — main has no recent successful Coverage run'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # printf format strings are intentionally
          # single-quoted; values are passed as positional %s args below.

          # Newest Coverage runs on main. Workflow conclusion is not the
          # freshness authority: an advisory side job can fail after all
          # required Codecov uploads completed. Exact receipts are authoritative.
          now_epoch="$(date -u +%s)"
          # Include the full freshness horizon plus the maximum self-hosted
          # queue/runtime cushion, and paginate so main churn cannot displace a
          # still-fresh scheduled run from an arbitrary first-page limit.
          scan_cutoff_epoch=$(( now_epoch - (MAX_AGE_HOURS + 30) * 3600 ))
          scan_cutoff="$(date -u -r "${scan_cutoff_epoch}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@${scan_cutoff_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          runs_json="$(gh api -X GET --paginate --slurp \
            "repos/${REPO}/actions/workflows/coverage.yml/runs" \
            -f branch=main -f per_page=100 -f created=">=${scan_cutoff}" \
            | jq -c '[.[].workflow_runs[] | {id, run_attempt, head_sha, status, conclusion, created_at, updated_at, html_url}]')"

          # The shared upload action emits a receipt only after the Codecov
          # action completes successfully. Main coverage is complete enough to
          # count as fresh only when both required native dashboard axes,
          # Linux, macOS, Python, Swift, Android, and React must each produce an
          # exact non-expired receipt for this run's SHA. Windows is still
          # discovered and reported, but remains best-effort while its bounded
          # instrumented suite can legitimately exceed the 210-minute cap.
          # This watchdog remains advisory; completeness cannot block a merge.
          completed_ids="$(printf '%s' "$runs_json" \
            | jq -r '[.[] | select(.status=="completed")] | sort_by(.updated_at) | reverse | .[].id')"
          last_success_at=""
          last_success_sha=""
          last_success_run=""
          scan_incomplete=0
          for rid in ${completed_ids}; do
            head_sha="$(printf '%s' "$runs_json" \
              | jq -r --arg id "${rid}" '.[] | select((.id|tostring)==$id) | .head_sha')"
            if ! jobs="$(gh api -X GET --paginate --slurp \
                "repos/${REPO}/actions/runs/${rid}/jobs" \
                -f filter=all -f per_page=100 2>/dev/null \
                | jq -c '[.[].jobs[] | {name, run_attempt, started_at}]')"; then
              echo "::warning::Could not read jobs for Coverage run ${rid}; freshness is unknown and issue state will not be mutated."
              scan_incomplete=1
              continue
            fi
            linux_attempt="$(printf '%s' "${jobs}" | jq -r '[.[] | select(.name == "Coverage report (Linux, Clang)") | .run_attempt] | max // empty')"
            macos_attempt="$(printf '%s' "${jobs}" | jq -r '[.[] | select(.name == "Coverage report (macOS, Clang)") | .run_attempt] | max // empty')"
            windows_attempt="$(printf '%s' "${jobs}" | jq -r '[.[] | select(.name == "Coverage report (Windows, Clang)") | .run_attempt] | max // empty')"
            android_attempt="$(printf '%s' "${jobs}" | jq -r '[.[] | select(.name == "Coverage report (Android, Kotlin)") | .run_attempt] | max // empty')"
            react_attempt="$(printf '%s' "${jobs}" | jq -r '[.[] | select(.name == "Coverage report (@pulp/react, Vitest)") | .run_attempt] | max // empty')"
            if [ -z "${linux_attempt}" ] || [ -z "${macos_attempt}" ] || [ -z "${windows_attempt}" ] || [ -z "${android_attempt}" ] || [ -z "${react_attempt}" ]; then
              echo "Run ${rid} has no complete producer job-attempt map; not a full coverage refresh."
              continue
            fi
            linux_started_at="$(printf '%s' "${jobs}" | jq -r --argjson attempt "${linux_attempt}" '[.[] | select(.name == "Coverage report (Linux, Clang)" and .run_attempt == $attempt) | .started_at] | min // empty')"
            macos_started_at="$(printf '%s' "${jobs}" | jq -r --argjson attempt "${macos_attempt}" '[.[] | select(.name == "Coverage report (macOS, Clang)" and .run_attempt == $attempt) | .started_at] | min // empty')"
            windows_started_at="$(printf '%s' "${jobs}" | jq -r --argjson attempt "${windows_attempt}" '[.[] | select(.name == "Coverage report (Windows, Clang)" and .run_attempt == $attempt) | .started_at] | min // empty')"
            android_started_at="$(printf '%s' "${jobs}" | jq -r --argjson attempt "${android_attempt}" '[.[] | select(.name == "Coverage report (Android, Kotlin)" and .run_attempt == $attempt) | .started_at] | min // empty')"
            react_started_at="$(printf '%s' "${jobs}" | jq -r --argjson attempt "${react_attempt}" '[.[] | select(.name == "Coverage report (@pulp/react, Vitest)" and .run_attempt == $attempt) | .started_at] | min // empty')"
            if [ -z "${linux_started_at}" ] || [ -z "${macos_started_at}" ] || [ -z "${windows_started_at}" ] || [ -z "${android_started_at}" ] || [ -z "${react_started_at}" ]; then
              echo "Run ${rid} has no start-time boundary for every current producer attempt; not accepting older-attempt uploads."
              continue
            fi
            if ! receipts="$(gh api -X GET --paginate --slurp \
                "repos/${REPO}/actions/runs/${rid}/artifacts" \
                -f per_page=100 2>/dev/null \
                | jq -c '{artifacts: [.[].artifacts[]]}')"; then
              echo "::warning::Could not read artifacts for Coverage run ${rid}; freshness is unknown and issue state will not be mutated."
              scan_incomplete=1
              continue
            fi
            receipt_counts='{}'
            if receipt_counts="$(printf '%s' "${receipts}" | python3 tools/scripts/check_codecov_receipts.py \
                --sha "${head_sha}" --required-axis \
                "linux=${linux_attempt}" "macos=${macos_attempt}" \
                "python-tools=${linux_attempt}" "apple-swift=${macos_attempt}" \
                "android-kotlin=${android_attempt}" "pulp-react=${react_attempt}")"; then
              # A receipt proves that the uploader command returned success; it
              # does not prove Codecov accepted and processed that exact SHA.
              # Consult Codecov's public commit endpoint before treating this
              # candidate as the dashboard freshness authority.
              owner="${REPO%%/*}"
              repo_name="${REPO#*/}"
              codecov_response="${RUNNER_TEMP}/codecov-uploads-${rid}.json"
              codecov_results='[]'
              codecov_page_url="https://api.codecov.io/api/v2/github/${owner}/repos/${repo_name}/commits/${head_sha}/uploads/?page_size=100"
              codecov_page_count=0
              codecov_query_failed=0
              while [ "${codecov_page_url}" != "null" ] && [ -n "${codecov_page_url}" ]; do
                codecov_page_count=$((codecov_page_count + 1))
                if [ "${codecov_page_count}" -gt 20 ]; then
                  echo "::warning::Codecov upload pagination exceeded 20 pages for run ${rid}; freshness is unknown."
                  codecov_query_failed=1
                  break
                fi
                codecov_page="${RUNNER_TEMP}/codecov-uploads-${rid}-${codecov_page_count}.json"
                if ! codecov_http="$(curl --silent --show-error --max-time 30 \
                    --output "${codecov_page}" --write-out '%{http_code}' \
                    "${codecov_page_url}")"; then
                  echo "::warning::Could not query Codecov for Coverage run ${rid}; freshness is unknown."
                  codecov_query_failed=1
                  break
                fi
                if [ "${codecov_http}" = "404" ]; then
                  echo "Run ${rid} has exact upload receipts but Codecov has no record for ${head_sha}; not counting it as processed coverage."
                  codecov_query_failed=2
                  break
                fi
                if [ "${codecov_http}" != "200" ]; then
                  echo "::warning::Codecov returned HTTP ${codecov_http} for Coverage run ${rid}; freshness is unknown."
                  codecov_query_failed=1
                  break
                fi
                codecov_results="$(jq -nc --argjson accumulated "${codecov_results}" \
                  --argjson page "$(jq -c '.results' "${codecov_page}")" \
                  '$accumulated + $page')"
                codecov_page_url="$(jq -r '.next // empty' "${codecov_page}")"
              done
              if [ "${codecov_query_failed}" -eq 1 ]; then
                scan_incomplete=1
                continue
              elif [ "${codecov_query_failed}" -eq 2 ]; then
                continue
              fi
              jq -nc --argjson results "${codecov_results}" \
                '{count: ($results | length), results: $results}' >"${codecov_response}"
              if ! processed_counts="$(python3 tools/scripts/check_codecov_receipts.py \
                  --codecov-processed-run-id "${rid}" --repository "${REPO}" \
                  --required-flag \
                  "os-linux=${linux_started_at}" "os-macos=${macos_started_at}" \
                  "python-tools=${linux_started_at}" \
                  "apple-swift=${macos_started_at}" "android-kotlin=${android_started_at}" \
                  "pulp-react=${react_started_at}" \
                  <"${codecov_response}")"; then
                echo "Run ${rid} receipts are not backed by merged exact-run Codecov uploads for every required freshness flag (${processed_counts})."
                continue
              fi
              # Freshness begins at the oldest required receipt, not workflow
              # updated_at (which an unrelated long-running job can refresh).
              candidate_at="$(printf '%s' "${receipt_counts}" | jq -r '.oldest_created_at')"
              echo "Complete Codecov-processed required receipt set: ${rid} (${candidate_at}, ${head_sha}); Windows remains explicitly monitored as best-effort."
              if [ -z "${last_success_at}" ] || [[ "${candidate_at}" > "${last_success_at}" ]]; then
                last_success_at="${candidate_at}"
                last_success_sha="${head_sha}"
                last_success_run="${rid}"
              fi
              continue
            fi
            echo "Run ${rid} lacks exact current Codecov receipts (${receipt_counts}) — not counting it as fresh coverage."
          done
          recent_summary="$(printf '%s' "$runs_json" \
            | jq -r 'sort_by(.created_at) | reverse | .[0:6][] | "  - \(.created_at)  \(.status)/\(.conclusion // "-")  \(.html_url)"')"

          if [ "${scan_incomplete}" -ne 0 ]; then
            echo "Coverage receipt scan incomplete; leaving watchdog issue state unchanged."
            exit 0
          fi

          if [ -n "${last_success_at}" ]; then
            succ_epoch="$(date -u -d "${last_success_at}" +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "${last_success_at}" +%s)"
            age_h=$(( (now_epoch - succ_epoch) / 3600 ))
          else
            age_h=99999  # no success at all in the window
          fi
          current_main_sha="$(gh api -X GET "repos/${REPO}/commits/main" --jq .sha)"
          coverage_lag="unknown"
          if [ -n "${last_success_sha}" ]; then
            if [ "${last_success_sha}" = "${current_main_sha}" ]; then
              coverage_lag=0
            elif compare_json="$(gh api -X GET "repos/${REPO}/compare/${last_success_sha}...${current_main_sha}" 2>/dev/null)"; then
              compare_status="$(printf '%s' "${compare_json}" | jq -r '.status // "unknown"')"
              if [ "${compare_status}" = "ahead" ]; then
                coverage_lag="$(printf '%s' "${compare_json}" | jq -r '.ahead_by')"
              else
                coverage_lag="${compare_status}"
              fi
            else
              echo "::warning::Could not compare the Codecov watermark to current main; issue state will not be mutated."
              scan_incomplete=1
            fi
          fi
          echo "Last Codecov-processed main receipt set: ${last_success_at:-<none in scan window>} (run ${last_success_run:-<none>}, sha ${last_success_sha:-<none>}, age ~${age_h}h, current-main lag ${coverage_lag}, threshold ${MAX_AGE_HOURS}h)"

          if [ "${scan_incomplete}" -ne 0 ]; then
            echo "Coverage receipt/Codecov scan incomplete; leaving watchdog issue state unchanged."
            exit 0
          fi

          # Find an existing open watchdog issue by marker.
          issue_num="$(gh api -X GET "repos/${REPO}/issues" \
            -f state=open -f labels=coverage,ci -f per_page=50 \
            --jq "[.[] | select(.body != null and (.body | contains(\"${MARKER}\")))] | first | .number // empty" || true)"

          if [ "${age_h}" -ge "${MAX_AGE_HOURS}" ]; then
            body="$(printf '%s\n\n**main has had no complete exact-attempt required receipt set processed by Codecov in ~%sh** (threshold %sh). A run may conclude success while a report, transport upload, or Codecov processing was skipped, so the dashboard can silently degrade. Windows remains explicitly monitored but best-effort while its bounded suite can exceed the job cap.\n\nLast processed upload set: %s (SHA %s; current-main lag %s)\n\nMost recent Coverage runs on main:\n%s\n\nLikely causes (check in order):\n1. A Linux or macOS native build/report verification failed before upload.\n2. Python, Swift, Android, or React coverage failed independently.\n3. The instrumented suite hit its internal time budget and intentionally dropped the report.\n4. Codecov transport or exact-run processing failed after local report verification.\n5. CI dispatch throttling cancelled the run before required uploads.\n6. A rerun failed to reproduce receipts from its current attempt.\n\nAuto-closes when a fresh Coverage run produces every required upload receipt and Codecov reports each required exact-run flag merged.' \
              "${MARKER}" "${age_h}" "${MAX_AGE_HOURS}" "${last_success_at:-<none>}" "${last_success_sha:-<none>}" "${coverage_lag}" "${recent_summary}")"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning::[dry-run] would open/update coverage-upload watchdog issue"
              echo "${body}"
            elif [ -n "${issue_num}" ]; then
              echo "Updating existing issue #${issue_num}"
              gh api -X PATCH "repos/${REPO}/issues/${issue_num}" -f body="${body}" >/dev/null
              gh api -X POST "repos/${REPO}/issues/${issue_num}/comments" -f body="Still stalled at $(date -u +%FT%TZ) — last success ~${age_h}h ago." >/dev/null
            else
              echo "Opening new coverage-upload watchdog issue"
              gh api -X POST "repos/${REPO}/issues" \
                -f title="${TITLE}" -f body="${body}" \
                -f 'labels[]=coverage' -f 'labels[]=ci' -f 'labels[]=P1-important' >/dev/null
            fi
            echo "::error::Coverage uploads stalled: no successful main Coverage run in ~${age_h}h (threshold ${MAX_AGE_HOURS}h)."
            if [ "${DRY_RUN}" != "true" ]; then
              exit 1
            fi
          else
            echo "Coverage uploads healthy within the configured freshness SLO (last Codecov-processed success ~${age_h}h ago; current-main lag ${coverage_lag})."
            if [ -n "${issue_num}" ] && [ "${DRY_RUN}" != "true" ]; then
              echo "Recovered — closing issue #${issue_num}"
              gh api -X POST "repos/${REPO}/issues/${issue_num}/comments" \
                -f body="Recovered: Codecov processed a complete exact-SHA receipt set from main (${last_success_at}, ${last_success_sha}; current-main lag ${coverage_lag}). Auto-closing." >/dev/null
              gh api -X PATCH "repos/${REPO}/issues/${issue_num}" -f state=closed >/dev/null
            fi
          fi
