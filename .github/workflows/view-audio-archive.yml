name: View-audio archive

# Builds the pulp-view-audio static archive at the commit this workflow runs
# on, which is always a commit of main, on a clean GitHub-hosted runner, and
# publishes it as assets of an immutable prerelease tagged
# artifact/pulp-view-audio/<sha>. It runs on every push to main and can be
# re-dispatched from main; there is no input naming another commit, so the
# workflow only ever builds code that is already on the protected branch.
#
# A downstream package that carries a view unit (Vellum's mirror inertness
# proof) needs the symbols this archive defines. It downloads the assets
# anonymously and must check both of these:
#
#   gh attestation verify libpulp-view-audio.a \
#     --bundle pulp-view-audio-archive.sigstore.json \
#     --repo Generous-Corp/pulp \
#     --signer-workflow Generous-Corp/pulp/.github/workflows/view-audio-archive.yml \
#     --source-ref refs/heads/main --source-digest <expected commit> \
#     --deny-self-hosted-runners
#   (the same for pulp-view-audio-archive.manifest.json)
#
#   python3 tools/scripts/view_audio_archive_manifest.py verify \
#     --archive libpulp-view-audio.a \
#     --manifest pulp-view-audio-archive.manifest.json \
#     --source-sha <expected commit> --require-gate-pass --require-identical-rebuild
#
# --bundle makes the attestation check work without a GitHub token, and
# --source-ref pins the signer to this file as it exists on main: anyone who
# can push a branch could dispatch a modified copy of this workflow from it,
# and that copy would carry the same workflow path. Because the workflow
# builds its own commit, the attestation's source digest is the archive's
# source commit; the attested manifest records the same commit along with the
# floor-gate verdict and the rebuild comparison.
#
# The release, not an Actions artifact, is the durable copy: artifacts expire
# and need a token to download even from a public repository, while a
# published release in this repository is immutable and publicly readable.
# The tag does not match the protected `v*` release namespace, so no release
# automation reacts to it, and the release is never marked latest. Because
# artifact/* tags are not protected, the publish job refuses a tag or draft
# that does not already point at this commit, and checks the published
# release afterwards.
#
# The build job holds no write token and cannot mint an OIDC token, so nothing
# the build downloads or runs can sign or publish, and nothing in this
# workflow restores a cache. The publish job only re-verifies the build's
# bytes, attests them and releases them.
#
# Identity is the manifest plus its attestation. The archive bytes depend on
# the runner image's Xcode, so a later run for the same commit is refused once
# a release exists rather than publishing a second, different archive.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: view-audio-archive-${{ github.sha }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  SOURCE_SHA: ${{ github.sha }}
  TAG: artifact/pulp-view-audio/${{ github.sha }}

jobs:
  request:
    name: Check the request
    if: github.repository == 'Generous-Corp/pulp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      published: ${{ steps.request.outputs.published }}
    steps:
      - name: Check the request
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Not a security boundary (a branch copy of this file can drop it);
          # consumers pin --source-ref refs/heads/main. It keeps a dispatch
          # from another branch from publishing something consumers reject.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::run this workflow on main; consumers verify --source-ref refs/heads/main"
            exit 1
          fi
          if state=$(gh release view "${TAG}" --repo "${REPO}" --json isDraft --jq .isDraft 2>/dev/null) \
              && [ "${state}" = "false" ]; then
            echo "::notice::${TAG} is already published; its assets are the archive of record."
            echo "published=true" >>"${GITHUB_OUTPUT}"
          else
            echo "published=false" >>"${GITHUB_OUTPUT}"
          fi

  build:
    name: Build pulp-view-audio
    needs: request
    if: needs.request.outputs.published != 'true'
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # Apple ar/ranlib write member and symbol-table timestamps unless asked
      # not to; without this two builds of one commit can never match.
      ZERO_AR_DATE: '1'
      # Every object is compiled in this job; nothing an earlier job wrote is
      # read back into an attested archive.
      CCACHE_DISABLE: '1'
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Isolate the build from shared caches
        shell: bash
        run: |
          set -euo pipefail
          # A per-dependency source override would bypass the fresh root.
          if overrides="$(env | grep '^PULP_FETCHCONTENT_SOURCE_DIR_' | cut -d= -f1)"; then
            echo "::error::runner environment overrides dependency sources: ${overrides//$'\n'/ }"
            exit 1
          fi
          root="${RUNNER_TEMP:?}/pulp-isolated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$root"
          mkdir -p "$root/src" "$root/fc" "$root/cc"
          # Current PulpConfigureCheckCache.cmake parses the files it finds in
          # PULP_CONFIGURE_CHECK_CACHE_DIR; older source commits include() them.
          # A fresh directory makes both cases safe.
          {
            echo "PULP_SHARED_FETCHCONTENT_SOURCE_DIR=$root/src"
            echo "PULP_FETCHCONTENT_BASE_DIR=$root/fc"
            echo "PULP_CONFIGURE_CHECK_CACHE_DIR=$root/cc"
          } >> "$GITHUB_ENV"

      - name: Check out this commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          lfs: true
          persist-credentials: false

      - name: Bootstrap dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          command -v ninja >/dev/null || brew install ninja
          ./setup.sh --ci --deps-only

      - name: Build pulp-view-audio
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          configure=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DPULP_BUILD_TESTS=OFF
            -DPULP_BUILD_EXAMPLES=OFF
            -DPULP_USE_CCACHE=OFF
          )
          printf '%s\n' "${configure[@]}" >"${RUNNER_TEMP}/configure-args.txt"
          cmake -S . -B build "${configure[@]}"
          tools/ci/governed-build.sh cmake --build build --config Release \
            --target pulp-view-audio pulp-view-core pulp-view-script pulp-design-import
          mkdir -p "${OUT}"
          cp build/core/view/libpulp-view-audio.a "${OUT}/libpulp-view-audio.a"

      - name: Rebuild in a separate build directory
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # A second clean configure and build of the same checkout into its
          # own directory. The manifest records whether the archive repeats
          # byte for byte, which is what a build-directory path or a
          # timestamp leaking into the archive would break.
          configure=()
          while IFS= read -r arg; do configure+=("${arg}"); done <"${RUNNER_TEMP}/configure-args.txt"
          cmake -S . -B build-rebuild "${configure[@]}"
          tools/ci/governed-build.sh cmake --build build-rebuild --config Release \
            --target pulp-view-audio

      - name: Describe the archive
        shell: bash
        run: |
          set -euo pipefail
          configure_flags=()
          while IFS= read -r arg; do
            configure_flags+=("--configure=${arg}")
          done <"${RUNNER_TEMP}/configure-args.txt"
          lib=source/build/core/view
          python3 source/tools/scripts/view_audio_archive_manifest.py describe \
            --archive "${OUT}/libpulp-view-audio.a" \
            --source-sha "${SOURCE_SHA}" \
            --source-root source \
            --floor-out "${OUT}/pulp-view-audio-symbol-floor.txt" \
            --gate-out "${OUT}/pulp-view-audio-symbol-floor-gate.txt" \
            --output "${OUT}/pulp-view-audio-archive.manifest.json" \
            --check "view-core=${lib}/libpulp-view-core.a" \
            --check "view-script=${lib}/libpulp-view-script.a" \
            --check "design-import=${lib}/libpulp-design-import.a" \
            --cmake-cache source/build/CMakeCache.txt \
            --build-dir source/build \
            --rebuild-dir source/build-rebuild \
            --rebuild-archive source/build-rebuild/core/view/libpulp-view-audio.a \
            "${configure_flags[@]}"
          cat "${OUT}/pulp-view-audio-archive.manifest.json"
          # A failing floor gate must not reach the publish job: the commit's
          # immutable tag could never be used again.
          python3 source/tools/scripts/view_audio_archive_manifest.py verify \
            --archive "${OUT}/libpulp-view-audio.a" \
            --manifest "${OUT}/pulp-view-audio-archive.manifest.json" \
            --floor "${OUT}/pulp-view-audio-symbol-floor.txt" \
            --gate "${OUT}/pulp-view-audio-symbol-floor-gate.txt" \
            --source-sha "${SOURCE_SHA}" \
            --require-gate-pass \
            --require-identical-rebuild
          (cd "${OUT}" && shasum -a 256 \
            libpulp-view-audio.a \
            pulp-view-audio-archive.manifest.json \
            pulp-view-audio-symbol-floor.txt \
            pulp-view-audio-symbol-floor-gate.txt >SHA256SUMS)
          cat "${OUT}/SHA256SUMS"

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulp-view-audio-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest and publish pulp-view-audio
    needs: [request, build]
    if: needs.request.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Check out the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false

      - name: Receive the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulp-view-audio-${{ github.sha }}
          path: out

      - name: Re-verify the build's bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd "${OUT}" && sha256sum -c SHA256SUMS)
          python3 tooling/tools/scripts/view_audio_archive_manifest.py verify \
            --archive "${OUT}/libpulp-view-audio.a" \
            --manifest "${OUT}/pulp-view-audio-archive.manifest.json" \
            --floor "${OUT}/pulp-view-audio-symbol-floor.txt" \
            --gate "${OUT}/pulp-view-audio-symbol-floor-gate.txt" \
            --source-sha "${SOURCE_SHA}" \
            --require-gate-pass \
            --require-identical-rebuild

      - name: Refuse a tag or draft that points elsewhere
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # artifact/* tags are outside the protected v* ruleset, so a tag or
          # draft someone else made must already point at SOURCE_SHA.
          if ref=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null); then
            read -r kind sha <<<"${ref}"
            if [ "${kind}" != "commit" ] || [ "${sha}" != "${SOURCE_SHA}" ]; then
              echo "::error::tag ${TAG} already exists as ${kind} ${sha}, not commit ${SOURCE_SHA}"
              exit 1
            fi
          fi
          gh api "repos/${REPO}/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG)' | jq -s . >"${RUNNER_TEMP}/existing.json"
          python3 tooling/tools/scripts/view_audio_archive_manifest.py check-draft \
            --releases "${RUNNER_TEMP}/existing.json" --out "${OUT}" \
            --source-sha "${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Attest the archive and its manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/libpulp-view-audio.a
            out/pulp-view-audio-archive.manifest.json
            out/pulp-view-audio-symbol-floor.txt
            out/pulp-view-audio-symbol-floor-gate.txt
            out/SHA256SUMS

      - name: Publish the immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DRAFT_EXISTS: ${{ steps.existing.outputs.draft }}
        run: |
          set -euo pipefail
          cp "${BUNDLE}" "${OUT}/pulp-view-audio-archive.sigstore.json"
          assets=(
            "${OUT}/libpulp-view-audio.a"
            "${OUT}/pulp-view-audio-archive.manifest.json"
            "${OUT}/pulp-view-audio-symbol-floor.txt"
            "${OUT}/pulp-view-audio-symbol-floor-gate.txt"
            "${OUT}/SHA256SUMS"
            "${OUT}/pulp-view-audio-archive.sigstore.json"
          )
          title="pulp-view-audio archive ${SOURCE_SHA:0:12}"
          notes="pulp-view-audio static archive (darwin-arm64, Release) built from ${SOURCE_SHA} by ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}.

          Verify both, without a token:
            gh attestation verify libpulp-view-audio.a --bundle pulp-view-audio-archive.sigstore.json --repo ${REPO} --signer-workflow ${REPO}/.github/workflows/view-audio-archive.yml --source-ref refs/heads/main --source-digest ${SOURCE_SHA} --deny-self-hosted-runners
            python3 tools/scripts/view_audio_archive_manifest.py verify --archive libpulp-view-audio.a --manifest pulp-view-audio-archive.manifest.json --source-sha ${SOURCE_SHA} --require-gate-pass --require-identical-rebuild
          The workflow builds its own commit, so the attestation's source digest and the manifest both name ${SOURCE_SHA}."
          # A published release is immutable, so every asset is attached while
          # it is still a draft and the publish flip comes last.
          if [ "${DRAFT_EXISTS}" = "true" ]; then
            # The draft already holds exactly these bytes (checked above); only
            # the notes are regenerated so they name this run. Its bundle is the
            # earlier attestation of the same digests and is what gets published.
            gh release download "${TAG}" --repo "${REPO}" \
              --pattern pulp-view-audio-archive.sigstore.json --dir "${RUNNER_TEMP}/draft-bundle"
            cp "${RUNNER_TEMP}/draft-bundle/pulp-view-audio-archive.sigstore.json" \
              "${OUT}/pulp-view-audio-archive.sigstore.json"
            gh release edit "${TAG}" --repo "${REPO}" --title "${title}" --notes "${notes}"
          else
            gh release create "${TAG}" "${assets[@]}" --repo "${REPO}" \
              --target "${SOURCE_SHA}" --draft --prerelease --latest=false \
              --title "${title}" --notes "${notes}"
          fi
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --prerelease --latest=false

      - name: Check the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '[.object.type, .object.sha] | @tsv' >"${RUNNER_TEMP}/tag.tsv"
          gh api "repos/${REPO}/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG)' | jq -s . >"${RUNNER_TEMP}/release.json"
          python3 tooling/tools/scripts/view_audio_archive_manifest.py check-release \
            --releases "${RUNNER_TEMP}/release.json" --tag-ref "${RUNNER_TEMP}/tag.tsv" \
            --out "${OUT}" --source-sha "${SOURCE_SHA}"

      - name: Verify the release the way a consumer does
        shell: bash
        run: |
          set -euo pipefail
          # No token and an empty gh config: the documented check must work
          # anonymously, from the published bundle alone.
          config="$(mktemp -d)"
          for subject in libpulp-view-audio.a pulp-view-audio-archive.manifest.json; do
            env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="${config}" gh attestation verify "${OUT}/${subject}" \
              --bundle "${OUT}/pulp-view-audio-archive.sigstore.json" \
              --repo "${REPO}" \
              --signer-workflow "${REPO}/.github/workflows/view-audio-archive.yml" \
              --source-ref refs/heads/main \
              --source-digest "${SOURCE_SHA}" \
              --deny-self-hosted-runners
          done
