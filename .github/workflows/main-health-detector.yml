name: Base health detector

# WHY THIS IS NOT PART OF `Build and Test`. main's health is already measured
# there, by the merge queue: the queue lands with the MERGE method, so the
# commit on main IS the merge-group head, and that merge group's runs tested
# main's exact commit. This workflow reads EVERY required status context on
# main's tip sha -- the jobs of every workflow in `[landability] workflows`,
# plus the commit's statuses -- (see tools/ci/base_poison_detector.py) and
# publishes a verdict, so it costs API reads and no gate lane. A push-to-main
# run carries no macOS leg and is not an observation.

# It REPORTS ONLY. Acting on the signal - pausing re-forming batches,
# prioritising the fix - is Shipyard's side and is not wired here.

on:
  # The primary trigger: read main's health after EVERY completed merge
  # group. A failed one is the moment a poisoned base first shows; a green one
  # is usually a new tip, and without a read then a healthy tip never gets a
  # verdict and the last published one goes stale. GitHub runs a
  # `workflow_run` workflow from the DEFAULT branch with base-repository
  # permissions, never from the triggering run's code, and this job checks out
  # only the default branch and only reads, so the trigger adds no path for
  # queued code to act with this workflow's token.
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  schedule:
    # A backstop only. GitHub throttles this repository's schedules to about
    # one run every four hours whatever the cron says, far longer than a
    # batch's lifetime, so the cron cannot be what catches a red base.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      min_streak:
        description: "Consecutive executed batch failures that make a streak (>= 2)"
        required: false
        default: "2"
        type: string
      name_fix_pr:
        description: "Also look for the open pull request that decisively owns the test"
        required: false
        default: true
        type: boolean

# One detector at a time, and never per-sha. A burst of completed batches
# collapses to the running read plus one pending. A superseded tick loses nothing:
# the next one reads main's CURRENT head, which is strictly more relevant than
# the head the cancelled tick would have reported on. A per-sha group would pin
# each read to a sha, so a cancelled read's observation would be gone for good.
concurrency:
  group: main-health-detector
  cancel-in-progress: false

# `checks` reads the required-context jobs of the non-build workflows in one
# check-runs call per commit; `statuses` reads a context published as a commit
# status (`Vellum trusted freeze` on a pull request's head).
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  triage:
    name: Base health
    # A fork's copy of this workflow would probe THIS repository's runs and mail
    # its owner every failure, so an unattended run no-ops off the primary repo.
    # `workflow_dispatch` is untouched, so a fork owner can still run it by hand.
    # A `workflow_run` read happens after every completed merge-group run,
    # green or red: a PR run or a push run says nothing about main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository == vars.PULP_PRIMARY_REPO &&
       (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'merge_group')))
    runs-on: ${{ fromJSON(vars.PULP_PREAMBLE_RUNS_ON_JSON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          lfs: false

      - name: Classify the base
        id: classify
        env:
          # No `ghapp` App wrapper on a GitHub runner; the detector reads this
          # override so both halves resolve the same client.
          PULP_GH_CLI: gh
          GH_TOKEN: ${{ github.token }}
          MIN_STREAK: ${{ inputs.min_streak || '2' }}
          NAME_FIX_PR: ${{ (github.event_name != 'workflow_dispatch' || inputs.name_fix_pr) && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --min-streak "$MIN_STREAK"
                --output "$RUNNER_TEMP/base-poison-signal.json")
          [ "$NAME_FIX_PR" != true ] || args+=(--name-fix-pr)
          # Report only: the exit status must not depend on the verdict, or a
          # poisoned base would read as a broken detector.
          python3 tools/ci/base_poison_detector.py "${args[@]}"

      - name: Upload the signal
        # `always()` because the signal is most needed on the runs a
        # failure-only upload would discard.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: base-poison-signal
          path: ${{ runner.temp }}/base-poison-signal.json
          if-no-files-found: warn
          retention-days: 30
