name: Android Build

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'core/**'
      - 'tools/deps/manifest.json'
      - 'tools/cmake/PulpAndroid.cmake'
      - 'tools/cmake/PulpDependencies.cmake'
      - 'tools/scripts/test_android_aligned_buffer.py'
      - 'tools/scripts/check_android_jni_exports.py'
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'

  schedule:
    - cron: '41 5 * * *'  # nightly de-starve safety net (see planning/fleet/2026-07-17-ci-destarve-analysis.md)
  workflow_dispatch: {}
# Cancel superseded PR runs when a new commit lands on the same ref.
# Main-branch pushes share `refs/heads/main` so consecutive main runs
# still serialize under the same group — acceptable: Android-on-main
# is a background signal, not a release gate.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-runners:
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO)
    runs-on: ubuntu-latest
    outputs:
      macos_runs_on: ${{ steps.resolve.outputs.macos_runs_on }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false
      - id: resolve
        env:
          MACOS_RUNS_ON_JSON: ${{ vars.PULP_NAMESPACE_BUILD_MACOS_RUNS_ON_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_HOSTED_WINDOWS_VAR: ${{ vars.PULP_ALLOW_HOSTED_WINDOWS || '' }}
          WINDOWS_X64_RUNS_ON_JSON: ${{ vars.PULP_LOCAL_WINDOWS_X64_RUNS_ON_JSON || '' }}
        run: |
          set -euo pipefail
          macos=$(python3 tools/scripts/resolve_runs_on.py \
            --target-name "Android Build (macOS)" \
            --mode default \
            --override-env MACOS_RUNS_ON_JSON \
            --default-label macos-latest)
          echo "macos_runs_on=${macos}" >>"${GITHUB_OUTPUT}"
          # The Windows row runs on the nightly schedule and on a dispatch, on
          # the self-hosted Windows x64 lane; PULP_ALLOW_HOSTED_WINDOWS=1 moves
          # it to GitHub-hosted windows-latest and adds it to a push. No
          # required context reads this workflow.
          windows=""
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] \
            || [ "$ALLOW_HOSTED_WINDOWS_VAR" = 1 ]; then
            windows=$(python3 tools/scripts/windows_runner_selector.py --route \
              --event-name "$EVENT_NAME" \
              --default-selector "$WINDOWS_X64_RUNS_ON_JSON" \
              --allow-hosted "$ALLOW_HOSTED_WINDOWS_VAR" | sed -n 's/^runs_on=//p')
          fi
          matrix=$(MACOS="$macos" WINDOWS="$windows" python3 -c '
          import json, os
          rows = [{"os": "macos-latest", "runs_on_json": os.environ["MACOS"]}]
          if os.environ["WINDOWS"]:
              rows.append({"os": "windows-x64", "runs_on_json": os.environ["WINDOWS"]})
          print(json.dumps({"include": rows}))
          ')
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"

  android-build:
    needs: resolve-runners
    strategy:
      matrix: ${{ fromJSON(needs.resolve-runners.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runs_on_json) }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install macOS CMake generator deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      - name: Compile DSP buffers at the supported Android API floor
        shell: bash
        run: python3 tools/scripts/test_android_aligned_buffer.py --ndk "$ANDROID_HOME/ndk/30.0.14904198"

      # Dependency and wrapper downloads only. The native build tree
      # (android/app/.cxx) is never cached: it is build output, its key could
      # not track the sources, and it never restored. Restore runs on
      # GitHub-hosted runners only; a push to main is the only writer.
      - name: Restore Gradle caches (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ runner.arch }}-jdk17-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ runner.arch }}-jdk17-

      - name: Build Android APK (arm64-v8a + x86_64)
        working-directory: android
        run: ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198

      # A running daemon holds locks under ~/.gradle/caches, which made the
      # Windows save fail its tar step on every run.
      - name: Stop the Gradle daemon before saving its caches
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && steps.gradle-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew --stop

      - name: Save Gradle caches (main, GitHub-hosted)
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Verify APK contains libpulp.so
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "--- APK full contents ---"
          unzip -l "$APK" || echo "(APK unreadable)"
          echo "---"
          if unzip -l "$APK" | grep -q "libpulp.so"; then
            echo "✅ libpulp.so found in APK"
            unzip -l "$APK" | grep "\.so"
          else
            echo "❌ libpulp.so NOT found in APK"
            exit 1
          fi

      # A JNI function in a static library that nothing in libpulp.so
      # references is dropped at link time; the build stays green and the
      # app throws UnsatisfiedLinkError the first time Java calls it.
      - name: Verify libpulp.so exports every declared JNI native
        shell: bash
        run: |
          python3 tools/scripts/check_android_jni_exports.py \
            --sources android/app/src/main \
            --apk android/app/build/outputs/apk/debug/app-debug.apk \
            --require-abi arm64-v8a

      # Always upload APK + Gradle/NDK logs so a failed "Verify APK"
      # step (historically flaky on windows-latest — #403, #418) can
      # be diagnosed from artifacts instead of requiring a close/reopen
      # retry cycle. The `if: always()` ensures this runs even when the
      # verify step above fails.
      - name: Upload APK + build logs (diagnostic)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pulp-android-${{ matrix.os }}-diag
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/logs/**
            android/app/.cxx/**/build.ninja
            android/app/.cxx/**/CMakeCache.txt
            android/app/.cxx/**/CMakeFiles/CMakeOutput.log
            android/app/.cxx/**/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pulp-android-${{ matrix.os }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Emulator test — only on macOS (KVM not available on GitHub Windows runners).
  # This boots a headless arm64-v8a emulator, exercises the BLE-MIDI registry
  # lifecycle through the production JNI/Kotlin bridge, installs the arm64-only
  # debug APK, launches PulpActivity, and greps logcat for the JNI_OnLoad marker.
  # Full GPU/rendering validation is out of scope here (tracked under #77).
  #
  # Re-gated 2026-04 after #530 (re-enable attempt) proved a third failure
  # mode beyond the two originally documented in #487:
  #
  #   1. ABI mismatch (x86_64 emulator vs arm64-only APK) — fixed in workflow.
  #   2. Wrong launch intent (com.pulp vs com.pulp.app) — fixed in workflow.
  #   3. `macos-latest` is now Apple Silicon (ARM64). Booting an arm64-v8a
  #      Android system image via QEMU + HVF hits `HV_UNSUPPORTED`, so
  #      `qemu-system-aarch64-headless` exits with "failed to initialize HVF:
  #      Invalid argument" immediately after startup. `adb wait-for-device`
  #      then hangs, and the job burns its full `timeout-minutes: 20`.
  #
  # The AVD arch + `am start` intent below are still the matched pair for
  # the APK (arm64-v8a / com.pulp.app/com.pulp.PulpActivity); do not change
  # one without the other. What's missing is a runner that can actually
  # accelerate arm64 Android guests — Linux arm64 + KVM, x86_64 APK + x86_64
  # emulator, or a self-hosted ARM macOS with nested-HVF — see #487 for the
  # path-forward discussion.
  #
  # `PULP_ANDROID_EMULATOR_ENABLED=true` in repo vars re-enables the job
  # once a working runner configuration lands.
  android-emulator-test:
    if: ${{ vars.PULP_ANDROID_EMULATOR_ENABLED == 'true' }}
    runs-on: ${{ fromJSON(needs.resolve-runners.outputs.macos_runs_on) }}
    needs: [resolve-runners, android-build]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install macOS CMake generator deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Install NDK and emulator
        run: |
          sdkmanager "ndk;30.0.14904198"
          sdkmanager "system-images;android-34;google_apis;arm64-v8a"
          sdkmanager "emulator"

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: pulp-android-macos-latest

      - name: Create AVD and boot emulator
        run: |
          echo "no" | avdmanager create avd -n pulp-ci -k "system-images;android-34;google_apis;arm64-v8a" --force
          "$ANDROID_HOME/emulator/emulator" -avd pulp-ci -no-window -no-audio -no-boot-anim &
          adb wait-for-device
          # Wait for boot (up to 120s across 60 × 2s checks).
          for _ in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && echo "Emulator booted" && break
            sleep 2
          done

      - name: Verify BLE-MIDI registry lifecycle
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:connectedBleMidiValidationAndroidTest

      - name: Verify the APK exports every declared JNI native
        run: python3 tools/scripts/check_android_jni_exports.py --sources android/app/src/main --apk app-debug.apk --require-abi arm64-v8a

      # On a freshly booted emulator the app receives a MIDI device-removed
      # callback within its first second, which calls the MIDI natives; an
      # app whose natives are missing dies there.
      - name: Install and launch
        run: |
          adb install app-debug.apk
          adb logcat -c
          adb shell am start -W -n com.pulp.app/com.pulp.PulpActivity
          sleep 8

      # JNI_OnLoad logs before anything else runs, so the marker alone also
      # passes for an app that dies right after it. Require the process to be
      # alive and no fatal exception as well.
      - name: Verify JNI bridge initialization and that the app survives launch
        run: |
          adb logcat -d -s Pulp:V AndroidRuntime:E | tee /tmp/pulp-logcat.txt
          status=0
          if grep -q "JNI_OnLoad: Pulp native bridge initialized" /tmp/pulp-logcat.txt; then
            echo "✅ JNI bridge initialized"
          else
            echo "❌ JNI bridge did not initialize"
            status=1
          fi
          if grep -Eq "FATAL EXCEPTION|UnsatisfiedLinkError" /tmp/pulp-logcat.txt; then
            echo "❌ fatal exception after launch"
            status=1
          fi
          if [ -n "$(adb shell pidof com.pulp.app | tr -d '\r')" ]; then
            echo "✅ app process alive 8 s after launch"
          else
            echo "❌ app process is not running 8 s after launch"
            status=1
          fi
          exit "$status"

      - name: Kill emulator
        if: always()
        run: adb emu kill 2>/dev/null || true

  # This stable context classifies its dependency closure on every PR and
  # merge group, then runs the Android API-floor compile probe and the
  # expensive Linux/KVM fixture lane only when affected. It is the only
  # Android job that runs pre-merge: the APK jobs above are push/schedule
  # only, so a PR's Android signal proves the API floor and the fixtures,
  # not a packaged APK.
  android-run-fixtures:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Classify fixture dependency changes
        id: fixture-scope
        env:
          PULP_EVENT_NAME: ${{ github.event_name }}
          PULP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PULP_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
        run: |
          if [[ "$PULP_EVENT_NAME" != pull_request && "$PULP_EVENT_NAME" != merge_group ]]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha=$PULP_PR_BASE_SHA
          [[ "$PULP_EVENT_NAME" == merge_group ]] && base_sha=$PULP_MERGE_GROUP_BASE_SHA
          test -n "$base_sha"
          affected=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/android.yml|CMakeLists.txt|\
              core/*|\
              test/fixtures/timeline/*|tools/ci/android-fixture-lane.sh|\
              tools/cmake/*|tools/deps/manifest.json|\
              tools/scripts/test_android_aligned_buffer.py)
                affected=true
                break
                ;;
            esac
          done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      - name: Report unaffected fixture gate
        if: steps.fixture-scope.outputs.affected != 'true'
        run: echo 'PASS android-fixture-lane (dependency closure unchanged)'

      - uses: actions/setup-java@v6
        if: steps.fixture-scope.outputs.affected == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.fixture-scope.outputs.affected == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK and x86_64 emulator
        if: steps.fixture-scope.outputs.affected == 'true'
        run: |
          sdkmanager "ndk;30.0.14904198" "platform-tools" "emulator" \
            "platforms;android-34" "system-images;android-34;google_apis;x86_64"

      # The fixture runners below are cross-compiled, but their target
      # closure is narrower than the APK's, so a core header can use a libc
      # symbol above the app's API floor and still build here. That is how
      # `std::aligned_alloc` (Bionic: API 28+, app floor: API 26) reached
      # `main` while every pre-merge Android signal was green. This probe
      # compiles the DSP buffer headers at both the floor and API 28 for
      # both ABIs in seconds, on the NDK this job already installed.
      - name: Compile DSP buffers at the supported Android API floor
        if: steps.fixture-scope.outputs.affected == 'true'
        run: python3 tools/scripts/test_android_aligned_buffer.py --ndk "$ANDROID_HOME/ndk/30.0.14904198"

      - name: Enable KVM
        if: steps.fixture-scope.outputs.affected == 'true'
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Build headless x86_64 fixture runners
        if: steps.fixture-scope.outputs.affected == 'true'
        run: |
          cmake -S . -B build-android-fixtures -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/30.0.14904198/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPULP_ENABLE_GPU=OFF \
            -DPULP_BUILD_TESTS=OFF \
            -DPULP_BUILD_EXAMPLES=OFF
          tools/ci/governed-build.sh cmake --build build-android-fixtures --target \
            pulp-fixture-runner pulp-android-fixture-runner

      - name: Create and boot x86_64 emulator
        if: steps.fixture-scope.outputs.affected == 'true'
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd -f -n pulp-fixtures \
            -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_2 -p "$ANDROID_AVD_HOME/pulp-fixtures.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx pulp-fixtures
          "$ANDROID_HOME/emulator/emulator" -avd pulp-fixtures -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/pulp-emulator.log" 2>&1 &
          emulator_pid=$!
          for _ in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "emulator exited before adb became ready" >&2
              cat "$RUNNER_TEMP/pulp-emulator.log" >&2
              exit 1
            fi
            [[ "$(adb get-state 2>/dev/null)" == device ]] && break
            sleep 2
          done
          if [[ "$(adb get-state 2>/dev/null)" != device ]]; then
            echo "emulator did not register with adb" >&2
            cat "$RUNNER_TEMP/pulp-emulator.log" >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] && exit 0
            sleep 2
          done
          echo "emulator did not boot" >&2
          cat "$RUNNER_TEMP/pulp-emulator.log" >&2
          exit 1

      - name: Execute timeline, journal, and playback fixtures
        if: steps.fixture-scope.outputs.affected == 'true'
        run: |
          fixture_runner=$(find build-android-fixtures -type f -name pulp-fixture-runner -perm -111 -print -quit)
          playback_runner=$(find build-android-fixtures -type f -name pulp-android-fixture-runner -perm -111 -print -quit)
          tools/ci/android-fixture-lane.sh "$fixture_runner" "$playback_runner" \
            test/fixtures/timeline

      - name: Stop emulator
        if: always() && steps.fixture-scope.outputs.affected == 'true'
        run: adb emu kill 2>/dev/null || true
