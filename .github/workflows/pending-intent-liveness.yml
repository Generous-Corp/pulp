name: Pending-intent liveness

# Time-based backstop for the release path (decisions-contract row 10). A
# release-worthy merge waits in release-please's standing release PR until
# release-pr-enqueue.yml lands it, auto-release.yml tags it, and
# release_please_handoff.py hands the tagged PR back to release-please. Any of
# those can stop without a failing check, stranding the change on main. This
# alarms when a release PR has been open past the threshold (above the enqueue
# backstop), when a merged release PR is still pending its tag past the grace
# window, when release-please.yml has not succeeded on main within the
# threshold, or when a merge touching a surface has gone unreleased past the
# threshold with no release PR for it (a change release-please cannot see).
# PULP_RELEASE_PLEASE=off (the rollback switch) turns it off; rollback then
# restores the version-at-land alarm from git history
# (docs/guides/version-at-land-cutover.md § Rollback to version-at-land). The file keeps its name so the schedule backstop and the contract
# row keep pointing at it. See tools/scripts/pending_intent_liveness.py and
# docs/guides/versioning.md § Release PR.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      threshold_minutes:
        description: "Minutes a release PR may stay open before alarming"
        required: false
        default: "360"

concurrency:
  group: pending-intent-liveness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read  # the release PRs and their labels
  actions: read        # the newest successful release-please.yml run

jobs:
  check:
    if: >-
      vars.PULP_RELEASE_PLEASE != 'off'
      && (github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0    # unreleased-change walks the merges since each tag
          fetch-tags: true

      - name: Assess release liveness
        id: assess
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULP_RELEASE_LIVENESS_THRESHOLD_MIN: ${{ github.event.inputs.threshold_minutes || '360' }}
        run: |
          set -uo pipefail
          python3 tools/scripts/pending_intent_liveness.py \
              --repo-name "$GITHUB_REPOSITORY" --json > liveness.json
          rc=$?
          cat liveness.json
          # 2 means GitHub could not be read: fail the run, but open no tracker.
          [ "$rc" -ne 2 ] || exit 1
          echo "overdue=$([ "$rc" -eq 1 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Open/refresh tracker on a stalled release
        if: steps.assess.outputs.overdue == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="release: stuck — release PR not landing or not tagged"
          body=$(python3 - <<'PY'
          import json
          d = json.load(open("liveness.json"))
          rows = d.get("overdue", [])
          print("_Auto-generated by `.github/workflows/pending-intent-liveness.yml`._\n")
          print("A merged change is not reaching a release tag. Consumers cannot get it")
          print("until the release PR lands and auto-release.yml tags it.\n")
          print("**Stalled:**\n")
          for r in rows:
              pr = f" #{r['pr']}" if r.get("pr") else ""
              age = f" — {r['age_minutes']} min" if r.get("age_minutes") is not None else ""
              print(f"- `{r['kind']}`{pr}: {r['title']}{age}")
          print("\n**Likely causes:** `release-pr-overdue` — the release PR is red, a draft,")
          print("or release-pr-enqueue.yml is not running; `handoff-stuck` — auto-release.yml")
          print("withheld or failed the tag, or the label hand-off did not run;")
          print("`release-please-silent` — release-please.yml is failing (config, token);")
          print("`unreleased-change` — release-please cannot see the merge (plain title,")
          print("non-standard type, `!` only in the title): add BEGIN_COMMIT_OVERRIDE /")
          print("`<type>(<scope>): <summary>` / END_COMMIT_OVERRIDE to the merged PR's body.")
          print("See docs/guides/versioning.md § Release PR.")
          PY
          )
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"release PR not landing\"" \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                  --body "Still overdue as of $(date -u '+%Y-%m-%d %H:%M UTC')."
          else
              gh api -X POST "/repos/${GITHUB_REPOSITORY}/labels" \
                  -f name="release-stuck" -f color="b60205" \
                  -f description="A user-facing change is waiting for a versioned release" \
                  >/dev/null 2>&1 || true
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                  --body "$body" --label "bug,ci,blocks-release,release-stuck" \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Fail the run so the schedule surfaces it
        if: steps.assess.outputs.overdue == '1'
        run: exit 1
