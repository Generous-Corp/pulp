name: DSP Throughput Benchmark (advisory)

# PROOF BRANCH ONLY: -ffp-contract option-4 proofs on aarch64 GCC.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of audio per repetition
        required: false
        default: '2'

concurrency:
  group: dsp-throughput-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numeric:
    name: g++-14 on, 11 numeric tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with: {submodules: false, lfs: false}
      - uses: ./.github/actions/install-linux-build-deps
      - run: sudo apt-get install -y g++-14
      - run: ./setup.sh --ci --deps-only
      - name: Configure g++-14 -ffp-contract=on
        run: |
          CC=gcc-14 CXX=g++-14 cmake -S . -B b -DCMAKE_BUILD_TYPE=Release -DPULP_BUILD_EXAMPLES=OFF \
            -DPULP_ENABLE_GPU=OFF -DPULP_PROOF_GNU_FP_CONTRACT=on
          grep -c -- "-ffp-contract=on" b/CMakeFiles/*.dir/flags.make b/core/signal/CMakeFiles/*/flags.make 2>/dev/null | head -3 || true
          grep -m1 CMAKE_CXX_COMPILER: b/CMakeCache.txt
      - name: Build and run the eleven
        run: |
          set -euo pipefail
          re='wavefolder stages retain|Transfer curve block, in-place|headphone crossfeed is channel symmetric|Particle voices match independent sample-level body oracles - float|Dynamic EQ reset and block partitions|GraphicEq response matches an independent|SignalGraph multi-path routing renders|SignalGraph multi-path oracle detects|SignalGraph multi-path routing is block|SignalGraph renders unchanged across an open|MF-3: snap_to_zero'
          cmake --build b --parallel 4 --target pulp-test-group-dsp-rt-signal pulp-test-signal-dynamic-eq \
            pulp-test-graphic-eq pulp-test-signal-graph-audio-parity pulp-test-denormal-null
          ctest --test-dir b -R "$re" --output-on-failure 2>&1 | tee eleven.txt
          grep -c "Passed" eleven.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: numeric-gcc14-on, path: eleven.txt}

  bench:
    name: g++-14 bench ${{ matrix.mode }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [on, default, "off"]
    steps:
      - uses: actions/checkout@v5
        with: {submodules: false, lfs: false}
      - uses: ./.github/actions/install-linux-build-deps
      - run: sudo apt-get install -y g++-14
      - run: ./setup.sh --ci --deps-only
      - name: Configure and build
        run: |
          CC=gcc-14 CXX=g++-14 cmake -S . -B b -DCMAKE_BUILD_TYPE=Release -DPULP_BENCHMARK=ON \
            -DPULP_BUILD_EXAMPLES=OFF -DPULP_ENABLE_GPU=OFF -DPULP_PROOF_GNU_FP_CONTRACT=${{ matrix.mode }}
          cmake --build b --target pulp-dsp-throughput-benchmark --parallel 4
      - name: Run
        run: |
          ./b/test/pulp-dsp-throughput-benchmark --seconds 2 --commit "${GITHUB_SHA}" \
            --host "gcc14-${{ matrix.mode }}" --json "bench-gcc14-${{ matrix.mode }}.json" > /dev/null
      - uses: actions/upload-artifact@v4
        with: {name: "bench-gcc14-${{ matrix.mode }}", path: "bench-gcc14-${{ matrix.mode }}.json"}

  gcc13-identity:
    name: g++-13 on vs off object identity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: {submodules: false, lfs: false}
      - uses: ./.github/actions/install-linux-build-deps
      - run: ./setup.sh --ci --deps-only
      - name: Build the benchmark twice, on and off, same build dir
        run: |
          set -euo pipefail
          g++ --version | head -1
          for mode in on off; do
            cmake -S . -B b -DCMAKE_BUILD_TYPE=Release -DPULP_BENCHMARK=ON -DPULP_BUILD_EXAMPLES=OFF \
              -DPULP_ENABLE_GPU=OFF -DPULP_PROOF_GNU_FP_CONTRACT=$mode
            cmake --build b --target pulp-dsp-throughput-benchmark --parallel 4
            grep -rho -- "-ffp-contract=[a-z]*" b --include=flags.make | sort | uniq -c || true
            (cd b && find . -name '*.o' -print0 | sort -z | xargs -0 sha256sum) > objs-$mode.txt
            cp b/test/pulp-dsp-throughput-benchmark bench-$mode
          done
          wc -l objs-on.txt objs-off.txt
          if diff -q objs-on.txt objs-off.txt; then echo "OBJECTS IDENTICAL"; else diff objs-on.txt objs-off.txt | head -40; echo "OBJECTS DIFFER: $(diff objs-on.txt objs-off.txt | grep -c '^<')"; fi
          sha256sum bench-on bench-off
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gcc13-identity, path: "objs-*.txt"}
