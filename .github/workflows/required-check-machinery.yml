name: Required-check machinery

# Advisory and never required. Every required context on main is posted by a
# GitHub Actions workflow, and a pull request's merge group runs the workflow
# YAML that pull request carries, so a change to those workflows, to the
# receipt-reuse decision, or to the rulesets decides its own required checks.
# Repository policy accepts that; this posts a check run naming the files so
# the reviewer sees it: `neutral` when flagged, `success` when not.
# pull_request_target runs this definition and the checked-out script from
# protected main: the pull request's copy of both is never run, and its head is
# only diffed.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

concurrency:
  group: required-check-machinery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Required-check machinery report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Report files that decide required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/required-check-machinery.json"
          # Data only: the head is fetched for diffing and never checked out.
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          # The required contexts come from protected main's committed ruleset.
          python3 tools/scripts/required_check_machinery.py --repo . \
            --diff HEAD "$PR_HEAD" > "$report"
          description="$(jq -r .description "$report")"
          summary="$(jq -r '
            (if .required_checks_read then "" else
              "The committed ruleset lists no readable required checks, so every workflow file is counted.\n\n" end)
            + "Required checks are only as trustworthy as this pull request'"'"'s own workflow YAML. "
            + "This report is visibility, not enforcement.\n\n"
            + ([.flagged | to_entries[] | "- `\(.key)`: \(.value | join(", "))"] | join("\n"))
          ' "$report")"
          {
            echo "### Required-check machinery (advisory)"
            echo
            echo "$description"
            echo
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r .conclusion "$report")" = neutral ]; then
            echo "::warning title=Required-check machinery (advisory)::$description. Required checks are only as trustworthy as this pull request's own workflow YAML; review these files."
          fi
          jq -n --arg head "$PR_HEAD" --arg url "$RUN_URL" --arg title "$description" \
            --arg summary "$summary" --arg conclusion "$(jq -r .conclusion "$report")" '{
              name: "Required-check machinery (advisory)", head_sha: $head,
              status: "completed", conclusion: $conclusion, details_url: $url,
              output: {title: $title, summary: $summary}
            }' | gh api --method POST "repos/$REPOSITORY/check-runs" --input - >/dev/null
