# Posts the `review-verdict` commit status on each pull request's head: the
# repository-side twin of Shipyard's review-before-arm guard, which only sees
# landings sent through ghapp. GitHub-native auto-merge armed before a HOLD
# never reaches that guard; a required review-verdict status would stop it.
#
# The poster job is also the `review-verdict` check run and fails unless the
# head is allowed (the pinned script exits non-zero on a refusal or any read
# error), so a required check cannot be green on a refused head. The rule runs
# from a pinned Shipyard commit, never from the pull request's code, on
# triggers that all run the default branch's definition of this file. See
# Shipyard's docs/review-verdict-status.md.
#
# Once Shipyard's rule allows a head, Pulp's review-item rule runs from the
# default branch's checkout: every review item the head carries (a serialized
# hotspot edit, a header fan-out growth) must be accepted by id in the
# reviewer's exact-head verdict, or it posts a `failure` status over
# Shipyard's `success`. It reads the pull request's commits as git objects and
# never checks them out or runs them. See tools/scripts/review_items.py.
name: Review verdict

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review verdict trigger]
    types: [completed]
  # Backfill: judge every open pull request, so landing or changing this
  # workflow (or running it by hand) gives each one a current status.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-verdict.yml
      - .github/workflows/review-verdict-trigger.yml
      - .github/workflows/review-verdict-merge-group.yml

permissions:
  contents: read
  pull-requests: read
  statuses: write
  # The script re-runs the head's own run when a comment or review changes the
  # verdict, so the head's check run follows it without a new push.
  actions: write

# One group per pull request on every path, so a review's run and a comment's
# run queue behind each other; a fork's review lists no pull request and
# falls back to its head.
concurrency:
  group: review-verdict-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || 'backfill' }}
  cancel-in-progress: false

jobs:
  # The job id and name must equal the required context, as in Vellum, Shipyard
  # and TartCI: the merge steward matches the Actions-bound required check by
  # this check run's name.
  review-verdict:
    name: review-verdict
    if: >-
      github.event_name != 'push' && github.event_name != 'workflow_dispatch'
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    # Shipyard's rule takes seconds; the review-item steps below carry their
    # own step timeouts, and this leaves room for the step that refuses the
    # head when one of them times out.
    timeout-minutes: 25
    steps:
      - name: Check out the pinned rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielraffel/Shipyard
          # Shipyard v0.407.0: the same approval rule as v0.384.0 (an App APPROVE
          # counts only from a session listed in `[auto_merge]
          # reviewer_stamp_sessions`; a HOLD from any session still counts; the
          # author's own approval never counts; nothing carries to a new head). The
          # commit status is `pending`, not `failure`, while a head only awaits its
          # reviewer; the job still fails until the head is allowed.
          ref: 44721a9f214e7836073165f66aa7bd9d26ec014d
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Post review-verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -o pipefail
          "$PYTHON" scripts/review_verdict_status.py | tee "$RUNNER_TEMP/review-verdict.txt"
      - name: Find the head Shipyard's rule allowed
        id: allowed
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/review-verdict.txt"
          head=$(sed -nE 's/^review-verdict: success on ([0-9a-f]{40})$/\1/p' "$out" | tail -n 1)
          prs=$(sed -nE 's/^review-verdict: PR #([0-9]+): allowed: .*/\1/p' "$out" | sort -u | tr '\n' ' ')
          if [ -n "$head" ] && [ -z "$prs" ]; then
            echo "::error::review-verdict allowed $head but named no pull request"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
      - name: Hold the head while its review items are judged
        # A comment's run has just posted Shipyard's `success` on a head whose
        # check may already be green; pending closes that window until the
        # review-item rule below (and the head's own re-run) decides.
        if: steps.allowed.outputs.head != '' && github.event_name != 'pull_request_target'
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.allowed.outputs.head }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=pending \
            -f context=review-verdict -f "description=judging review items for head ${HEAD_SHA:0:12}"
      - name: Check out the default branch's review-item rules
        if: steps.allowed.outputs.head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: pulp-base
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the default branch's history and the head
        # Only the default branch and the head: the merge-base and the head's
        # commits are all the rule reads. Never checked out.
        if: steps.allowed.outputs.head != ''
        shell: bash
        timeout-minutes: 10
        working-directory: pulp-base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.allowed.outputs.head }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet --unshallow \
            origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet origin "$HEAD_SHA"
      - name: Require the verdict to accept every review item
        id: items
        if: steps.allowed.outputs.head != ''
        shell: bash
        timeout-minutes: 5
        working-directory: pulp-base
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.python.outputs.python-path }}
          HEAD_SHA: ${{ steps.allowed.outputs.head }}
          PRS: ${{ steps.allowed.outputs.prs }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Worst result over every PR on the head: 0 accepted, 1 refused
          # (failure status posted), 2 could not be judged.
          rc=0
          for pr in $PRS; do
            r=0
            "$PYTHON" tools/scripts/review_items.py check --root . --repo "$GITHUB_REPOSITORY" \
              --pr "$pr" --head "$HEAD_SHA" --base "origin/$BASE_BRANCH" --post-status \
              --posted-marker "$RUNNER_TEMP/review-items-posted" --target-url "$RUN_URL" || r=$?
            if [ "$r" -gt "$rc" ]; then rc=$r; fi
          done
          if [ "$EVENT_NAME" = pull_request_target ]; then
            # This run's check run sits on the head: it is red unless accepted.
            exit "$rc"
          fi
          if [ "$rc" -eq 0 ]; then
            # The hold step replaced Shipyard's success with pending; the head
            # is allowed and every item accepted, so restore it here rather
            # than rely on the head's re-run (which may find no run to re-run).
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success \
              -f context=review-verdict \
              -f "description=approved; every review item is accepted" \
              -f "target_url=${RUN_URL}" > /dev/null
          fi
          # A comment's run leaves its check run on the default branch, where it
          # gates nothing: a refusal is the posted status, an error fails the run.
          [ "$rc" -le 1 ]
      - name: Refuse the head when the review-item rule could not run
        # Shipyard has posted `success` (or the hold step `pending`). If any
        # step after it failed, timed out or was cancelled, that status must
        # not stand, unless the rule confirmed it already posted a failure.
        if: (failure() || cancelled()) && steps.allowed.outputs.head != ''
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.allowed.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/review-items-posted" ]; then
            echo "the review-item rule already posted a failure status on $HEAD_SHA"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=failure \
            -f context=review-verdict \
            -f "description=review items could not be judged; see the run" \
            -f "target_url=${RUN_URL}"
          exit 1

  # Runs the same pinned script once per open, non-draft pull request that
  # targets main, as if each had just been opened. Only the status is posted;
  # a refusal is expected here and must not fail the run on main, so each
  # pull request's outcome is logged as a warning instead. No pull request code
  # is checked out, and no actions: write is needed (no check is re-run).
  backfill-review-verdict:
    name: backfill-review-verdict
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the pinned rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielraffel/Shipyard
          # Same pinned commit as the review-verdict job.
          ref: 44721a9f214e7836073165f66aa7bd9d26ec014d
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Check out the default branch's review-item rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: pulp-base
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the default branch's history
        timeout-minutes: 10
        working-directory: pulp-base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet --unshallow \
            origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
      - name: Post review-verdict for every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.python.outputs.python-path }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          numbers=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.draft == false) | .number')
          dir=$(mktemp -d)
          total=0
          posted=0
          unsettled=0
          for number in $numbers; do
            total=$((total + 1))
            printf '{"pull_request":{"number":%s}}' "$number" > "$dir/event.json"
            # Inline assignment: GitHub ignores a step-level env override of its
            # default GITHUB_* variables, so the script would see push or
            # workflow_dispatch and post nothing.
            rc=0
            GITHUB_EVENT_NAME=pull_request_target GITHUB_EVENT_PATH="$dir/event.json" \
              "$PYTHON" scripts/review_verdict_status.py > "$dir/out.txt" 2>&1 || rc=$?
            cat "$dir/out.txt"
            if grep -Eq '^review-verdict: (success|failure) on [0-9a-f]{40}$' "$dir/out.txt"; then
              posted=$((posted + 1))
            fi
            # Shipyard's success is not the last word: the same review-item
            # rule as the review-verdict job, from the default branch.
            head=$(sed -nE 's/^review-verdict: success on ([0-9a-f]{40})$/\1/p' "$dir/out.txt" | tail -n 1)
            if [ -n "$head" ]; then
              # Hold the head at pending while its items are judged, so
              # Shipyard's fresh success cannot admit it in the meantime.
              gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" -f state=pending \
                -f context=review-verdict \
                -f "description=judging review items for head ${head:0:12}" > /dev/null \
                || echo "::warning::could not hold $head at pending"
              auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              item_rc=0
              # An unfetched head cannot be read, and the checker then posts failure.
              timeout 300 git -C pulp-base -c "http.https://github.com/.extraheader=$auth" \
                fetch --no-tags --quiet origin "$head" || echo "::warning::could not fetch $head"
              rm -f "$dir/posted"
              (cd pulp-base && timeout 300 "$PYTHON" tools/scripts/review_items.py check --root . \
                --repo "$GITHUB_REPOSITORY" --pr "$number" --head "$head" \
                --base "origin/$BASE_BRANCH" --post-status --posted-marker "$dir/posted" \
                --target-url "$RUN_URL") || item_rc=$?
              if [ "$item_rc" -eq 0 ]; then
                # Allowed and every item accepted: restore the success the hold replaced.
                gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" -f state=success \
                  -f context=review-verdict \
                  -f "description=approved; every review item is accepted" \
                  -f "target_url=${RUN_URL}" > /dev/null || item_rc=2
              fi
              if [ "$item_rc" -ne 0 ] && [ ! -f "$dir/posted" ]; then
                # Refused, killed or timed out without a confirmed failure
                # status: refuse the head here.
                gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" -f state=failure \
                  -f context=review-verdict \
                  -f "description=review items could not be judged; see the run" \
                  -f "target_url=${RUN_URL}" > /dev/null || true
              fi
              if [ "$item_rc" -ne 0 ]; then
                echo "::warning::PR #${number} has review items its verdict does not accept, or they could not be judged"
                rc=1
              fi
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::warning::review-verdict for PR #${number} is refused or could not be posted"
              unsettled=$((unsettled + 1))
            fi
          done
          echo "found ${total} open pull requests; posted ${posted} statuses (${unsettled} refused or errored)"
          if [ "$total" -gt 0 ] && [ "$posted" -ne "$total" ]; then
            echo "::error::posted ${posted} statuses for ${total} open pull requests"
            exit 1
          fi
