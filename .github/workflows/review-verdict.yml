# Posts the `review-verdict` commit status on each pull request's head: the
# repository-side twin of Shipyard's review-before-arm guard, which only sees
# landings sent through ghapp. GitHub-native auto-merge armed before a HOLD
# never reaches that guard; a required review-verdict status would stop it.
#
# The poster job is deliberately NOT named `review-verdict`: a check run from a
# comment, workflow_run or pull_request_target trigger can attach to the default
# branch's commit rather than the pull request's head, so a same-named job would
# leave a second `review-verdict` signal (a red mark on main after a HOLD). The
# commit status the script posts on the exact head is the only `review-verdict`
# signal on a pull request. The rule runs from a
# pinned Shipyard commit, never from the pull request's code, on triggers that
# all run the default branch's definition of this file. See Shipyard's
# docs/review-verdict-status.md.
name: Review verdict

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review verdict trigger]
    types: [completed]
  # Backfill: judge every open pull request, so landing or changing this
  # workflow (or running it by hand) gives each one a current status.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-verdict.yml
      - .github/workflows/review-verdict-trigger.yml
      - .github/workflows/review-verdict-merge-group.yml

permissions:
  contents: read
  pull-requests: read
  statuses: write
  # The script re-runs the head's own run when a comment or review changes the
  # verdict, so the head's check run follows it without a new push.
  actions: write

# One group per pull request on every path, so a review's run and a comment's
# run queue behind each other; a fork's review lists no pull request and
# falls back to its head.
concurrency:
  group: review-verdict-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || 'backfill' }}
  cancel-in-progress: false

jobs:
  post-review-verdict:
    name: post-review-verdict
    if: >-
      github.event_name != 'push' && github.event_name != 'workflow_dispatch'
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pinned rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielraffel/Shipyard
          # Shipyard main at the merge of PR 1086 (a counted HOLD is sticky
          # for its head, so a later APPROVE from another session cannot
          # clear it), on top of PR 1068 (fail the check when the verdict is
          # not allowed and re-run the head's check on a verdict comment).
          ref: e7dc77e866a63ba829aaac0daa0abdbbae374468
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.12'
      - name: Post review-verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"${{ steps.python.outputs.python-path }}" scripts/review_verdict_status.py'

  # Runs the same pinned script once per open, non-draft pull request that
  # targets main, as if each had just been opened. Only the status is posted;
  # a refusal is expected here and must not fail the run on main, so each
  # pull request's outcome is logged as a warning instead. No pull request code
  # is checked out, and no actions: write is needed (no check is re-run).
  backfill-review-verdict:
    name: backfill-review-verdict
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the pinned rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danielraffel/Shipyard
          # Same pinned commit as the post-review-verdict job.
          ref: e7dc77e866a63ba829aaac0daa0abdbbae374468
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.12'
      - name: Post review-verdict for every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.python.outputs.python-path }}
          GITHUB_EVENT_NAME: pull_request_target
        run: |
          set -u
          numbers=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.draft == false) | .number')
          dir=$(mktemp -d)
          total=0
          unsettled=0
          for number in $numbers; do
            total=$((total + 1))
            printf '{"pull_request":{"number":%s}}' "$number" > "$dir/event.json"
            if ! GITHUB_EVENT_PATH="$dir/event.json" "$PYTHON" scripts/review_verdict_status.py; then
              echo "::warning::review-verdict for PR #${number} is refused or could not be posted"
              unsettled=$((unsettled + 1))
            fi
          done
          echo "backfilled ${total} open pull requests (${unsettled} refused or unposted)"
