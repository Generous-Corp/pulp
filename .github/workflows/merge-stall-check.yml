name: Merge-stall check

# Off-fleet "green PRs, but nothing is merging" watchdog.
#
# Runs on ubuntu-latest ON PURPOSE — the same reasoning as
# runner-health-check.yml: a guard that lives on the fleet dies with the fleet.
# The wedge this catches lives in whatever presses the merge button (Shipyard's
# per-host queue-tick held in reap-only mode), so GitHub-hosted is the only
# vantage point that survives it.
#
# The gap it closes
# -----------------
# runner-health-check.yml alarms on a DEAD RUNNER LANE: jobs sitting queued
# because runners died. The incident this guard exists for had the opposite
# shape — every required check GREEN, nothing queued, and still nothing merged
# for hours because the auto-merger was silently held. No job-level signal sees
# "everything is green and nobody is merging"; the only observable is a
# population of merge-ready PRs that stays merge-ready and unmerged.
#
# The alarm predicate (per open PR), all required:
#   1. Every REQUIRED check green (required set read from branch protection at
#      runtime, not hardcoded — falls back to the documented set if the token
#      cannot read protection rules).
#   2. mergeStateStatus in {CLEAN, BEHIND} (DIRTY / BLOCKED / UNSTABLE excluded).
#   3. Auto-merge enabled (a machine, not a human, owns the merge).
#   4. Merge-ready longer than the threshold (default 45 min), measured from the
#      last required check's completion time.
#   ...AND sustained across TWO consecutive sweeps, so a normal in-flight PR
#   that merges within a tick never trips. The cross-tick memory is the set of
#   stuck PR numbers, persisted as a workflow artifact (crash-safe: GitHub holds
#   it independently of this repo or any host).
#
# mergeStateStatus is a GraphQL field; one paginated GraphQL call returns every
# open PR's state. A per-PR REST loop gets rate-limited and returns false
# readings under load — which is exactly how the motivating incident's state
# looked wrong — so collection is GraphQL, in tools/scripts/merge_stall_watchdog.py.
#
# The outcome heartbeat, and why a blind sweep alarms
# ---------------------------------------------------
# The per-PR predicate above still infers health from components. A third
# check asks the outcome directly: nothing has merged for
# `throughput_threshold_minutes` WHILE the merge queue is non-empty. The
# non-empty queue is the denominator — a quiet repository merging nothing is
# correct and must never alarm.
#
# A fourth check reports the sweep's own blindness. A collection failure yields
# zero findings, which reads exactly like a clean bill of health; this guard
# once printed "Merges are flowing" with both of its reads failed, during a
# total merge stall, and finished green. So a failed read is now itself an
# alarm that names the verdicts it could not reach, and a degraded sweep may
# never close a tracker on the strength of an observation it did not make.
#
# Review latency
# --------------
# A fifth check pages when a ready (non-draft) PR has waited more than
# `review_latency_minutes` (default 60) with no verdict naming its current
# head. Reviewers are agents and can stop silently; nothing turns red when they
# do, and the merge-stall predicate cannot see it because arming waits on the
# verdict. It keeps its own tracking issue, maintained by the same function.
# Predicate and tests: tools/scripts/review_latency_watchdog.py.
#
# Issue lifecycle mirrors auto-release-watchdog.yml / runner-health-check.yml:
# one tracking issue, edited in place each sweep, closed automatically on
# recovery. REST search rather than GraphQL for the issue lookup — the shared
# GraphQL quota is regularly exhausted by agent PR polling, and a watchdog must
# not fail when the thing it watches is fine.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      threshold_minutes:
        description: 'Merge-ready age (min) that, sustained two sweeps, opens an issue'
        required: false
        default: '45'
      queue_threshold_minutes:
        description: 'Merge-queue head age (min) without a new batch that opens an issue'
        required: false
        default: '30'
      throughput_threshold_minutes:
        description: 'Minutes with zero merges, while the queue is non-empty, that opens an issue'
        required: false
        default: '90'
      review_latency_minutes:
        description: 'Minutes a ready PR may wait for a verdict on its current head before an issue opens'
        required: false
        default: '60'
      dry_run:
        description: 'Log findings but do not touch the tracking issues'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: merge-stall-check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'schedule' || github.repository == vars.PULP_PRIMARY_REPO
    runs-on: ubuntu-latest
    name: Check for merge-ready PRs that are not merging

    env:
      THRESHOLD_MINUTES: ${{ github.event.inputs.threshold_minutes || '45' }}
      QUEUE_THRESHOLD_MINUTES: ${{ github.event.inputs.queue_threshold_minutes || '30' }}
      THROUGHPUT_THRESHOLD_MINUTES: ${{ github.event.inputs.throughput_threshold_minutes || '90' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      REVIEW_LATENCY_MINUTES: ${{ github.event.inputs.review_latency_minutes || '60' }}
      TRACKING_TITLE: 'Merge stall: green PRs are not merging'
      REVIEW_TRACKING_TITLE: 'Review latency: ready PRs are waiting for a verdict'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore previous-sweep state
        id: restore
        shell: bash
        run: |
          set -euo pipefail

          repo='${{ github.repository }}'
          mkdir -p prev
          echo '{"stuck_prs": []}' > prev/state.json

          # Pull the stuck-PR set from the most recent completed run of THIS
          # workflow. The two-consecutive-sweeps rule needs last sweep's set;
          # the artifact is the crash-safe carrier (GitHub holds it whether or
          # not any tracking issue exists yet). A first-ever run, or a run whose
          # predecessor uploaded nothing, simply starts from the empty set — the
          # worst case is one extra sweep before an alarm can promote.
          runs_json=$(
              gh api "/repos/${repo}/actions/workflows/merge-stall-check.yml/runs?status=completed&per_page=10" \
                  2>/dev/null || echo '{"workflow_runs": []}'
          )
          ids=$(echo "$runs_json" | python3 -c "import json,sys; [print(r['id']) for r in json.load(sys.stdin).get('workflow_runs', [])]")
          for id in $ids; do
              if [ "$id" = "${{ github.run_id }}" ]; then
                  continue
              fi
              if gh run download "$id" -n merge-stall-state -D prev 2>/dev/null; then
                  echo "Restored stuck-PR state from run ${id}."
                  break
              fi
          done
          echo "prev_state=$(cat prev/state.json)"

      - name: Scan open PRs
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/scripts/merge_stall_watchdog.py \
              --repo '${{ github.repository }}' \
              --base main \
              --threshold-minutes "${THRESHOLD_MINUTES}" \
              --queue-threshold-minutes "${QUEUE_THRESHOLD_MINUTES}" \
              --throughput-threshold-minutes "${THROUGHPUT_THRESHOLD_MINUTES}" \
              --prev-state prev/state.json \
              --findings-out findings.json \
              --snapshot-out snapshot.json \
              --state-out state.json \
              --body-out body.md \
              --summary-out "${GITHUB_STEP_SUMMARY}" \
              | tee scan.log

          count=$(python3 -c "import json; print(sum(1 for f in json.load(open('findings.json')) if f['level'] in ('alarm', 'queue_alarm', 'throughput_alarm', 'blind_alarm')))")
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          degraded=$(python3 -c "import json; print('true' if json.load(open('snapshot.json')).get('errors') else 'false')")
          echo "degraded=${degraded}" >> "$GITHUB_OUTPUT"
          echo "Alarm count: ${count}"

      - name: Persist this-sweep state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merge-stall-state
          path: state.json
          retention-days: 7
          if-no-files-found: warn

      - name: Scan review latency
        id: review
        # Its own step, so a failure here never hides the merge-stall result.
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/scripts/review_latency_watchdog.py \
              --repo '${{ github.repository }}' \
              --base main \
              --threshold-minutes "${REVIEW_LATENCY_MINUTES}" \
              --findings-out review-findings.json \
              --snapshot-out review-snapshot.json \
              --body-out review-body.md \
              --summary-out "${GITHUB_STEP_SUMMARY}" \
              | tee review-scan.log

          count=$(python3 -c "import json; print(len(json.load(open('review-findings.json'))))")
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          degraded=$(python3 -c "import json; print('true' if json.load(open('review-snapshot.json')).get('errors') else 'false')")
          echo "degraded=${degraded}" >> "$GITHUB_OUTPUT"
          echo "Review-latency alarm count: ${count}"

      - name: Maintain tracking issues
        if: ${{ !cancelled() && env.DRY_RUN != 'true' }}
        shell: bash
        env:
          COUNT: ${{ steps.scan.outputs.count }}
          DEGRADED: ${{ steps.scan.outputs.degraded }}
          REVIEW_COUNT: ${{ steps.review.outputs.count }}
          REVIEW_DEGRADED: ${{ steps.review.outputs.degraded }}
        run: |
          set -euo pipefail

          repo='${{ github.repository }}'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # maintain_tracker TITLE COUNT DEGRADED BODY_FILE LABELS_JSON RECOVERED
          # One tracking issue per TITLE, edited in place each sweep, closed on
          # recovery, reopened on recurrence.
          maintain_tracker() {
              local title="$1" count="$2" degraded="$3" body_file="$4" labels="$5" recovered="$6"
              local search_json existing_json existing existing_state

              # Look up in both OPEN and CLOSED state so a recovered sweep only
              # closes an OPEN tracker and a recurrence reopens the same issue
              # rather than spawning a new one every 30 minutes.
              search_json=$(
                  gh api --method GET "/search/issues" \
                      -f q="repo:${repo} is:issue in:title ${title}"
              )
              existing_json=$(printf '%s' "$search_json" | TRACKING_TITLE="$title" python3 -c 'import json, os, sys; title = os.environ["TRACKING_TITLE"]; data = json.load(sys.stdin); match = next((item for item in data.get("items", []) if item.get("title") == title), None); print(json.dumps({"number": match.get("number", ""), "state": str(match.get("state", "")).upper()}) if match else "{}")')
              existing=$(echo "$existing_json" | python3 -c "import json, sys; d=json.load(sys.stdin); print(d.get('number','') or '')")
              existing_state=$(echo "$existing_json" | python3 -c "import json, sys; d=json.load(sys.stdin); print(d.get('state','') or '')")

              if [ "$count" -eq 0 ]; then
                  if [ "$degraded" = "true" ]; then
                      # Unreachable while each scan emits a blind_alarm for a
                      # degraded sweep (which its count includes), and kept as a
                      # backstop: a degraded sweep must never close a tracker on
                      # the strength of an observation it did not make.
                      echo "${title}: collection was degraded — preserving any existing tracker until a complete sweep proves recovery."
                      return 0
                  fi
                  if [ -n "${existing:-}" ] && [ "$existing_state" = "OPEN" ]; then
                      echo "${title}: recovered — closing tracker #${existing}."
                      gh api -X POST "/repos/${repo}/issues/${existing}/comments" \
                          -f body="Sweep on $(date -u '+%Y-%m-%d %H:%M UTC') ${recovered}. Closing. (${run_url})"
                      gh api -X PATCH "/repos/${repo}/issues/${existing}" \
                          -f state=closed \
                          -f state_reason=completed
                  else
                      echo "${title}: nothing to report and no open tracker — nothing to do."
                  fi
                  return 0
              fi

              {
                cat "$body_file"
                echo
                echo "**Sweep:** ${run_url}"
              } > issue-body.md

              if [ -z "${existing:-}" ]; then
                  echo "${title}: creating tracking issue."
                  TRACKING_TITLE="$title" LABELS="$labels" python3 -c 'import json, os; body = open("issue-body.md", encoding="utf-8").read(); print(json.dumps({"title": os.environ["TRACKING_TITLE"], "body": body, "labels": json.loads(os.environ["LABELS"])}))' > issue.json
                  gh api -X POST "/repos/${repo}/issues" --input issue.json 2>&1 || {
                      # Labels may not exist on a fresh repo; the tracker matters
                      # more than its tags, so retry without them.
                      TRACKING_TITLE="$title" python3 -c 'import json, os; body = open("issue-body.md", encoding="utf-8").read(); print(json.dumps({"title": os.environ["TRACKING_TITLE"], "body": body}))' > issue.json
                      gh api -X POST "/repos/${repo}/issues" --input issue.json
                  }
              else
                  echo "${title}: updating tracking issue #${existing} in place."
                  gh api -X PATCH "/repos/${repo}/issues/${existing}" -F body=@issue-body.md
                  gh api -X PATCH "/repos/${repo}/issues/${existing}" -f state=open 2>/dev/null || true
              fi
          }

          # A scan that did not finish leaves its count empty; skip its tracker
          # rather than read the gap as a clean sweep.
          if [ -n "${COUNT:-}" ]; then
              maintain_tracker "${TRACKING_TITLE}" "$COUNT" "${DEGRADED:-false}" body.md \
                  '["bug", "ci", "blocks-release"]' \
                  "found no PR stuck merge-ready: merges are flowing (or nothing is ready)"
          else
              echo "${TRACKING_TITLE}: scan did not finish; tracker left as it is."
          fi
          if [ -n "${REVIEW_COUNT:-}" ]; then
              maintain_tracker "${REVIEW_TRACKING_TITLE}" "$REVIEW_COUNT" "${REVIEW_DEGRADED:-false}" review-body.md \
                  '["ci"]' \
                  "found every ready PR with a verdict on its current head, or waiting less than ${REVIEW_LATENCY_MINUTES} min"
          else
              echo "${REVIEW_TRACKING_TITLE}: scan did not finish; tracker left as it is."
          fi

      - name: Upload snapshot + findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merge-stall-findings
          path: |
            findings.json
            snapshot.json
            review-findings.json
            review-snapshot.json
          retention-days: 14
          if-no-files-found: ignore
