# Pulp host and golden toolchain authority. Generated consumers carry this digest.
schema = 1

[toolchain]
# Every value is an exact version; generate.py refuses a floating selector
# ("homebrew", "stable", "latest", a bare "3.12"). A platform that still takes
# a tool from its own package manager says so below as an override. Whether a
# pin is already true on the required gate or is a target the gate must still
# reach is recorded per tool in [evidence]; a target is not an observation.
xcode = "26.5"
xcode_build = "17F42"
cmake = "4.3.3"
ninja = "1.13.2"
python = "3.14.4"
node = "26.10.0"
rust = "1.97.1"
rust_targets = ["x86_64-apple-darwin"]
rust_components = ["rustfmt", "clippy"]
tart = "2.38.0"
clang_format = "21.1.8"

[evidence]
# observed: the required gate already runs this exact version (source named).
# target: chosen, not yet what the gate runs; the golden receipt must show it
# before enforcement. The golden facts come from a read-only mount of m3's
# pulp-build-runner:latest disk (2026-10-12): Xcode.app version.plist,
# /opt/homebrew/Cellar, and the rustup channel manifest.
xcode = { status = "observed", source = "golden /Applications/Xcode.app version.plist: 26.5 (17F42); gate compiler Apple clang 21.0.0 (clang-2100.1.1.101)" }
cmake = { status = "observed", source = "gate setup.sh prints 'cmake 4.3.3' on m3, m5 and m5s gate VMs; golden Cellar/cmake/4.3.3" }
ninja = { status = "observed", source = "golden Cellar/ninja/1.13.2; every host runs 1.13.2" }
python = { status = "observed", source = "gate configure 'Found Python3 ... 3.14.4'; golden Cellar/python@3.14/3.14.4_1 is python3" }
node = { status = "target", source = "golden runs Homebrew node 26.0.0; hosts run 26.7.0 to 26.10.0 (m5s nvm 24.21.0); 26.10.0 is the newest a host runs" }
rust = { status = "observed", source = "golden rustup stable toolchain is rustc 1.97.1 with the x86_64-apple-darwin std; release-cli darwin legs print cargo 1.97.1. The golden got it from a floating 'stable' install, so a rebake can move it until rust-toolchain.toml pins it" }
tart = { status = "target", source = "tart runs on the hosts, not in the VM: m5s runs gate VMs on 2.38.0, m3, m1 and m5 still run 2.36.0" }
clang_format = { status = "target", source = "the hosted format check pins PyPI clang-format 21.1.8; the golden has no clang-format at all" }

[mise]
# The mise binary itself is part of the pin: built from source at this tag and
# commit, installed by digest, never self-updated. The lock is only
# reproducible with the same mise: releases before this one select aqua
# version-prefix overrides and percent-encoded release URLs differently, so
# the same [tools] table can lock to different URLs.
version = "2026.10.8"
source_commit = "b671d356aaf33b87e48e7469a77abb40c3553c68"
lock_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64", "windows-arm64", "windows-x64"]
# warn: nothing refuses an environment yet. enforce: emits a hard min_version.
enforcement = "warn"
# sha256 of the committed mise.toolchain.lock. generate.py --lock writes it; the drift
# test refuses a lock whose bytes do not hash to it, so a lock edit shows
# up as a change to this reviewed file.
lock_sha256 = "3e3d93b19c8ea8f1b8f034e5713bdae59c7c9552d1f26ab725e6309d53b39a05"

# The installed binary hosts run, checked by digest (tools/toolchain/check_env.py).
# Self-update is off for it: its lib/mise-self-update-instructions.toml points
# at `pulp deps update mise`. macos-arm64 is the build live on m1, m3, m5 and
# m5s since 2026-10-12. A rebuild from source_commit that hashes differently is
# a reproducibility finding to investigate, not a replacement. A platform with
# no digest here is reported as unpinned, never as a match.
[mise.binary]
path = "~/.local/opt/mise-2026.10.8/bin/mise"
sha256 = { macos-arm64 = "87c18142dd67f5848b0236738eb9338976329266937ecd79b11121de64dd2d47" }

# One table per tool mise installs. Rust is deliberately absent: rustup
# installs it and cargo reads rust-toolchain.toml, so the lock never records
# it (mise could only lock a version string, with no checksum). Every locked
# URL must start with one of url_prefixes, which name the backend's own
# repository or distribution; `unlocked` lists, with the reason, each lock
# platform the tool deliberately has no entry for.
[mise.tools.cmake]
backend = "aqua:Kitware/CMake"
url_prefixes = ["https://github.com/Kitware/CMake/releases/download/", "https://api.github.com/repos/Kitware/CMake/releases/assets/"]

[mise.tools.ninja]
backend = "aqua:ninja-build/ninja"
url_prefixes = ["https://github.com/ninja-build/ninja/releases/download/", "https://api.github.com/repos/ninja-build/ninja/releases/assets/"]

[mise.tools.python]
backend = "core:python"
url_prefixes = ["https://github.com/astral-sh/python-build-standalone/releases/download/", "https://api.github.com/repos/astral-sh/python-build-standalone/releases/assets/"]

[mise.tools.node]
backend = "core:node"
url_prefixes = ["https://nodejs.org/dist/"]

[mise.tools.tart]
# Tart publishes from openai/tart (cirruslabs/tart redirects to the same repository).
backend = "aqua:openai/tart"
url_prefixes = ["https://github.com/openai/tart/releases/download/", "https://api.github.com/repos/openai/tart/releases/assets/"]
unlocked = { linux-arm64 = "tart runs only on macOS hosts", linux-x64 = "tart runs only on macOS hosts", windows-arm64 = "tart runs only on macOS hosts", windows-x64 = "tart runs only on macOS hosts" }

[mise.tools.clang_format]
# The same LLVM 21.1.8 release CI installs from PyPI; the PyPI route cannot be
# installed with `mise install --locked`.
backend = "conda:clang-format"
url_prefixes = ["https://conda.anaconda.org/conda-forge/"]
unlocked = { windows-arm64 = "conda-forge publishes no windows-arm64 clang-format; that platform keeps its own" }

[shipyard]
# Shipyard is CI and PR orchestration, never a build input: it is not in
# .mise.toolchain.toml, check_env.py never reports it, and no build or test
# path runs it. generate.py writes this version and repo into
# tools/shipyard.toml (which Shipyard itself reads) and the digests into
# tools/toolchain/shipyard.sha256, which tools/install-shipyard.sh checks every
# download against before installing. The digests are the release's own
# checksums.sha256; `generate.py --shipyard <tag>` rewrites this table from it.
version = "v0.269.1"
repo = "danielraffel/Shipyard"

[shipyard.assets]
"shipyard-linux-arm64" = "8d723c275e8ae8f01d07b5ca15234baabe7b043b6919e43af9eaf96f003ff738"
"shipyard-linux-x64" = "327dd4b5f72a9dcc225655a61cdd10aefada94960b5611649f90b03f32b4e689"
"shipyard-macos-arm64.dmg" = "73c426a8a6f949b22c96818d2bc5c60685fbbfcca870318b65fec58d2f056588"
"shipyard-windows-x64.exe" = "789f53ee7fae7b28fc349e6da9fce1c127ad50a26e8010135acd4a77414f28a8"
"shipyard-workstream-provider-linux-arm64" = "6999564bde0f70d0b98dd9118c00da6ef8a5a52a71f927298df2094ca1d074fe"
"shipyard-workstream-provider-linux-x64" = "6ee621c2f60b0ad27407b383f977e9e2b2776db241199b068920769cdfd7837d"
"shipyard-workstream-provider-windows-x64.exe" = "27ff9704767de3c59dfcde418beba55dd87f9ecfa43f79d763c7de59f2618ea7"

[npm]
# Project dependencies install with `npm ci` from these committed lockfiles,
# never `npm install`, so a configure cannot run against a partial tree.
prefixes = ["tools/import-design/jsx-runtime", "tools/scripts"]

[platform.intel]
rust = true
rust_targets = ["x86_64-apple-darwin"]

[platform.linux]
cmake = "system" # exception: apt cmake until the tartci bake installs from mise.toolchain.lock
rust = "absent"

[platform.windows]
cmake = "system" # exception: choco cmake until the tartci bake installs from mise.toolchain.lock
rust = "absent"


[packages]
brew = ["git", "git-lfs", "gh", "rsync", "ccache", "jq", "coreutils", "tailscale", "cmake", "ninja", "node", "python@3.12", "rustup", "clang-format"]
apt = ["build-essential", "cmake", "ninja-build", "git", "pkg-config", "ccache", "python3", "python3-pip", "libicu-dev", "libegl1-mesa-dev", "libgbm-dev", "libdrm-dev", "libx11-dev", "libxext-dev", "libxrandr-dev", "libxcursor-dev", "libxi-dev", "libxinerama-dev", "libwayland-dev", "libxkbcommon-dev", "libasound2-dev", "libpulse-dev", "gcc-x86-64-linux-gnu", "g++-x86-64-linux-gnu", "binfmt-support", "libc6:amd64", "libstdc++6:amd64", "libgcc-s1:amd64", "zlib1g:amd64", "libtinfo6:amd64", "libxml2:amd64"]
choco = ["git", "cmake", "ninja", "python3"]
