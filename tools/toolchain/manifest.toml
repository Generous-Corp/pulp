# Pulp host and golden toolchain authority. Generated consumers carry this digest.
schema = 1

[toolchain]
# Every value is an exact version. generate.py refuses a floating selector
# ("homebrew", "stable", "latest", a bare major.minor) here; a platform that
# still installs a tool from its own package manager declares that below as an
# override, and generate.py lists it as an exception rather than a pin.
# Each pin is the newest version the required macOS gate already ran on:
#   python 3.14.4 and cmake 4.3.3 from the gate's CMake configure output,
#   rust 1.97.1 from the macOS gate-VM release legs (and Shipyard's pin),
#   clang-format 21.1.8 from the hosted format check's PyPI pin.
xcode = "26.5"
cmake = "4.3.3"
ninja = "1.13.2"
python = "3.14.4"
node = "26.10.0"
rust = "1.97.1"
rust_targets = ["x86_64-apple-darwin"]
rust_components = ["rustfmt", "clippy"]
tart = "2.38.0"
clang_format = "21.1.8"

[mise]
# The mise binary itself is part of the pin: built from source at this tag and
# commit, installed by digest, never self-updated. The lock is only
# reproducible with the same mise: releases before this one select aqua
# version-prefix overrides and percent-encoded release URLs differently, so
# the same [tools] table can lock to different URLs.
version = "2026.10.8"
source_commit = "b671d356aaf33b87e48e7469a77abb40c3553c68"
lock_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64", "windows-arm64", "windows-x64"]
# warn: report a mismatch and continue. enforce: refuse. See check_env.py.
enforcement = "warn"

[npm]
# Project dependencies install with `npm ci` from these committed lockfiles,
# never `npm install`, so a configure cannot run against a partial tree.
prefixes = ["tools/import-design/jsx-runtime", "tools/scripts"]

[platform.intel]
rust = true
rust_targets = ["x86_64-apple-darwin"]

[platform.linux]
cmake = "system" # exception: apt cmake until the tartci bake installs from mise.lock
rust = "absent"

[platform.windows]
cmake = "system" # exception: choco cmake until the tartci bake installs from mise.lock
rust = "absent"


[packages]
brew = ["git", "git-lfs", "gh", "rsync", "ccache", "jq", "coreutils", "tailscale", "cmake", "ninja", "node", "python@3.12", "rustup", "clang-format"]
apt = ["build-essential", "cmake", "ninja-build", "git", "pkg-config", "ccache", "python3", "python3-pip", "libicu-dev", "libegl1-mesa-dev", "libgbm-dev", "libdrm-dev", "libx11-dev", "libxext-dev", "libxrandr-dev", "libxcursor-dev", "libxi-dev", "libxinerama-dev", "libwayland-dev", "libxkbcommon-dev", "libasound2-dev", "libpulse-dev", "gcc-x86-64-linux-gnu", "g++-x86-64-linux-gnu", "binfmt-support", "libc6:amd64", "libstdc++6:amd64", "libgcc-s1:amd64", "zlib1g:amd64", "libtinfo6:amd64", "libxml2:amd64"]
choco = ["git", "cmake", "ninja", "python3"]
