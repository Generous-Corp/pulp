model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_provider = "subrouter_repair"
approval_policy = "never"
sandbox_mode = "workspace-write"

[model_providers.subrouter_repair]
name = "M3 Subrouter repair lease"
base_url = "__SUBROUTER_CODEX_BASE_URL__"
env_key = "SUBROUTER_REPAIR_TOKEN"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 1
stream_max_retries = 1

[sandbox_workspace_write]
network_access = false

[features]
plugins = false
apps = false
browser_use = false
in_app_browser = false
computer_use = false
image_generation = false
memories = false
multi_agent = false
multi_agent_v2 = false
goals = false
