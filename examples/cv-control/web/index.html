<!doctype html>
<meta charset="utf-8">
<title>Pulp CV Face Tone</title>
<style>body{font:16px system-ui;max-width:52rem;margin:2rem auto;padding:0 1rem}video{width:320px;transform:scaleX(-1)}button{padding:.6rem 1rem}#status{white-space:pre-wrap}</style>
<h1>Pulp CV Face Tone</h1>
<p>Browser camera → MediaPipe Face Landmarker → shared Pulp C++ mapping and modulation.</p>
<button id="start">Start camera and audio</button>
<button id="stop" disabled>Stop</button>
<label>Brightness base <input id="brightness" type="range" min="0" max="1" step="0.01" value="0.35"></label>
<video id="camera" autoplay muted playsinline></video>
<pre id="status">Idle</pre>
<script type="module">
import { sendControlSample } from "./control_input.mjs";
import { createWamAdapter } from "../../../packages/pulp-web-player/src/adapters/wam.js";

const PARAM_BRIGHTNESS = 100;
const WORKLET_DSP = "../../web-demos/wasm-build/build/CvFaceToneWorklet.js";
const WORKLET_PROCESSOR = "../../../packages/pulp-web-player/src/vendor/pulp-wasm/wam-processor.js";
const status = (s) => document.querySelector("#status").textContent = s;
let active = null;

async function stop(session = active) {
  if (!session) return;
  const wasActive = active === session;
  if (wasActive) active = null;
  if (session.raf) cancelAnimationFrame(session.raf);
  session.raf = 0;
  if (session.adapter) {
    sendControlSample(session.adapter, 0, false);
    session.adapter.scheduleMidi(0x80, 60, 0);
    session.adapter.destroy();
    session.adapter = null;
  }
  const landmarker = session.landmarker;
  session.landmarker = null;
  landmarker?.close();
  const stream = session.stream;
  session.stream = null;
  stream?.getTracks().forEach((track) => track.stop());
  const video = document.querySelector("#camera");
  if (video.srcObject === stream) video.srcObject = null;
  const ctx = session.ctx;
  session.ctx = null;
  if (ctx && ctx.state !== "closed") await ctx.close();
  if (wasActive) {
    document.querySelector("#start").disabled = false;
    document.querySelector("#stop").disabled = true;
    status("Stopped");
  }
}

async function ensureActive(session) {
  if (session !== active) {
    await stop(session);
    throw new DOMException("Session stopped", "AbortError");
  }
}

async function start() {
  if (active) return;
  const session = {stream: null, ctx: null, adapter: null, landmarker: null, raf: 0};
  active = session;
  document.querySelector("#start").disabled = true;
  document.querySelector("#stop").disabled = false;
  const video = document.querySelector("#camera");
  try {
  // Create/resume audio in the click's user activation, before permission awaits.
  const ctx = new AudioContext();
  session.ctx = ctx;
  await ctx.resume();
  await ensureActive(session);
  const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
  session.stream = stream;
  await ensureActive(session);
  video.srcObject = stream;
  await video.play();
  await ensureActive(session);
  const adapter = await createWamAdapter(ctx, {dsp: WORKLET_DSP, processor: WORKLET_PROCESSOR});
  session.adapter = adapter;
  await ensureActive(session);
  adapter.audioNode.connect(ctx.destination);
  const {FilesetResolver, FaceLandmarker} = await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs");
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
  await ensureActive(session);
  const landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true
  });
  session.landmarker = landmarker;
  await ensureActive(session);
  adapter.setParameterValue(PARAM_BRIGHTNESS, Number(document.querySelector("#brightness").value));
  adapter.scheduleMidi(0x90, 60, 80);
  let sequence = 0;
  const tick = () => {
    if (session !== active) return;
    try {
      const result = landmarker.detectForVideo(video, performance.now());
      const categories = result.faceBlendshapes?.[0]?.categories || [];
      const mouth = categories.find((x) => x.categoryName === "jawOpen")?.score || 0;
      const tracked = result.faceLandmarks?.length > 0;
      sendControlSample(adapter, mouth, tracked);
      ++sequence;
      status(`provider: MediaPipe Face Landmarker\nsequence: ${sequence}\n` +
        `mouth_open: ${mouth.toFixed(3)}\ntracked: ${tracked}`);
      session.raf = requestAnimationFrame(tick);
    } catch (e) {
      stop().then(() => status(`Tracking error: ${e}`));
    }
  };
  session.raf = requestAnimationFrame(tick);
  } catch (e) {
    const wasActive = active === session;
    await stop(session);
    if (wasActive && e?.name !== "AbortError") status(`Error: ${e}`);
  }
}

document.querySelector("#start").addEventListener("click", start);
document.querySelector("#stop").addEventListener("click", stop);
document.querySelector("#brightness").addEventListener("input", (e) => {
  active?.adapter?.setParameterValue(PARAM_BRIGHTNESS, Number(e.target.value));
});
document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
</script>
