# Pulp decisions contract — machine-readable, layered, agent-neutral.
#
# WHAT THIS IS
#   Settled build-system / CI / release-automation decisions that agents
#   (Claude, Codex, humans) must read at plan time before proposing changes to
#   fleet or CI configuration. Each decision was bought with a concrete
#   incident. Proposing to reverse one requires first proving the motivating
#   incident class can no longer occur — see [meta].reversal_rule.
#
# LAYERING (doc 21 — layered portable contract)
#   * layer = "default": generic scars that ANY repo using Shipyard + tartci +
#     self-hosted runners inherits for free. Repo-agnostic best practice.
#   * layer = "pulp": this repo's overlay — native/GPU/multi-format-plugin,
#     warm-dir ODR, the CMakeLists VERSION-line + skill-sync collision, the
#     macOS required gate, no paid overflow runners. Extends/overrides default.
#   A different repo inherits the same "default" rows and swaps its own overlay.
#
# PUBLIC-SAFE (doc 24 — public pulp never requires Shipyard/tartci/fleet)
#   This file is opt-in context. A public user running cmake / ctest / pulp
#   build never needs it. It carries NO account emails, NO chat topology, and
#   NO private host names — only issue numbers, env-var names, and file paths
#   that already appear in the public repo. The read surface + hooks that
#   consume it are advisory and no-op for external contributors.
#
# READ SURFACE (agent-neutral)
#   tools/scripts/decisions_contract.py is the one checker both agents call.
#     validate : parse + schema-check this file            (exit 0 / 2)
#     surface  : given changed paths, print the matching rows (advisory, exit 0)
#     list     : dump rows, optionally filtered by --layer
#     probe    : evaluate rows carrying a `probe` against observed state
#                (`--landing-json FILE`, or `--live` to shell out to
#                `shipyard landing --json`, which needs Shipyard >= 0.208.0;
#                manual, never a gate)
#   A row may carry `probe`: one table or an array of tables
#   {source = "shipyard-landing", path = ".a.b", equals = <scalar>}. A probe
#   whose path is missing, or whose value is anything but `equals` (including
#   an UNKNOWN verdict), FAILS; nothing unobserved ever counts as confirmed.
#   Each decision's `guards` are glob patterns over fleet/CI config paths ONLY;
#   a change that touches none of them surfaces nothing (the external-contributor
#   no-op). `tags` are the re-proposal keywords (merge-queue, namespace,
#   depend-mode, squash, auto-rebase, bump-at-merge, static-names, …).

[schema]
version = 1
kind = "pulp.decisions-contract"
# Fleet/CI config path globs. A change touching none of these is a no-op for
# the read surface (this is the external-contributor guarantee). Individual
# decisions narrow within this set via their own `guards`.
config_paths = [
    ".github/workflows/**",
    ".shipyard/config.toml",
    ".shipyard.local/**",
    "tools/shipyard.toml",
    "tools/local-ci/**",
    "tools/ci/**",
    "tools/scripts/gpu_trace_overhead_acceptance.py",
    "tools/scripts/gpu_trace_overhead_scope.json",
    ".agents/contract.toml",
    "tools/toolchain/**",
    "experimental/pulp-rs/rust-toolchain.toml",
    ".mise.toml",
    ".mise.toolchain.toml",
    "mise.toolchain.lock",
    ".githooks/**",
]

[meta]
reversal_rule = """
Most "obviously wrong" designs here are scar tissue. Before proposing removal,
find the incident that installed the decision and prove that incident class can
no longer occur (Step Zero of the friction-report loop). Two confident proposals
were retracted in one week for skipping this.
"""
enforcement_boundary = """
The authoritative block is the agent-neutral CLI + CI/server-side required
checks. Hooks (Claude PreToolUse, Codex SessionStart/PostToolUse) are
defense-in-depth / context / audit ONLY — Codex PreToolUse cannot hard-block, so
no hook is the boundary. This contract is a read-at-start pointer, not a veto.
"""

# ─────────────────────────────────────────────────────────────────────────────
# DEFAULT LAYER — inherited by any Shipyard + tartci + self-hosted repo
# ─────────────────────────────────────────────────────────────────────────────

[[decision]]
id = 1
layer = "default"
tags = ["staged-rollout", "queue-tick", "reap-only"]
title = "A staged-rollout gate stays in its conservative mode until graduated by a canary + scenario battery."
why = "A proven janitor (reap) must not be blind-flipped into an unobserved merge actor on the gating path."
do_not = "Flip all hosts to the active mode at once: it trades a proven-safe behavior for an unobserved one on the path that gates every merge."
guards = [".github/workflows/**", "tools/ci/**", "tools/local-ci/**"]

[[decision]]
id = 2
layer = "default"
tags = ["auto-rebase", "behind", "dirty", "update-branch"]
title = "No unattended rebase of BEHIND/DIRTY PRs. The single fenced carrier may merge-update a BEHIND, armed, approved PR, never DIRTY."
why = "A scripted rebase once mis-resolved the version line and flattened a PR's diff. GitHub's merge-only update-branch rewrites nothing and refuses on conflict, and the own-lines invariant checks every update against the approved head."
do_not = "Rebase unattended; touch a DIRTY or CONFLICTING PR; update before Q1 and the own-lines invariant exist; update an unarmed PR, or a head that moved since its approval record; update more than 2 times per PR per day, or while a required run on the head is live."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 3
layer = "default"
tags = ["adopt-head", "recovery"]
title = "Never auto --adopt-head; recovery pins the stored SHA, and a head change is reported, not adopted."
why = "--adopt-head can validate and merge a force-push the agent never intended."
do_not = "Head adoption: it reintroduces merge-unintended-head by construction."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 4
layer = "default"
tags = ["static-names", "runner-names", "held", "retry-storm"]
title = "Self-hosted runner names are EPHEMERAL, never static; a runnerless required lane is HELD, never a retry storm."
why = "A static runner-name zombie (HTTP 409/422, token lacking admin) once blocked every PR ~1h; the ephemeral lane kept serving."
do_not = "Static runner names or blind re-dispatch: a reused name collides with its own corpse."
guards = [".github/workflows/**", "tools/local-ci/**", "tools/ci/**"]

[[decision]]
id = 5
layer = "default"
tags = ["branch-protection", "auto-merge"]
title = "A repo with no branch protection cannot host required-check-based auto-merge; host-side mechanisms must cover it."
why = "Arming GitHub-native auto-merge where no required check exists is a silent no-op."
do_not = "Arming GitHub auto-merge on an unprotected repo: it does nothing."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 6
layer = "default"
tags = ["pinned-version", "fleet-version"]
title = "One pinned CI-tool version fleet-wide."
why = "Version drift across hosts (e.g. 0.68.0 vs 0.70.0) gives divergent gate semantics between machines validating the same PR."
do_not = "Per-host version experiments."
guards = ["tools/shipyard.toml", ".github/workflows/**"]

[[decision]]
id = 12
layer = "default"
tags = ["recovery", "auto-merge", "never-merge"]
title = "Recovery VALIDATES, never merges; merges happen only via the platform's native auto-merge or the CI tool's fail-closed auto-merge."
why = "A recovery path with its own merge code is a second, untested merge implementation."
do_not = "A recovery path that merges directly."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 13
layer = "default"
tags = ["reap", "open-state", "fail-closed"]
title = "Never reap an OPEN work-state record; fail closed on read errors."
why = "The large safe reap discarded only MERGED/CLOSED records; reaping OPEN converts 'recovery pending' into 'PR forgotten'."
do_not = "Reaping OPEN records, or failing open on a read error."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 14
layer = "default"
tags = ["retry", "terminal-failure"]
title = "Terminal validation failures are NOT retried; only interruptions, bounded attempts, with persisted backoff."
why = "Retrying a genuine failure is infinite background load on the gate."
do_not = "Retry-until-green on real failures."
guards = [".github/workflows/**", ".shipyard/config.toml", "tools/ci/**"]

[[decision]]
id = 15
layer = "default"
tags = ["recovery", "cross-host", "fencing", "carrier", "singleton"]
title = "One fenced carrier fleet-wide acts on GitHub facts alone; every other host is inert. Host-local recovery stays origin-host-only."
why = "Host-local state stores have no fencing token, so two hosts acting from them would race. Dead-owner PRs (#9650 3.4 d, #9658 never re-armed, 27 min to 37.5 h to first fix) showed the carrier is needed. Fencing: exactly one host runs --mode live --authority; every other install is inert, and the quarantine stops a second live controller. That controller reads only GitHub, under a host lock and a write-ahead intent."
do_not = "Install a second live controller; let a controller act from host-local state; act on a PR whose head has no approval record; skip the inert canary before live."
guards = ["tools/ci/**", "tools/local-ci/**"]

[[decision]]
id = 18
layer = "default"
tags = ["uncommitted", "worktrees", "commit-early"]
title = "Uncommitted work is unrecoverable BY DESIGN; the mitigation is habit (commit early, work in worktrees), not a mechanism."
why = "Session/agent relaunches kill in-flight state; no layer resurrects uncommitted bytes."
do_not = "Any 'mechanism' to resurrect uncommitted work: it is a governing agent in disguise."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 20
layer = "default"
tags = ["ghapp", "depend-mode", "ccache", "3504"]
title = "Use the app-authenticated wrapper for all GitHub reads; ccache depend-mode stays OFF (issue 3504)."
why = "Anonymous/bare reads trip rate-limit false positives; ccache depend-mode is a known correctness scar (issue 3504)."
do_not = "'Simplifying' auth to bare gh/anon curl, or turning ccache depend-mode ON for speed."
guards = [".github/workflows/**", "tools/ci/**"]

# ─────────────────────────────────────────────────────────────────────────────
# PULP OVERLAY — this repo only (native/GPU/plugin, warm dirs, macOS gate)
# ─────────────────────────────────────────────────────────────────────────────

[[decision]]
id = 7
layer = "pulp"
tags = ["namespace", "paid-runners", "cost"]
title = "No paid overflow (Namespace) runners; never point PULP_NAMESPACE_*_RUNS_ON_JSON at self-hosted."
why = "Cost, plus a hijacked var once dumped sanitizer lanes onto the required gate's hardware and broke it across PRs."
do_not = "Repurposing PULP_NAMESPACE_*_RUNS_ON_JSON for anything, or auto-routing to paid cloud runners."
guards = [".github/workflows/**", "tools/local-ci/**", "tools/ci/**"]

[[decision]]
id = 8
layer = "pulp"
tags = ["warm-dir", "odr", "clean-per-run", "ccache"]
title = "Warm build dirs on self-hosted; ODR-prone lanes stay on GitHub-hosted UNTIL the ccache fix + clean-per-run/VM prerequisite lands."
why = "Warm-dir ODR is a known class (SEGFAULT/exit-8 false reds AND false greens masking a real main break); fresh builds are ~25 min."
do_not = "'Clean every run' WITHOUT first fixing shared ccache (doubles gate time), or moving heavy lanes onto warm dirs (reintroduces ODR on the gate)."
guards = [".github/workflows/**", ".shipyard/config.toml", "tools/ci/**"]

[[decision]]
id = 22
layer = "pulp"
tags = ["a2t-scope-history", "history-base", "re-pin", "gpu-trace-overhead"]
title = "A2T keeps immutable authority separate from a rolling, bounded revision-history window."
why = "The immutable authority delta must remain auditable, while a forever-growing revision walk eventually makes every PR fail for elapsed repository history rather than a product defect."
do_not = "Raise A2T_SCOPE_HISTORY_LIMIT or move A2T_SCOPE_BASE to re-arm the timer; re-pin only A2T_SCOPE_HISTORY_BASE on protected main at 75%, retaining roughly 25% of the window."
guards = ["tools/scripts/gpu_trace_overhead_acceptance.py", "tools/scripts/gpu_trace_overhead_scope.json"]

[[decision]]
id = 9
layer = "pulp"
tags = ["debug-lane", "mac-lane", "release"]
title = "One unoptimised (-O0) full-suite lane exists on purpose: .github/workflows/debug-o0.yml, clean on GitHub-hosted, nightly on main and dispatchable per PR head. The Shipyard macOS host lane is opt-in, not default (`[targets.mac] default = false`, run with `--target mac`), and when requested it builds DEBUG until debug-o0.yml has been green on main."
why = "-O0 caught a real ODR/UB (snap_to_zero) that a Release build masks by inlining. Run once per worktree on the shared host it costs a second full Debug tree per worktree and ~27 min of up to 12 cores per run, while its reds were not acted on (134 of 180 mapped PRs merged over a red local lane). On 2026-09-30 it was made opt-in: 1 of 147 runs passed after 2026-09-02, 64 of 64 failed in the preceding week at ~42 host-hours on one Mac, and PRs merged on the required GitHub checks regardless, so running it by default bought cost without a verdict anyone used."
do_not = "Removing the -O0 lane, running it in a warm self-hosted build dir (row #8), or flipping the Shipyard host lane to Release before debug-o0.yml is green on main and the changed-surface inventory contract is re-pinned for the Release lane."
guards = [".shipyard/config.toml", ".github/workflows/**"]

[[decision]]
id = 10
layer = "pulp"
tags = ["bump-at-merge", "version-bump", "in-branch", "version-at-land", "pending-intent-liveness", "1008"]
title = "Every merge to main declares its version intent pre-merge (Version-Bump trailer, gated at PR time); version-at-land applies it after land; an intent the bot has not applied within the drain cadence alarms (pending-intent liveness)."
why = "A fix once merged bumpless (issue 1008) → no tag → no release, silently. Bump-at-merge was proposed 2026-07-14 and retracted the same day because it lost the pre-merge guarantee. Version-at-land keeps that guarantee by gating the declared intent at PR time; the bot's bump PR (e.g. #10251) only applies it. The row previously read 'the bump lives IN THE BRANCH' after version-at-land had graduated, which sent the 2026-10-14 release-stall plan to a ruling it did not need; rewritten per that ruling."
do_not = "Reintroduce in-branch bump commits as a requirement; ship a land-time writer without the pending-intent liveness alarm; squash (row 16)."
guards = [".github/workflows/**", ".shipyard/config.toml"]

[[decision]]
id = 11
layer = "pulp"
tags = ["merge-queue", "ruleset", "enqueue", "auto-merge"]
title = "Pulp main lands through the LIVE merge queue (ruleset main-merge-queue): enqueue, never hand-merge a backlog."
why = "Ruleset main-merge-queue is enforcement=active, grouping ALLGREEN, up to 5 entries per merge, method MERGE. With strict up-to-date protection on (decision 17), each hand merge makes every other open PR behind and re-runs its full required gate, a treadmill by construction; the queue batches instead. Two API reads lie about it: classic branch protection omits a ruleset-based queue entirely, and REST pulls/<n>.auto_merge (and GraphQL autoMergeRequest) read null for a PR the queue already holds."
do_not = "Hand-merging or rebasing PRs one at a time; concluding the queue is absent from branch protection (query repos/<o>/<r>/rulesets); reading auto_merge == null as 'not queued' (read GraphQL mergeQueueEntry); or enqueueing with a method other than MERGE (decision 16)."
guards = [".github/workflows/**", ".shipyard/config.toml"]
probe = [
    { source = "shipyard-landing", path = ".merge_queue.verdict.verdict", equals = "present" },
    { source = "shipyard-landing", path = ".merge_queue.verdict.value.enforcement", equals = "active" },
    { source = "shipyard-landing", path = ".merge_queue.verdict.value.grouping_strategy", equals = "ALLGREEN" },
    { source = "shipyard-landing", path = ".merge_queue.verdict.value.merge_method", equals = "MERGE" },
    { source = "shipyard-landing", path = ".merge_queue.verdict.value.max_entries_to_merge", equals = 5 },
]

[[decision]]
id = 16
layer = "pulp"
tags = ["squash", "auto-merge", "bump-marker"]
title = "Pulp auto-merge uses --merge, never squash."
why = "Squash folds the bump-marker commit into the squash, tripping an auto-release false alarm."
do_not = "Switching to squash for 'clean history'."
guards = [".github/workflows/**", "tools/ci/**"]

[[decision]]
id = 17
layer = "pulp"
tags = ["strict", "branch-protection", "up-to-date"]
title = "strict up-to-date branch protection stays ON for pulp main."
why = "It is what keeps main always-green; the stale-base silent-revert class lives in non-strict merges."
do_not = "Disabling strict to kill the rebase treadmill (the merge queue is the cure, not disabling strict)."
guards = [".github/workflows/**"]
probe = [
    { source = "shipyard-landing", path = ".strict.verdict.verdict", equals = "present" },
    { source = "shipyard-landing", path = ".strict.verdict.value", equals = true },
]

[[decision]]
id = 19
layer = "pulp"
tags = ["skill-sync", "version-bump", "gates", "prepush"]
title = "Skill-sync + version-bump gates are enforcing; the only bypass is per-commit trailers, never the nuclear skip."
why = "Advisory mode burned 80+ min/PR; a nuclear PULP_SKIP_PREPUSH on a new commit burned a roundtrip anyway."
do_not = "PULP_SKIP_PREPUSH=1 on new commits to dodge a gate; use the scoped Skill-Update / Version-Bump trailers instead."
guards = [".github/workflows/**", ".shipyard/config.toml"]

[[decision]]
id = 21
layer = "pulp"
tags = ["could-not-establish", "exit-codes", "skip-return-code", "typed-verdict"]
title = "No shared 'could not establish' exit code and no static SKIP_RETURN_CODE ledger: a check emits its own verdict, and its CONSUMER names that verdict in a case."
why = "Exit 2 is already argparse/config error (version_bump_check.py, docs_noise_lint.py) and four checks already spend their own codes on this state, so a shared code collides rather than unifies; every aggregator collapses nonzero to fail while the correct response differs per site (block at pre-push, warn on a required check, retry on a platform 503). The working shape already ships: gates.sh cases format_changed.sh's 3 as 'SKIPPED (INFRASTRUCTURE, not a formatting verdict)'."
do_not = "Minting a repo-wide 'could not establish' code, or a static SKIP_RETURN_CODE ledger of checks that might be blind: there is no enumerable population to freeze, and such a ledger certifies the defect instead of detecting it, so it would have been green throughout the incident that motivated it."
guards = [".github/workflows/**", ".shipyard/config.toml", "tools/ci/**"]

[[decision]]
id = 23
layer = "pulp"
tags = ["ios-gate", "digest", "skip", "receipt", "content-hash"]
title = "The iOS compile gate is skipped only on a trusted PASS receipt for its exact input digest, with a 1-in-10 control run."
why = "The gate costs 6-13 min per macos job. Over its shadow window (2026-09-27..29: 242 gate jobs, 60 would_skip verdicts across merge_group and pull_request) no would_skip was followed by a failing real run; the one digest that failed and later passed failed on an npm registry DNS error, not an input. A code audit then found inputs the digest missed (the Three.js bundler and its npm lockfile, the build wrapper, directories the root CMakeLists adds on iOS), which were added before enforcement."
do_not = "Trusting a receipt from outside this repository's build.yml merge_group or same-repository pull_request runs; narrowing ios_gate_digest.py's input set without a shadow window; removing the control cadence. A control_run or would_skip followed by ran_failed means an input is missing: set PULP_IOS_GATE_DIGEST_MODE=shadow and widen the set before re-enabling."
guards = [".github/workflows/build.yml", "tools/ci/ios_gate_digest.py"]

[[decision]]
id = 24
layer = "pulp"
tags = ["toolchain", "host-freshness", "mise", "rustup", "host-sync", "drift"]
title = "tools/toolchain/manifest.toml is the single toolchain authority; hosts converge with the additive, idempotent tools/toolchain/host_sync.py, and drift is detected by check_env.py and fleet_report.py."
why = "2026-10-22: m3 and m5s had never installed the pinned mise toolchain, and three hosts ran three different rustc versions (1.96.0, 1.98.1, 1.99.1) against a 1.97.1 pin, because nothing applied the pins and every host updated on its own schedule."
do_not = "Letting host_sync uninstall a tool, run `mise use`, change the rustup default, edit shell profiles, touch Homebrew or Xcode, or run a mise binary whose digest is not the pin; reading pins from a working tree instead of the fetched origin/main; counting a network failure as fixed; hand-installing per host instead of fixing the manifest."
guards = ["tools/toolchain/**", ".mise.toml", ".mise.toolchain.toml", "mise.toolchain.lock"]

[[decision]]
id = 25
layer = "pulp"
tags = ["rust", "rust-toolchain", "stable", "pin", "rustup", "toolchain"]
title = "Rust is pinned by experimental/pulp-rs/rust-toolchain.toml, generated from the manifest with the exact release, components and targets; never `channel = \"stable\"`. CI provides the pin before the build (offline when the image has it or its stable is the same release), never by re-enabling RUSTUP_AUTO_INSTALL."
why = "The file said `channel = \"stable\"` while the manifest pinned 1.97.1, so the pin was unenforceable: each host built pulp-rs with its own stable. Pinning it alone would have broken the required gate, whose golden had only `stable` and whose build legs set RUSTUP_AUTO_INSTALL=0, so tools/ci/provide_pinned_rust.sh runs first."
do_not = "Hand-editing rust-toolchain.toml or setting it to a channel; `rustup target add` / `component add` at the repo root (that changes the default toolchain, not the pinned one); `rustup toolchain link` of an official release name (rustup refuses it); deleting the provide step or turning auto-install back on to green a job."
guards = ["experimental/pulp-rs/rust-toolchain.toml", "tools/toolchain/**", "tools/ci/**", ".github/workflows/**"]

[[decision]]
id = 26
layer = "pulp"
tags = ["cache", "volume", "symlink", "mise", "rustup", "cargo", "skia", "ccache", "placement"]
title = "On volume hosts, agent-only caches (mise data, rustup, cargo, the Skia keyed cache) live under /Volumes/<vol>/caches/<name>, symlinked from their default path; VM-mounted caches (ccache cache_root, fetchcontent-src) and TARTCI_HOME/logs move only through tartci profile placement, never a symlink."
why = "An Aug-29 mise data symlink pointed into a mktemp directory under the volume's VMs/cache tree and dangled once that was cleared; a dangling --dir mount behind a VM-mounted cache would take a lane down. check_env.py reports a cache symlink that dangles, points into a temporary directory, or leaves /Volumes/<vol>/caches."
do_not = "Symlinking a cache into a tmp or mktemp directory, under /Volumes/<vol>/VMs, or inside any reclaim root; moving a VM-mounted cache with a symlink; deleting the old copy before the new one is verified and proven in use."
guards = ["tools/toolchain/**"]

[[decision]]
id = 27
layer = "pulp"
tags = ["launchd", "removable-volumes", "tcc", "consent", "launcher", "host-sync"]
title = "A launchd job that opens /Volumes paths on a volume host runs under the tartci launcher's consented identity; a plain LaunchAgent is forbidden. Until tartci schedules host_sync, it runs by hand or from an interactive or agent session, and the hourly fleet_report is the drift alarm."
why = "A launchd job without the launcher's Removable Volumes grant hangs on its first /Volumes open: an orphan on m5s hung on the data volume for two hours. host_sync and check_env bound every child they start and abandon one that does not answer, so a lost grant fails fast with a named finding."
do_not = "Installing host_sync (or any cache-touching job) as a plain LaunchAgent; an unbounded wait on a child that may touch /Volumes."
guards = ["tools/toolchain/**", "tools/ci/**"]

[[decision]]
id = 28
layer = "pulp"
tags = ["mise", "trust", "worktree", "post-checkout", "trusted_config_paths", "security"]
title = "mise trust is per checkout: .githooks/post-checkout trusts a new worktree's own .mise.toml, and host_sync trusts the checkout it runs in. No trusted_config_paths roots."
why = "mise 2026.10.13+ refuses an untrusted config, so python3 through the mise shim failed in every fresh worktree (gates.sh, pre-push). A root in trusted_config_paths is a prefix match that would trust every repository cloned under it, and a .mise.toml can run code."
do_not = "Adding trusted_config_paths roots, trusting a parent directory, $HOME or /, or running `mise trust` on an arbitrary path; repair one worktree with `mise trust <worktree>/.mise.toml`."
guards = [".githooks/**", ".mise.toml", "tools/toolchain/**"]

[[decision]]
id = 29
layer = "pulp"
tags = ["rust", "fallback", "fail-closed", "gate", "receipt", "rustup"]
title = "A build that cannot get the pinned Rust fails closed on self-hosted legs and on pull requests that change experimental/pulp-rs; only GitHub-hosted legs may fall back, and only loudly (::warning naming both versions, a step summary line, a JSON receipt uploaded as an artifact). When tartci bakes the pin by name into the live golden, --fallback-to-default is removed from build.yml and every leg fails closed."
why = "A silent fallback leaves the required gate green on an unpinned compiler, so code that needs a newer stable passes review. The gate VMs reach the network through a proxy that refuses static.rust-lang.org ('tunnel error: unsuccessful' on all three attempts, PR 10789's first macos run), so their pin must come from the image: by name, or as a stable that is the same release with every pinned part."
do_not = "Letting a self-hosted leg fall back; dropping the warning, summary line or receipt; keeping --fallback-to-default after the golden carries the pin by name; fixing a gate that cannot download Rust by re-enabling auto-install."
guards = ["tools/ci/**", ".github/workflows/**", "experimental/pulp-rs/rust-toolchain.toml"]
