# Pulp's mise profile. The pinned tools are in .mise.toolchain.toml, generated by
# tools/toolchain/generate.py from tools/toolchain/manifest.toml and locked with
# per-platform checksums in mise.toolchain.lock; mise loads them only with
# MISE_ENV=toolchain. Use this locked profile for reproducibility-sensitive
# local builds and VM probes. CI/Shipyard remain compatible with hosts without
# mise until their reviewed provisioning migration lands; no auto-install occurs.
[settings]
auto_install = false
locked = true
# A pinned mise never asks whether a newer release exists: the update warning
# is the only path that queries in normal use. Automatic self-update is off by
# default and only a global config may turn it on (mise ignores, with a warning,
# self_update.* in a project file). The pin moves only through
# `pulp deps update mise`.
disable_update_warning = true

[tasks.visual-deps]
description = "Install Pulp's hash-pinned visual-analysis Python dependencies"
run = "tools/ci/install_visual_python_deps.sh ${PULP_BUILD_DIR:-build}"

[tasks.visual-check]
description = "Verify the configured Python can run visual-analysis tests"
run = "python3 tools/scripts/check_visual_python_deps.py"

[tasks.visual-deps-windows]
description = "Install the visual-analysis lock with the Windows Python command"
run = "tools/ci/install_visual_python_deps.sh ${PULP_BUILD_DIR:-build}"

[tasks.visual-check-windows]
description = "Verify the visual-analysis dependencies with the Windows Python command"
run = "python tools/scripts/check_visual_python_deps.py"

# BEGIN GENERATED PULP TOOLCHAIN (tools/toolchain/manifest.toml)
# source_sha256 = a8a2abef8ffa4e2d7c9e30c5e562183d9a2c2a96e927c1822583396cec00b559
[tasks.npm-deps]
description = "Install project npm dependencies from the committed lockfiles (npm ci)"
run = [
  "npm ci --prefix tools/import-design/jsx-runtime --no-audit --no-fund",
  "npm ci --prefix tools/scripts --no-audit --no-fund",
]
# END GENERATED PULP TOOLCHAIN
