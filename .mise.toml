# Edit tools/toolchain/manifest.toml, then run
#   python3 tools/toolchain/generate.py --lock --mise <pinned mise>
min_version = { soft = "2026.10.8" }

[tools]
cmake = "4.3.3"
ninja = "1.13.2"
python = "3.14.4"
node = "26.10.0"
rust = { version = "1.97.1", targets = "x86_64-apple-darwin", components = "rustfmt,clippy", profile = "minimal" }
tart = { version = "2.38.0", os = ["macos"] }
"conda:clang-format" = { version = "21.1.8", os = ["linux", "macos", "windows/x64"] }

[tasks.npm-deps]
description = "Install project npm dependencies from the committed lockfiles (npm ci)"
run = [
  "npm ci --prefix tools/import-design/jsx-runtime --no-audit --no-fund",
  "npm ci --prefix tools/scripts --no-audit --no-fund",
]
# END GENERATED PULP TOOLCHAIN

# Pulp's pinned toolchain. The generated block above is written by
# tools/toolchain/generate.py from tools/toolchain/manifest.toml and locked, with
# per-platform checksums, in mise.lock; never edit it by hand. No Shipyard,
# tartci, gate, or release lane runs `mise` yet: enforcement is staged
# (manifest [mise].enforcement), and the tasks below remain optional.
[settings]
auto_install = false
locked = true

[tasks.visual-deps]
description = "Install Pulp's hash-pinned visual-analysis Python dependencies"
run = "tools/ci/install_visual_python_deps.sh ${PULP_BUILD_DIR:-build}"

[tasks.visual-check]
description = "Verify the configured Python can run visual-analysis tests"
run = "python3 tools/scripts/check_visual_python_deps.py"

[tasks.visual-deps-windows]
description = "Install the visual-analysis lock with the Windows Python command"
run = "tools/ci/install_visual_python_deps.sh ${PULP_BUILD_DIR:-build}"

[tasks.visual-check-windows]
description = "Verify the visual-analysis dependencies with the Windows Python command"
run = "python tools/scripts/check_visual_python_deps.py"
